<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Бронирования</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#0b0d17;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#121526;border:1px solid #252941;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #252941}.muted{color:#8f95ab;font-size:.88rem}.btn{border:1px solid #34384f;background:#181c2d;color:#ddd;border-radius:10px;padding:9px 13px;cursor:pointer}.ok{background:#32d583;color:#07120c;border-color:#32d583}.cancel{background:#ff6b6b;color:#190505;border-color:#ff6b6b}.new{color:#f5c542}.confirmed{color:#32d583}.cancelled{color:#ff6b6b}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#121526;border:1px solid #34384f;border-radius:18px;padding:18px;width:min(760px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#181c2d;padding:12px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><h1>📅 Бронирования</h1><div id="auth" class="muted">Проверка доступа…</div></div><div class="card"><div id="list">Загрузка…</div></div></div><div id="modal" class="modal"><div class="box" id="box"></div></div><script>const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—';let bookings=[];async function init(){const {data}=await sb.auth.getSession();if(!data.session){location.href='login.html';return}if(data.session.user.email!==ADMIN){document.getElementById('auth').textContent='⛔ Доступ запрещён';return}document.getElementById('auth').textContent='🔒 '+data.session.user.email;await load()}async function load(){const {data,error}=await sb.from('bookings').select('*,rooms(name),users(Display_name,Phone,Email)').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('list').textContent='Ошибка: '+error.message;return}bookings=data||[];render()}function status(s){if(['подтверждено','confirmed','завершена'].includes(s))return '<span class="confirmed">🟢 Подтверждено</span>';if(['отменена','cancelled'].includes(s))return '<span class="cancelled">🔴 Отменено</span>';return '<span class="new">🟡 Ожидает подтверждения</span>'}function render(){document.getElementById('list').innerHTML=bookings.map(b=>`<div class="row"><div><b>${esc(b.guest_name||'Гость')}</b> · ${esc(b.rooms?.name||'Номер')}</div><div>${date(b.check_in_date)} → ${date(b.check_out_date)} · ${money(b.total_amount)}</div><div>${status(b.status)} <button class="btn" onclick="openBooking('${b.id}')">Подробнее</button></div></div>`).join('')||'<div class="muted">Нет бронирований</div>'}window.openBooking=async id=>{const b=bookings.find(x=>x.id===id);if(!b)return;const nights=Math.max(0,Math.round((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000));const canConfirm=!['подтверждено','confirmed','завершена','отменена','cancelled'].includes(b.status);const canCancel=!['подтверждено','confirmed','завершена','отменена','cancelled'].includes(b.status);document.getElementById('box').innerHTML=`<div class="row"><h2>Бронирование</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="grid"><div class="item"><b>Гость</b><br>${esc(b.guest_name||'—')}</div><div class="item"><b>Телефон</b><br>${esc(b.guest_phone||b.users?.Phone||'—')}</div><div class="item"><b>Email</b><br>${esc(b.guest_email||b.users?.Email||'—')}</div><div class="item"><b>Гостей</b><br>${esc(b.guest_count||'—')}</div><div class="item"><b>Номер</b><br>${esc(b.rooms?.name||'—')}</div><div class="item"><b>Период</b><br>${date(b.check_in_date)} → ${date(b.check_out_date)}<br>${nights} ночей</div><div class="item"><b>Стоимость</b><br>${money(b.total_amount)}</div><div class="item"><b>Оплачено</b><br>${money(b.paid_amount)}</div><div class="item"><b>Статус</b><br>${status(b.status)}</div><div class="item"><b>Создано</b><br>${b.created_at?new Date(b.created_at).toLocaleString('ru-RU'):'—'}</div></div><div class="item" style="margin-top:10px"><b>Пожелания / дополнительные услуги</b><pre style="white-space:pre-wrap;font:inherit">${esc(b.services||'Нет')}</pre></div><div class="actions">${canConfirm?`<button class="btn ok" onclick="confirmBooking('${b.id}')">✅ Подтвердить бронь</button>`:''}${canCancel?`<button class="btn cancel" onclick="cancelBooking('${b.id}')">❌ Отменить бронь</button>`:''}</div>`;document.getElementById('modal').classList.add('show')};window.closeModal=()=>document.getElementById('modal').classList.remove('show');window.confirmBooking=async id=>{if(!confirm('Подтвердить бронирование? После подтверждения стоимость проживания попадёт в долг пользователя.'))return;const {error}=await sb.rpc('confirm_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);closeModal();await load();alert('Бронь подтверждена. Стоимость проживания теперь учитывается в долге пользователя.')};window.cancelBooking=async id=>{if(!confirm('Отменить бронирование? Долг за проживание создан не будет.'))return;const {error}=await sb.rpc('cancel_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);closeModal();await load();alert('Бронь отменена.')};init();</script></body></html>
