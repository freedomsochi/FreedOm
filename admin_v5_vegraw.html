<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v5</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:20px}.card{background:#151c30;padding:18px;border-radius:14px;max-width:800px;margin:auto}.btn{padding:12px 16px;border:0;border-radius:10px;cursor:pointer;background:#d4af37;color:#111}.muted{color:#9aa3b8}.row{padding:12px 0;border-bottom:1px solid #303a52}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.modalbox{background:#151c30;border:1px solid #34415d;border-radius:16px;width:min(700px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #000}.ok{color:#4ee18b}input,select{padding:10px;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662;margin:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.close{float:right;background:#2a3348;color:#fff}</style></head><body><div class="card"><h1>🥗 FreeDom — Veg Raw v5</h1><p class="muted">Тестовая версия оплаты конкретного заказа. Основную админку не изменяет.</p><div id="list">Загрузка…</div></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let orders=[];const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=document.getElementById('list'),modal=document.getElementById('modal'),modalbox=document.getElementById('modalbox');async function load(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(r.error){list.textContent='Ошибка загрузки: '+r.error.message;return}orders=r.data||[];list.innerHTML=orders.map(o=>{const b=Math.max(0,(Number(o.total_amount)||0)-(Number(o.paid_amount)||0));return `<div class="row"><b>${esc(o.guest_name||'Гость')}</b><div>${esc(o.guest_email||'')} · ${money(o.total_amount)}</div><div>Оплачено: ${money(o.paid_amount)} · Остаток: ${money(b)}</div><button type="button" class="btn details-btn" data-id="${esc(o.id)}">Подробнее</button></div>`}).join('')||'Заказов нет'}function closeModal(){modal.classList.remove('show');modalbox.innerHTML=''}function openOrder(id){const o=orders.find(x=>String(x.id)===String(id));if(!o){alert('Заказ не найден');return}const total=Number(o.total_amount)||0,paid=Number(o.paid_amount)||0,balance=Math.max(0,total-paid);modalbox.innerHTML=`<button type="button" class="btn close" id="closeBtn">✕ Закрыть</button><h2>🥗 Veg Raw — заказ</h2><p><b>Гость:</b> ${esc(o.guest_name)}</p><p><b>Телефон:</b> ${esc(o.guest_phone)}</p><p><b>Email:</b> ${esc(o.guest_email)}</p><p><b>Сумма:</b> ${money(total)}</p><p><b>Оплачено:</b> ${money(paid)}</p><p><b>Остаток:</b> ${money(balance)}</p><p><b>Статус:</b> ${esc(o.status)}</p><p><b>Оплата:</b> ${esc(o.payment_status||'—')}</p><h3>💳 Оплата именно этого заказа</h3>${balance?`<input id="amount" type="number" min="1" max="${balance}" value="${balance}"><select id="method"><option value="нал">Нал</option><option value="безнал">Безнал</option><option value="бонусы">Бонусы</option></select><div class="actions"><button type="button" class="btn" id="payBtn">Внести оплату</button></div>`:'<span class="ok">Заказ полностью оплачен</span>'}`;modal.classList.add('show');document.getElementById('closeBtn').onclick=closeModal;const payBtn=document.getElementById('payBtn');if(payBtn)payBtn.onclick=()=>pay(id)}async function pay(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;const amount=Number(document.getElementById('amount').value),method=document.getElementById('method').value;const balance=Math.max(0,(Number(o.total_amount)||0)-(Number(o.paid_amount)||0));if(!amount||amount<1||amount>balance){alert('Некорректная сумма');return}if(!confirm('Внести '+money(amount)+' именно за этот заказ?'))return;const p=await sb.from('payments').insert({user_id:o.user_id,order_id:id,amount,method:method,payment_method:method,status:'успешно',note:'Оплата Veg Raw: '+id}).select('id').single();if(p.error){alert('Ошибка платежа: '+p.error.message);return}const a=await sb.from('payment_allocations').insert({payment_id:p.data.id,user_id:o.user_id,order_id:id,amount,allocated_amount:amount});if(a.error){await sb.from('payments').delete().eq('id',p.data.id);alert('Ошибка распределения: '+a.error.message);return}const np=(Number(o.paid_amount)||0)+amount;const u=await sb.from('orders').update({paid_amount:np,payment_status:np>=Number(o.total_amount)?'оплачено':'частично оплачено'}).eq('id',id);if(u.error){alert('Платёж создан, но заказ не обновился: '+u.error.message);return}alert('Оплата внесена именно за этот заказ: '+money(amount));closeModal();await load()}list.addEventListener('click',e=>{const btn=e.target.closest('.details-btn');if(btn)openOrder(btn.dataset.id)});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});load();</script></body></html>
