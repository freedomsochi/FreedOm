<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v5</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:20px}.card{background:#151c30;padding:18px;border-radius:14px;max-width:800px;margin:auto}.btn{padding:12px 16px;border:0;border-radius:10px;cursor:pointer;background:#d4af37}.danger{background:#54202a;color:#fff}.muted{color:#9aa3b8}.row{padding:12px 0;border-bottom:1px solid #303a52}input,select{padding:10px;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662}.modal{margin-top:18px;padding:16px;background:#101627;border-radius:12px}.ok{color:#4ee18b}</style></head><body><div class="card"><h1>🥗 FreeDom — Veg Raw v5</h1><p class="muted">Тестовая версия оплаты конкретного заказа. Основную админку не изменяет.</p><div id="list">Загрузка…</div><div id="modal"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let orders=[];const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(r.error)return document.getElementById('list').textContent=r.error.message;orders=r.data||[];document.getElementById('list').innerHTML=orders.map(o=>{const b=Math.max(0,(Number(o.total_amount)||0)-(Number(o.paid_amount)||0));return `<div class="row"><b>${esc(o.guest_name||'Гость')}</b><div>${esc(o.guest_email||'')} · ${money(o.total_amount)}</div><div>Оплачено: ${money(o.paid_amount)} · Остаток: ${money(b)}</div><button class="btn" onclick="openOrder('${o.id}')">Подробнее</button></div>`}).join('')||'Заказов нет'}function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const total=Number(o.total_amount)||0,paid=Number(o.paid_amount)||0,balance=Math.max(0,total-paid);document.getElementById('modal').innerHTML=`<div class="modal"><h2>🥗 Veg Raw — заказ</h2><p><b>Гость:</b> ${esc(o.guest_name)}</p><p><b>Email:</b> ${esc(o.guest_email)}</p><p><b>Сумма:</b> ${money(total)}</p><p><b>Оплачено:</b> ${money(paid)}</p><p><b>Остаток:</b> ${money(balance)}</p><p><b>Статус:</b> ${esc(o.status)}</p><h3>💳 Оплата именно этого заказа</h3>${balance?`<input id="amount" type="number" min="1" max="${balance}" value="${balance}"><select id="method"><option value="нал">Нал</option><option value="безнал">Безнал</option><option value="бонусы">Бонусы</option></select><button class="btn" onclick="pay('${o.id}')">Внести оплату</button>`:'<span class="ok">Заказ полностью оплачен</span>'}</div>`}async function pay(id){const o=orders.find(x=>x.id===id);const amount=Number(document.getElementById('amount').value),method=document.getElementById('method').value;const balance=Math.max(0,(Number(o.total_amount)||0)-(Number(o.paid_amount)||0));if(!amount||amount<1||amount>balance)return alert('Некорректная сумма');if(!confirm('Внести '+money(amount)+' именно за этот заказ?'))return;const p=await sb.from('payments').insert({user_id:o.user_id,amount,payment_method:method,status:'проведен',note:'Оплата Veg Raw: '+id}).select('id').single();if(p.error)return alert('Ошибка платежа: '+p.error.message);const a=await sb.from('payment_allocations').insert({payment_id:p.data.id,user_id:o.user_id,order_id:id,amount,allocated_amount:amount});if(a.error){await sb.from('payments').delete().eq('id',p.data.id);return alert('Ошибка распределения: '+a.error.message)}const np=(Number(o.paid_amount)||0)+amount;const u=await sb.from('orders').update({paid_amount:np,payment_status:np>=Number(o.total_amount)?'оплачено':'частично оплачено'}).eq('id',id);if(u.error)return alert('Платёж создан, но заказ не обновился: '+u.error.message);alert('Оплата внесена именно за этот заказ: '+money(amount));document.getElementById('modal').innerHTML='';load()}load()</script></body></html>
