<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Финансы</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d17;color:#eee;font:15px Arial,sans-serif;padding:16px}.wrap{max-width:1050px;margin:auto}.head,.card{background:#121625;border:1px solid #262b3d;border-radius:18px;padding:18px;margin-bottom:14px}.head h1{color:#d4af37;margin:0 0 5px}.muted{color:#8e93a6}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab,.btn{border:1px solid #30364c;background:#171b2b;color:#ddd;border-radius:12px;padding:9px 13px;cursor:pointer}.tab.active,.btn.primary{background:#d4af37;color:#111;border-color:#d4af37}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.stat{background:#171b2b;border-radius:14px;padding:14px}.stat b{display:block;color:#d4af37;font-size:1.35rem;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #24283a;align-items:center}.row:last-child{border:0}.info{flex:1}.small{font-size:.82rem;color:#8e93a6}.red{color:#ff6b6b}.yellow{color:#f1c75b}.green{color:#32d583}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:.75rem}.br{background:#3a2024;color:#ff8585}.by{background:#3b321b;color:#f1c75b}.bg{background:#193629;color:#58e09a}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}select,input{background:#171b2b;color:#eee;border:1px solid #30364c;border-radius:10px;padding:9px;width:100%}.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:8px;margin-bottom:10px}.panel{display:none}.panel.active{display:block}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.box{background:#121625;border:1px solid #30364c;border-radius:18px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}.box h2{color:#d4af37;margin-top:0}.field{margin:10px 0}.field label{display:block;color:#9aa0b4;font-size:.82rem;margin-bottom:5px}.history{margin-top:15px}.history div{padding:9px 0;border-bottom:1px solid #252a3b}.error{color:#ff6b6b;margin-top:8px}.success{color:#58e09a;margin-top:8px}.payline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #252a3b}.payline:last-child{border:0}@media(max-width:650px){.filters{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><div class="wrap">
<div class="head"><a href="admin.html" style="color:#aaa">← старая админка</a><h1>💰 Финансы FreeDom</h1><div class="muted">Учёт фактических оплат и долгов</div><div id="who" class="muted" style="margin-top:7px">Проверка доступа…</div></div>
<div class="tabs"><button class="tab active" data-p="dash">📊 Обзор</button><button class="tab" data-p="book">🛏️ Брони</button><button class="tab" data-p="orders">🥗 Veg-raw</button><button class="tab" data-p="fin">💰 Финансы</button></div>
<section id="dash" class="panel active"><div class="card"><div class="grid"><div class="stat">Гостей<b id="guests">—</b></div><div class="stat">Активных броней<b id="active">—</b></div><div class="stat">Оплачено<b id="paid">—</b></div><div class="stat">Долги<b id="debt">—</b></div></div></div><div class="card"><h3>🔴 Требуют внимания</h3><div id="attention">Загрузка…</div></div></section>
<section id="book" class="panel"><div class="card"><h2>🛏️ Бронирования</h2><div class="filters"><input id="bs" placeholder="Имя, телефон, номер"><select id="bp"><option value="all">Любая оплата</option><option value="не оплачено">🔴 Не оплачено</option><option value="частично">🟡 Частично</option><option value="оплачено">🟢 Оплачено</option></select><select id="bstat"><option value="all">Все статусы</option><option>подтверждено</option><option>завершена</option><option>отменена</option></select></div><div id="bookings">Загрузка…</div></div></section>
<section id="orders" class="panel"><div class="card"><h2>🥗 Veg-raw</h2><div class="filters"><input id="os" placeholder="Имя или телефон"><select id="op"><option value="all">Любая оплата</option><option value="не оплачено">🔴 Не оплачено</option><option value="частично">🟡 Частично</option><option value="оплачено">🟢 Оплачено</option></select><select id="ostat"><option value="all">Все статусы</option><option>новый</option><option>подтверждён</option><option>готовится</option><option>выдан</option><option>отменён</option></select></div><div id="ordersList">Загрузка…</div></div></section>
<section id="fin" class="panel"><div class="card"><h2>💰 Финансы</h2><div class="filters"><input type="date" id="from"><input type="date" id="to"><button class="btn primary" id="loadFin">Показать</button></div><div class="grid"><div class="stat">Начислено<b id="fCharged">0 ₽</b></div><div class="stat">Оплачено<b id="fPaid">0 ₽</b></div><div class="stat">Долг<b id="fDebt">0 ₽</b></div><div class="stat">Veg-raw<b id="fOrderTotal">0 ₽</b></div></div><div id="finDetails" style="margin-top:12px"></div></div></section>
</div>
<div class="modal" id="modal"><div class="box"><div class="actions" style="justify-content:space-between"><h2>💰 Внести оплату</h2><button class="btn" id="close">Закрыть</button></div><div id="summary"></div><div class="field"><label>Сумма</label><input id="amount" type="number" min="1"></div><div class="field"><label>Способ</label><select id="method"><option>Перевод</option><option>Наличные</option><option>Карта</option><option>Другое</option></select></div><div class="field"><label>Комментарий</label><input id="note" placeholder="Например: предоплата"></div><div class="actions"><button class="btn primary" id="save">Сохранить оплату</button><button class="btn" id="hist">История</button></div><div id="history" class="history"></div><div id="err" class="error"></div><div id="ok" class="success"></div></div></div>
<script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const ADMIN='serzh.xz@mail.ru';let bookings=[],orders=[],current=null;
const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pay=(t,p,d=0)=>{t=+t||0;p=+p||0;d=+d||0;const due=Math.max(t-d-p,0);return{t,p,d,due,s:due?(p?'частично':'не оплачено'):'оплачено'}};
const pc=s=>s==='оплачено'?'bg':s==='частично'?'by':'br';
async function init(){const {data}=await sb.auth.getSession();if(!data.session||data.session.user.email!==ADMIN){location.href='login.html';return}document.getElementById('who').textContent='🔒 '+data.session.user.email;setDates();await Promise.all([loadBookings(),loadOrders(),loadGuests(),loadFinance()]);refresh()}
async function loadGuests(){const {data}=await sb.from('users').select('user_id');document.getElementById('guests').textContent=data?.length||0}
async function loadBookings(){const {data,error}=await sb.from('bookings').select('id,guest_name,guest_phone,check_in_date,check_out_date,total_amount,paid_amount,discount_amount,payment_status,status,rooms(name),users(Display_name)').order('created_at',{ascending:false}).limit(200);if(error){document.getElementById('bookings').textContent=error.message;return}bookings=data||[];renderBookings()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('id,guest_name,guest_phone,items,total_amount,paid_amount,discount_amount,payment_status,status,created_at').order('created_at',{ascending:false}).limit(200);if(error){document.getElementById('ordersList').textContent=error.message;return}orders=data||[];renderOrders()}
function bookingRow(b){const p=pay(b.total_amount,b.paid_amount,b.discount_amount);return `<div class="row"><div class="info"><b>${esc(b.users?.Display_name||b.guest_name||'Гость')}</b> — ${esc(b.rooms?.name||'Номер')}</b><div class="small">${b.check_in_date} → ${b.check_out_date} · ${money(p.t)} · <span class="${p.due?'red':'green'}">${p.due?(p.p?'Оплачено '+money(p.p)+' · долг '+money(p.due):'Долг '+money(p.due)):'Оплачено'}</span></div></div><div class="actions"><span class="badge ${pc(p.s)}">${esc(p.s)}</span><button class="btn primary" onclick="openPay('booking','${b.id}')">💰 Оплата</button></div></div>`}
function orderRow(o){const p=pay(o.total_amount,o.paid_amount,o.discount_amount);let items='';try{items=(o.items||[]).map(x=>`${esc(x.name||'Блюдо')} × ${x.quantity||1}`).join(', ')}catch{}return `<div class="row"><div class="info"><b>${esc(o.guest_name||'Гость')}</b> · ${money(p.t)}<div class="small">${esc(o.guest_phone||'')} · ${items}<br><span class="${p.due?'red':'green'}">${p.due?(p.p?'Оплачено '+money(p.p)+' · долг '+money(p.due):'Долг '+money(p.due)):'Оплачено'}</span></div></div><div class="actions"><span class="badge">${esc(o.status||'новый')}</span><span class="badge ${pc(p.s)}">${esc(p.s)}</span><button class="btn primary" onclick="openPay('order','${o.id}')">💰 Оплата</button></div></div>`}
function renderBookings(){const q=document.getElementById('bs').value.toLowerCase(),ps=document.getElementById('bp').value,st=document.getElementById('bstat').value;document.getElementById('bookings').innerHTML=bookings.filter(b=>{const p=pay(b.total_amount,b.paid_amount,b.discount_amount);return(st==='all'||b.status===st)&&(ps==='all'||p.s===ps)&&((b.guest_name||'').toLowerCase().includes(q)||(b.guest_phone||'').includes(q)||(b.rooms?.name||'').toLowerCase().includes(q)||(b.users?.Display_name||'').toLowerCase().includes(q))}).map(bookingRow).join('')||'<div class="muted">Нет записей</div>'}
function renderOrders(){const q=document.getElementById('os').value.toLowerCase(),ps=document.getElementById('op').value,st=document.getElementById('ostat').value;document.getElementById('ordersList').innerHTML=orders.filter(o=>{const p=pay(o.total_amount,o.paid_amount,o.discount_amount);return(st==='all'||o.status===st)&&(ps==='all'||p.s===ps)&&((o.guest_name||'').toLowerCase().includes(q)||(o.guest_phone||'').includes(q))}).map(orderRow).join('')||'<div class="muted">Нет записей</div>'}
function refresh(){let paid=0,debt=0;[...bookings,...orders].forEach(x=>{const p=pay(x.total_amount,x.paid_amount,x.discount_amount);paid+=p.p;debt+=p.due});document.getElementById('paid').textContent=money(paid);document.getElementById('debt').textContent=money(debt);document.getElementById('active').textContent=bookings.filter(x=>x.status==='подтверждено').length;const a=[...bookings.map(x=>({t:'Номер',n:x.guest_name||x.users?.Display_name||'Гость',id:x.id,type:'booking',p:pay(x.total_amount,x.paid_amount,x.discount_amount)})),...orders.map(x=>({t:'Veg-raw',n:x.guest_name||'Гость',id:x.id,type:'order',p:pay(x.total_amount,x.paid_amount,x.discount_amount)}))].filter(x=>x.p.due).sort((a,b)=>b.p.due-a.p.due).slice(0,12);document.getElementById('attention').innerHTML=a.map(x=>`<div class="row"><div class="info"><b>${esc(x.n)}</b><div class="small">${x.t} · <span class="red">долг ${money(x.p.due)}</span></div></div><button class="btn primary" onclick="openPay('${x.type}','${x.id}')">💰 Внести оплату</button></div>`).join('')||'<div class="muted">🎉 Долгов нет</div>'}
window.openPay=(type,id)=>{const item=type==='booking'?bookings.find(x=>x.id===id):orders.find(x=>x.id===id);if(!item)return;const p=pay(item.total_amount,item.paid_amount,item.discount_amount);current={type,id,item};document.getElementById('summary').innerHTML=`<b>${esc(item.guest_name||item.users?.Display_name||'Гость')}</b><div class="small">Сумма ${money(p.t)} · оплачено ${money(p.p)} · остаток ${money(p.due)}</div>`;document.getElementById('amount').value=p.due||'';document.getElementById('note').value='';document.getElementById('err').textContent='';document.getElementById('ok').textContent='';document.getElementById('history').innerHTML='';document.getElementById('modal').classList.add('on')};
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('on');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};
document.getElementById('save').onclick=async()=>{if(!current)return;const amount=+document.getElementById('amount').value;if(!amount||amount<=0){document.getElementById('err').textContent='Введите сумму';return}document.getElementById('save').disabled=true;document.getElementById('err').textContent='';const {error}=await sb.rpc('record_payment',{p_booking_id:current.type==='booking'?current.id:null,p_order_id:current.type==='order'?current.id:null,p_amount:amount,p_payment_method:document.getElementById('method').value,p_note:document.getElementById('note').value||null});document.getElementById('save').disabled=false;if(error){document.getElementById('err').textContent=error.message;return}document.getElementById('ok').textContent='Оплата сохранена ✓';await Promise.all([loadBookings(),loadOrders(),loadFinance()]);refresh();setTimeout(()=>document.getElementById('modal').classList.remove('on'),700)};
document.getElementById('hist').onclick=async()=>{if(!current)return;const btn=document.getElementById('hist');btn.disabled=true;document.getElementById('history').innerHTML='<div class="muted">Загрузка истории…</div>';const {data,error}=await sb.rpc('get_payment_history',{p_booking_id:current.type==='booking'?current.id:null,p_order_id:current.type==='order'?current.id:null});btn.disabled=false;if(error){document.getElementById('history').innerHTML='<div class="error">Не удалось загрузить историю: '+esc(error.message)+'</div>';return}if(!data?.length){document.getElementById('history').innerHTML='<div class="muted">Платежей пока нет</div>';return}document.getElementById('history').innerHTML='<h3>История оплат</h3>'+data.map(x=>`<div class="payline"><span><b>${money(x.amount)}</b><br><span class="small">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||'Перевод')}${x.note?' · '+esc(x.note):''}</span></span><span class="green">✓</span></div>`).join('')};
function setDates(){const n=new Date();document.getElementById('from').value=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);document.getElementById('to').value=new Date(n.getFullYear(),n.getMonth()+1,0).toISOString().slice(0,10)}
async function loadFinance(){const f=document.getElementById('from').value,t=document.getElementById('to').value;if(!f||!t)return;const [a,b]=await Promise.all([sb.from('bookings').select('total_amount,paid_amount,discount_amount,status').neq('status','отменена').gte('created_at',f).lte('created_at',t+'T23:59:59'),sb.from('orders').select('total_amount,paid_amount,discount_amount,status').neq('status','отменён').gte('created_at',f).lte('created_at',t+'T23:59:59')]);let charged=0,paid=0,debt=0,ot=0;for(const x of a.data||[]){const p=pay(x.total_amount,x.paid_amount,x.discount_amount);charged+=p.t-p.d;paid+=p.p;debt+=p.due}for(const x of b.data||[]){const p=pay(x.total_amount,x.paid_amount,x.discount_amount);charged+=p.t-p.d;ot+=p.t-p.d;paid+=p.p;debt+=p.due}document.getElementById('fCharged').textContent=money(charged);document.getElementById('fPaid').textContent=money(paid);document.getElementById('fDebt').textContent=money(debt);document.getElementById('fOrderTotal').textContent=money(ot);document.getElementById('finDetails').innerHTML=`<div class="row"><div>Начислено</div><b>${money(charged)}</b></div><div class="row"><div>Фактически оплачено</div><b class="green">${money(paid)}</b></div><div class="row"><div>Осталось долгов</div><b class="red">${money(debt)}</b></div>`}
['bs','bp','bstat'].forEach(id=>document.getElementById(id).addEventListener(id==='bs'?'input':'change',renderBookings));['os','op','ostat'].forEach(id=>document.getElementById(id).addEventListener(id==='os'?'input':'change',renderOrders));document.getElementById('loadFin').onclick=loadFinance;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});
init();
</script></body></html>
