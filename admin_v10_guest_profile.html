<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Гость</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.avatar{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#22273b;font-size:24px}.person{display:flex;gap:13px}.section{margin-top:16px}.item{padding:14px 0;border-top:1px solid var(--fd-line);display:flex;justify-content:space-between;gap:15px}.item:first-child{border-top:0}.muted{color:var(--fd-muted)}.danger{color:#ff6b6b}.ok{color:#42d392}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:5px 9px;border-radius:999px;background:#1b2032;color:#b8bfd3;font-size:12px}.amount{font-weight:700}.empty{padding:14px 0;color:var(--fd-muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#181c2d;border-radius:12px;padding:13px}.stat small{color:var(--fd-muted)}.stat b{display:block;font-size:20px;margin-top:4px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.item{display:block}.item>div:last-child{margin-top:8px}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a href="admin_v10.html" class="fd-muted">← Гости</a><h1 class="fd-title">Профиль гостя</h1></div></header><div id="app"><div class="fd-card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const params=new URLSearchParams(location.search),uid=params.get('id');function status(s){return({confirmed:'Подтверждена',new:'Новая',cancelled:'Отменена',paid:'Оплачено',pending:'Ожидает'})[s]||s||'—'}async function load(){if(!uid){document.getElementById('app').innerHTML='<div class="fd-card">Не указан пользователь.</div>';return}const [{data:u,error:ue},{data:ev},{data:pay}]=await Promise.all([sb.from('users').select('*').eq('user_id',uid).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,comment,created_at,events(name,event_date,start_time,location)').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('id,amount,payment_method,status,note,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(20)]);if(ue){document.getElementById('app').innerHTML='<div class="fd-card">Ошибка: '+esc(ue.message)+'</div>';return}const events=ev||[],payments=pay||[],eventDebt=events.reduce((s,x)=>s+Math.max(0,(Number(x.amount)||0)-(Number(x.paid_amount)||0)),0);document.getElementById('app').innerHTML=`<section class="fd-card"><div class="hero"><div class="person"><div class="avatar">👤</div><div><h2 style="margin:0">${esc(u.Display_name||'Без имени')}</h2><div class="muted">📞 ${esc(u.Phone||'—')} · ✉️ ${esc(u.Email||'—')}</div></div></div><div class="chips"><span class="chip">ID: ${esc(u.user_id)}</span></div></div><div class="stats" style="margin-top:18px"><div class="stat"><small>Общий долг</small><b class="${Number(u.total_debt)>0?'danger':'ok'}">${money(u.total_debt)}</b></div><div class="stat"><small>Баланс</small><b>${money(u.balance)}</b></div><div class="stat"><small>Долг по событиям</small><b class="${eventDebt?'danger':'ok'}">${money(eventDebt)}</b></div><div class="stat"><small>Событий</small><b>${events.length}</b></div></div></section><section class="fd-card section"><h2 style="margin-top:0">🔴 За что должен</h2>${eventDebt?events.filter(x=>(Number(x.amount)||0)>(Number(x.paid_amount)||0)).map(x=>`<div class="item"><div><b>🎫 ${esc(x.events?.name||'Событие')}</b><div class="muted">${x.events?.event_date?new Date(x.events.event_date+'T00:00:00').toLocaleDateString('ru-RU'):''}</div></div><div class="amount danger">${money((Number(x.amount)||0)-(Number(x.paid_amount)||0))}</div></div>`).join(''):'<div class="empty">Долгов по событиям нет.</div>'}</section><section class="fd-card section"><h2 style="margin-top:0">🎫 События</h2>${events.length?events.map(x=>{const a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p);return `<div class="item"><div><b>${esc(x.events?.name||'Событие')}</b><div class="muted">${x.events?.event_date?new Date(x.events.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}${x.events?.start_time?' · '+esc(x.events.start_time):''}${x.events?.location?' · 📍 '+esc(x.events.location):''}</div><div class="chips" style="margin-top:7px"><span class="chip">👥 ${Number(x.participants)||1}</span><span class="chip">${esc(status(x.status))}</span></div></div><div>${a?'💰 '+money(a):'Бесплатно'}<br><span class="${d?'danger':'ok'}">${a?(d?'долг '+money(d):'оплачено'):'Бесплатно'}</span></div></div>`}).join(''):'<div class="empty">Регистраций нет.</div>'}</section><section class="fd-card section"><h2 style="margin-top:0">💳 Платежи</h2>${payments.length?payments.map(x=>`<div class="item"><div><b>${money(x.amount)}</b><div class="muted">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||'—')}</div>${x.note?'<div class="muted">'+esc(x.note)+'</div>':''}</div><div class="ok">${esc(status(x.status))}</div></div>`).join(''):'<div class="empty">Платежей пока нет.</div>'}</section>`}load();</script></body></html>
