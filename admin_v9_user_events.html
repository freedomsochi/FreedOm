<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — События гостя</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#0b0d17;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#121526;border:1px solid #252941;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #252941}.row:last-child{border-bottom:0}.muted{color:#8f95ab;font-size:.85rem}.green{color:#32d583}.red{color:#ff6b6b}.gold{color:#d4af37}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#181c2d;padding:13px;border-radius:12px}.stat b{display:block;font-size:1.25rem;margin-top:5px}input{width:100%;box-sizing:border-box;background:#181c2d;color:#eee;border:1px solid #34384f;border-radius:9px;padding:11px}.btn{border:1px solid #34384f;background:#d4af37;color:#111;border-radius:10px;padding:9px 13px;cursor:pointer;margin-top:8px}.event{background:#0e1120;border:1px solid #252941;border-radius:12px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#263149;font-size:.78rem}.paid{background:#214d3a}.cancel{background:#4b2930}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><h1>🎫 События гостя</h1><div class="muted">История записей на события, стоимость и оплата.</div><input id="search" placeholder="Имя или телефон"><button class="btn" onclick="loadUsers()">Найти</button></div><div id="result"></div></div><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—';async function loadUsers(){const q=$('search').value.trim();if(!q)return $('result').innerHTML='<div class="card muted">Введите имя или телефон.</div>';let r=await db.from('users').select('user_id,Display_name,Phone,Email').or(`Display_name.ilike.%${q}%,Phone.ilike.%${q}%`).limit(20);if(r.error)return $('result').innerHTML='<div class="card red">'+esc(r.error.message)+'</div>';if(!r.data?.length)return $('result').innerHTML='<div class="card muted">Гость не найден.</div>';let html='';for(const u of r.data){let e=await db.from('event_registrations').select('id,event_id,guest_name,guest_phone,participants,amount,paid_amount,status,payment_status,created_at,comment,events(name,event_date,start_time,end_time,location)').eq('user_id',u.user_id).order('created_at',{ascending:false});if(e.error){html+=`<div class="card red">Ошибка событий для ${esc(u.Display_name)}: ${esc(e.error.message)}</div>`;continue}const rows=e.data||[],charged=rows.reduce((s,x)=>s+(Number(x.amount)||0),0),paid=rows.reduce((s,x)=>s+(Number(x.paid_amount)||0),0),debt=Math.max(charged-paid,0),participants=rows.reduce((s,x)=>s+(Number(x.participants)||1),0);html+=`<div class="card"><div class="row"><div><h2 style="margin:0">👤 ${esc(u.Display_name||'Без имени')}</h2><div class="muted">${esc(u.Phone||u.Email||'')}</div></div><b class="${debt?'red':'green'}">${debt?'Долг '+money(debt):'Долга нет'}</b></div><div class="grid"><div class="stat"><small>Событий</small><b>${rows.length}</b></div><div class="stat"><small>Участников</small><b>${participants}</b></div><div class="stat"><small>Начислено</small><b>${money(charged)}</b></div><div class="stat"><small>Оплачено</small><b class="green">${money(paid)}</b></div></div><h3>🎫 История событий</h3>${rows.length?rows.map(x=>{const ev=x.events||{};const d=Math.max((Number(x.amount)||0)-(Number(x.paid_amount)||0),0);const free=!Number(x.amount);return `<div class="event"><div class="row"><div><b>${esc(ev.name||'Событие')}</b><div class="muted">${date(ev.event_date)} ${esc(ev.start_time||'')} ${ev.end_time?'– '+esc(ev.end_time):''}${ev.location?' · '+esc(ev.location):''}</div></div><span class="badge ${x.status==='cancelled'?'cancel':x.payment_status==='paid'?'paid':''}">${x.status==='cancelled'?'Отменена':x.status==='confirmed'?'Подтверждена':'Новая'}</span></div><div>👥 Участников: <b>${Number(x.participants)||1}</b></div><div>💰 ${free?'Бесплатно':`Стоимость: <b>${money(x.amount)}</b> · оплачено: <b>${money(x.paid_amount)}</b> · ${d?'долг: <b class="red">'+money(d)+'</b>':'<b class="green">оплачено полностью</b>'}`}</div><div class="muted">Запись: ${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}${x.comment?' · '+esc(x.comment):''}</div></div>`}).join(''):'<div class="muted">Записей на события нет.</div>'}</div>`}$('result').innerHTML=html}loadUsers();</script></body></html>
