<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — FreeDom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0d17; color: #eae6f0; font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.2rem; }
        .card h3 { color: #d4af37; margin-bottom: 0.8rem; }
        .btn { background: #d4af37; color: #0b0d17; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: scale(1.02); }
        .list-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .list-item:last-child { border-bottom: none; }
        .loading { text-align:center; padding:2rem; opacity:0.6; }
        .spinner { width:40px; height:40px; border:3px solid rgba(212,175,55,0.1); border-top:3px solid #d4af37; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1rem; }
        .stat-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-item .number { font-size: 1.8rem; font-weight: 700; color: #d4af37; }
        .stat-item .label { font-size: 0.75rem; opacity: 0.6; }
        .tab-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
        .tab-nav .tab-link { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 30px; padding: 6px 16px; color: #b8a9d4; cursor: pointer; transition: 0.3s; font-size: 0.85rem; font-weight: 500; }
        .tab-nav .tab-link:hover { background: rgba(255,255,255,0.08); }
        .tab-nav .tab-link.active { background: rgba(212,175,55,0.12); border-color: rgba(212,175,55,0.3); color: #d4af37; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-weight: 500; margin-bottom: 4px; color: #b8a9d4; font-size: 0.9rem; }
        .field input, .field select { width: 100%; padding: 10px 14px; font-size: 1rem; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(255,255,255,0.04); color: #eae6f0; }
        .field input:focus, .field select:focus { border-color: rgba(212,175,55,0.2); outline: none; background: rgba(255,255,255,0.06); }
    </style>
</head>
<body>
<div class="container">
    <h1 style="color:#d4af37; margin-bottom:0.5rem;">⚙️ Админ-панель</h1>
    <p style="opacity:0.6; margin-bottom:1.5rem;">Управление гостями, комнатами и арендами</p>

    <div id="loadingState" class="loading">
        <div class="spinner"></div>
        <p>Загрузка данных...</p>
    </div>

    <div id="adminContent" style="display:none;">
        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tab-nav" id="mainTabs">
            <span class="tab-link active" data-tab="tabDashboard">📊 Дашборд</span>
            <span class="tab-link" data-tab="tabRooms">🛏️ Комнаты</span>
            <span class="tab-link" data-tab="tabGuests">👥 Гости</span>
        </div>

        <!-- ===== ДАШБОРД ===== -->
        <div id="tabDashboard" class="tab-content active">
            <div class="card">
                <h3>📊 Статистика</h3>
                <div class="stat-grid">
                    <div class="stat-item"><span class="number" id="totalRooms">0</span><div class="label">Комнат</div></div>
                    <div class="stat-item"><span class="number" id="totalUsers">0</span><div class="label">Гостей</div></div>
                    <div class="stat-item"><span class="number" id="totalBookings">0</span><div class="label">Аренд</div></div>
                </div>
            </div>
            <div class="card">
                <h3>📌 Последние аренды</h3>
                <div id="recentBookings"><div style="text-align:center; opacity:0.4;">Нет аренд</div></div>
            </div>
        </div>

        <!-- ===== КОМНАТЫ ===== -->
        <div id="tabRooms" class="tab-content">
            <div class="card">
                <h3>🛏️ Список комнат</h3>
                <div id="roomsList"><div style="text-align:center; opacity:0.4;">Загрузка...</div></div>
            </div>
        </div>

        <!-- ===== ГОСТИ ===== -->
        <div id="tabGuests" class="tab-content">
            <div class="card">
                <h3>👥 Гости</h3>
                <div id="guestList"><div style="text-align:center; opacity:0.4;">Загрузка...</div></div>
            </div>
        </div>

        <button class="btn" id="logoutBtn" style="margin-top:1rem; width:100%; padding:12px;">🚪 Выйти</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const SUPABASE_URL = 'https://vutmbhsclmcfqqlzxqkc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_EMAIL = "serzh.xz@mail.ru";

    const loadingState = document.getElementById('loadingState');
    const adminContent = document.getElementById('adminContent');

    // === ПРОВЕРКА АДМИНА ===
    supabase.auth.getSession().then(async ({ data: sessionData }) => {
        if (!sessionData.session) {
            window.location.href = 'login.html';
            return;
        }
        const user = sessionData.session.user;
        if (user.email !== ADMIN_EMAIL) {
            loadingState.innerHTML = '<h2 style="color:#ff6b6b;">⛔ Доступ запрещён</h2>';
            return;
        }

        loadingState.style.display = 'none';
        adminContent.style.display = 'block';

        // Загружаем все данные
        await loadRooms();
        await loadGuests();
        await loadStats();
        await loadRecentBookings();
    });

    // === ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ===
    document.querySelectorAll('#mainTabs .tab-link').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('#mainTabs .tab-link').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const tabId = this.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        });
    });

    // === КОМНАТЫ ===
    async function loadRooms() {
        try {
            const { data, error } = await supabase.from('rooms').select('*').order('name');
            if (error) throw error;
            
            const container = document.getElementById('roomsList');
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.4;">Комнат пока нет</div>';
                return;
            }

            let html = '';
            data.forEach(room => {
                html += `
                    <div class="list-item">
                        <div>
                            <strong>${room.name}</strong>
                            <div style="font-size:0.8rem; opacity:0.6;">${room.description || ''}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="color:#d4af37;">${room.price_per_night} ₽</div>
                            <div style="font-size:0.75rem; opacity:0.5;">${room.capacity} чел.</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            console.error('Ошибка загрузки комнат:', error);
            document.getElementById('roomsList').innerHTML = '<div style="color:#ff6b6b;">Ошибка загрузки</div>';
        }
    }

    // === ГОСТИ ===
    async function loadGuests() {
        try {
            const { data, error } = await supabase.from('users').select('*').order('Display_name');
            if (error) throw error;
            
            const container = document.getElementById('guestList');
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.4;">Гостей пока нет</div>';
                return;
            }

            let html = '';
            data.forEach(user => {
                html += `
                    <div class="list-item">
                        <div>
                            <strong>${user.Display_name || 'Без имени'}</strong>
                            <div style="font-size:0.8rem; opacity:0.6;">${user.Email || '—'}</div>
                        </div>
                        <div style="font-size:0.8rem; opacity:0.5;">
                            Баланс: ${user.balance || 0} ₽
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            console.error('Ошибка загрузки гостей:', error);
            document.getElementById('guestList').innerHTML = '<div style="color:#ff6b6b;">Ошибка загрузки</div>';
        }
    }

    // === СТАТИСТИКА ===
    async function loadStats() {
        try {
            const { count: roomsCount } = await supabase.from('rooms').select('*', { count: 'exact', head: true });
            const { count: usersCount } = await supabase.from('users').select('*', { count: 'exact', head: true });
            const { count: bookingsCount } = await supabase.from('bookings').select('*', { count: 'exact', head: true });
            
            document.getElementById('totalRooms').textContent = roomsCount || 0;
            document.getElementById('totalUsers').textContent = usersCount || 0;
            document.getElementById('totalBookings').textContent = bookingsCount || 0;
        } catch (error) {
            console.error('Ошибка статистики:', error);
        }
    }

    // === ПОСЛЕДНИЕ АРЕНДЫ ===
    async function loadRecentBookings() {
        try {
            const { data, error } = await supabase
                .from('bookings')
                .select('*, rooms(name), users(Display_name)')
                .order('created_at', { ascending: false })
                .limit(5);
            if (error) throw error;
            
            const container = document.getElementById('recentBookings');
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.4;">Нет аренд</div>';
                return;
            }

            let html = '';
            data.forEach(b => {
                const guest = b.users?.Display_name || b.guest_name || 'Гость';
                const room = b.rooms?.name || 'Комната';
                html += `
                    <div class="list-item">
                        <div>
                            <strong>${guest}</strong>
                            <div style="font-size:0.8rem; opacity:0.6;">${room} · ${b.check_in_date} → ${b.check_out_date}</div>
                        </div>
                        <div style="font-size:0.8rem; color:#d4af37;">
                            ${b.total_amount || 0} ₽
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (error) {
            console.error('Ошибка загрузки аренд:', error);
            document.getElementById('recentBookings').innerHTML = '<div style="color:#ff6b6b;">Ошибка загрузки</div>';
        }
    }

    // === ВЫХОД ===
    document.getElementById('logoutBtn').addEventListener('click', function() {
        if (confirm('Выйти из админ-панели?')) {
            supabase.auth.signOut().then(() => { window.location.href = 'index.html'; });
        }
    });
});
</script>
</body>
</html>
