<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#0b0d17;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.head,.card{background:#121526;border:1px solid #252941;border-radius:16px;padding:18px;margin-bottom:14px}.head{text-align:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab,.btn{border:1px solid #34384f;background:#181c2d;color:#ddd;border-radius:10px;padding:9px 13px;cursor:pointer}.tab.active,.primary{background:#d4af37;color:#111}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#181c2d;padding:13px;border-radius:12px}.stat b{display:block;font-size:1.35rem;margin-top:5px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #252941}.muted{color:#8f95ab;font-size:.85rem}.red{color:#ff6b6b}.green{color:#32d583}.pay{display:grid;grid-template-columns:120px 150px 1fr auto;gap:7px;margin-top:10px}input,select{width:100%;box-sizing:border-box;background:#181c2d;color:#eee;border:1px solid #34384f;border-radius:9px;padding:9px}.detail{background:#0e1120;border-radius:12px;padding:12px;margin-top:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.modalbox{background:#121526;border:1px solid #34384f;border-radius:18px;padding:18px;width:min(720px,100%);max-height:90vh;overflow:auto}.charge{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px}.charge>*{background:#181c2d;padding:8px;border-radius:7px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.pay{grid-template-columns:1fr 1fr}.pay button,.pay input:last-child{grid-column:1/-1}.charge{grid-template-columns:1.5fr 1fr 1fr 1fr;font-size:.8rem}.row{align-items:flex-start}}</style></head><body><div class="wrap"><div class="head"><h1>⚙️ FreeDom — Админ-панель</h1><div id="auth" class="muted">Проверка доступа…</div></div><div id="app" style="display:none"><div class="tabs"><button class="tab active" data-p="dashboard">📊 Дашборд</button><button class="tab" data-p="users">👥 Пользователи</button><button class="tab" data-p="bookings">📅 Бронирования</button><button class="tab" data-p="orders">🥗 Veg Raw</button><button class="tab" data-p="finance">💰 Финансы</button></div><section id="dashboard" class="panel active"><div class="card"><div class="grid"><div class="stat"><small>Пользователи</small><b id="nUsers">0</b></div><div class="stat"><small>Бронирования</small><b id="nBookings">0</b></div><div class="stat"><small>Заказы</small><b id="nOrders">0</b></div><div class="stat"><small>Общий долг</small><b id="nDebt">0 ₽</b></div></div></div></section><section id="users" class="panel"><div class="card"><h2>👥 Пользователи</h2><div id="usersList">Загрузка…</div></div></section><section id="bookings" class="panel"><div class="card"><h2>📅 Бронирования</h2><div id="bookingsList">Загрузка…</div></div></section><section id="orders" class="panel"><div class="card"><h2>🥗 Veg Raw</h2><div id="ordersList">Загрузка…</div></div></section><section id="finance" class="panel"><div class="card"><h2>💰 Финансы</h2><div class="grid"><div class="stat"><small>Начислено</small><b id="charged">0 ₽</b></div><div class="stat"><small>Оплачено</small><b id="paid">0 ₽</b></div><div class="stat"><small>Долг</small><b id="debt">0 ₽</b></div><div class="stat"><small>Должников</small><b id="debtors">0</b></div></div></div><div class="card"><input id="search" placeholder="Поиск пользователя"><div id="financeList">Загрузка…</div></div></section></div></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';let users=[],finance=[];const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const {data}=await sb.auth.getSession();if(!data.session){location.href='login.html';return}if(data.session.user.email!==ADMIN){document.getElementById('auth').textContent='⛔ Доступ запрещён';return}document.getElementById('auth').textContent='🔒 '+data.session.user.email;document.getElementById('app').style.display='block';await loadAll()})();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});
async function loadAll(){const [u,b,o,f]=await Promise.all([sb.from('users').select('user_id,Display_name,Phone,Email').order('Display_name'),sb.from('bookings').select('id,guest_name,check_in_date,check_out_date,total_amount,paid_amount,status,rooms(name)').order('created_at',{ascending:false}).limit(100),sb.from('orders').select('id,guest_name,total_amount,status,created_at').order('created_at',{ascending:false}).limit(100),sb.from('user_financial_summary').select('*').order('total_debt',{ascending:false})]);users=u.data||[];finance=f.data||[];document.getElementById('nUsers').textContent=users.length;document.getElementById('nBookings').textContent=(b.data||[]).length;document.getElementById('nOrders').textContent=(o.data||[]).length;renderUsers();renderBookings(b.data||[]);renderOrders(o.data||[]);renderFinance()}
function renderUsers(){document.getElementById('usersList').innerHTML=users.map(u=>`<div class="row"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div></div><button class="btn" onclick="openProfile('${u.user_id}')">Финансы</button></div>`).join('')||'<div class="muted">Нет пользователей</div>'}
function renderBookings(a){document.getElementById('bookingsList').innerHTML=a.map(x=>`<div class="row"><div><b>${esc(x.guest_name||'Гость')} · ${esc(x.rooms?.name||'')}</b><div class="muted">${x.check_in_date||''} → ${x.check_out_date||''}</div></div><span>${money(x.total_amount)} / ${money(x.paid_amount)}</span></div>`).join('')||'<div class="muted">Нет бронирований</div>'}
function renderOrders(a){document.getElementById('ordersList').innerHTML=a.map(x=>`<div class="row"><div><b>${esc(x.guest_name||'Гость')}</b><div class="muted">${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}</div></div><span>${money(x.total_amount)} · ${esc(x.status||'')}</span></div>`).join('')||'<div class="muted">Нет заказов</div>'}
function renderFinance(){const c=finance.reduce((s,x)=>s+(+x.total_charged||0),0),p=finance.reduce((s,x)=>s+(+x.total_paid||0),0),d=finance.reduce((s,x)=>s+(+x.total_debt||0),0);document.getElementById('charged').textContent=money(c);document.getElementById('paid').textContent=money(p);document.getElementById('debt').textContent=money(d);document.getElementById('debtors').textContent=finance.filter(x=>+x.total_debt>0).length;document.getElementById('nDebt').textContent=money(d);const q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('financeList').innerHTML=finance.filter(x=>((x.Display_name||'').toLowerCase().includes(q))||users.some(u=>u.user_id===x.user_id&&(u.Display_name||'').toLowerCase().includes(q))).map(x=>{const u=users.find(u=>u.user_id===x.user_id)||{};return `<div class="detail"><div class="row"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||u.Email||'')}</div></div><b class="${+x.total_debt?'red':'green'}">Долг ${money(x.total_debt)}</b></div>${+x.total_debt?`<div class="pay"><input id="amt-${x.user_id}" type="number" min="1" placeholder="Сумма"><select id="met-${x.user_id}"><option>Наличные</option><option>Перевод</option><option>Карта</option><option>Бонусы</option></select><input id="note-${x.user_id}" placeholder="Комментарий"><button class="btn primary" onclick="pay('${x.user_id}')">Оплатить</button></div>`:''}</div>`}).join('')||'<div class="muted">Нет данных</div>'}
document.getElementById('search').oninput=renderFinance;
window.pay=async uid=>{const amount=Number(document.getElementById('amt-'+uid).value),method=document.getElementById('met-'+uid).value,note=document.getElementById('note-'+uid).value.trim();if(!amount)return alert('Введите сумму');const {error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:method,p_note:note||null});if(error)return alert('Ошибка оплаты: '+error.message);alert('Оплата зарегистрирована');await loadAll();await openProfile(uid)};
window.openProfile=async uid=>{const u=users.find(x=>x.user_id===uid)||{};const [r,p]=await Promise.all([sb.from('user_financial_breakdown').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('id,amount,payment_method,note,status,created_at').eq('user_id',uid).order('created_at',{ascending:false})]);if(r.error)return alert(r.error.message);const rows=r.data||[],debt=rows.filter(x=>+x.debt>0),f=finance.find(x=>x.user_id===uid)||{};document.getElementById('modalbox').innerHTML=`<div class="row"><h2>${esc(u.Display_name||'Без имени')}</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="grid"><div class="stat">Начислено<b>${money(f.total_charged)}</b></div><div class="stat">Оплачено<b class="green">${money(f.total_paid)}</b></div><div class="stat">Долг<b class="red">${money(f.total_debt)}</b></div><div class="stat">Статус<b>${esc(f.payment_status||'')}</b></div></div><h3>За что должен</h3><div class="charge"><b>Начисление</b><b>Начислено</b><b>Оплачено</b><b>Долг</b>${debt.map(x=>`<div><b>${esc(x.label||x.charge_type||'Начисление')}</b><div class="muted">${x.charge_type==='booking'?(x.check_in_date||'')+' → '+(x.check_out_date||''):x.charge_type==='service'?(x.service_name||'Услуга'):'Veg Raw'}</div></div><div>${money(x.charged)}</div><div class="green">${money(x.paid)}</div><div class="red"><b>${money(x.debt)}</b></div>`).join('')||'<div>Долга нет</div><div>0 ₽</div><div>0 ₽</div><div>0 ₽</div>'}</div><h3>История оплат</h3>${(p.data||[]).map(x=>`<div class="row"><span>${money(x.amount)} · ${esc(x.payment_method||'')}<div class="muted">${new Date(x.created_at).toLocaleString('ru-RU')} ${esc(x.note||'')}</div></span><span class="green">${esc(x.status||'')}</span></div>`).join('')||'<div class="muted">Оплат ещё нет</div>'}`;document.getElementById('modal').classList.add('show')};window.closeModal=()=>document.getElementById('modal').classList.remove('show');
</script></body></html>
