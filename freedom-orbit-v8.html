<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FreeDom — Orbit V8</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;color:#3c352d;background:#cbb79c}.scene{position:relative;height:100%;overflow:hidden;isolation:isolate;background:#d5c0a3}.bg,.bg2{position:absolute;inset:-7%;z-index:-5;background:center/cover no-repeat;filter:saturate(.72) sepia(.12) contrast(.92);transition:opacity 1.35s ease,transform 2.2s cubic-bezier(.16,.8,.2,1)}.bg2{opacity:0;z-index:-4}.veil{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(250,241,224,.42),rgba(250,239,216,.04) 42%,rgba(45,35,27,.27)),radial-gradient(circle at 50% 48%,transparent 25%,rgba(56,42,30,.18) 100%)}.sun{position:absolute;inset:-45%;z-index:-1;background:linear-gradient(108deg,transparent 35%,rgba(255,244,210,.55) 46%,rgba(255,218,165,.12) 52%,transparent 63%);filter:blur(18px);animation:sun 14s ease-in-out infinite alternate}@keyframes sun{to{transform:translateX(32%)}}.brand{position:absolute;top:24px;left:50%;z-index:50;transform:translateX(-50%);font:500 18px Georgia,serif;letter-spacing:.34em;color:rgba(48,40,33,.78);text-transform:uppercase}.sub{position:absolute;top:53px;left:50%;transform:translateX(-50%);z-index:50;font-size:7px;letter-spacing:.35em;text-transform:uppercase;color:rgba(70,59,48,.52);white-space:nowrap}.stage{position:absolute;inset:0;display:grid;place-items:center}.orbit{position:relative;width:min(102vw,760px);height:min(102vw,760px);touch-action:none}.tree{position:absolute;z-index:12;left:50%;bottom:-4%;width:72%;height:94%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 24px 35px rgba(46,34,24,.16))}.tree img{width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;animation:sway 9s ease-in-out infinite}@keyframes sway{50%{transform:rotate(.22deg) translateY(-.35%)}}.ring{position:absolute;inset:2%;z-index:22;border-radius:50%;--r:0deg;transform:rotate(var(--r));cursor:grab;transition:transform .95s cubic-bezier(.12,.86,.16,1)}.ring.drag{cursor:grabbing;transition:none}.ring:before{content:"";position:absolute;inset:1%;border-radius:50%;border:1px solid rgba(255,250,237,.62);box-shadow:inset 0 0 65px rgba(255,238,208,.2),0 0 70px rgba(68,48,29,.12)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(73,55,39,.13)}.node{position:absolute;left:50%;top:50%;width:122px;height:122px;margin:-61px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:18px;background:rgba(255,249,236,.17);border:1px solid rgba(255,251,240,.54);backdrop-filter:blur(25px) saturate(125%);-webkit-backdrop-filter:blur(25px) saturate(125%);color:rgba(58,50,42,.64);font-size:9px;letter-spacing:.18em;text-transform:uppercase;transform:rotate(calc(var(--a)*1deg)) translateY(min(37vw,278px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)));transition:.65s cubic-bezier(.2,.8,.2,1)}.node.active{color:#302922;background:rgba(255,248,229,.48);box-shadow:0 18px 55px rgba(62,43,27,.14),0 0 0 8px rgba(255,235,205,.1),inset 0 1px rgba(255,255,255,.8);scale:1.08}.node b{font-weight:500}.node i{position:absolute;top:13px;width:4px;height:4px;border-radius:50%;background:#ad8257;box-shadow:0 0 14px rgba(173,130,87,.6)}.core{position:absolute;z-index:18;left:50%;top:50%;width:82px;height:82px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 25%,rgba(255,255,249,.98) 0 9%,rgba(224,196,158,.72) 25%,rgba(119,83,52,.2) 48%,transparent 70%);border:1px solid rgba(255,249,235,.55);box-shadow:0 0 0 18px rgba(255,239,211,.08),0 18px 70px rgba(55,40,28,.16);animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.82}}.hint{position:absolute;bottom:27px;left:50%;z-index:50;transform:translateX(-50%);padding:12px 18px;border:1px solid rgba(255,248,232,.48);border-radius:99px;background:rgba(255,248,232,.16);backdrop-filter:blur(22px);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(66,56,47,.66);white-space:nowrap}.world{position:absolute;inset:0;z-index:80;background:rgba(52,42,33,.12);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);opacity:0;pointer-events:none;transition:opacity .75s ease}.world.open{opacity:1;pointer-events:auto}.sheet{position:absolute;inset:5%;overflow:hidden;border:1px solid rgba(255,255,255,.75);border-radius:34px;background:rgba(248,243,233,.78);box-shadow:0 40px 140px rgba(45,32,22,.25);transform:translateY(45px) scale(.94);transition:1s cubic-bezier(.16,.86,.18,1)}.world.open .sheet{transform:none}.sheetbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(91,70,51,.1);background:rgba(255,250,241,.28);backdrop-filter:blur(22px)}.sheettitle{font:500 27px Georgia,serif}.sheetmeta{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#857768}.close{width:42px;height:42px;border-radius:50%;border:1px solid rgba(87,68,51,.18);background:rgba(255,251,242,.5);font-size:20px;color:#55483c}.spaceframe{width:100%;height:calc(100% - 70px);border:0;background:#efe5d5}.intro{position:absolute;inset:70px 0 0;z-index:2;display:grid;place-items:center;pointer-events:none;background:linear-gradient(180deg,rgba(239,228,210,.72),rgba(239,228,210,.2));transition:opacity .8s}.intro.hide{opacity:0}.intro div{text-align:center}.intro strong{display:block;font:500 44px Georgia,serif}.intro span{display:block;margin-top:10px;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#806f5d}@media(max-width:620px){.brand{top:17px;font-size:15px}.sub{top:43px}.orbit{width:124vw;height:124vw}.tree{width:82%;height:90%}.node{width:90px;height:90px;margin:-45px;font-size:7px}.node{transform:rotate(calc(var(--a)*1deg)) translateY(43vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.core{width:62px;height:62px}.sheet{inset:2.5%;border-radius:27px}.sheetbar{height:62px}.sheettitle{font-size:23px}.spaceframe{height:calc(100% - 62px)}.intro{inset:62px 0 0}.intro strong{font-size:34px}.hint{bottom:14px;font-size:7px}}
</style></head><body><main class="scene" id="scene"><div class="bg" id="bg"></div><div class="bg2" id="bg2"></div><div class="veil"></div><div class="sun"></div><div class="brand">FreeDom</div><div class="sub">living space · sochi</div><section class="stage"><div class="orbit"><div class="tree"><img src="images/branches.png" alt="FreeDom"></div><div class="ring" id="ring"><div class="node active" style="--a:0" data-i="0"><i></i><b>Пространство</b></div><div class="node" style="--a:72" data-i="1"><i></i><b>События</b></div><div class="node" style="--a:144" data-i="2"><i></i><b>Комнаты</b></div><div class="node" style="--a:216" data-i="3"><i></i><b>Баня</b></div><div class="node" style="--a:288" data-i="4"><i></i><b>Кухня</b></div></div><div class="core"></div></div></section><div class="hint">вращайте пространство</div><section class="world" id="world"><div class="sheet"><div class="sheetbar"><div><div class="sheettitle" id="sheettitle">Пространство</div><div class="sheetmeta">FreeDom · сейчас</div></div><button class="close" id="close">×</button></div><div class="intro" id="intro"><div><strong>Пространство</strong><span>входим внутрь FreeDom</span></div></div><iframe class="spaceframe" id="spaceframe" title="FreeDom Space"></iframe></div></section></main><script>const labels=['Пространство','События','Комнаты','Баня','Кухня'];const imgs=['images/room-bungalow.jpg','images/gong-meditation.jpg','images/room-family.jpg','images/sauna.jpg','images/room-hostel.jpg'];const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],bg=document.getElementById('bg'),bg2=document.getElementById('bg2'),world=document.getElementById('world'),frame=document.getElementById('spaceframe'),intro=document.getElementById('intro'),sheettitle=document.getElementById('sheettitle');let idx=0,rot=0,drag=false,last=0,lastT=0,vel=0,timer;bg.style.backgroundImage=`url('${imgs[0]}')`;function ang(e){const r=ring.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}function apply(){ring.style.setProperty('--r',rot+'deg')}function atmos(i){clearTimeout(timer);bg2.style.backgroundImage=`url('${imgs[i]}')`;bg2.style.opacity=1;bg2.style.transform='scale(1.09)';bg.style.transform='scale(1.075)';timer=setTimeout(()=>{bg.style.backgroundImage=`url('${imgs[i]}')`;bg.style.transform='scale(1.045)';bg2.style.opacity=0;bg2.style.transform='scale(1.045)'},1250)}function select(i){idx=(i+5)%5;let target=-idx*72,d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;apply();nodes.forEach((n,k)=>n.classList.toggle('active',k===idx));atmos(idx)}function snap(){select(Math.round(-rot/72))}ring.addEventListener('pointerdown',e=>{drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);last=ang(e);lastT=performance.now();vel=0});ring.addEventListener('pointermove',e=>{if(!drag)return;let a=ang(e),d=a-last;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;apply();let now=performance.now(),dt=Math.max(8,now-lastT);vel=.76*vel+.24*d/dt*16;last=a;lastT=now});ring.addEventListener('pointerup',()=>{if(!drag)return;drag=false;ring.classList.remove('drag');rot+=Math.max(-30,Math.min(30,vel*8));apply();setTimeout(snap,260)});ring.addEventListener('pointercancel',()=>{drag=false;ring.classList.remove('drag');snap()});nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();select(+n.dataset.i)}));function openWorld(){if(idx!==0)return;sheettitle.textContent='Пространство';frame.src='space-preview.html';world.classList.add('open');intro.classList.remove('hide');setTimeout(()=>intro.classList.add('hide'),1000)}document.getElementById('close').onclick=()=>{world.classList.remove('open');setTimeout(()=>frame.src='',700)};document.getElementById('spaceframe').addEventListener('load',()=>setTimeout(()=>intro.classList.add('hide'),350));nodes[0].addEventListener('dblclick',openWorld);document.querySelector('.core').addEventListener('click',openWorld);</script></body></html>
