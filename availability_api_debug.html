<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Availability API Debug</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}button{padding:12px 18px;border-radius:10px;border:0;cursor:pointer}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:12px}.ok{color:#087f23}.err{color:#b00020}</style></head><body><h1>Live availability diagnostics</h1><p>Проверяет production <code>/api/availability</code> без изменения данных.</p><label>Заезд <input id="in" type="date" value="2026-08-25"></label> <label>Выезд <input id="out" type="date" value="2026-08-28"></label><p><button id="run">Проверить API</button></p><div id="status">Готово.</div><pre id="result"></pre><script>const $=id=>document.getElementById(id);$('run').onclick=async()=>{const check_in=$('in').value,check_out=$('out').value; $('status').textContent='Запрос…';$('status').className='';$('result').textContent='';const t=performance.now();try{const r=await fetch('/api/availability',{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},cache:'no-store',body:JSON.stringify({check_in,check_out})});const text=await r.text();$('status').textContent=`HTTP ${r.status} · ${Math.round(performance.now()-t)} ms`;$('status').className=r.ok?'ok':'err';try{$('result').textContent=JSON.stringify(JSON.parse(text),null,2)}catch{$('result').textContent=text}}catch(e){$('status').textContent='NETWORK ERROR';$('status').className='err';$('result').textContent=String(e)}};</script></body></html>
