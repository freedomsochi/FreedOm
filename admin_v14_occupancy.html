<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeDom CRM — Кто живёт</title>
<link rel="stylesheet" href="admin_design.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:linear-gradient(135deg,#f5fbf8,#f7f7ff 48%,#eef8f7)}
.wrap{max-width:1440px;margin:auto;padding:24px}.hero{padding:24px;border-radius:28px;background:linear-gradient(135deg,#fff,#eaf8f3 55%,#f0edff);border:1px solid rgba(80,100,110,.14);box-shadow:0 18px 50px rgba(50,70,80,.08)}
h1{margin:5px 0;font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}.muted{color:var(--fd-muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{padding:17px;border-radius:20px;background:rgba(255,255,255,.78);border:1px solid rgba(80,100,110,.13);box-shadow:0 12px 34px rgba(50,70,80,.07)}
.card.busy{border-color:rgba(65,165,140,.35);background:linear-gradient(145deg,#fff,#effaf5)}.card.soon{border-color:rgba(210,150,80,.35);background:linear-gradient(145deg,#fffaf0,#f8f1ff)}
.top{display:flex;justify-content:space-between;gap:12px}.room{font-size:18px;font-weight:850}.status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#e9f7f1;color:#26715d}.soon .status{background:#fff0d8;color:#9b681f}
.info{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 9px;border-radius:10px;background:#f3f7f6;border:1px solid rgba(80,100,110,.1);font-size:12px}.guest{margin-top:14px;padding-top:13px;border-top:1px solid rgba(80,100,110,.1)}.guest b{font-size:15px}.money{font-weight:850}.debt{color:#c84c5c}.next{margin-top:9px;font-size:12px;color:#66757b}.empty{padding:30px;text-align:center;color:var(--fd-muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="muted">FreeDom · пространство</div><h1>Кто живёт сейчас</h1><p class="muted">Быстрый взгляд администратора: кто находится в комнате, до какой даты, сколько мест занято и есть ли долг.</p></section>
<div id="grid" class="grid"><div class="empty">Загрузка…</div></div>
</div>
<script>
const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}):'—';
const active=b=>!['отменено','отменена','cancelled','canceled','завершена','завершено'].includes(String(b.status||'').toLowerCase());
async function load(){
 const r=await db.from('bookings').select('*,rooms(name)').order('check_in_date',{ascending:true});
 if(r.error){$('grid').innerHTML='<div class="empty">Не удалось загрузить размещение: '+esc(r.error.message)+'</div>';return}
 const rows=(r.data||[]).filter(active);
 const byRoom=new Map();
 rows.forEach(b=>{const name=b.rooms?.name||'Без номера';if(!byRoom.has(name))byRoom.set(name,[]);byRoom.get(name).push(b)});
 const rooms=['Эконом','Стандарт 4','Стандарт 6','Семейная','Комната','Мансарда','Бунгало','Йога'];
 const entries=[...byRoom.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
 $('grid').innerHTML=entries.length?entries.map(([name,bs])=>{
   const now=new Date(); const current=bs.filter(b=>new Date(String(b.check_in_date||'')+'T00:00:00')<=now && new Date(String(b.check_out_date||'')+'T23:59:59')>=now);
   const upcoming=bs.filter(b=>new Date(String(b.check_in_date||'')+'T00:00:00')>now);
   const list=current.length?current:upcoming;
   const isSoon=!current.length&&upcoming.length;
   const capacity=Number(list.reduce((n,b)=>n+(Number(b.guest_count)||1),0));
   return `<article class="card ${current.length?'busy':isSoon?'soon':''}">
    <div class="top"><div class="room">${esc(name)}</div><span class="status">${current.length?'Сейчас живут':isSoon?'Следующий заезд':'Активно'}</span></div>
    <div class="info"><span class="pill">👥 ${capacity} ${capacity===1?'гость':'гостей'}</span>${list.map(b=>b.additional_bed===true?'<span class="pill">🛏️ + кровать</span>':'').join('')}</div>
    ${list.map(b=>{const total=Math.max((Number(b.total_amount)||0)-(Number(b.discount_amount)||0),0),paid=Number(b.paid_amount)||0,due=Math.max(total-paid,0);return `<div class="guest"><b>${esc(b.guest_name||'Гость')}</b><div class="next">📅 ${fmt(b.check_in_date)} → ${fmt(b.check_out_date)} · ${Number(b.guest_count)||1} гостей</div><div class="next ${due?'debt':''}">${due?'🔴 Долг '+money(due):'✓ Оплачено'}</div>${b.additional_bed===true?'<div class="next">🛏️ Нужна дополнительная двухъярусная кровать</div>':''}</div>`}).join('')}
   </article>`;
 }).join(''):'<div class="empty">Сейчас нет активных размещений.</div>';
}
load();
</script>
</body>
</html>
