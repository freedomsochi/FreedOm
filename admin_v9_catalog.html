<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin — Справочники</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:16px}.wrap{max-width:1050px;margin:auto}.head,.card{background:#151c30;border-radius:14px;padding:16px;margin-bottom:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;padding:10px 14px;border-radius:9px;background:#263149;color:#fff;cursor:pointer}.tab.active,.btn{background:#d4af37;color:#111}.btn{border:0;padding:8px 11px;border-radius:8px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #303a52}.muted{color:#9aa3b8}.badge{padding:4px 7px;border-radius:7px;background:#263149;font-size:12px}.on{color:#8fe0a8}.off{color:#ff8585}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{background:#151c30;padding:18px;border-radius:14px;width:min(520px,100%)}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0 10px;padding:10px;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662}label{font-size:13px;color:#aeb7ca}@media(max-width:650px){.table{font-size:13px}.hide{display:none}}</style></head><body><div class="wrap"><div class="head"><h2>⚙️ Справочники</h2><div class="muted">Изменения сразу сохраняются в Supabase и автоматически появляются в CRM.</div><div class="tabs" style="margin-top:12px"><button class="tab active" onclick="switchTab('rooms',this)">🛏 Бронирования</button><button class="tab" onclick="switchTab('veg',this)">🥗 Veg Raw</button><button class="tab" onclick="switchTab('services',this)">🧺 Услуги</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 id="title"></h3><button class="btn" onclick="addItem()">＋ Добавить</button></div><div style="overflow:auto"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></div><div id="modal" class="modal"><div class="box"><h3 id="modalTitle"></h3><div id="form"></div><button class="btn" onclick="save()">Сохранить</button> <button class="tab" onclick="closeM()">Отмена</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let tab='rooms',data=[],editId=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cfg(){return tab==='rooms'?{table:'rooms',title:'🛏 Бронирования',cols:['name','price_per_night','capacity'],labels:['Название','Цена за ночь','Вместимость']} :tab==='veg'?{table:'veg_raw_menu',title:'🥗 Veg Raw',cols:['name','price','category','unit','is_active'],labels:['Блюдо','Цена','Категория','Ед.','Активно']}:{table:'services',title:'🧺 Услуги',cols:['name','price','category','unit','is_active'],labels:['Услуга','Цена','Категория','Ед.','Активно']}}async function load(){let c=cfg(),q=await db.from(c.table).select('*').order('name');if(q.error)return alert(q.error.message);data=q.data||[];render(c)}function render(c=cfg()){$('title').textContent=c.title;$('thead').innerHTML='<tr>'+c.labels.map((x,i)=>`<th>${x}</th>`).join('')+'<th></th></tr>';$('tbody').innerHTML=data.map(x=>`<tr>${c.cols.map(k=>`<td>${k==='price'||k==='price_per_night'?Number(x[k]).toLocaleString('ru-RU')+' ₽':k==='is_active'?`<span class="${x[k]?'on':'off'}">${x[k]?'Да':'Нет'}</span>`:esc(x[k])}</td>`).join('')}<td><button class="btn" onclick="edit('${x.id}')">Изменить</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Пусто</td></tr>'}function switchTab(t,b){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}function addItem(){openForm(null)}function edit(id){openForm(data.find(x=>x.id===id))}function input(label,id,value,type='text'){return `<label>${label}</label><input id="${id}" type="${type}" value="${esc(value??'')}">`}function openForm(x){editId=x?.id||null;let c=cfg();$('modalTitle').textContent=(x?'Изменить ':'Добавить ')+c.title.replace(/^\S+ /,'');let h='';if(tab==='rooms'){h+=input('Название','name',x?.name);h+=input('Описание','description',x?.description);h+=input('Цена за ночь','price_per_night',x?.price_per_night,'number');h+=input('Вместимость','capacity',x?.capacity,'number');h+=input('Фото URL','image_url',x?.image_url)}else{h+=input(tab==='veg'?'Блюдо':'Услуга','name',x?.name);h+=input('Описание','description',x?.description);h+=input('Цена','price',x?.price,'number');h+=input('Категория','category',x?.category);h+=input('Единица','unit',x?.unit||(tab==='veg'?'шт':'шт.'));h+=`<label><input id="is_active" type="checkbox" style="width:auto" ${x?.is_active!==false?'checked':''}> Активно</label>`}$('form').innerHTML=h;$('modal').classList.add('show')}async function save(){let c=cfg(),o={};if(tab==='rooms'){o={name:$('name').value.trim(),description:$('description').value.trim()||null,price_per_night:+$('price_per_night').value,capacity:+$('capacity').value,image_url:$('image_url').value.trim()||null}}else{o={name:$('name').value.trim(),description:$('description').value.trim()||null,price:+$('price').value,category:$('category').value.trim()||null,unit:$('unit').value.trim(),is_active:$('is_active').checked}}if(!o.name)return alert('Введите название');let q=editId?await db.from(c.table).update(o).eq('id',editId):await db.from(c.table).insert(o);if(q.error)return alert(q.error.message);closeM();load()}function closeM(){$('modal').classList.remove('show')}load();</script></body></html>
