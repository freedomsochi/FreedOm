<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Профиль гостя</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.person{display:flex;gap:14px;align-items:center}.avatar{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#dff9f1,#ece8ff);font-size:25px}.name{font-size:26px;margin:0}.muted{color:var(--fd-muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{padding:14px;border:1px solid #ffffffaa;background:#ffffff70;border-radius:16px}.stat b{display:block;font-size:20px;margin-top:5px}.danger{color:#d94f5f}.ok{color:#149b78}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(41,77,86,.07)}.card h2{margin:0 0 6px;font-size:18px}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 4px;border-top:1px solid var(--fd-line);text-decoration:none;color:inherit}.row:first-child{border-top:0}.row:hover{background:#f5faf8;border-radius:10px}.amount{font-weight:800;white-space:nowrap}.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef5f3;color:#64736f;font-size:11px;margin:5px 4px 0 0}.empty{padding:10px 0;color:var(--fd-muted)}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mini{padding:11px;border-radius:13px;background:#f7faf9;border:1px solid var(--fd-line)}.mini b{display:block;margin-top:4px}.current{margin-top:14px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(225,242,235,.72));border:1px solid rgba(47,130,112,.16);border-radius:18px;padding:16px}.current-main{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.breakdown{grid-template-columns:1fr 1fr}}@media(max-width:520px){.name{font-size:22px}.row{display:grid}.amount{white-space:normal}.actions{width:100%}.actions .fd-btn{flex:1}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><a id="back" class="fd-muted" href="admin_v10.html">← Гости</a><h1 class="fd-title">Профиль гостя</h1><div class="fd-sub">Единый защищённый профиль: человек, проживание, активность и деньги.</div></header><div id="app"><div class="card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'—';const qs=new URLSearchParams(location.search);const uid=qs.get('id');const from=qs.get('from')||'guests';const backMap={bookings:['admin_v13_bookings.html','← Бронирования'],occupancy:['admin_v14_occupancy.html','← Кто живёт'],finance:['admin_v10_finance.html','← Финансы'],guests:['admin_v10.html','← Гости']};const [backUrl,backText]=backMap[from]||backMap.guests;$('#back').href=backUrl;$('#back').textContent=backText;const detail=(t,id)=>`admin_v11_finance_detail.html?type=${encodeURIComponent(t)}&id=${encodeURIComponent(id)}&user_id=${encodeURIComponent(uid)}`;async function load(){if(!uid){$('app').innerHTML='<div class="card">Не указан пользователь.</div>';return}const{data:{session}}=await sb.auth.getSession();if(!session){$('app').innerHTML='<div class="card">Требуется вход администратора.</div>';return}const{data,error}=await sb.rpc('admin_get_guest_profile',{p_user_id:uid});if(error){$('app').innerHTML='<div class="card">Ошибка загрузки профиля: '+esc(error.message)+'</div>';return}const u=data.user||{},bk=data.bookings||[],od=data.orders||[],so=data.services||[],ev=data.events||[],sm=data.financial_summary||{},bd=data.financial_breakdown||[],payments=data.payments||[];const debt=t=>bd.filter(x=>x.charge_type===t).reduce((n,x)=>n+(Number(x.debt)||0),0);const debts={booking:debt('booking'),order:debt('order'),event:debt('event'),service:debt('service')};const totalDebt=Number(sm.total_debt)||Object.values(debts).reduce((a,b)=>a+b,0);const today=new Date();today.setHours(0,0,0,0);const active=bk.find(x=>x.check_in_date&&x.check_out_date&&new Date(x.check_in_date+'T00:00:00')<=today&&today<=new Date(x.check_out_date+'T23:59:59'));const next=bk.filter(x=>x.check_in_date&&new Date(x.check_in_date+'T00:00:00')>=today).sort((a,b)=>a.check_in_date.localeCompare(b.check_in_date))[0];const current=active||next;const mini=(l,n,i)=>`<div class="mini"><span class="muted">${i} ${l}</span><b class="${n?'danger':'ok'}">${money(n)}</b></div>`;const debtRows=bd.filter(x=>Number(x.debt)>0).map(x=>`<a class="row" href="${detail(x.charge_type,x.charge_id)}"><div><b>${esc(x.label||x.charge_type)}</b><div class="muted">${esc(x.charge_type)}</div></div><div class="amount danger">${money(x.debt)} ↗</div></a>`).join('');const bookingRows=bk.map(x=>`<a class="row" href="${detail('booking',x.id)}"><div><b>🛏️ ${esc(x.room_name||'Номер')}</b><div class="muted">${date(x.check_in_date)} → ${date(x.check_out_date)} · 👥 ${x.guest_count||1}</div><span class="chip">${esc(x.status||'—')}</span><span class="chip">${esc(x.payment_status||'—')}</span></div><div class="amount">${money(x.total_amount)}<br>${Number(x.paid_amount)>=Number(x.total_amount)?'<span class="ok">оплачено</span>':'<span class="danger">не оплачено</span>'}</div></a>`).join('');$('app').innerHTML=`<section class="card ${totalDebt?'danger':'ok'}"><div class="hero"><div class="person"><div class="avatar">${esc((u.Display_name||'Г').trim().slice(0,1).toUpperCase())}</div><div><h2 class="name">${esc(u.Display_name||'Без имени')}</h2><div class="muted">📞 ${esc(u.Phone||'—')} · ✉️ ${esc(u.Email||'—')}${u.City?' · 📍 '+esc(u.City):''}</div></div></div><div class="actions"><a class="fd-btn" href="admin_v10_finance.html">💰 Финансы</a><a class="fd-btn primary" href="admin_v13_bookings.html?guest_id=${encodeURIComponent(uid)}">🛏️ Бронировать</a></div></div><div class="stats"><div class="stat"><small>Текущий долг</small><b class="${totalDebt?'danger':'ok'}">${money(totalDebt)}</b></div><div class="stat"><small>Оплачено</small><b class="ok">${money(sm.total_paid)}</b></div><div class="stat"><small>Начислено</small><b>${money(sm.total_charged)}</b></div><div class="stat"><small>Активность</small><b>${bk.length+od.length+so.length+ev.length}</b></div></div></section>${current?`<section class="current"><div class="current-main"><div><div class="muted">${active?'Гость сейчас проживает':'Ближайшее проживание'}</div><h2>🛏️ ${esc(current.room_name||'Номер')}</h2><div class="muted">${date(current.check_in_date)} → ${date(current.check_out_date)} · 👥 ${current.guest_count||1}</div></div><div class="actions"><a class="fd-btn primary" href="${detail('booking',current.id)}">Открыть бронирование</a></div></div></section>`:''}<section id="finance" class="card" style="margin-top:14px"><h2>💳 За что должен</h2><div class="muted">Только непогашенные начисления.</div><div class="breakdown">${mini('Проживание',debts.booking,'🛏️')}${mini('Кухня',debts.order,'🍲')}${mini('События',debts.event,'🎫')}${mini('Услуги',debts.service,'🧾')}</div><div>${debtRows||'<div class="empty">Долгов нет. Все начисления закрыты.</div>'}</div></section><section id="booking" class="card" style="margin-top:14px"><h2>🛏️ Проживание</h2><div class="list">${bookingRows||'<div class="empty">Бронирований пока нет.</div>'}</div></section><div class="grid"><section id="kitchen" class="card"><h2>🍲 Кухня</h2><div class="list">${od.map(x=>`<div class="row"><div><b>Заказ</b><div class="muted">${esc(x.items||'—')} · ${esc(x.status||'—')}</div></div><div class="amount">${money(x.total_amount)}</div></div>`).join('')||'<div class="empty">Заказов нет.</div>'}</div></section><section class="card"><h2>🧾 Услуги</h2><div class="list">${so.map(x=>`<div class="row"><div><b>${esc(x.service_name||'Услуга')}</b><div class="muted">${esc(x.quantity||1)} ${esc(x.unit||'шт.')} · ${esc(x.status||'—')}</div></div><div class="amount">${money(x.total_amount)}</div></div>`).join('')||'<div class="empty">Услуг нет.</div>'}</div></section></div><section class="card" style="margin-top:14px"><h2>💰 Последние платежи</h2><div class="list">${payments.map(x=>`<div class="row"><div><b>${money(x.amount)}</b><div class="muted">${esc(x.payment_method||x.method||'—')} · ${esc(x.status||'—')}</div></div><div class="muted">${new Date(x.created_at).toLocaleDateString('ru-RU')}</div></div>`).join('')||'<div class="empty">Платежей нет.</div>'}</div></section>`;if(location.hash==='#finance')document.getElementById('finance')?.scrollIntoView();if(location.hash==='#booking')document.getElementById('booking')?.scrollIntoView();if(location.hash==='#kitchen')document.getElementById('kitchen')?.scrollIntoView()}load();</script></body></html>
