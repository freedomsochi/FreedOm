<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — Orbit V5</title>
<style>
:root{--ink:#26352d;--muted:#68776e;--glass:rgba(255,255,255,.28);--glass-hi:rgba(255,255,255,.58);--green:#638e70;--gold:#b89267}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink)}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#eef5ef 0%,#fbfaf4 48%,#e7f0ea 100%)}
.scene:before,.scene:after{content:"";position:absolute;inset:-20%;pointer-events:none}.scene:before{background:radial-gradient(ellipse at 18% 8%,rgba(255,255,255,.95),transparent 24%),radial-gradient(ellipse at 78% 82%,rgba(115,166,133,.22),transparent 30%);filter:blur(18px)}
.scene:after{background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 37%,rgba(255,255,255,.08) 48%,transparent 60%);transform:translateX(-30%);animation:sun 9s ease-in-out infinite alternate}@keyframes sun{to{transform:translateX(32%)}}
.top{position:absolute;z-index:20;top:22px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}.hint{font-size:10px;letter-spacing:.12em;color:#66756c;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.62);padding:9px 13px;border-radius:99px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none}.orbit{position:relative;width:min(94vw,700px);height:min(94vw,700px)}
.light{position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle at 50% 43%,rgba(255,255,255,.9),rgba(255,255,255,.28) 42%,transparent 70%);filter:blur(7px)}
.ring{position:absolute;inset:5%;border-radius:50%;z-index:5;cursor:grab;--r:0deg;transform:rotate(var(--r));transition:transform 850ms cubic-bezier(.16,.86,.18,1)}.ring.drag{cursor:grabbing;transition:none}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(73,96,82,.19);box-shadow:inset 0 0 80px rgba(255,255,255,.75),0 0 0 1px rgba(255,255,255,.55),0 30px 90px rgba(45,66,53,.09)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(255,255,255,.48);box-shadow:0 0 45px rgba(255,255,255,.35)}
.node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:13px;z-index:3;color:#66756c;font-size:10px;line-height:1.25;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);box-shadow:inset 0 1px rgba(255,255,255,.85),0 12px 34px rgba(49,70,57,.05);transition:background .45s,box-shadow .45s,color .45s}
.node{transform:rotate(calc(var(--a)*1deg)) translateY(min(36vw,245px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}
.node.active{color:var(--ink);background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.35));box-shadow:0 18px 55px rgba(45,66,53,.15),0 0 0 5px rgba(99,142,112,.08),inset 0 1px rgba(255,255,255,.98)}
.node:after{content:"";position:absolute;top:10px;width:5px;height:5px;border-radius:50%;background:rgba(99,142,112,.62);box-shadow:0 0 14px rgba(99,142,112,.35)}
.tree{position:absolute;z-index:8;left:50%;bottom:0;width:55%;height:91%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 26px 26px rgba(39,62,48,.13))}.tree img{width:100%;height:100%;object-fit:contain;object-position:center bottom;animation:treeFloat 7s ease-in-out infinite}@keyframes treeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.004)}}
.center{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.core{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff 0,#dbeadd 28%,#7da487 68%,#567761 100%);box-shadow:0 0 0 13px rgba(99,142,112,.08),0 12px 35px rgba(45,70,52,.2),inset 0 1px rgba(255,255,255,.95);animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 20px rgba(99,142,112,.035),0 15px 42px rgba(45,70,52,.22),inset 0 1px rgba(255,255,255,.95)}}.center span{display:block;margin-top:12px;font-size:8px;letter-spacing:.34em;color:#7c8982;text-transform:uppercase}
.panel{position:absolute;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100% - 30px));display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border:1px solid rgba(255,255,255,.7);border-radius:22px;background:rgba(255,255,255,.28);backdrop-filter:blur(24px) saturate(120%);-webkit-backdrop-filter:blur(24px) saturate(120%);box-shadow:0 24px 80px rgba(38,58,46,.1)}.panel small{display:block;color:#7c8982;font-size:9px;letter-spacing:.22em;text-transform:uppercase}.panel strong{display:block;margin-top:4px;font:600 22px Georgia,serif}.panel button{border:1px solid rgba(255,255,255,.78);border-radius:14px;padding:11px 15px;background:rgba(38,53,45,.88);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(35,48,40,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:.55s}.modal.open{opacity:1;pointer-events:auto}.window{width:min(860px,calc(100% - 24px));max-height:88vh;overflow:hidden;border-radius:30px;background:rgba(249,251,247,.92);border:1px solid rgba(255,255,255,.9);box-shadow:0 45px 130px rgba(25,40,31,.2);transform:translateY(22px) scale(.965);transition:.6s cubic-bezier(.16,.86,.18,1)}.modal.open .window{transform:none}.media{height:350px;background:center/cover no-repeat}.copy{padding:25px}.copy small{font-size:9px;letter-spacing:.2em;color:#7a867f;text-transform:uppercase}.copy h2{font:600 39px Georgia,serif;margin:8px 0 10px}.copy p{margin:0;color:#68756d;line-height:1.6}.close{position:absolute;right:18px;top:18px;width:40px;height:40px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,255,255,.72);font-size:20px;color:#405047;z-index:2}
@media(max-width:620px){.top{top:15px;left:15px;right:15px}.hint{font-size:9px}.orbit{width:112vw;height:112vw}.tree{width:68%;height:86%}.node{width:84px;height:84px;margin:-42px;font-size:8px}.node{transform:rotate(calc(var(--a)*1deg)) translateY(41vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.panel{bottom:12px}.panel button{display:none}.media{height:235px}.copy h2{font-size:31px}}
</style>
</head>
<body>
<main class="scene">
<header class="top"><div class="brand">FreeDom</div><div class="hint">исследуйте пространство</div></header>
<section class="stage"><div class="orbit" id="orbit"><div class="light"></div><div class="tree"><img src="images/branches.png" alt="FreeDom tree branches"></div><div class="ring" id="ring">
<div class="node active" style="--a:0" data-i="0">Пространство</div><div class="node" style="--a:72" data-i="1">События</div><div class="node" style="--a:144" data-i="2">Комнаты</div><div class="node" style="--a:216" data-i="3">Баня</div><div class="node" style="--a:288" data-i="4">Кухня</div>
</div><div class="center"><div class="core"></div><span>living free</span></div></div></section>
<div class="panel"><div><small>выбрано</small><strong id="title">Пространство</strong></div><button id="open">Открыть</button></div>
<div class="modal" id="modal"><div class="window"><button class="close" id="close">×</button><div class="media" id="media"></div><div class="copy"><small>FreeDom</small><h2 id="mh"></h2><p id="mp"></p></div></div></div>
</main>
<script>
const labels=['Пространство','События','Комнаты','Баня','Кухня'];
const texts=['Здесь начинается знакомство с домом. Готовая страница FreeDom Space откроет пространства, практики, сад и атмосферу дома.','Жизнь FreeDom каждый день: реальные события, встречи, музыка, практики и люди.','Карта дома уже умеет показывать комнаты и их реальную доступность. Здесь она станет входом в этот мир.','Тепло бани, холодная вода и место под звёздным небом. Галерею и атмосферу проработаем отдельно.','Общее пространство дома. Концепцию кухни разработаем позже.'];
const imgs=['images/room-bungalow.jpg','images/gong-meditation.jpg','images/room-family.jpg','images/sauna.jpg','images/room-hostel.jpg'];
const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],title=document.getElementById('title');
let idx=0,rot=0,drag=false,startAngle=0,startRot=0,lastAngle=0,lastTime=0,velocity=0;
function pointAngle(e){const r=ring.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
function apply(r,animate=true){rot=r;ring.style.setProperty('--r',rot+'deg');if(!animate)ring.classList.add('drag');else ring.classList.remove('drag')}
function select(n){idx=(n%5+5)%5;const target=-idx*72;let d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;apply(rot);nodes.forEach((x,i)=>x.classList.toggle('active',i===idx));title.textContent=labels[idx]}
function nearest(){select(Math.round(-rot/72))}
ring.addEventListener('pointerdown',e=>{drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);startAngle=pointAngle(e);startRot=rot;lastAngle=startAngle;lastTime=performance.now();velocity=0});
ring.addEventListener('pointermove',e=>{if(!drag)return;const a=pointAngle(e);let d=a-lastAngle;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;apply(rot,false);const now=performance.now(),dt=Math.max(8,now-lastTime);velocity=.72*velocity+.28*(d/dt*16);lastAngle=a;lastTime=now});
ring.addEventListener('pointerup',()=>{if(!drag)return;drag=false;ring.classList.remove('drag');const inertia=Math.max(-38,Math.min(38,velocity*9));rot+=inertia;apply(rot);setTimeout(nearest,260)});
ring.addEventListener('pointercancel',()=>{drag=false;ring.classList.remove('drag');nearest()});
nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();select(+n.dataset.i)}));
const modal=document.getElementById('modal'),mh=document.getElementById('mh'),mp=document.getElementById('mp'),media=document.getElementById('media');
document.getElementById('open').onclick=()=>{mh.textContent=labels[idx];mp.textContent=texts[idx];media.style.backgroundImage=`url('${imgs[idx]}')`;modal.classList.add('open')};
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
// Direct Space entry: the finished Space experience lives separately while its final URL is being integrated.
nodes[0].addEventListener('dblclick',()=>location.href='space-preview.html');
</script>
</body>
</html>
