<div class="ui"><div class="brand"><a href="index.html">FreeDom</a><small>дом в котором живет любовь</small></div><a class="back" href="index.html">← Вернуться на главную</a><button class="light" id="light">☾ Ночной свет</button><div class="levels" id="levels"></div><div class="reticle" id="reticle"></div><div class="card" id="card"><button class="close" id="close">×</button><div class="photo"></div><div class="eyebrow">Объект FreeDom</div><h1 id="title">—</h1><p id="desc">—</p><div class="facts"><div class="fact"><b id="cap">—</b><span>вместимость</span></div><div class="fact"><b id="kind">—</b><span>тип</span></div></div><button class="book" id="book">Забронировать →</button></div><div class="hint">Перетаскивайте · колесо — масштаб · нажмите на светящуюся точку</div><div class="signature">Здесь начинается<br>твоя история...</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const world=new THREE.Group();scene.add(world),terrain=new THREE.Group();world.add(terrain);const floors={minus:new THREE.Group(),one:new THREE.Group(),two:new THREE.Group(),three:new THREE.Group(),attic:new THREE.Group()};Object.values(floors).forEach(g=>world.add(g));const hotspots=[];
function rounded(g,n,x,y,z,w,h,d,m,r=.35,u={}){const o=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),m);o.position.set(x,y,z);o.name=n;o.castShadow=true;o.receiveShadow=true;Object.assign(o.userData,u);g.add(o);return o}function box(g,n,x,y,z,w,h,d,m,u={}){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.name=n;o.castShadow=true;o.receiveShadow=true;Object.assign(o.userData,u);g.add(o);return o}function cyl(g,n,x,y,z,r,h,m,u={}){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;Object.assign(o.userData,u);g.add(o);return o}function sphere(g,n,x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
function tree(x,z,s=1){cyl(terrain,'trunk',x,2*s,z,.32*s,4*s,M.wood);sphere(terrain,'crown',x,5.1*s,z,2.25*s,M.grass)}

function roof(g,x,y,z,w,d){const a=box(g,'roofA',x,y,z-3.5,w,1.2,d/2,M.roof);a.rotation.x=-.5;const b=box(g,'roofB',x,y,z+3.5,w,1.2,d/2,M.roof);b.rotation.x=.5}

function hotspot(g,id,title,x,y,z,type='space'){const m=cyl(g,'hotspot',x,y,z,.42,.12,new THREE.MeshStandardMaterial({color:C.mint,emissive:C.mint,emissiveIntensity:2.5}),{id,title,type,hotspot:true});hotspots.push(m);const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.055,12,32),new THREE.MeshBasicMaterial({color:C.mint,transparent:true,opacity:.82}));ring.rotation.x=Math.PI/2;ring.position.copy(m.position);g.add(ring)}

rounded(terrain,'gate',0,2.2,43,15,4.4,.7,M.wood2,.15);for(let x=-6;x<=6;x+=2)rounded(terrain,'gateSlat',x,2.25,42.5,.22,4,.25,M.wood,.08);for(const x of [-7,7])rounded(terrain,'gateStone',x,2.8,43,.8,5.6,.8,M.stone,.12);
rounded(terrain,'poolDeck',21,.25,5,19,.38,27,M.floor,.4);rounded(terrain,'pool',21,.47,5,12,.42,21,M.water,.35);rounded(terrain,'poolEdge',21,.68,5,13,.2,22,M.stone,.2);for(const p of [[14,-4],[28,-4],[14,14],[28,14]])plant(p[0],p[1],.9);
rounded(terrain,'sportDeck',-24,.3,28,18,.55,14,M.wood,.45);for(let i=0;i<4;i++){cyl(terrain,'sportPole',-30+i*4,2.25,28,.18,4.1,M.metal);rounded(terrain,'sportBar',-28+i*4,4.1,28,4,.22,.22,M.metal,.08)}rounded(terrain,'bench',-24,1.05,33,7,.35,.85,M.wood2,.12);
rounded(terrain,'summerKitchen',-20,2.35,2,10,4.7,13,M.wood,.45);roof(terrain,-20,5.2,2,11,14);rounded(terrain,'summerDeck',-20,.22,9,12,.35,5,M.floor,.25);window(terrain,-20,2.7,-4.55,5);
rounded(terrain,'bungalow',-30,2.35,-28,14,4.7,10,M.wood,.45);roof(terrain,-30,5.2,-28,15,11);window(terrain,-30,2.65,-33.1,6);
rounded(terrain,'fountainBase',16,.4,-28,7,.7,7,M.stone,.5);cyl(terrain,'fountainWater',16,.82,-28,2.7,.16,M.water);cyl(terrain,'fountainCore',16,1.7,-28,.45,1.7,M.wall2);for(const p of [[9,-31],[23,-31],[9,-25],[23,-25]])plant(p[0],p[1],.75);

// Hammock
for(const x of [36,44])rounded(terrain,'hammockPost',x,2,-11,.3,4.2,.3,M.wood2,.08);const ham=rounded(terrain,'hammock',40,1.35,-11,8,.16,1.8,M.glass,.35);ham.rotation.z=.05;
// House shell and cutaway-friendly floors.
const W=34,D=24,H=5.1;function floorLevel(g,y,alpha=1){const wallMat=M.wall.clone();wallMat.transparent=alpha<1;wallMat.opacity=alpha;const side=M.wall2.clone();side.transparent=alpha<1;side.opacity=alpha;rounded(g,'slab',0,y,0,W+.6,.35,D+.6,M.floor,.18);rounded(g,'north',0,y+H/2,-D/2,W,H,.72,wallMat,.12);rounded(g,'west',-W/2,y+H/2,0,.72,H,D,side,.12);rounded(g,'east',W/2,y+H/2,-4,.72,H,D-8,wallMat,.12);rounded(g,'southL',-10,y+H/2,D/2,14,H,.72,wallMat,.12);rounded(g,'southR',13,y+H/2,D/2,9,H,.72,wallMat,.12);rounded(g,'hall',0,y+H/2,0,.55,H,D-1,side,.08);rounded(g,'partitionL',-8.5,y+H/2,0,W/2-1.5,.55,.6,side,.08);rounded(g,'partitionR',8.5,y+H/2,0,W/2-1.5,.55,.6,side,.08);for(const x of [-12,-4,4,12])window(g,x,y+2.5,-12.43);}

// Main porch on the right/front side.
rounded(floors.one,'porch',12,.28,14,11,.55,5,M.wood2,.2);for(let i=0;i<4;i++)rounded(floors.one,'porchPost',8+i*3.1,2.7,15,.25,5,.25,M.wood2,.06);for(let i=0;i<4;i++)rounded(floors.one,'step',12,.2-i*.12,17+i*.55,10-i*.7,.18,.65,M.stone,.05);

const nav=document.querySelector('#levels');const levels=[['space','Пространство','весь дом и территория'],['attic','Мансарда','верхний уровень'],['three','3 этаж','жилой уровень'],['two','2 этаж','жилой уровень'],['one','1 этаж','вход · общие зоны'],['minus','−1 этаж','нижний уровень']];let current='space';levels.forEach(([id,t,s])=>{const b=document.createElement('button');b.className='level'+(id==='space'?' space':'');b.dataset.id=id;b.innerHTML=`<b>${t}</b><span>${s}</span>`;b.onclick=()=>setView(id);nav.appendChild(b)});
function opacity(g,v){g.traverse(o=>{if(!o.isMesh)return;o.material.transparent=v<1||o.material.transparent;o.material.opacity=(o.userData.baseOpacity??1)*v})}function resetVisibility(){Object.entries(floors).forEach(([id,g])=>{g.visible=true;opacity(g,id===current?1:current==='space'?1:.13)});terrain.visible=true}

const card=document.querySelector('#card'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),cap=document.querySelector('#cap'),kind=document.querySelector('#kind');const data={
'room-guest':['Гостевая','Комната внутри дома. Здесь позже появятся реальные фотографии, актуальная вместимость и связь с room_id.','2 места','комната'],
'room-standard':['Стандарт','Размещение, которое будет связано с каталогом комнат и существующим бронированием.','2 места','комната'],

'summer-kitchen':['Летняя кухня','Пространство рядом с домом и бассейном.','общее','территория'],

let selected=null;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function select(o){const d=data[o.userData.id];if(!d)return;selected=o;const p=o.getWorldPosition(new THREE.Vector3());move(new THREE.Vector3(p.x+10,p.y+16,p.z+12),new THREE.Vector3(p.x,p.y,p.z),1050);title.textContent=d[0];desc.textContent=d[1];cap.textContent=d[2];kind.textContent=d[3];setTimeout(()=>card.classList.add('open'),550)}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(hotspots,true)[0];if(hit)select(hit.object)});document.querySelector('#close').onclick=()=>card.classList.remove('open');document.querySelector('#book').onclick=()=>selected&&(location.href='booking.html?object='+encodeURIComponent(selected.userData.id));document.querySelector('#light').onclick=()=>{const night=sun.intensity>1;sun.intensity=night?.75:4.5;hemi.intensity=night?.8:2.5;renderer.toneMappingExposure=night?.72:1.05;document.querySelector('#light').textContent=night?'☀ Дневной свет':'☾ Ночной свет'};
