<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Профиль гостя</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--mint:#20b997;--violet:#8877ee;--ink:#17222b}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.person{display:flex;gap:15px;align-items:center}.avatar{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#dff9f1,#ece8ff);font-size:28px}.name{font-size:28px;letter-spacing:-.7px;margin:0}.contact,.muted{color:var(--fd-muted)}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat{padding:15px;border:1px solid #ffffffaa;background:#ffffff70;backdrop-filter:blur(14px);border-radius:16px}.stat small{color:var(--fd-muted)}.stat b{display:block;font-size:21px;margin-top:5px}.danger{color:#d94f5f}.ok{color:#149b78}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(41,77,86,.07)}.card h2{margin:0 0 6px;font-size:18px}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.mini{padding:12px;border-radius:13px;background:#f7faf9;border:1px solid var(--fd-line)}.mini b{display:block;margin-top:4px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 4px;border-top:1px solid var(--fd-line);text-decoration:none;color:inherit}.row:first-child{border-top:0}.row:hover{background:#f5faf8;border-radius:10px}.amount{font-weight:800;white-space:nowrap}.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef5f3;color:#64736f;font-size:11px;margin:5px 4px 0 0}.empty{padding:12px 0;color:var(--fd-muted)}.payrow{display:grid;grid-template-columns:1fr auto;gap:12px}.payrow small{display:block;color:var(--fd-muted);margin-top:3px}.back{display:inline-flex;gap:6px;margin-bottom:7px}.section{margin-top:14px}.list{margin-top:9px}.attention{border-left:4px solid #d94f5f;background:#fff6f7}.settled{border-left:4px solid #20b997;background:#f3fbf8}.orb{min-height:220px;border-radius:20px;background:radial-gradient(circle at 35% 30%,#fff 0,#dff8f1 14%,#b7eadd 36%,#b9b0f0 72%,#e7e4fa 100%);position:relative;overflow:hidden}.orb:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffffaa;border-radius:50%;left:calc(50% - 75px);top:30px;transform:rotate(-18deg) scaleX(.45)}.orb-label{position:absolute;left:22px;bottom:20px;color:#27423d}.orb-label b{display:block;font-size:22px}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.breakdown{grid-template-columns:1fr 1fr}}@media(max-width:520px){.name{font-size:22px}.avatar{width:54px;height:54px}.hero-actions{width:100%}.hero-actions .fd-btn{flex:1}.row{display:grid;grid-template-columns:1fr}.amount{white-space:normal}.breakdown{gap:7px}.mini{padding:10px}}
</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a class="back fd-muted" href="admin_v10.html">← Гости</a><h1 class="fd-title">Профиль гостя</h1><div class="fd-sub">Один экран: человек, проживание, активность и деньги.</div></div></header><div id="app"><div class="card">Загрузка…</div></div></div></main></div><script>
const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'—';const uid=new URLSearchParams(location.search).get('id');
const typeLabel={booking:'🛏️ Проживание',order:'🍲 Кухня',service:'🧾 Услуга',event:'🎫 Событие'};const detail=(t,id)=>`admin_v11_finance_detail.html?type=${encodeURIComponent(t)}&id=${encodeURIComponent(id)}&user_id=${encodeURIComponent(uid)}`;
async function load(){if(!uid){$('app').innerHTML='<div class="card">Не указан пользователь.</div>';return}const [u,e,b,o,s,sum,bd,pay]=await Promise.all([sb.from('users').select('*').eq('user_id',uid).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,created_at,events(name,event_date,start_time,location)').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('bookings').select('id,room_id,check_in_date,check_out_date,status,total_amount,discount_amount,paid_amount,payment_method,payment_status,guest_count,rooms(name)').eq('user_id',uid).order('check_in_date',{ascending:false}),sb.from('orders').select('id,items,total_amount,paid_amount,discount_amount,status,payment_status,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('service_orders').select('id,service_name,unit,quantity,unit_price,total_amount,status,comment,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('user_financial_summary').select('total_charged,total_paid,total_debt,payment_status').eq('user_id',uid).single(),sb.from('user_financial_breakdown').select('charge_type,charge_id,label,charged,paid,debt,created_at,check_in_date,check_out_date,service_unit,service_quantity').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('id,booking_id,order_id,user_id,amount,method,status,payment_method,note,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(20)]);if(u.error){$('app').innerHTML='<div class="card">Ошибка: '+esc(u.error.message)+'</div>';return}const user=u.data,ev=e.data||[],bk=b.data||[],od=o.data||[],so=s.data||[],sm=sum.data||{total_charged:0,total_paid:0,total_debt:0,payment_status:'—'},bdt=bd.data||[],payments=pay.data||[];const debt=t=>bdt.filter(x=>x.charge_type===t).reduce((n,x)=>n+(Number(x.debt)||0),0),debts={booking:debt('booking'),order:debt('order'),event:debt('event'),service:debt('service')};const totalDebt=Number(sm.total_debt)||Object.values(debts).reduce((a,b)=>a+b,0);const initials=(user.Display_name||'Г').trim().slice(0,1).toUpperCase();const mini=(label,n,icon)=>`<div class="mini"><span class="muted">${icon} ${label}</span><b class="${n?'danger':'ok'}">${money(n)}</b></div>`;const chargeRows=bdt.filter(x=>Number(x.debt)>0).map(x=>`<a class="row" href="${detail(x.charge_type,x.charge_id)}"><div><b>${esc(x.label||typeLabel[x.charge_type]||'Начисление')}</b><div class="muted">${typeLabel[x.charge_type]||x.charge_type}</div></div><div class="amount danger">${money(x.debt)} ↗</div></a>`).join('');$('app').innerHTML=`<section class="card ${totalDebt?'attention':'settled'}"><div class="hero"><div class="person"><div class="avatar">${esc(initials)}</div><div><h2 class="name">${esc(user.Display_name||'Без имени')}</h2><div class="contact">📞 ${esc(user.Phone||'—')} · ✉️ ${esc(user.Email||'—')}${user.City?' · 📍 '+esc(user.City):''}</div></div></div><div class="hero-actions"><a class="fd-btn" href="admin_v10_finance.html">💰 Финансы</a><a class="fd-btn primary" href="admin_v11_bookings.html">🛏️ Бронировать</a></div></div><div class="stats"><div class="stat"><small>Текущий долг</small><b class="${totalDebt?'danger':'ok'}">${money(totalDebt)}</b></div><div class="stat"><small>Оплачено</small><b class="ok">${money(sm.total_paid)}</b></div><div class="stat"><small>Начислено</small><b>${money(sm.total_charged)}</b></div><div class="stat"><small>Активность</small><b>${ev.length+bk.length+od.length+so.length}</b></div></div></section><div class="grid"><section class="card"><h2>💳 За что должен</h2><div class="muted">Только реальные непогашенные начисления. Нажмите на строку, чтобы записать оплату.</div><div class="breakdown">${mini('Проживание',debts.booking,'🛏️')}${mini('Кухня',debts.order,'🍲')}${mini('События',debts.event,'🎫')}${mini('Услуги',debts.service,'🧾')}</div><div class="list">${chargeRows||'<div class="empty">Долгов нет. Все начисления закрыты.</div>'}</div></section><div class="orb"><div class="orb-label"><b>FreeDom</b><span>пространство развития</span></div></div></div><section class="card section"><h2>🛏️ Проживание</h2><div class="muted">Все бронирования гостя</div><div class="list">${bk.length?bk.map(x=>{const r=bdt.find(q=>q.charge_type==='booking'&&q.charge_id===x.id),d=Number(r?.debt)||0,total=Number(r?.charged)||Math.max((Number(x.total_amount)||0)-(Number(x.discount_amount)||0),0);return `<a class="row" href="${detail('booking',x.id)}"><div><b>${esc(x.rooms?.name||'Номер')}</b><div class="muted">${date(x.check_in_date)} → ${date(x.check_out_date)} · 👥 ${x.guest_count||1}</div><span class="chip">${esc(x.status||'—')}</span><span class="chip">${esc(x.payment_status||'—')}</span></div><div class="amount">${money(total)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d):'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Бронирований пока нет.</div>'}</div></section><section class="card section"><h2>🎫 События</h2><div class="muted">Участие и регистрационные платежи</div><div class="list">${ev.length?ev.map(x=>{const r=bdt.find(q=>q.charge_type==='event'&&q.charge_id===x.id),total=Number(r?.charged)||Number(x.amount)||0,d=Number(r?.debt)||0;return `<a class="row" href="${detail('event',x.id)}"><div><b>${esc(x.events?.name||'Событие')}</b><div class="muted">${date(x.events?.event_date)}${x.events?.start_time?' · '+esc(x.events.start_time):''}${x.events?.location?' · 📍 '+esc(x.events.location):''}</div><span class="chip">👥 ${x.participants||1}</span><span class="chip">${esc(x.payment_status||x.status||'—')}</span></div><div class="amount">${total?money(total):'Бесплатно'}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d):'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Регистраций нет.</div>'}</div></section><section class="grid section"><section class="card"><h2>🍲 Кухня</h2><div class="muted">История заказов</div><div class="list">${od.length?od.map(x=>{const r=bdt.find(q=>q.charge_type==='order'&&q.charge_id===x.id),total=Number(r?.charged)||Math.max((Number(x.total_amount)||0)-(Number(x.discount_amount)||0),0),d=Number(r?.debt)||0;return `<a class="row" href="${detail('order',x.id)}"><div><b>Заказ · ${new Date(x.created_at).toLocaleDateString('ru-RU')}</b><div class="muted">${esc(JSON.stringify(x.items||[]).slice(0,130))}</div><span class="chip">${esc(x.status||'—')}</span></div><div class="amount">${money(total)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d):'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Заказов нет.</div>'}</div></section><section class="card"><h2>🧾 Услуги</h2><div class="muted">Дополнительные услуги</div><div class="list">${so.length?so.map(x=>{const r=bdt.find(q=>q.charge_type==='service'&&q.charge_id===x.id),d=Number(r?.debt)||0;return `<a class="row" href="${detail('service',x.id)}"><div><b>${esc(x.service_name)}</b><div class="muted">${x.quantity||1} ${esc(x.unit||'шт.')} × ${money(x.unit_price)}</div><span class="chip">${esc(x.status||'—')}</span></div><div class="amount">${money(x.total_amount)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d):'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Услуг нет.</div>'}</div></section></section><section class="card section"><h2>💰 Последние оплаты</h2><div class="muted">Последние 20 платежей гостя</div><div class="list">${payments.length?payments.map(p=>`<div class="row payrow"><div><b>${money(p.amount)}</b><small>${new Date(p.created_at).toLocaleString('ru-RU')}${p.payment_method?' · '+esc(p.payment_method):p.method?' · '+esc(p.method):''}</small>${p.note?`<small>${esc(p.note)}</small>`:''}</div><div class="ok">✓ ${esc(p.status||'Проведён')}</div></div>`).join(''):'<div class="empty">Оплат пока нет.</div>'}</div></section></div>`}load();</script></body></html>
