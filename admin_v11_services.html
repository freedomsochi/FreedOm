<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Услуги</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0c1019;border:1px solid var(--fd-line);border-radius:12px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}.service{padding:16px;background:linear-gradient(180deg,#141927,#10131e);border:1px solid var(--fd-line);border-radius:16px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.meta span{padding:7px 9px;background:var(--fd-panel2);border-radius:9px;color:#cbd1df;font-size:13px}.debt{color:var(--fd-red);font-weight:850}.paid{color:var(--fd-green);font-weight:850}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input{flex:1;min-width:220px}.comment{margin-top:12px;padding:11px;background:#0c1019;border-radius:11px;color:#cbd1df}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.top{display:block}.top>div:last-child{margin-top:10px}.filters input{min-width:100%}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a class="active" href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Услуги</h1><div class="fd-sub">Дополнительные услуги гостей</div></div><button class="fd-btn" onclick="load()">↻ Обновить</button></header><section class="fd-card"><div class="stats"><div class="stat"><span class="fd-muted">Заказов</span><b id="count">—</b></div><div class="stat"><span class="fd-muted">Начислено</span><b id="charged">—</b></div><div class="stat"><span class="fd-muted">Оплачено</span><b id="paid">—</b></div><div class="stat"><span class="fd-muted">Долг</span><b id="debt" class="debt">—</b></div></div></section><section class="fd-card" style="margin-top:16px"><div class="filters"><input id="q" class="fd-search" placeholder="Поиск: услуга, имя, телефон"><button id="active" class="fd-btn primary">Активные</button><button id="all" class="fd-btn">Все</button><button id="debtOnly" class="fd-btn">🔴 С долгом</button></div><div id="list">Загрузка…</div></section></div></main></div><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let rows=[],paidBy={};let mode='active';function cancelled(o){return ['cancelled','canceled','отменён','отменено','отменена'].includes(String(o.status||'').toLowerCase())}function total(o){return Math.max(Number(o.total_amount)||0,0)}function paid(o){return Number(paidBy[o.id]||0)}function due(o){return Math.max(total(o)-paid(o),0)}async function load(){const {data,error}=await db.from('service_orders').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="fd-empty" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}rows=data||[];paidBy={};const ids=rows.map(o=>o.id).filter(Boolean);if(ids.length){const {data:a,error:ae}=await db.from('payment_allocations').select('service_order_id,amount').in('service_order_id',ids);if(!ae)(a||[]).forEach(x=>paidBy[x.service_order_id]=(paidBy[x.service_order_id]||0)+(Number(x.amount)||0))}const valid=rows.filter(o=>!cancelled(o));$('count').textContent=valid.length;$('charged').textContent=money(valid.reduce((s,o)=>s+total(o),0));$('paid').textContent=money(valid.reduce((s,o)=>s+paid(o),0));$('debt').textContent=money(valid.reduce((s,o)=>s+due(o),0));render()}function render(){const q=$('q').value.trim().toLowerCase();const list=rows.filter(o=>{const txt=[o.service_name,o.unit,o.comment,o.status].join(' ').toLowerCase();return (!q||txt.includes(q))&&(mode==='all'||(mode==='active'&&!cancelled(o))||(mode==='debt'&&!cancelled(o)&&due(o)>0))});$('list').innerHTML=list.map(o=>{const t=total(o),p=paid(o),d=due(o),cancel=cancelled(o);return `<article class="service"><div class="top"><div><div class="fd-kicker">${esc(o.status||'Услуга')}</div><h2 style="margin:4px 0">🧾 ${esc(o.service_name)}</h2><div>${Number(o.quantity)||0} ${esc(o.unit||'шт.')}</div><div class="fd-muted">${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):''}</div></div><div style="text-align:right"><div style="font-size:20px" class="${d?'debt':'paid'}">${money(d)}</div><div class="fd-muted">${d?'долг':'оплачено'}</div></div></div><div class="meta"><span>💰 Начислено ${money(t)}</span><span>💳 Оплачено ${money(p)}</span><span>📦 ${Number(o.quantity)||0} ${esc(o.unit||'')}</span><span>💵 ${money(o.unit_price)}</span></div>${o.comment?`<div class="comment">💬 ${esc(o.comment)}</div>`:''}<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px">${o.user_id?`<a class="fd-btn" href="admin_v11_guest_profile.html?id=${encodeURIComponent(o.user_id)}">👤 Профиль гостя</a>`:''}${o.user_id&&d&&!cancel?`<a class="fd-btn primary" href="admin_v11_finance_detail.html?type=service&id=${encodeURIComponent(o.id)}&user_id=${encodeURIComponent(o.user_id)}">💳 Оплатить ${money(d)}</a>`:''}</div></article>`}).join('')||'<div class="fd-empty">Нет подходящих услуг.</div>'}$('q').oninput=render;$('active').onclick=()=>{mode='active';buttons();render()};$('all').onclick=()=>{mode='all';buttons();render()};$('debtOnly').onclick=()=>{mode='debt';buttons();render()};function buttons(){$('active').classList.toggle('primary',mode==='active');$('all').classList.toggle('primary',mode==='all');$('debtOnly').classList.toggle('primary',mode==='debt')}load();</script></body></html>
