:var(--fd-muted)}.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:#d9e4e0}.event-dot{position:absolute;left:0;width:11px;height:11px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #dff8f1}.orb{height:100%;min-height:220px;border-radius:22px;background:radial-gradient(circle at 35% 30%,#ffffff 0,#dff8f1 13%,#b7eadd 35%,#b9b0f0 70%,#e7e4fa 100%);position:relative;overflow:hidden}.orb:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffffaa;border-radius:50%;left:calc(50% - 75px);top:35px;transform:rotate(-18deg) scaleX(.45)}.orb:after{content:"✦";position:absolute;right:28px;top:25px;color:#fff;font-size:20px}.orb-label{position:absolute;left:24px;bottom:22px;color:#27423d}.orb-label b{display:block;font-size:22px}.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px}.mobile-nav{display:none}@media(max-width:800px){.dashboard-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.charge-summary{grid-template-columns:1fr 1fr}.orb{min-height:180px}}@media(max-width:520px){.name{font-size:22px}.avatar{width:54px;height:54px;border-radius:18px}.hero-actions{width:100%}.hero-actions .fd-btn{flex:1}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:18px}.row{display:grid;grid-template-columns:1fr}.row>div:last-child{margin-top:7px}.amount{white-space:normal}.mobile-nav{display:block}.fd-sidebar{display:none}}
</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a class="back fd-muted" href="admin_v10.html">← Гости</a><h1 class="fd-title">Профиль гостя</h1><div class="fd-sub">Единая история взаимодействия с FreeDom</div></div></header><div id="app"><div class="fd-card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'—';const p=new URLSearchParams(location.search),uid=p.get('id'),status=s=>({confirmed:'Подтверждена',new:'Новая',cancelled:'Отменена',paid:'Оплачено',pending:'Ожидает'}[s]||s||'—'),chargeUrl=(t,id)=>`admin_v11_finance_detail.html?type=${encodeURIComponent(t)}&id=${encodeURIComponent(id)}&user_id=${encodeURIComponent(uid)}`;async function load(){if(!uid){$('app').innerHTML='<div class="fd-card">Не указан пользователь.</div>';return}const [u,e,b,o,s,summary,breakdown]=await Promise.all([sb.from('users').select('*').eq('user_id',uid).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,created_at,events(name,event_date,start_time,location)').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('bookings').select('id,room_id,check_in_date,check_out_date,status,total_amount,discount_amount,paid_amount,payment_method,payment_status,guest_count,rooms(name)').eq('user_id',uid).order('check_in_date',{ascending:false}),sb.from('orders').select('id,items,total_amount,paid_amount,discount_amount,status,payment_status,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('service_orders').select('id,service_name,unit,quantity,unit_price,total_amount,status,comment,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('user_financial_summary').select('total_charged,total_paid,total_debt,payment_status').eq('user_id',uid).single(),sb.from('user_financial_breakdown').select('charge_type,charge_id,label,charged,paid,debt,created_at,check_in_date,check_out_date,service_unit,service_quantity').eq('user_id',uid).order('created_at',{ascending:false})]);if(u.error){$('app').innerHTML='<div class="fd-card">Ошибка: '+esc(u.error.message)+'</div>';return}const ev=e.data||[],bk=b.data||[],od=o.data||[],so=s.data||[],sum=summary.data||{total_charged:0,total_paid:0,total_debt:0},bd=breakdown.data||[];const debt=t=>bd.filter(x=>x.charge_type===t).reduce((n,r)=>n+(Number(r.debt)||0),0),bdt=debt('booking'),odt=debt('order'),evt=debt('event'),sot=debt('service');const stat=(label,n,cl='')=>`<div class="mini"><span class="muted">${label}</span><b class="${cl}">${money(n)}</b></div>`;$('app').innerHTML=`<section class="fd-card profile"><div class="hero"><div class="person"><div class="avatar">👤</div><div><h2 class="name">${esc(u.Display_name||'Без имени')}</h2><div class="contact">📞 ${esc(u.Phone||'—')} &nbsp; · &nbsp; ✉️ ${esc(u.Email||'—')}</div></div></div><div class="hero-actions"><a class="fd-btn" href="admin_v10_finance.html">💰 Финансы</a><a class="fd-btn primary" href="admin_v10_events.html">🎫 События</a></div></div><div class="stats"><div class="stat"><small>Общий долг</small><b class="${Number(sum.total_debt)>0?'danger':'ok'}">${money(sum.total_debt)}</b></div><div class="stat"><small>Оплачено</small><b class="ok">${money(sum.total_paid)}</b></div><div class="stat"><small>Начислено</small><b>${money(sum.total_charged)}</b></div><div class="stat"><small>Событий</small><b>${ev.length}</b></div></div></section><div class="dashboard-grid section"><section class="fd-card"><h2>Финансовая картина</h2><div class="muted">Разбивка текущих обязательств гостя</div><div class="charge-summary">${stat('🛏️ Проживание',bdt,bdt?'danger':'ok')}${stat('🍲 Кухня',odt,odt?'danger':'ok')}${stat('🎫 События',evt,evt?'danger':'ok')}${stat('🧾 Услуги',sot,sot?'danger':'ok')}</div><div class="row" style="margin-top:8px"><div><b>Итого к оплате</b><div class="muted">Все активные начисления</div></div><div class="amount ${Number(sum.total_debt)?'danger':'ok'}">${money(sum.total_debt)}</div></div></section><div class="orb"><div class="orb-label"><b>FreeDom</b><span>пространство развития</span></div></div></div><section class="fd-card section"><h2>🎫 События</h2>${ev.length?ev.map(x=>{const r=bd.find(q=>q.charge_type==='event'&&q.charge_id===x.id),a=Number(r?.charged)||Number(x.amount)||0,d=Number(r?.debt)||0;return `<a class="row ${d?'charge-link':''}" ${d?`href="${chargeUrl('event',x.id)}"`:''}><div><b>${esc(x.events?.name||'Событие')}</b><div class="muted">${date(x.events?.event_date)}${x.events?.start_time?' · '+esc(x.events.start_time):''}${x.events?.location?' · 📍 '+esc(x.events.location):''}</div><span class="chip">👥 ${x.participants||1}</span><span class="chip">${esc(status(x.status))}</span></div><div>${a?money(a):'Бесплатно'}<br><span class="${d?'danger':'ok'}">${a?(d?'долг '+money(d)+' ↗':'оплачено'):'Бесплатно'}</span></div></a>`}).join(''):'<div class="empty">Регистраций нет.</div>'}</section><section class="fd-card section"><h2>🛏️ Проживание</h2>${bk.length?bk.map(x=>{const r=bd.find(q=>q.charge_type==='booking'&&q.charge_id===x.id),d=Number(r?.debt)||0,t=Number(r?.charged)||Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0));return `<a class="row ${d?'charge-link':''}" ${d?`href="${chargeUrl('booking',x.id)}"`:''}><div><b>${esc(x.rooms?.name||'Номер')}</b><div class="muted">${date(x.check_in_date)} → ${date(x.check_out_date)} · 👥 ${x.guest_count||1}</div><span class="chip">${esc(x.status||'—')}</span><span class="chip">${esc(x.payment_status||'—')}</span></div><div>${money(t)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d)+' ↗':'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Бронирований нет.</div>'}</section><section class="fd-card section"><h2>🍲 Кухня и услуги</h2>${od.length?od.map(x=>{const r=bd.find(q=>q.charge_type==='order'&&q.charge_id===x.id),t=Number(r?.charged)||Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0)),d=Number(r?.debt)||0;return `<a class="row ${d?'charge-link':''}" ${d?`href="${chargeUrl('order',x.id)}"`:''}><div><b>Заказ от ${new Date(x.created_at).toLocaleDateString('ru-RU')}</b><div class="muted">${esc(JSON.stringify(x.items||[]).slice(0,150))}</div><span class="chip">${esc(x.status||'—')}</span></div><div>${money(t)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d)+' ↗':'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Заказов кухни нет.</div>'}${so.length?so.map(x=>{const r=bd.find(q=>q.charge_type==='service'&&q.charge_id===x.id),d=Number(r?.debt)||0;return `<a class="row ${d?'charge-link':''}" ${d?`href="${chargeUrl('service',x.id)}"`:''}><div><b>${esc(x.service_name)}</b><div class="muted">${x.quantity} ${esc(x.unit)} × ${money(x.unit_price)}</div><span class="chip">${esc(x.status||'—')}</span></div><div>${money(x.total_amount)}<br><span class="${d?'danger':'ok'}">${d?'долг '+money(d)+' ↗':'оплачено'}</span></div></a>`}).join(''):'<div class="empty">Дополнительных услуг нет.</div>'}</section></div>`}load();</script></body></html>
