<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Профиль гостя</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.person{display:flex;gap:13px;align-items:center}.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#22273b;font-size:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#181c2d;border-radius:12px;padding:13px}.stat small{color:var(--fd-muted)}.stat b{display:block;font-size:20px;margin-top:4px}.section{margin-top:16px}.row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid var(--fd-line)}.row:first-child{border-top:0}.muted{color:var(--fd-muted)}.danger{color:#ff6b6b}.ok{color:#42d392}.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#1b2032;color:#b8bfd3;font-size:12px;margin:3px 4px 0 0}.amount{font-weight:700;white-space:nowrap}.empty{padding:12px 0;color:var(--fd-muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{display:block}.row>div:last-child{margin-top:8px}.amount{white-space:normal}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a href="admin_v10.html" class="fd-muted">← Гости</a><h1 class="fd-title">Профиль гостя</h1></div></header><div id="app"><div class="fd-card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'—';const p=new URLSearchParams(location.search),uid=p.get('id');const st=s=>({confirmed:'Подтверждена',new:'Новая',cancelled:'Отменена',paid:'Оплачено',pending:'Ожидает'}[s]||s||'—');async function load(){if(!uid){$('app').innerHTML='<div class="fd-card">Не указан пользователь.</div>';return}const [u,e,b,o,s]=await Promise.all([sb.from('users').select('*').eq('user_id',uid).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,events(name,event_date,start_time,location)').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('bookings').select('id,room_id,check_in_date,check_out_date,status,total_amount,discount_amount,paid_amount,payment_method,payment_status,guest_count,rooms(name)').eq('user_id',uid).order('check_in_date',{ascending:false}),sb.from('orders').select('id,items,total_amount,paid_amount,discount_amount,status,payment_status,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('service_orders').select('id,service_name,unit,quantity,unit_price,total_amount,status,comment,created_at').eq('user_id',uid).order('created_at',{ascending:false})]);if(u.error){$('app').innerHTML='<div class="fd-card">Ошибка: '+esc(u.error.message)+'</div>';return}const ev=e.data||[],bk=b.data||[],od=o.data||[],so=s.data||[];const bookingDebt=bk.reduce((x,r)=>x+Math.max(0,(Number(r.total_amount)||0)-(Number(r.discount_amount)||0)-(Number(r.paid_amount)||0)),0),orderDebt=od.reduce((x,r)=>x+Math.max(0,(Number(r.total_amount)||0)-(Number(r.discount_amount)||0)-(Number(r.paid_amount)||0)),0),serviceDebt=so.reduce((x,r)=>x+Math.max(0,Number(r.total_amount)||0),0),eventDebt=ev.reduce((x,r)=>x+Math.max(0,(Number(r.amount)||0)-(Number(r.paid_amount)||0)),0);$('app').innerHTML=`<section class="fd-card"><div class="hero"><div class="person"><div class="avatar">👤</div><div><h2 style="margin:0">${esc(u.Display_name||'Без имени')}</h2><div class="muted">📞 ${esc(u.Phone||'—')} · ✉️ ${esc(u.Email||'—')}</div></div></div></div><div class="stats"><div class="stat"><small>Общий долг</small><b class="${Number(u.total_debt)>0?'danger':'ok'}">${money(u.total_debt)}</b></div><div class="stat"><small>Баланс</small><b>${money(u.balance)}</b></div><div class="stat"><small>Бронирований</small><b>${bk.length}</b></div><div class="stat"><small>Событий</small><b>${ev.length}</b></div></div></section><section class="fd-card section"><h2 style="margin-top:0">🔴 За что должен</h2><div class="row"><div>🛏️ Проживание</div><div class="amount ${bookingDebt?'danger':'ok'}">${money(bookingDebt)}</div></div><div class="row"><div>🍲 Кухня / заказы</div><div class="amount ${orderDebt?'danger':'ok'}">${money(orderDebt)}</div></div><div class="row"><div>🎫 События</div><div class="amount ${eventDebt?'danger':'ok'}">${money(eventDebt)}</div></div><div class="row"><div>🧾 Дополнительные услуги</div><div class="amount ${serviceDebt?'danger':'ok'}">${money(serviceDebt)}</div></div></section><section class="fd-card section"><h2 style="margin-top:0">🛏️ Проживание</h2>${bk.length?bk.map(x=>{const debt=Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0)-(Number(x.paid_amount)||0));return `<div class="row"><div><b>${esc(x.rooms?.name||'Номер')}</b><div class="muted">${date(x.check_in_date)} → ${date(x.check_out_date)} · 👥 ${x.guest_count||1}</div><span class="chip">${esc(x.status||'—')}</span><span class="chip">${esc(x.payment_status||'—')}</span></div><div><div>${money((Number(x.total_amount)||0)-(Number(x.discount_amount)||0))}</div><div class="${debt?'danger':'ok'}">${debt?'долг '+money(debt):'оплачено'}</div></div></div>`}).join(''):'<div class="empty">Бронирований нет.</div>'}</section><section class="fd-card section"><h2 style="margin-top:0">🎫 События</h2>${ev.length?ev.map(x=>{const a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p);return `<div class="row"><div><b>${esc(x.events?.name||'Событие')}</b><div class="muted">${date(x.events?.event_date)}${x.events?.start_time?' · '+esc(x.events.start_time):''}${x.events?.location?' · 📍 '+esc(x.events.location):''}</div><span class="chip">👥 ${x.participants||1}</span><span class="chip">${esc(st(x.status))}</span></div><div>${a?money(a):'Бесплатно'}<br><span class="${d?'danger':'ok'}">${a?(d?'долг '+money(d):'оплачено'):'Бесплатно'}</span></div></div>`}).join(''):'<div class="empty">Регистраций нет.</div>'}</section><section class="fd-card section"><h2 style="margin-top:0">🍲 Кухня / заказы</h2>${od.length?od.map(x=>`<div class="row"><div><b>Заказ от ${new Date(x.created_at).toLocaleDateString('ru-RU')}</b><div class="muted">${esc(JSON.stringify(x.items||[]).slice(0,180))}</div><span class="chip">${esc(x.status||'—')}</span><span class="chip">${esc(x.payment_status||'—')}</span></div><div>${money((Number(x.total_amount)||0)-(Number(x.discount_amount)||0))}<br><span class="${Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0)-(Number(x.paid_amount)||0)?'danger':'ok'}">${Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0)-(Number(x.paid_amount)||0)?'долг '+money(Math.max(0,(Number(x.total_amount)||0)-(Number(x.discount_amount)||0)-(Number(x.paid_amount)||0))):'оплачено')}</span></div></div>`).join(''):'<div class="empty">Заказов кухни нет.</div>'}${so.length?so.map(x=>`<div class="row"><div><b>${esc(x.service_name)}</b><div class="muted">${x.quantity} ${esc(x.unit)} × ${money(x.unit_price)}</div><span class="chip">${esc(x.status)}</span></div><div>${money(x.total_amount)}</div></div>`).join(''):''}</section></div>`}load();</script></body></html>
