<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Финансы</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.finance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:13px;background:#20263a;display:grid;place-items:center}.debt{color:var(--fd-red);font-weight:800}.ok{color:var(--fd-green)}.detail{margin-top:12px;padding:14px;background:#0d111b;border:1px solid var(--fd-line);border-radius:13px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--fd-line)}.detail-row:last-child{border-bottom:0}.muted{color:var(--fd-muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.person-row{padding:14px 0;border-bottom:1px solid var(--fd-line)}.charge{cursor:pointer}.charge:hover{background:#171d2d;border-radius:9px;padding-left:8px;padding-right:8px}.charge-title{display:flex;align-items:center;gap:7px}.charge-arrow{color:var(--fd-muted)}.person-main{min-width:0}.person-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.finance-actions{display:flex;gap:8px;flex-wrap:wrap}.finance-actions .fd-btn{justify-content:center}@media(max-width:700px){.finance-grid{grid-template-columns:1fr 1fr;gap:8px}.finance-grid .fd-card{padding:12px}.finance-grid .fd-stat-value{font-size:19px}.detail-row{display:block}.detail-row>div:last-child{margin-top:5px}.toolbar{display:block}.toolbar input{width:100%;box-sizing:border-box;margin-bottom:8px}.person{align-items:flex-start}.avatar{width:38px;height:38px;flex:0 0 38px}.person-main{flex:1}.finance-actions{display:grid;grid-template-columns:1fr}.finance-actions .fd-btn{width:100%}}@media(max-width:480px){.fd-sidebar{display:none}.fd-main{margin:0!important}.fd-container{padding:12px!important}.fd-topbar{padding:4px 0 10px}.fd-title{font-size:24px!important}.fd-sub{font-size:12px}.finance-grid{margin-top:8px}.finance-grid .fd-stat-label{font-size:11px}.finance-grid .fd-stat-value{font-size:18px}.person-row{padding:13px 0}.detail{padding:11px;margin-top:9px;border-radius:12px}.detail-row{padding:9px 0}.charge{padding-left:2px!important;padding-right:2px!important}.charge:hover{padding-left:2px;padding-right:2px}.toolbar .fd-btn{width:100%;justify-content:center}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a class="active" href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Финансы</h1><div class="fd-sub">Долги, оплаты и понятная детализация</div></div><a class="fd-btn" href="admin.html">Старая финансовая панель</a></header><section class="finance-grid"><div class="fd-card"><div class="fd-stat-label">Начислено</div><div id="charged" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Оплачено</div><div id="paid" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div id="debt" class="fd-stat-value red">—</div></div><div class="fd-card"><div class="fd-stat-label">Должников</div><div id="debtors" class="fd-stat-value">—</div></div></section><section class="fd-card" style="margin-top:18px"><div class="toolbar"><input id="search" class="fd-search" placeholder="Поиск по имени или телефону"><button id="onlyDebt" class="fd-btn">🔴 Только с долгом</button></div><div id="list" style="margin-top:10px">Загрузка…</div></section></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],onlyDebt=false;function normalise(x){return x||{summary:[],users:[],breakdown:[]}}async function load(){const{data,error}=await sb.rpc('admin_get_finance_overview');if(error){$('list').innerHTML='<div class="fd-card">Ошибка загрузки финансовых данных.</div>';return}const d=normalise(data),summary=d.summary||[],users=new Map((d.users||[]).map(u=>[u.user_id,u])),breakdown={};(d.breakdown||[]).forEach(x=>(breakdown[x.user_id]??=[]).push(x));rows=summary.map(x=>({...x,user:users.get(x.user_id)||{},charges:breakdown[x.user_id]||[]}));const charged=rows.reduce((n,x)=>n+(Number(x.total_charged)||0),0),paid=rows.reduce((n,x)=>n+(Number(x.total_paid)||0),0),debt=rows.reduce((n,x)=>n+(Number(x.total_debt)||0),0);$('charged').textContent=money(charged);$('paid').textContent=money(paid);$('debt').textContent=money(debt);$('debtors').textContent=rows.filter(x=>Number(x.total_debt)>0).length;render()}function render(){const q=$('search').value.trim().toLowerCase();const arr=rows.filter(x=>{const text=[x.user.Display_name,x.user.Phone,x.user.Email].join(' ').toLowerCase();return(!q||text.includes(q))&&(!onlyDebt||Number(x.total_debt)>0)});$('list').innerHTML=arr.map(x=>{const open=x.charges.filter(r=>Number(r.debt)>0);return `<div class="person-row"><div class="person"><div class="avatar">👤</div><div class="person-main"><b class="person-name">${esc(x.user.Display_name||'Без имени')}</b><div class="muted">${esc(x.user.Phone||x.user.Email||'')}</div></div><div style="margin-left:auto;text-align:right"><b class="${Number(x.total_debt)>0?'debt':'ok'}">${money(x.total_debt)}</b><div class="muted">долг</div></div></div><div class="detail"><div class="detail-row"><div><span class="muted">Начислено</span></div><div>${money(x.total_charged)}</div></div><div class="detail-row"><div><span class="muted">Оплачено</span></div><div class="ok">${money(x.total_paid)}</div></div><div style="margin-top:10px"><b>🔴 За что должен</b>${open.length?open.map(r=>`<a class="detail-row charge" href="admin_v11_finance_detail.html?type=${encodeURIComponent(r.charge_type||'service')}&id=${encodeURIComponent(r.charge_id||'')}&user_id=${encodeURIComponent(x.user_id)}" style="display:flex;text-decoration:none;color:inherit"><div><div class="charge-title">${esc(r.label||'Начисление')} <span class="charge-arrow">↗</span></div><div class="muted">${r.created_at?new Date(r.created_at).toLocaleDateString('ru-RU'):''}</div></div><div class="debt">${money(r.debt)}</div></a>`).join(''):'<div class="muted" style="margin-top:8px">Долгов нет</div>'}</div><div class="finance-actions" style="margin-top:12px"><a class="fd-btn primary" href="admin_v11_guest_profile.html?id=${encodeURIComponent(x.user_id)}">👤 Профиль гостя</a></div></div></div>`}).join('')||'<div class="fd-empty">Нет подходящих пользователей.</div>'}$('search').oninput=render;$('onlyDebt').onclick=()=>{onlyDebt=!onlyDebt;$('onlyDebt').classList.toggle('primary',onlyDebt);render()};load();</script></body></html>
