<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Финансы</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.finance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:13px;background:#20263a;display:grid;place-items:center}.debt{color:var(--fd-red);font-weight:800}.ok{color:var(--fd-green)}.detail{margin-top:12px;padding:14px;background:#0d111b;border:1px solid var(--fd-line);border-radius:13px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--fd-line)}.detail-row:last-child{border-bottom:0}.muted{color:var(--fd-muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.payment{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.payment input,.payment select{padding:10px;background:#151a28;border:1px solid #343b52;color:#fff;border-radius:9px}.payment input{width:120px}.payment input:last-of-type{flex:1;min-width:160px}.person-row{padding:14px 0;border-bottom:1px solid var(--fd-line)}@media(max-width:700px){.finance-grid{grid-template-columns:1fr 1fr}.detail-row{display:block}.detail-row>div:last-child{margin-top:5px}.payment input{width:100%}.payment select{width:100%}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a class="active" href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Финансы</h1><div class="fd-sub">Долги, оплаты и понятная детализация</div></div><a class="fd-btn" href="admin.html">Открыть старую финансовую панель</a></header><section class="finance-grid"><div class="fd-card"><div class="fd-stat-label">Начислено</div><div id="charged" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Оплачено</div><div id="paid" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div id="debt" class="fd-stat-value red">—</div></div><div class="fd-card"><div class="fd-stat-label">Должников</div><div id="debtors" class="fd-stat-value">—</div></div></section><section class="fd-card" style="margin-top:18px"><div class="toolbar"><input id="search" class="fd-search" placeholder="Поиск по имени или телефону"><button id="onlyDebt" class="fd-btn">🔴 Только с долгом</button></div><div id="list" style="margin-top:10px">Загрузка…</div></section></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let users=[],summary=[],breakdown={},onlyDebt=false;async function load(){const [{data:u, error:ue},{data:s,error:se}]=await Promise.all([sb.from('users').select('user_id,Display_name,Phone,Email').order('Display_name'),sb.from('user_financial_summary').select('*').order('total_debt',{ascending:false})]);if(ue||se){$('list').innerHTML='<div class="fd-card">Ошибка загрузки финансовых данных.</div>';return}users=u||[];summary=s||[];const ids=summary.map(x=>x.user_id).filter(Boolean);if(ids.length){const {data:b}=await sb.from('user_financial_breakdown').select('*').in('user_id',ids).order('created_at',{ascending:false});(b||[]).forEach(x=>(breakdown[x.user_id]??=[]).push(x))}const charged=summary.reduce((n,x)=>n+(Number(x.total_charged)||0),0),paid=summary.reduce((n,x)=>n+(Number(x.total_paid)||0),0),debt=summary.reduce((n,x)=>n+(Number(x.total_debt)||0),0);$('charged').textContent=money(charged);$('paid').textContent=money(paid);$('debt').textContent=money(debt);$('debtors').textContent=summary.filter(x=>Number(x.total_debt)>0).length;render()}function render(){const q=$('search').value.trim().toLowerCase();const arr=summary.filter(x=>{const u=users.find(y=>y.user_id===x.user_id)||{};const text=((u.Display_name||x.Display_name||'')+' '+(u.Phone||'')).toLowerCase();return (!q||text.includes(q))&&(!onlyDebt||Number(x.total_debt)>0)});$('list').innerHTML=arr.map(x=>{const u=users.find(y=>y.user_id===x.user_id)||{}, rows=breakdown[x.user_id]||[], open=rows.filter(r=>Number(r.debt)>0);return `<div class="person-row"><div class="person"><div class="avatar">👤</div><div><b>${esc(u.Display_name||x.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||u.Email||'')}</div></div><div style="margin-left:auto;text-align:right"><b class="${Number(x.total_debt)>0?'debt':'ok'}">${money(x.total_debt)}</b><div class="muted">долг</div></div></div><div class="detail"><div class="detail-row"><div><span class="muted">Начислено</span></div><div>${money(x.total_charged)}</div></div><div class="detail-row"><div><span class="muted">Оплачено</span></div><div class="ok">${money(x.total_paid)}</div></div><div style="margin-top:10px"><b>🔴 За что должен</b>${open.length?open.map(r=>`<div class="detail-row"><div>${esc(r.description||r.title||r.category||'Начисление')}<div class="muted">${r.created_at?new Date(r.created_at).toLocaleDateString('ru-RU'):''}</div></div><div class="debt">${money(r.debt)}</div></div>`).join(''):'<div class="muted" style="margin-top:8px">Долгов нет</div>'}</div><div class="payment"><input id="amt-${x.user_id}" type="number" min="1" placeholder="Сумма"><select id="met-${x.user_id}"><option>Наличные</option><option>Перевод</option><option>Карта</option><option>Бонусы</option></select><input id="note-${x.user_id}" placeholder="Комментарий"><button class="fd-btn primary" onclick="pay('${x.user_id}',${Number(x.total_debt)||0})">💳 Записать оплату</button><a class="fd-btn" href="admin_v10_guest_profile.html?id=${encodeURIComponent(x.user_id)}">👤 Профиль</a></div></div></div>`}).join('')||'<div class="fd-empty">Нет подходящих пользователей.</div>'}async function pay(uid,debt){const amount=Number($('amt-'+uid).value);if(!amount||amount<=0)return alert('Введите сумму');if(amount>debt&&!confirm('Сумма больше текущего долга. Продолжить?'))return;const method=$('met-'+uid).value,note=$('note-'+uid).value.trim();const {error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:method,p_note:note||null});if(error)return alert('Ошибка: '+error.message);await load();alert('Оплата зарегистрирована')}$('search').oninput=render;$('onlyDebt').onclick=()=>{onlyDebt=!onlyDebt;$('onlyDebt').classList.toggle('primary',onlyDebt);render()};load();</script></body></html>
