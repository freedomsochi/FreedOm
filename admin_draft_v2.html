<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Admin v2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090c15;color:#eef1f7;font:15px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.head,.card,.modalbox{background:#111625;border:1px solid #283249;border-radius:16px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn,.tab{border:1px solid #39455f;background:#171d2c;color:#eee;border-radius:10px;padding:9px 13px;cursor:pointer}.active,.primary{background:#d4af37;color:#111}.success{background:#173b2b;border-color:#2b7753}.danger{background:#4b1e28;border-color:#7c3341}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#171d2c;padding:14px;border-radius:12px}.stat b{display:block;font-size:1.3rem;margin-top:5px}.list{background:#111625;border-radius:12px}.row{display:grid;grid-template-columns:2fr 1.3fr 1.2fr 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #283249}.muted{color:#8992a8}.pending{color:#f2c94c;font-weight:700}.confirmed{color:#35d48a;font-weight:700}.cancelled{color:#ff6978;font-weight:700}.debt{color:#ff6978;font-weight:700}.ok{color:#35d48a;font-weight:700}.search,input,select{width:100%;background:#171d2c;color:#fff;border:1px solid #39455f;border-radius:9px;padding:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#171d2c;border-radius:10px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;text-align:left;border-bottom:1px solid #283249}.alloc{margin-top:14px;padding:14px;background:#0d1220;border:1px solid #39455f;border-radius:12px}.allocrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #283249}.form{display:grid;grid-template-columns:150px 150px 1fr auto;gap:8px;margin-top:10px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.row,.details,.form{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ FreeDom — Админ v2</h1><div id="auth" class="muted">Проверка доступа…</div></div><button class="btn" onclick="loadAll()">↻ Обновить</button></div><div id="app" style="display:none"><div class="tabs"><button class="tab active" data-p="dash">📊 Дашборд</button><button class="tab" data-p="users">👥 Пользователи</button><button class="tab" data-p="bookings">📅 Бронирования</button><button class="tab" data-p="orders">🥗 Veg Raw</button><button class="tab" data-p="finance">💰 Финансы</button></div><section id="dash" class="panel active"><div class="card"><div class="grid"><div class="stat">Пользователи<b id="nUsers">0</b></div><div class="stat">Брони<b id="nBookings">0</b></div><div class="stat">Veg Raw<b id="nOrders">0</b></div><div class="stat">Общий долг<b id="nDebt">0 ₽</b></div></div></div></section><section id="users" class="panel"><div class="card"><h2>👥 Пользователи</h2><input class="search" id="userSearch" placeholder="Имя, телефон или email"><div id="usersList">Загрузка…</div></div></section><section id="bookings" class="panel"><div class="card"><h2>📅 Бронирования</h2><div id="bookingsList">Загрузка…</div></div></section><section id="orders" class="panel"><div class="card"><h2>🥗 Veg Raw</h2><div id="ordersList">Загрузка…</div></div></section><section id="finance" class="panel"><div class="card"><div class="grid"><div class="stat">Начислено<b id="charged">0 ₽</b></div><div class="stat">Оплачено<b id="paid">0 ₽</b></div><div class="stat">Долг<b id="debt">0 ₽</b></div><div class="stat">Должников<b id="debtors">0</b></div></div></div><div class="card"><input class="search" id="financeSearch" placeholder="Поиск должника"><div id="financeList">Загрузка…</div></div></section></div></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';let users=[],bookings=[],finance=[],orders=[],profile=null;const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—';function st(s){let v=String(s||'').toLowerCase();if(['подтверждено','confirmed','активна','завершена','долг'].includes(v))return'<span class="confirmed">🟢 Подтверждено</span>';if(['отменено','отменена','cancelled'].includes(v))return'<span class="cancelled">🔴 Отменено</span>';return'<span class="pending">🟡 Ожидает подтверждения</span>'}async function init(){let{data}=await sb.auth.getSession();if(!data.session)return location.href='login.html';if(data.session.user.email!==ADMIN)return document.getElementById('auth').textContent='⛔ Доступ запрещён';document.getElementById('auth').textContent='🔒 '+data.session.user.email;document.getElementById('app').style.display='block';await loadAll()}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));document.querySelectorAll('.panel').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.getElementById(x.dataset.p).classList.add('active')});async function loadAll(){let [u,b,o,f]=await Promise.all([sb.from('users').select('user_id,Display_name,Phone,Email').order('Display_name'),sb.from('bookings').select('*,rooms(name)').order('created_at',{ascending:false}).limit(200),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200),sb.from('user_financial_summary').select('*').order('total_debt',{ascending:false})]);if(u.error||b.error||o.error||f.error)return alert('Ошибка загрузки: '+[u,b,o,f].find(x=>x.error)?.error?.message);users=u.data||[];bookings=b.data||[];orders=o.data||[];finance=f.data||[];nUsers.textContent=users.length;nBookings.textContent=bookings.length;nOrders.textContent=orders.length;nDebt.textContent=money(sum('total_debt'));render()}function sum(k){return finance.reduce((s,x)=>s+(+x[k]||0),0)}function render(){let q=(userSearch.value||'').toLowerCase();usersList.innerHTML=users.filter(u=>[u.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(q)).map(u=>{let f=finance.find(x=>x.user_id===u.user_id)||{};return`<div class="row"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div></div><div class="${+f.total_debt>0?'debt':'ok'}">${money(f.total_debt)} долг</div><div></div><div></div><button class="btn" onclick="openUser('${u.user_id}')">Подробнее</button></div>`}).join('')||'<p class="muted">Нет пользователей</p>';bookingsList.innerHTML=bookings.map(b=>`<div class="row"><div><b>${esc(b.guest_name||'Гость')}</b><div class="muted">${esc(b.rooms?.name||'Номер')} · ${date(b.check_in_date)} → ${date(b.check_out_date)}</div></div><div>${money(b.total_amount)}</div><div>${st(b.status)}</div><div>${money(b.paid_amount)} оплачено</div><button class="btn" onclick="openBooking('${b.id}')">Подробнее</button></div>`).join('')||'<p class="muted">Нет бронирований</p>';ordersList.innerHTML=orders.map(o=>`<div class="row"><div><b>${esc(o.guest_name||o.name||'Заказ')}</b><div class="muted">${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):''}</div></div><div>${money(o.total_amount)}</div><div>${esc(o.status||'')}</div><div></div><button class="btn" onclick="openOrder('${o.id}')">Подробнее</button></div>`).join('')||'<p class="muted">Нет заказов</p>';charged.textContent=money(sum('total_charged'));paid.textContent=money(sum('total_paid'));debt.textContent=money(sum('total_debt'));debtors.textContent=finance.filter(x=>+x.total_debt>0).length;let fq=(financeSearch.value||'').toLowerCase();financeList.innerHTML=finance.filter(x=>{let u=users.find(y=>y.user_id===x.user_id)||{};return[u.Display_name,x.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(fq)}).map(x=>`<div class="row"><div><b>${esc(x.Display_name||users.find(u=>u.user_id===x.user_id)?.Display_name||'Без имени')}</b></div><div class="debt">${money(x.total_debt)}</div><div></div><div></div><button class="btn" onclick="openUser('${x.user_id}')">За что долг →</button></div>`).join('')||'<p class="muted">Нет должников</p>'}userSearch.oninput=render;financeSearch.oninput=render;function closeModal(){modal.classList.remove('show')}async function openBooking(id){let b=bookings.find(x=>x.id===id);if(!b)return;let nights=b.check_in_date&&b.check_out_date?Math.max(0,Math.round((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000)):0;let pending=!['подтверждено','confirmed','отменено','отменена','cancelled'].includes(String(b.status||'').toLowerCase());modalbox.innerHTML=`<div class="row"><h2>📅 Полная информация о бронировании</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="details"><div class="detail"><b>Гость</b><br>${esc(b.guest_name||'—')}</div><div class="detail"><b>Телефон</b><br>${esc(b.guest_phone||b.phone||'—')}</div><div class="detail"><b>Email</b><br>${esc(b.guest_email||b.email||'—')}</div><div class="detail"><b>Количество гостей</b><br>${esc(b.guest_count||b.guests_count||b.guests||'—')}</div><div class="detail"><b>Номер</b><br>${esc(b.rooms?.name||'—')}</div><div class="detail"><b>Период</b><br>${date(b.check_in_date)} → ${date(b.check_out_date)}<br>${nights} ночей</div><div class="detail"><b>Стоимость</b><br>${money(b.total_amount)}</div><div class="detail"><b>Оплачено</b><br>${money(b.paid_amount)}</div><div class="detail"><b>Остаток</b><br>${money(Math.max(0,+b.total_amount-(+b.paid_amount||0)))}</div><div class="detail"><b>Статус</b><br>${st(b.status)}</div><div class="detail"><b>Создано</b><br>${b.created_at?new Date(b.created_at).toLocaleString('ru-RU'):'—'}</div><div class="detail"><b>ID бронирования</b><br>${esc(b.id)}</div></div><div class="alloc"><b>Комментарий / пожелания</b><p>${esc(b.comment||b.notes||b.message||b.services||'Нет')}</p></div><div class="actions">${pending?`<button class="btn success" onclick="confirmBooking('${b.id}')">✅ Подтвердить</button><button class="btn danger" onclick="cancelBooking('${b.id}')">❌ Отменить</button>`:''}</div>`;modal.classList.add('show')}async function confirmBooking(id){if(!confirm('Подтвердить бронь? Стоимость проживания станет долгом пользователя.'))return;let{data,error}=await sb.rpc('confirm_booking',{p_booking_id:id});if(error)return alert(error.message);if(data&&!data.ok)return alert(data.message||'Не удалось подтвердить');closeModal();await loadAll()}async function cancelBooking(id){if(!confirm('Отменить бронь? Долг за проживание создан не будет.'))return;let{data,error}=await sb.rpc('cancel_booking',{p_booking_id:id});if(error)return alert(error.message);if(data&&!data.ok)return alert(data.message||'Не удалось отменить');closeModal();await loadAll()}async function openUser(uid){let u=users.find(x=>x.user_id===uid)||{};let[r,p]=await Promise.all([sb.from('user_financial_breakdown').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);if(r.error)return alert(r.error.message);let f=finance.find(x=>x.user_id===uid)||{},rows=r.data||[];profile={uid,rows};modalbox.innerHTML=`<div class="row"><h2>👤 ${esc(u.Display_name||'Без имени')}</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><p class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</p><div class="grid"><div class="stat">Начислено<b>${money(f.total_charged)}</b></div><div class="stat">Оплачено<b class="ok">${money(f.total_paid)}</b></div><div class="stat">Долг<b class="debt">${money(f.total_debt)}</b></div><div class="stat">Брони<b>${bookings.filter(b=>b.user_id===uid).length}</b></div></div><div class="alloc"><h3>За что должен</h3>${rows.length?`<table class="table"><tr><th>За что</th><th>Начислено</th><th>Оплачено</th><th>Долг</th></tr>${rows.map(x=>`<tr><td>${esc(x.label||x.description||x.service_name||x.type||'Начисление')}</td><td>${money(x.charged??x.amount)}</td><td>${money(x.paid??x.paid_amount)}</td><td class="${+x.debt>0?'debt':'ok'}">${money(x.debt)}</td></tr>`).join('')}</table>`:'<span class="muted">Начислений нет</span>'}</div><div class="alloc"><h3>💳 Оплата долга</h3><div class="form"><input id="payAmount" type="number" min="1" placeholder="Сумма"><select id="payMethod"><option>Наличные</option><option>Перевод</option><option>Карта</option><option>Бонусы</option></select><input id="payNote" placeholder="Комментарий"><button class="btn primary" onclick="pay('${uid}')">Оплатить</button></div><div id="allocation"></div></div><div class="alloc"><h3>История платежей</h3>${(p.data||[]).map(x=>`<div class="allocrow"><span>${date(x.created_at)} · ${esc(x.payment_method||x.method||'')}</span><b>${money(x.amount)}</b></div>`).join('')||'<span class="muted">Платежей нет</span>'}</div>`;modal.classList.add('show')}function showAllocation(){if(!profile)return;let a=+payAmount.value||0,left=a,h='';for(let x of profile.rows.filter(r=>+r.debt>0)){let z=Math.min(left,+x.debt);if(z){h+=`<div class="allocrow"><span>${esc(x.label||x.description||x.service_name||x.type)}</span><b>${money(z)}</b></div>`;left-=z}if(left<=0)break}allocation.innerHTML=a?'<div class="muted">Распределение:</div>'+h:' '}document.addEventListener('input',e=>{if(e.target.id==='payAmount')showAllocation()});async function pay(uid){let amount=+payAmount.value,method=payMethod.value,note=payNote.value.trim();if(!amount||amount<=0)return alert('Введите сумму');let{error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:method,p_note:note||null});if(error)return alert(error.message);await loadAll();await openUser(uid);alert('Оплата зарегистрирована')}async function openOrder(id){let{data,error}=await sb.from('orders').select('*').eq('id',id).single();if(error)return alert(error.message);modalbox.innerHTML=`<div class="row"><h2>🥗 Veg Raw</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="details">${Object.entries(data||{}).map(([k,v])=>`<div class="detail"><b>${esc(k)}</b><br>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</div>`;modal.classList.add('show')}init();</script></body></html>
