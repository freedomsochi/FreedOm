<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — События</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{position:relative;overflow:hidden;border:1px solid rgba(130,150,165,.22);border-radius:26px;padding:24px;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(232,248,243,.72) 48%,rgba(242,238,255,.78));box-shadow:0 18px 50px rgba(53,75,90,.10)}.hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;margin:5px 0}.hero p{max-width:610px;color:var(--fd-muted);margin:0}.hero-orb{width:110px;height:110px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 27%,#fff 0 7%,rgba(113,211,188,.75) 8%,rgba(72,176,162,.36) 35%,rgba(163,145,222,.18),transparent 72%)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:220px}.toolbar .active{background:linear-gradient(135deg,#e2f6ef,#edf0ff);border-color:rgba(70,155,135,.35)}.event-list{display:grid;gap:14px}.event-card{position:relative;overflow:hidden;background:rgba(255,255,255,.72);border:1px solid rgba(130,150,165,.22);border-radius:22px;padding:18px;box-shadow:0 12px 34px rgba(45,65,80,.07);backdrop-filter:blur(14px)}.event-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#55bea1,#a897df);opacity:.8}.event-card.is-past{opacity:.72}.event-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.event-title{font-size:21px;margin:4px 0 0;letter-spacing:-.02em}.event-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.event-meta span{background:rgba(240,245,246,.72);border:1px solid rgba(130,150,165,.14);padding:7px 9px;border-radius:10px;color:#4d5964;font-size:13px}.event-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.mini{background:rgba(248,250,250,.78);border:1px solid rgba(130,150,165,.13);border-radius:14px;padding:11px}.mini span{font-size:12px;color:var(--fd-muted)}.mini b{display:block;font-size:18px;margin-top:4px}.mini .ok{color:#269a78}.event-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.reg{background:rgba(255,255,255,.76);border:1px solid rgba(130,150,165,.18);border-radius:16px;padding:14px;margin-top:9px}.reg-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.reg-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--fd-muted)}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.summary .pill{padding:8px 11px;border-radius:12px;background:rgba(244,248,248,.8);border:1px solid rgba(130,150,165,.14);font-size:13px}.fd-modal{background:rgba(25,40,45,.25)!important;backdrop-filter:blur(8px)}.fd-modal-box{background:rgba(248,251,250,.94)!important;color:var(--fd-text);border:1px solid rgba(130,150,165,.25);box-shadow:0 25px 70px rgba(25,45,55,.22);backdrop-filter:blur(22px)}@media(max-width:700px){.hero{padding:18px}.hero-inner{align-items:center}.hero-orb{width:78px;height:78px}.hero h1{font-size:31px}.event-grid{grid-template-columns:1fr 1fr}.event-card{padding:15px}.toolbar input{min-width:100%}.fd-sidebar{display:none}.fd-main{margin:0!important}.fd-container{padding:12px!important}.fd-topbar{padding:4px 0 8px}.event-list{gap:9px}.event-card{border-radius:17px;box-shadow:0 8px 25px rgba(45,65,80,.055)}.event-title{font-size:18px}.event-meta{margin-top:9px}.event-meta span{font-size:11px;padding:6px 7px}.event-grid{gap:6px;margin-top:10px}.mini{padding:9px;border-radius:11px}.mini span{font-size:10px}.mini b{font-size:16px}.event-actions{margin-top:10px}.event-actions .fd-btn{width:100%;justify-content:center}.reg{padding:12px;border-radius:14px}.reg-actions .fd-btn{flex:1;min-width:120px}.fd-modal-box{width:calc(100% - 24px)!important;max-height:calc(100vh - 24px);overflow:auto;padding:12px!important}.summary{gap:5px;margin-top:10px}.summary .pill{font-size:11px;padding:7px 8px}}@media(max-width:430px){.hero-orb{display:none}.hero{border-radius:18px}.hero h1{font-size:27px}.hero p{font-size:12px}.toolbar{margin:10px 0}.toolbar .fd-btn{flex:1}.toolbar input{width:100%}}
</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a class="active" href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><section class="hero"><div class="hero-inner"><div><div class="fd-kicker">Пространство · события</div><h1>События</h1><p>Все мероприятия FreeDom в одном месте: даты, участники, начисления и состояние оплаты.</p></div><div class="hero-orb" aria-hidden="true"></div></div></section><div class="toolbar"><input id="search" class="fd-search" placeholder="Поиск события или места"><button id="future" class="fd-btn active">Ближайшие</button><button id="all" class="fd-btn">Все</button><button class="fd-btn" onclick="loadEvents()">↻ Обновить</button></div><div id="events" class="event-list">Загрузка…</div></div></main></div><div id="modal" class="fd-modal"><div class="fd-modal-box"><div class="fd-actions"><button class="fd-btn" onclick="closeModal()">← События</button><button class="fd-btn" onclick="closeModal()">✕ Закрыть</button></div><div id="modalBody"></div></div></div><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const st=s=>({new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена'}[s]||s||'Новая');const ps=s=>({unpaid:'Не оплачено',partial:'Частично оплачено',paid:'Оплачено'}[s]||s||'Не оплачено');let events=[],regs=[],showFuture=true;async function loadEvents(){const {data,error}=await db.from('events').select('*').order('event_date',{ascending:true}).order('start_time',{ascending:true});if(error){$('events').innerHTML='<div class="fd-card" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}events=data||[];const ids=events.map(x=>x.id);regs=[];if(ids.length){const r=await db.from('event_registrations').select('id,event_id,guest_name,guest_phone,guest_email,participants,amount,paid_amount,status,payment_status,comment,created_at,user_id').in('event_id',ids);regs=r.error?[]:(r.data||[])}render()}function render(){const q=$('search').value.trim().toLowerCase(),today=new Date().toISOString().slice(0,10);const filtered=events.filter(e=>(!q||((e.name||'')+' '+(e.location||'')).toLowerCase().includes(q))&&(!showFuture||!e.event_date||e.event_date>=today));$('events').innerHTML=filtered.length?filtered.map(e=>{const rs=regs.filter(r=>r.event_id===e.id),count=rs.length,people=rs.reduce((s,r)=>s+(Number(r.participants)||1),0),paid=rs.reduce((s,r)=>s+(Number(r.paid_amount)||0),0),amount=rs.reduce((s,r)=>s+(Number(r.amount)||0),0),due=Math.max(amount-paid,0),past=e.event_date&&e.event_date<today;return `<article class="event-card ${past?'is-past':''}"><div class="event-head"><div><div class="fd-kicker">${past?'Прошедшее':'Мероприятие'}</div><h2 class="event-title">${esc(e.name||'Без названия')}</h2><div class="fd-sub">${esc(e.description||'')}</div></div><span class="fd-badge ${e.is_active?'green':'red'}">${e.is_active?'Активно':'Скрыто'}</span></div><div class="event-meta"><span>📅 ${e.event_date?new Date(e.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}</span><span>🕐 ${esc(e.start_time||'—')}${e.end_time?'–'+esc(e.end_time):''}</span><span>📍 ${esc(e.location||'—')}</span><span>💰 ${Number(e.price)?money(e.price):'Бесплатно'}</span></div><div class="event-grid"><div class="mini"><span>Записей</span><b>${count}</b></div><div class="mini"><span>Участников</span><b>${people}</b></div><div class="mini"><span>Начислено</span><b>${money(amount)}</b></div><div class="mini"><span>Осталось</span><b class="${due?'':'ok'}">${money(due)}</b></div></div><div class="event-actions"><button class="fd-btn primary" onclick="showRegs('${e.id}')">👥 Участники · ${count}</button></div></article>`}).join(''):'<div class="fd-card empty">Нет подходящих событий.</div>'}$('search').oninput=render;$('future').onclick=()=>{showFuture=true;$('future').classList.add('active');$('all').classList.remove('active');render()};$('all').onclick=()=>{showFuture=false;$('all').classList.add('active');$('future').classList.remove('active');render()};async function showRegs(id){const e=events.find(x=>x.id===id);$('modal').classList.add('show');$('modalBody').innerHTML='<div class="empty">Загрузка участников…</div>';const {data,error}=await db.from('event_registrations').select('*').eq('event_id',id).order('created_at',{ascending:false});if(error){$('modalBody').innerHTML='<div class="empty" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}const rows=data||[],people=rows.reduce((s,r)=>s+(Number(r.participants)||1),0),paid=rows.reduce((s,r)=>s+(Number(r.paid_amount)||0),0),amount=rows.reduce((s,r)=>s+(Number(r.amount)||0),0),due=Math.max(amount-paid,0);$('modalBody').innerHTML=`<div style="margin-top:16px"><div class="fd-kicker">Участники события</div><h2 style="margin:5px 0">${esc(e?.name||'Событие')}</h2><div class="summary"><span class="pill">👥 ${rows.length} регистраций</span><span class="pill">🧑 ${people} участников</span><span class="pill">💰 ${money(amount)} начислено</span><span class="pill">${due?'🔴 '+money(due)+' осталось':'🟢 оплачено'}</span></div>${rows.length?rows.map(r=>{const debt=Math.max(Number(r.amount||0)-Number(r.paid_amount||0),0);return `<div class="reg"><div class="reg-top"><div><b>${esc(r.guest_name||'Без имени')}</b><div class="fd-muted">📞 ${esc(r.guest_phone||'—')} ${r.guest_email?'· ✉️ '+esc(r.guest_email):''}</div></div><span class="fd-badge ${r.status==='confirmed'?'green':r.status==='cancelled'?'red':''}">${esc(st(r.status))}</span></div><div style="margin-top:8px">👥 ${Number(r.participants)||1} · ${Number(r.amount)?money(r.amount):'Бесплатно'} · ${Number(r.amount)?ps(r.payment_status):'Бесплатно'}${Number(r.amount)?' · оплачено '+money(r.paid_amount):''}</div>${r.comment?'<div class="fd-muted" style="margin-top:6px">💬 '+esc(r.comment)+'</div>':''}<div class="reg-actions">${r.user_id?`<button class="fd-btn" onclick="openGuest('${r.user_id}')">👤 Профиль</button>`:''}${r.user_id&&debt>0?`<a class="fd-btn primary" href="admin_v11_finance_detail.html?type=event&id=${encodeURIComponent(r.id)}&user_id=${encodeURIComponent(r.user_id)}">💳 Долг ${money(debt)}</a>`:''}</div></div>`}).join(''):'<div class="empty">Регистраций пока нет.</div>'}</div>`}function openGuest(id){if(id)location.href='admin_v11_guest_profile.html?id='+encodeURIComponent(id)}function closeModal(){$('modal').classList.remove('show')}loadEvents();</script></body></html>
