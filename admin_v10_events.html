<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — События</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.event-card{background:linear-gradient(180deg,#141927,#10131e);border:1px solid var(--fd-line);border-radius:18px;padding:18px}.event-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.event-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.event-meta span{background:var(--fd-panel2);padding:7px 9px;border-radius:9px;color:#cbd1df;font-size:13px}.event-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.mini{background:#0c1019;border:1px solid var(--fd-line);border-radius:12px;padding:12px}.mini b{display:block;font-size:18px;margin-top:4px}.reg{background:#0c1019;border:1px solid var(--fd-line);border-radius:13px;padding:14px;margin-top:9px}.reg-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.reg-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:25px;text-align:center;color:var(--fd-muted)}.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filterbar input{flex:1;min-width:220px}.event-card.is-past{opacity:.78}.event-card.is-past .event-head h2{color:#c5c9d3}@media(max-width:700px){.event-grid{grid-template-columns:1fr 1fr}.event-card{padding:14px}.event-head{display:block}.event-head .fd-badge{display:inline-flex;margin-top:10px}.filterbar input{min-width:100%}}@media(max-width:420px){.event-grid{grid-template-columns:1fr 1fr}.event-meta span{font-size:12px;padding:6px 8px}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a class="active" href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><div class="fd-topbar"><div><h1 class="fd-title">События</h1><div class="fd-sub">Мероприятия и список участников</div></div><div class="fd-actions"><button class="fd-btn" onclick="loadEvents()">↻ Обновить</button><a class="fd-btn primary" href="admin_v10.html">👥 Гости</a></div></div><div class="filterbar"><input id="search" class="fd-search" placeholder="Поиск события или места"><button id="future" class="fd-btn primary">Ближайшие</button><button id="all" class="fd-btn">Все</button></div><div id="events" class="fd-section">Загрузка…</div></div></main></div><div id="modal" class="fd-modal"><div class="fd-modal-box"><div class="fd-actions"><button class="fd-btn" onclick="closeModal()">← События</button><button class="fd-btn" onclick="closeModal()">✕ Закрыть</button></div><div id="modalBody"></div></div></div><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const st=s=>({new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена'}[s]||s||'Новая');const ps=s=>({unpaid:'Не оплачено',partial:'Частично оплачено',paid:'Оплачено'}[s]||s||'Не оплачено');let events=[],regs=[],showFuture=true;async function loadEvents(){const {data,error}=await db.from('events').select('*').order('event_date',{ascending:true}).order('start_time',{ascending:true});if(error){$('events').innerHTML='<div class="fd-card" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}events=data||[];const ids=events.map(x=>x.id);if(ids.length){const r=await db.from('event_registrations').select('id,event_id,guest_name,guest_phone,guest_email,participants,amount,paid_amount,status,payment_status,comment,created_at,user_id').in('event_id',ids);regs=r.error?[]:(r.data||[])}render()}function render(){const q=$('search').value.trim().toLowerCase(),today=new Date().toISOString().slice(0,10);const filtered=events.filter(e=>(!q||((e.name||'')+' '+(e.location||'')).toLowerCase().includes(q))&&(!showFuture||!e.event_date||e.event_date>=today));$('events').innerHTML=filtered.length?filtered.map(e=>{const rs=regs.filter(r=>r.event_id===e.id),count=rs.length,people=rs.reduce((s,r)=>s+(Number(r.participants)||1),0),paid=rs.reduce((s,r)=>s+(Number(r.paid_amount)||0),0),amount=rs.reduce((s,r)=>s+(Number(r.amount)||0),0),past=e.event_date&&e.event_date<today;return `<div class="event-card fd-section ${past?'is-past':''}"><div class="event-head"><div><div class="fd-kicker">${past?'Прошедшее':'Мероприятие'}</div><h2 style="margin:4px 0 0">${esc(e.name||'Без названия')}</h2><div class="fd-sub">${esc(e.description||'')}</div></div><span class="fd-badge ${e.is_active?'green':'red'}">${e.is_active?'Активно':'Скрыто'}</span></div><div class="event-meta"><span>📅 ${e.event_date?new Date(e.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}</span><span>🕐 ${esc(e.start_time||'—')}${e.end_time?'–'+esc(e.end_time):''}</span><span>📍 ${esc(e.location||'—')}</span><span>💰 ${Number(e.price)?money(e.price):'Бесплатно'}</span></div><div class="event-grid"><div class="mini"><span class="fd-muted">Записей</span><b>${count}</b></div><div class="mini"><span class="fd-muted">Участников</span><b>${people}</b></div><div class="mini"><span class="fd-muted">Начислено</span><b>${money(amount)}</b></div><div class="mini"><span class="fd-muted">Оплачено</span><b class="ok">${money(paid)}</b></div></div><div class="fd-actions" style="margin-top:14px"><button class="fd-btn primary" onclick="showRegs('${e.id}')">👥 Открыть участников · ${count}</button></div></div>`}).join(''):'<div class="fd-card empty">Нет подходящих событий.</div>'}$('search').oninput=render;$('future').onclick=()=>{showFuture=true;$('future').classList.add('primary');$('all').classList.remove('primary');render()};$('all').onclick=()=>{showFuture=false;$('all').classList.add('primary');$('future').classList.remove('primary');render()};async function showRegs(id){const e=events.find(x=>x.id===id);$('modal').classList.add('show');$('modalBody').innerHTML='<div class="empty">Загрузка участников…</div>';const {data,error}=await db.from('event_registrations').select('*').eq('event_id',id).order('created_at',{ascending:false});if(error){$('modalBody').innerHTML='<div class="empty" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}const rows=data||[],people=rows.reduce((s,r)=>s+(Number(r.participants)||1),0),paid=rows.reduce((s,r)=>s+(Number(r.paid_amount)||0),0),amount=rows.reduce((s,r)=>s+(Number(r.amount)||0),0);$('modalBody').innerHTML=`<div style="margin-top:16px"><div class="fd-kicker">Участники события</div><h2 style="margin:5px 0">${esc(e?.name||'Событие')}</h2><div class="fd-sub">${rows.length} регистраций · ${people} участников · начислено ${money(amount)} · оплачено ${money(paid)}</div>${rows.length?rows.map(r=>`<div class="reg"><div class="reg-top"><div><b>${esc(r.guest_name||'Без имени')}</b><div class="fd-muted">📞 ${esc(r.guest_phone||'—')} ${r.guest_email?'· ✉️ '+esc(r.guest_email):''}</div></div><span class="fd-badge ${r.status==='confirmed'?'green':r.status==='cancelled'?'red':''}">${esc(st(r.status))}</span></div><div style="margin-top:8px">👥 ${Number(r.participants)||1} · ${Number(r.amount)?money(r.amount):'Бесплатно'} · ${Number(r.amount)?ps(r.payment_status):'Бесплатно'}${Number(r.amount)?' · оплачено '+money(r.paid_amount):''}</div>${r.comment?'<div class="fd-muted" style="margin-top:6px">💬 '+esc(r.comment)+'</div>':''}<div class="reg-actions"><button class="fd-btn" onclick="openGuest('${r.user_id||''}')">👤 Открыть профиль</button>${r.user_id&&Number(r.amount||0)>Number(r.paid_amount||0)?`<a class="fd-btn primary" href="admin_v11_finance_detail.html?type=event&id=${encodeURIComponent(r.id)}&user_id=${encodeURIComponent(r.user_id)}">💳 Долг ${money(Math.max(Number(r.amount||0)-Number(r.paid_amount||0),0))}</a>`:''}</div></div>`).join(''):'<div class="empty">Регистраций пока нет.</div>'}</div>`}function openGuest(id){if(!id)return;location.href='admin_v11_guest_profile.html?id='+encodeURIComponent(id)}function closeModal(){$('modal').classList.remove('show')}loadEvents();</script></body></html>
