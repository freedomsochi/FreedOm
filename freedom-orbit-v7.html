adow .65s,color .65s,scale .65s cubic-bezier(.2,.8,.2,1)}.node.active{color:#302d27;background:linear-gradient(145deg,rgba(255,251,241,.6),rgba(255,226,193,.17));box-shadow:0 22px 65px rgba(73,54,35,.15),0 0 0 7px rgba(255,238,211,.11),inset 0 1px rgba(255,255,255,.9);scale:1.1}.node:after{content:"";position:absolute;top:12px;width:4px;height:4px;border-radius:50%;background:rgba(164,120,77,.72);box-shadow:0 0 16px rgba(164,120,77,.42)}.center{position:absolute;z-index:16;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.core{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fff,#f3ddbb 30%,#ad8259 64%,#60452f);border:1px solid rgba(255,249,235,.76);box-shadow:0 0 0 16px rgba(255,240,214,.1),0 20px 60px rgba(75,54,34,.18),inset 0 1px #fff;animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 25px rgba(255,240,214,.035),0 24px 70px rgba(75,54,34,.2),inset 0 1px #fff}}.center span{display:block;margin-top:13px;font-size:8px;letter-spacing:.36em;color:rgba(82,73,62,.72);text-transform:uppercase}.particles{position:absolute;inset:0;z-index:8;pointer-events:none}.p{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,239,211,.55);animation:float 8s ease-in-out infinite}.p:nth-child(1){left:18%;top:35%;animation-delay:-2s}.p:nth-child(2){left:77%;top:29%;animation-delay:-5s}.p:nth-child(3){left:70%;top:67%;animation-delay:-1s}.p:nth-child(4){left:27%;top:73%;animation-delay:-6s}@keyframes float{50%{transform:translate(8px,-18px);opacity:.3}}.panel{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(570px,calc(100% - 30px));display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border:1px solid rgba(255,248,233,.58);border-radius:24px;background:rgba(255,248,233,.18);backdrop-filter:blur(26px) saturate(130%);box-shadow:0 30px 90px rgba(67,50,33,.1)}.panel small{display:block;color:rgba(84,74,6
