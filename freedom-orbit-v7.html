<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — Orbit V7</title>
<style>
:root{--ink:#302f29;--muted:#766f63;--warm:#b48b63;--glass:rgba(255,248,237,.18);--line:rgba(255,249,236,.56)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:#d9c9b3}
.scene{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#e8dccb,#d7c9b6 52%,#cbbda9)}
.photo,.photo-next{position:absolute;inset:-6%;z-index:-7;background:center/cover no-repeat;filter:saturate(.78) sepia(.06) contrast(.93);transform:scale(1.045);transition:opacity 1.35s cubic-bezier(.16,.8,.2,1),transform 2.2s cubic-bezier(.16,.8,.2,1),filter 1.2s}.photo-next{z-index:-6;opacity:0}.photo:after,.photo-next:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(250,242,229,.52),rgba(244,233,214,.06) 38%,rgba(77,62,45,.34)),radial-gradient(circle at 50% 48%,transparent 0,rgba(249,238,219,.08) 42%,rgba(67,55,43,.28) 100%)}
.scene.light-shift:before{transform:translateX(22%) rotate(-4deg);opacity:.9}.scene:before{content:"";position:absolute;inset:-35%;z-index:-2;background:linear-gradient(112deg,transparent 27%,rgba(255,248,222,.55) 40%,rgba(255,236,191,.14) 48%,transparent 59%);transform:translateX(-34%) rotate(-4deg);animation:sun 13s ease-in-out infinite alternate;filter:blur(15px);pointer-events:none;transition:transform 1.6s ease}.scene:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 48%,rgba(255,244,218,.34),transparent 37%),radial-gradient(circle at 15% 8%,rgba(255,250,235,.42),transparent 23%);pointer-events:none}@keyframes sun{to{transform:translateX(34%) rotate(-4deg)}}
.top{position:absolute;z-index:40;top:22px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:11px;font-weight:650;letter-spacing:.34em;text-transform:uppercase}.hint{font-size:9px;letter-spacing:.12em;color:#655d51;padding:9px 13px;border:1px solid rgba(255,248,233,.52);border-radius:99px;background:rgba(255,248,233,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none}.orbit{position:relative;width:min(98vw,760px);height:min(98vw,760px)}.glow{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,rgba(255,245,220,.64),rgba(255,231,194,.15) 43%,transparent 71%);filter:blur(18px);animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.05);opacity:.72}}
.tree{position:absolute;z-index:14;left:50%;bottom:-2%;width:67%;height:92%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 28px 35px rgba(57,45,32,.17))}.tree img{width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;animation:tree 8s ease-in-out infinite}@keyframes tree{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(.2%,-.5%,0) rotate(.25deg)}}
.ring{position:absolute;inset:3%;z-index:20;border-radius:50%;--r:0deg;transform:rotate(var(--r));cursor:grab;transition:transform 920ms cubic-bezier(.12,.86,.16,1);touch-action:none}.ring.drag{cursor:grabbing;transition:none}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,249,237,.52);box-shadow:inset 0 0 78px rgba(255,246,226,.28),0 0 90px rgba(90,68,43,.14)}.ring:after{content:"";position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(88,70,52,.12);box-shadow:0 0 0 1px rgba(255,250,238,.20),inset 0 0 38px rgba(255,244,220,.28)}
.node{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:15px;color:rgba(58,54,46,.62);font-size:10px;font-weight:520;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(145deg,rgba(255,250,240,.30),rgba(255,239,214,.07));border:1px solid rgba(255,248,232,.52);box-shadow:inset 0 1px rgba(255,255,255,.66),0 16px 50px rgba(67,51,34,.05);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);transform:rotate(calc(var(--a)*1deg)) translateY(min(37vw,278px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)));transition:background .65s,box-shadow .65s,color .65s,scale .65s cubic-bezier(.2,.8,.2,1)}.node:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,252,241,.22);opacity:0;transition:opacity .5s}.node.active{color:var(--ink);background:linear-gradient(145deg,rgba(255,251,241,.58),rgba(255,230,199,.16));box-shadow:0 22px 65px rgba(73,54,35,.14),0 0 0 7px rgba(255,239,211,.11),inset 0 1px rgba(255,255,255,.88);scale:1.10}.node.active:before{opacity:1}.node:after{content:"";position:absolute;top:12px;width:4px;height:4px;border-radius:50%;background:rgba(164,120,77,.72);box-shadow:0 0 16px rgba(164,120,77,.42)}
.center{position:absolute;z-index:16;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.core{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.98),rgba(245,225,193,.74) 29%,rgba(174,132,91,.46) 63%,rgba(93,69,46,.26));border:1px solid rgba(255,249,235,.74);box-shadow:0 0 0 16px rgba(255,244,222,.10),0 20px 60px rgba(75,54,34,.18),inset 0 1px rgba(255,255,255,.98);backdrop-filter:blur(10px);animation:core 5s ease-in-out infinite}@keyframes core{50%{box-shadow:0 0 0 25px rgba(255,244,222,.035),0 24px 70px rgba(75,54,34,.20),inset 0 1px rgba(255,255,255,.98)}}.center span{display:block;margin-top:13px;font-size:8px;letter-spacing:.36em;color:rgba(82,73,62,.72);text-transform:uppercase}
.particles{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,244,218,.58);filter:blur(.2px);animation:float 8s ease-in-out infinite}.particle:nth-child(1){left:18%;top:35%;animation-delay:-2s}.particle:nth-child(2){left:77%;top:29%;animation-delay:-5s}.particle:nth-child(3){left:70%;top:67%;animation-delay:-1s}.particle:nth-child(4){left:27%;top:73%;animation-delay:-6s}@keyframes float{50%{transform:translate3d(8px,-18px,0);opacity:.35}}
.panel{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(570px,calc(100% - 30px));display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border:1px solid rgba(255,248,233,.58);border-radius:24px;background:rgba(255,248,233,.18);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);box-shadow:0 30px 90px rgba(67,50,33,.10)}.panel small{display:block;color:rgba(84,74,63,.66);font-size:8px;letter-spacing:.25em;text-transform:uppercase}.panel strong{display:block;margin-top:4px;font:500 23px Georgia,serif}.panel button{border:1px solid rgba(255,248,233,.66);border-radius:16px;padding:11px 16px;background:rgba(55,47,39,.76);color:white;font-size:9px;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 8px 25px rgba(55,47,39,.12)}
+.modal{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:rgba(54,44,35,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .65s}.modal.open{opacity:1;pointer-events:auto}.window{width:min(900px,calc(100% - 24px));max-height:88vh;overflow:hidden;border-radius:32px;background:rgba(250,246,237,.88);border:1px solid rgba(255,255,255,.82);box-shadow:0 45px 140px rgba(45,35,27,.22);transform:translateY(25px) scale(.96);transition:.7s cubic-bezier(.16,.86,.18,1)}.modal.open .window{transform:none}.media{height:360px;background:center/cover no-repeat}.copy{padding:26px}.copy small{font-size:9px;letter-spacing:.2em;color:#85786a;text-transform:uppercase}.copy h2{font:500 40px Georgia,serif;margin:8px 0 10px}.copy p{margin:0;color:#70675d;line-height:1.65}.close{position:absolute;right:18px;top:18px;width:40px;height:40px;border:1px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,252,244,.64);font-size:20px;color:#51473e;z-index:2}
+@media(max-width:620px){.top{top:15px;left:15px;right:15px}.hint{font-size:8px}.orbit{width:122vw;height:122vw}.tree{width:78%;height:88%}.node{width:88px;height:88px;margin:-44px;font-size:8px;letter-spacing:.15em}.node{transform:rotate(calc(var(--a)*1deg)) translateY(43vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.panel{bottom:11px}.panel button{display:none}.media{height:235px}.copy h2{font-size:31px}}
+</style>
+</head>
+<body>
+<main class="scene" id="scene">
+<div class="photo" id="photo"></div><div class="photo-next" id="photoNext"></div>
+<div class="particles"><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i></div>
+<header class="top"><div class="brand">FreeDom</div><div class="hint">исследуйте пространство</div></header>
+<section class="stage"><div class="orbit"><div class="glow"></div><div class="tree"><img src="images/branches.png" alt="FreeDom tree branches"></div><div class="ring" id="ring"><div class="node active" style="--a:0" data-i="0">Пространство</div><div class="node" style="--a:72" data-i="1">События</div><div class="node" style="--a:144" data-i="2">Комнаты</div><div class="node" style="--a:216" data-i="3">Баня</div><div class="node" style="--a:288" data-i="4">Кухня</div></div><div class="center"><div class="core"></div><span>living free</span></div></div></section>
+<div class="panel"><div><small>выбрано</small><strong id="title">Пространство</strong></div><button id="open">Открыть</button></div>
+<div class="modal" id="modal"><div class="window"><button class="close" id="close">×</button><div class="media" id="media"></div><div class="copy"><small>FreeDom</small><h2 id="mh"></h2><p id="mp"></p></div></div></div>
+</main>
+<script>
+const labels=['Пространство','События','Комнаты','Баня','Кухня'];
+const texts=['Здесь начинается знакомство с домом.','Жизнь FreeDom каждый день: реальные события, встречи, музыка, практики и люди.','Карта дома показывает комнаты и их реальную доступность.','Тепло бани, холодная вода и место под звёздным небом.','Общее пространство дома.'];
+const imgs=['images/room-bungalow.jpg','images/gong-meditation.jpg','images/room-family.jpg','images/sauna.jpg','images/room-hostel.jpg'];
+const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],title=document.getElementById('title'),photo=document.getElementById('photo'),photoNext=document.getElementById('photoNext'),scene=document.getElementById('scene');
+let idx=0,rot=0,drag=false,lastAngle=0,lastTime=0,velocity=0,transitioning=false;
+photo.style.backgroundImage=`url('${imgs[0]}')`;
+function pointAngle(e){const r=ring.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
+function apply(r){rot=r;ring.style.setProperty('--r',rot+'deg')}
+function changeAtmosphere(i){if(transitioning)return;transitioning=true;photoNext.style.backgroundImage=`url('${imgs[i]}')`;photoNext.style.opacity='1';photoNext.style.transform='scale(1.09)';photo.style.transform='scale(1.075)';scene.classList.add('light-shift');setTimeout(()=>{photo.style.backgroundImage=`url('${imgs[i]}')`;photo.style.transform='scale(1.045)';photoNext.style.opacity='0';photoNext.style.transform='scale(1.045)';scene.classList.remove('light-shift');transitioning=false},1250)}
+function select(n){idx=(n%5+5)%5;const target=-idx*72;let d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;apply(rot);nodes.forEach((x,i)=>x.classList.toggle('active',i===idx));title.textContent=labels[idx];changeAtmosphere(idx)}
+function nearest(){select(Math.round(-rot/72))}
+ring.addEventListener('pointerdown',e=>{drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);lastAngle=pointAngle(e);lastTime=performance.now();velocity=0});
+ring.addEventListener('pointermove',e=>{if(!drag)return;const a=pointAngle(e);let d=a-lastAngle;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;apply(rot);const now=performance.now(),dt=Math.max(8,now-lastTime);velocity=.76*velocity+.24*(d/dt*16);lastAngle=a;lastTime=now});
+ring.addEventListener('pointerup',()=>{if(!drag)return;drag=false;ring.classList.remove('drag');rot+=Math.max(-32,Math.min(32,velocity*8));apply(rot);setTimeout(nearest,280)});
+ring.addEventListener('pointercancel',()=>{drag=false;ring.classList.remove('drag');nearest()});
+nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();const i=+n.dataset.i;if(i===0)location.href='https://freed-om.vercel.app/space-preview.html';else select(i)}));
+const modal=document.getElementById('modal'),mh=document.getElementById('mh'),mp=document.getElementById('mp'),media=document.getElementById('media');
+document.getElementById('open').onclick=()=>{if(idx===0){location.href='https://freed-om.vercel.app/space-preview.html';return}mh.textContent=labels[idx];mp.textContent=texts[idx];media.style.backgroundImage=`url('${imgs[idx]}')`;modal.classList.add('open')};
+document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
+</script>
+</body>
+</html>
