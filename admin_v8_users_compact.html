<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin — CRM Пользователи</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:16px}.wrap{max-width:1100px;margin:auto}.head,.panel,.box{background:#151c30;border-radius:14px;padding:16px;margin-bottom:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:12px;border-radius:9px;background:#101627;color:#fff;border:1px solid #3a4662}.select{padding:10px 12px;border-radius:9px;background:#101627;color:#fff;border:1px solid #3a4662}.btn{padding:9px 12px;border:0;border-radius:8px;background:#d4af37;color:#111;cursor:pointer}.dark{background:#263149;color:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th{text-align:left;font-size:12px;color:#9aa3b8;padding:10px;border-bottom:1px solid #39445e}.table td{padding:11px 10px;border-bottom:1px solid #2a344b}.tr{cursor:pointer}.tr:hover{background:#1b243b}.name{font-weight:700}.debt{font-weight:700}.good{color:#8fe0a8}.bad{color:#ff8585}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.pages{display:flex;gap:5px;flex-wrap:wrap}.page{padding:7px 10px;border:0;border-radius:7px;background:#263149;color:#fff;cursor:pointer}.page.active{background:#d4af37;color:#111}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto}.profile{background:#101627;padding:12px;border-radius:10px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sum{background:#101627;padding:9px 12px;border-radius:9px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.section{margin-top:16px}.section h3{margin-bottom:7px}.item{background:#101627;padding:10px;border-radius:8px;margin:6px 0;font-size:13px}.itemtop{display:flex;justify-content:space-between;gap:10px}.sub{font-size:12px;color:#9aa3b8;margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:7px;background:#263149;font-size:11px}.pay{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#9aa3b8}.empty{padding:10px;color:#9aa3b8;background:#101627;border-radius:8px}@media(max-width:700px){.table{min-width:650px}.box{padding:12px}}</style></head><body><div class="wrap"><div class="head"><h2 style="margin-top:0">👥 Клиенты</h2><div class="toolbar"><input id="search" class="search" placeholder="Поиск по ФИО…"><select id="debt" class="select"><option value="all">Все клиенты</option><option value="debt">Есть долг</option><option value="zero">Без долга</option></select></div><div id="count" class="muted" style="margin-top:9px"></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>ФИО</th><th>Телефон</th><th>Email</th><th>Долг</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="5">Загрузка…</td></tr></tbody></table></div><div class="pager"><div id="range" class="muted"></div><div class="pages" id="pages"></div></div></div></div><div id="modal" class="modal"><div class="box"><button class="btn dark" style="float:right" onclick="closeM()">✕ Закрыть</button><div id="detail"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let U=[],B=[],O=[],S=[],R=[],P=[],page=1,size=25;const $=x=>document.getElementById(x),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function val(u,...ks){for(const k of ks)if(u?.[k]!=null&&String(u[k]).trim()!=='')return u[k];return ''}function profile(id){let u=U.find(x=>x.user_id===id)||{},b=B.find(x=>x.user_id===id),o=O.find(x=>x.user_id===id);return{name:val(u,'Display_name','display_name','name')||val(b,'guest_name')||val(o,'guest_name')||'Гость',phone:val(u,'Phone','phone')||val(b,'guest_phone')||val(o,'guest_phone')||'—',email:val(u,'Email','email')||val(b,'guest_email')||val(o,'guest_email')||'—'}}function rows(id){return [...B.filter(x=>x.user_id===id).map(x=>({kind:'booking',id:x.id,title:'🛏 '+(R.find(r=>r.id===x.room_id)?.name||'Бронирование'),amount:+(x.total_amount||x.amount||0),paid:+(x.paid_amount||0),date:x.check_in||x.start_date||x.created_at,status:x.status||'—',guests:x.guests||x.guest_count||'—'})),...O.filter(x=>x.user_id===id).map(x=>({kind:'order',id:x.id,title:'🥗 Veg Raw',amount:+(x.total_amount||x.amount||0),paid:+(x.paid_amount||0),date:x.created_at,status:x.status||'—',guests:'',items:x.items||x.order_items||x.items_json})),...S.filter(x=>x.user_id===id).map(x=>({kind:'service',id:x.id,title:'🧺 '+(x.service_name||x.name||'Услуга'),amount:+(x.total_amount||x.amount||0),paid:+(x.paid_amount||0),date:x.created_at||x.date,status:x.status||'—',guests:''}))]}function debtOf(id){return rows(id).reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0)}function paymentTitle(p){if(p.booking_id){let b=B.find(x=>x.id===p.booking_id);return '🛏 '+(R.find(r=>r.id===b?.room_id)?.name||'Бронь')}if(p.order_id)return '🥗 Veg Raw';return '💳 Платёж'}function filtered(){let q=$('search').value.trim().toLocaleLowerCase('ru-RU'),f=$('debt').value;return U.filter(u=>{let p=profile(u.user_id),d=debtOf(u.user_id);return(!q||p.name.toLocaleLowerCase('ru-RU').includes(q))&&(f==='all'||(f==='debt'&&d>0)||(f==='zero'&&d<=0))}).sort((a,b)=>profile(a.user_id).name.localeCompare(profile(b.user_id),'ru'))}function render(){let a=filtered(),max=Math.max(1,Math.ceil(a.length/size));if(page>max)page=max;let part=a.slice((page-1)*size,page*size);$('count').textContent=`Клиентов: ${a.length}`;$('range').textContent=a.length?`${(page-1)*size+1}–${Math.min(page*size,a.length)} из ${a.length}`:'Нет результатов';$('tbody').innerHTML=part.map(u=>{let p=profile(u.user_id),d=debtOf(u.user_id);return `<tr class="tr" onclick="openUser('${u.user_id}')"><td class="name">${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td><td class="${d?'bad':'good'}">${money(d)}</td><td><button class="btn" onclick="event.stopPropagation();openUser('${u.user_id}')">Открыть</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Ничего не найдено</td></tr>';let html='';for(let i=1;i<=max;i++)html+=`<button class="page ${i===page?'active':''}" onclick="go(${i})">${i}</button>`;$('pages').innerHTML=html}function go(n){page=n;render();window.scrollTo({top:0,behavior:'smooth'})}$('search').oninput=()=>{page=1;render()};$('debt').onchange=()=>{page=1;render()};function openUser(id){let p=profile(id),rs=rows(id),ps=P.filter(x=>x.user_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),charged=rs.reduce((a,x)=>a+x.amount,0),paid=ps.filter(x=>!['cancelled','canceled'].includes(x.status)).reduce((a,x)=>a+(+x.amount||0),0),debt=Math.max(0,charged-paid);$('detail').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="profile">📞 ${esc(p.phone)}<br>✉️ ${esc(p.email)}</div><div class="actions"><button class="btn" onclick="alert('Следующим шагом подключим форму бронирования')">＋ Бронь</button><button class="btn" onclick="alert('Следующим шагом подключим выбор блюда')">＋ Кухня</button><button class="btn" onclick="alert('Следующим шагом подключим выбор услуги')">＋ Услуга</button><button class="btn" onclick="alert('Используйте существующее добавление оплаты')">💳 Оплата</button></div><div class="summary"><div class="sum">Начислено <b>${money(charged)}</b></div><div class="sum">Оплачено <b>${money(paid)}</b></div><div class="sum">Остаток <b class="${debt?'bad':'good'}">${money(debt)}</b></div></div><div class="section"><h3>🛏 Бронирования (${rs.filter(x=>x.kind==='booking').length})</h3>${rs.filter(x=>x.kind==='booking').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · Гостей: ${esc(x.guests)} · <span class="badge">${esc(x.status)}</span> · оплачено ${money(x.paid)}</div></div>`).join('')||'<div class="empty">Бронирований нет</div>'}</div><div class="section"><h3>🥗 Veg Raw (${rs.filter(x=>x.kind==='order').length})</h3>${rs.filter(x=>x.kind==='order').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · <span class="badge">${esc(x.status)}</span> · оплачено ${money(x.paid)}</div></div>`).join('')||'<div class="empty">Заказов кухни нет</div>'}</div><div class="section"><h3>🧺 Услуги (${rs.filter(x=>x.kind==='service').length})</h3>${rs.filter(x=>x.kind==='service').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · <span class="badge">${esc(x.status)}</span> · оплачено ${money(x.paid)}</div></div>`).join('')||'<div class="empty">Услуг нет</div>'}</div><div class="section"><h3>💳 Платежи (${ps.length})</h3>${ps.map(x=>`<div class="item pay"><span><b>${esc(paymentTitle(x))}</b><br><span class="sub">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||x.method||'—')}</span></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Платежей пока нет</div>'}</div>`;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}async function load(){let [u,b,o,s,r,p]=await Promise.all([db.from('users').select('*').limit(5000),db.from('bookings').select('*').limit(5000),db.from('orders').select('*').limit(5000),db.from('service_orders').select('*').limit(5000),db.from('rooms').select('*').order('name'),db.from('payments').select('*').limit(10000)]);if(u.error)return alert(u.error.message);U=u.data||[];B=b.data||[];O=o.data||[];S=s.data||[];R=r.data||[];P=p.data||[];render()}load();</script></body></html>
