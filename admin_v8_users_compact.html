<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin — CRM</title><style>body{font-family:Arial,sans-serif;background:#0b1020;color:#eee;padding:16px}.wrap{max-width:1100px;margin:auto}.head,.panel,.box{background:#151c30;border-radius:14px;padding:16px;margin-bottom:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.search,input,select,textarea{box-sizing:border-box;padding:11px;border-radius:9px;background:#101627;color:#fff;border:1px solid #3a4662}.search{flex:1;min-width:220px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{font-size:12px;color:#9aa3b8;text-align:left;padding:10px;border-bottom:1px solid #39445e}.table td{padding:11px 10px;border-bottom:1px solid #2a344b}.tr{cursor:pointer}.tr:hover{background:#1b243b}.name{font-weight:700}.good{color:#8fe0a8}.bad{color:#ff8585}.btn{padding:9px 12px;border:0;border-radius:8px;background:#d4af37;color:#111;cursor:pointer}.dark{background:#263149;color:#fff}.pager{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}.pages{display:flex;gap:5px;flex-wrap:wrap}.page{padding:7px 10px;border:0;border-radius:7px;background:#263149;color:#fff}.page.active{background:#d4af37;color:#111}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto}.profile,.item,.sum{background:#101627;border-radius:9px;padding:10px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.section{margin-top:16px}.item{margin:6px 0;font-size:13px}.itemtop{display:flex;justify-content:space-between;gap:10px}.sub,.muted{font-size:12px;color:#9aa3b8}.badge{display:inline-block;padding:3px 7px;border-radius:7px;background:#263149;font-size:11px}.pay{display:flex;justify-content:space-between;gap:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid>*{width:100%}.empty{padding:10px;color:#9aa3b8;background:#101627;border-radius:8px}@media(max-width:700px){.table{min-width:700px}.formgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h2 style="margin-top:0">👥 Клиенты</h2><div class="toolbar"><input id="search" class="search" placeholder="Поиск по ФИО…"><select id="debtFilter"><option value="all">Все клиенты</option><option value="debt">Есть долг</option><option value="zero">Без долга</option></select></div><div id="count" class="muted" style="margin-top:9px"></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>ФИО</th><th>Телефон</th><th>Email</th><th>Долг</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="5">Загрузка…</td></tr></tbody></table></div><div class="pager"><div id="range" class="muted"></div><div id="pages" class="pages"></div></div></div></div><div id="modal" class="modal"><div class="box"><button class="btn dark" style="float:right" onclick="closeM()">✕ Закрыть</button><div id="detail"></div></div></div><div id="actionModal" class="modal"><div class="box"><button class="btn dark" style="float:right" onclick="closeAction()">✕ Закрыть</button><div id="actionBody"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let U=[],B=[],O=[],S=[],R=[],P=[],F=[],M=[],currentUser=null,page=1,size=25;const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function val(u,...keys){for(const k of keys)if(u?.[k]!=null&&String(u[k]).trim()!=='')return u[k];return ''}function profile(id){let u=U.find(x=>x.user_id===id)||{},b=B.find(x=>x.user_id===id),o=O.find(x=>x.user_id===id);return{name:val(u,'Display_name','display_name','name')||val(b,'guest_name')||val(o,'guest_name')||'Гость',phone:val(u,'Phone','phone')||val(b,'guest_phone')||val(o,'guest_phone')||'—',email:val(u,'Email','email')||val(b,'guest_email')||val(o,'guest_email')||'—'}}function summary(id){return F.summary.find(x=>x.user_id===id)||{total_charged:0,total_paid:0,total_debt:0}}function debtOf(id){return Math.max(0,Number(summary(id).total_debt)||0)}function rows(id){return F.filter(x=>x.user_id===id).map(x=>({kind:x.charge_type,id:x.charge_id,title:(x.charge_type==='booking'?'🛏 ':'')+(x.charge_type==='order'?'🥗 ':'')+(x.charge_type==='service'?'🧺 ':'')+(x.label||'Начисление'),amount:Number(x.charged)||0,paid:Number(x.paid)||0,debt:Number(x.debt)||0,date:x.created_at,status:'',checkIn:x.check_in_date,checkOut:x.check_out_date,unit:x.service_unit,quantity:x.service_quantity}))}function rawStatus(kind,id){if(kind==='booking')return B.find(x=>x.id===id)?.status||'—';if(kind==='order')return O.find(x=>x.id===id)?.status||'—';return S.find(x=>x.id===id)?.status||'—'}function paymentTitle(p){if(p.booking_id){let b=B.find(x=>x.id===p.booking_id);return '🛏 '+(R.find(r=>r.id===b?.room_id)?.name||'Бронь')}if(p.order_id)return '🥗 Veg Raw';if(p.service_order_id){let s=S.find(x=>x.id===p.service_order_id);return '🧺 '+(s?.service_name||'Услуга')}return '💳 Платёж'}function filtered(){let q=$('search').value.trim().toLocaleLowerCase('ru-RU'),f=$('debtFilter').value;return U.filter(u=>{let p=profile(u.user_id),d=debtOf(u.user_id);return(!q||p.name.toLocaleLowerCase('ru-RU').includes(q))&&(f==='all'||(f==='debt'&&d>0)||(f==='zero'&&d===0))}).sort((a,b)=>profile(a.user_id).name.localeCompare(profile(b.user_id),'ru'))}function render(){let a=filtered(),max=Math.max(1,Math.ceil(a.length/size));if(page>max)page=max;let part=a.slice((page-1)*size,page*size);$('count').textContent='Клиентов: '+a.length;$('range').textContent=a.length?`${(page-1)*size+1}–${Math.min(page*size,a.length)} из ${a.length}`:'Нет результатов';$('tbody').innerHTML=part.map(u=>{let p=profile(u.user_id),d=debtOf(u.user_id);return `<tr class="tr" onclick="openUser('${u.user_id}')"><td class="name">${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td><td class="${d?'bad':'good'}">${money(d)}</td><td><button class="btn" onclick="event.stopPropagation();openUser('${u.user_id}')">Открыть</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Ничего не найдено</td></tr>';let h='';for(let i=1;i<=max;i++)h+=`<button class="page ${i===page?'active':''}" onclick="go(${i})">${i}</button>`;$('pages').innerHTML=h}function go(n){page=n;render()}$('search').oninput=()=>{page=1;render()};$('debtFilter').onchange=()=>{page=1;render()};function openUser(id){currentUser=id;let p=profile(id),s=summary(id),rs=rows(id),ps=P.filter(x=>x.user_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('detail').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="profile">📞 ${esc(p.phone)}<br>✉️ ${esc(p.email)}</div><div class="actions"><button class="btn" onclick="showAction('booking')">＋ Бронь</button><button class="btn" onclick="showAction('food')">＋ Кухня</button><button class="btn" onclick="showAction('service')">＋ Услуга</button><button class="btn" onclick="showAction('payment')">💳 Оплата</button></div><div class="summary"><div class="sum">Начислено <b>${money(s.total_charged)}</b></div><div class="sum">Оплачено <b>${money(s.total_paid)}</b></div><div class="sum">Остаток <b class="${s.total_debt?'bad':'good'}">${money(s.total_debt)}</b></div></div><div class="section"><h3>🛏 Бронирования (${rs.filter(x=>x.kind==='booking').length})</h3>${rs.filter(x=>x.kind==='booking').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.checkIn?esc(new Date(x.checkIn).toLocaleDateString('ru-RU')):''}${x.checkOut?' — '+esc(new Date(x.checkOut).toLocaleDateString('ru-RU')):''} · <span class="badge">${esc(rawStatus(x.kind,x.id))}</span> · оплачено ${money(x.paid)} · остаток ${money(x.debt)}</div></div>`).join('')||'<div class="empty">Бронирований нет</div>'}</div><div class="section"><h3>🥗 Veg Raw (${rs.filter(x=>x.kind==='order').length})</h3>${rs.filter(x=>x.kind==='order').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · <span class="badge">${esc(rawStatus(x.kind,x.id))}</span> · оплачено ${money(x.paid)} · остаток ${money(x.debt)}</div></div>`).join('')||'<div class="empty">Заказов кухни нет</div>'}</div><div class="section"><h3>🧺 Услуги (${rs.filter(x=>x.kind==='service').length})</h3>${rs.filter(x=>x.kind==='service').map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · ${x.quantity||1} ${esc(x.unit||'шт.')} · <span class="badge">${esc(rawStatus(x.kind,x.id))}</span> · оплачено ${money(x.paid)} · остаток ${money(x.debt)}</div></div>`).join('')||'<div class="empty">Услуг нет</div>'}</div><div class="section"><h3>💳 Платежи (${ps.length})</h3>${ps.map(x=>`<div class="item pay"><span><b>${esc(paymentTitle(x))}</b><br><span class="sub">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||x.method||'—')}</span></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Платежей пока нет</div>'}</div>`;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}function closeAction(){$('actionModal').classList.remove('show')}async function showAction(type){if(!currentUser)return;if(type==='food'){let q=await db.from('veg_raw_menu').select('*').eq('is_active',true).order('name');M=q.data||[];$('actionBody').innerHTML=`<h2>🥗 Добавить Veg Raw</h2><div class="formgrid"><select id="foodId">${M.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="foodQty" type="number" min="1" value="1"></div><textarea id="foodComment" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="saveFood()">Добавить</button>`}else if(type==='service'){let q=await db.from('services').select('*').eq('is_active',true).order('name');M=q.data||[];$('actionBody').innerHTML=`<h2>🧺 Добавить услугу</h2><div class="formgrid"><select id="serviceId">${M.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="serviceQty" type="number" min="1" value="1"></div><textarea id="serviceComment" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="saveService()">Добавить</button>`}else if(type==='payment'){let d=debtOf(currentUser);$('actionBody').innerHTML=`<h2>💳 Добавить оплату</h2><p class="muted">Текущий остаток: <b>${money(d)}</b></p><div class="formgrid"><input id="payAmount" type="number" min="1" max="${Math.max(1,d)}" placeholder="Сумма"><select id="payMethod"><option>наличные</option><option>перевод</option><option>карта</option><option>бонусы</option></select></div><textarea id="payComment" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="savePayment()">Зачислить оплату</button>`}else{let q=await db.from('rooms').select('*').order('name');R=q.data||[];$('actionBody').innerHTML=`<h2>🛏 Добавить бронь</h2><div class="formgrid"><select id="roomId">${R.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price_per_night)}/ночь</option>`).join('')}</select><input id="guestCount" type="number" min="1" value="1"><input id="checkIn" type="date"><input id="checkOut" type="date"></div><button class="btn" style="margin-top:8px" onclick="saveBooking()">Создать бронь</button>`}$('actionModal').classList.add('show')}async function saveFood(){let q=M.find(x=>x.id===$('foodId').value),qty=Math.max(1,+$('foodQty').value||1);if(!q)return;let p=profile(currentUser),r=await db.from('orders').insert({user_id:currentUser,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,items:[{name:q.name,price:q.price,quantity:qty,comment:$('foodComment').value.trim()}],total_amount:q.price*qty,status:'новый',payment_status:'не оплачено'});if(r.error)return alert(r.error.message);closeAction();await load();openUser(currentUser)}async function saveService(){let q=M.find(x=>x.id===$('serviceId').value),qty=Math.max(1,+$('serviceQty').value||1);if(!q)return;let r=await db.from('service_orders').insert({user_id:currentUser,service_id:q.id,service_name:q.name,unit:q.unit||'шт.',quantity:qty,unit_price:q.price,status:'новая',comment:$('serviceComment').value.trim()});if(r.error)return alert(r.error.message);closeAction();await load();openUser(currentUser)}async function saveBooking(){let room=$('roomId').value,ci=$('checkIn').value,co=$('checkOut').value,g=+$('guestCount').value||1;if(!ci||!co||co<=ci)return alert('Проверьте даты');let days=Math.ceil((new Date(co)-new Date(ci))/86400000),rm=R.find(x=>x.id===room),total=(rm?.price_per_night||0)*days;if(!total)return alert('У выбранного номера не указана цена за ночь');let p=profile(currentUser),r=await db.from('bookings').insert({room_id:room,user_id:currentUser,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,check_in_date:ci,check_out_date:co,status:'новое',total_amount:total,guest_count:g,paid_amount:0,payment_status:'не оплачено'});if(r.error)return alert(r.error.message);closeAction();await load();openUser(currentUser)}async function savePayment(){let amount=+$('payAmount').value||0,d=debtOf(currentUser);if(!amount)return alert('Введите сумму');if(amount>d)return alert(`Сумма больше остатка: ${money(d)}`);let r=await db.rpc('record_user_payment',{p_user_id:currentUser,p_amount:amount,p_payment_method:$('payMethod').value,p_note:$('payComment').value.trim()});if(r.error)return alert(r.error.message);closeAction();await load();openUser(currentUser)}async function load(){let [u,b,o,s,r,p,f,sum]=await Promise.all([db.from('users').select('*').limit(5000),db.from('bookings').select('*').limit(5000),db.from('orders').select('*').limit(5000),db.from('service_orders').select('*').limit(5000),db.from('rooms').select('*').order('name'),db.from('payments').select('*').limit(10000),db.from('user_financial_breakdown').select('*').limit(20000),db.from('user_financial_summary').select('*').limit(5000)]);if(u.error)return alert(u.error.message);if(f.error)return alert('Финансы: '+f.error.message);if(sum.error)return alert('Финансовая сводка: '+sum.error.message);U=u.data||[];B=b.data||[];O=o.data||[];S=s.data||[];R=r.data||[];P=p.data||[];F=f.data||[];F.summary=sum.data||[];render()}load();</script></body></html>
