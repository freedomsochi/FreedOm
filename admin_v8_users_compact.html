<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin — Пользователи</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:14px}.wrap{max-width:950px;margin:auto}.card,.box{background:#151c30;border-radius:14px;padding:14px;margin-bottom:10px}.search{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;background:#101627;color:#fff;border:1px solid #3a4662}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid #303a52}.main{min-width:0}.name{font-weight:700}.meta{font-size:13px;color:#9aa3b8;margin-top:3px}.debt{font-size:13px;color:#ff8585}.btn{padding:8px 11px;border:0;border-radius:8px;background:#d4af37;color:#111;cursor:pointer}.dark{background:#263149;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{width:min(780px,100%);max-height:90vh;overflow:auto}.profile{background:#101627;padding:11px;border-radius:10px;font-size:14px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sum{background:#101627;padding:9px 12px;border-radius:9px;font-size:13px}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:7px 5px;border-bottom:1px solid #303a52;text-align:left}.paybox{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#101627;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13px}.muted{color:#9aa3b8}@media(max-width:600px){.hide-m{display:none!important}.row{align-items:flex-start}.btn{white-space:nowrap}}</style></head><body><div class="wrap"><div class="card"><h2>👤 Пользователи</h2><input id="search" class="search" placeholder="Поиск по ФИО…"><div id="count" class="meta"></div><div id="users">Загрузка…</div></div></div><div id="modal" class="modal"><div class="box" id="box"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let U=[],B=[],O=[],S=[],R=[],P=[];const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function prof(u,id){let b=B.find(x=>x.user_id===id),o=O.find(x=>x.user_id===id);return{name:u?.Display_name||u?.display_name||u?.name||b?.guest_name||o?.guest_name||'Гость',phone:u?.Phone||u?.phone||b?.guest_phone||o?.guest_phone||'—',email:u?.Email||u?.email||b?.guest_email||o?.guest_email||'—'}}function rows(id){return [...B.filter(x=>x.user_id===id).map(x=>({kind:'booking',id:x.id,title:'🛏 '+(R.find(r=>r.id===x.room_id)?.name||'Бронирование'),amount:+x.total_amount||0,paid:+x.paid_amount||0})),...O.filter(x=>x.user_id===id).map(x=>({kind:'order',id:x.id,title:'🥗 Veg Raw',amount:+x.total_amount||0,paid:+x.paid_amount||0})),...S.filter(x=>x.user_id===id).map(x=>({kind:'service',id:x.id,title:'🧺 '+x.service_name,amount:+x.total_amount||0,paid:0}))]}function paymentsFor(id){return P.filter(x=>x.user_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}function paymentTitle(p){if(p.booking_id){let b=B.find(x=>x.id===p.booking_id);return '🛏 '+(R.find(r=>r.id===b?.room_id)?.name||'Бронь')}if(p.order_id){return '🥗 Veg Raw'}return '💳 Платёж'}function render(){let q=$('search').value.trim().toLocaleLowerCase('ru-RU'),a=U.filter(u=>{let p=prof(u,u.user_id);return !q||p.name.toLocaleLowerCase('ru-RU').includes(q)});$('count').textContent=`Показано: ${a.length} из ${U.length}`;$('users').innerHTML=a.map(u=>{let p=prof(u,u.user_id),d=rows(u.user_id).reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0);return `<div class="row"><div class="main"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.phone)} · ${esc(p.email)}</div>${d?`<div class="debt">Долг: ${money(d)}</div>`:''}</div><button class="btn" onclick="openUser('${u.user_id}')">Подробнее</button></div>`}).join('')||'<div class="muted">Ничего не найдено</div>'}async function load(){let [u,b,o,s,r,p]=await Promise.all([db.from('users').select('*').limit(500),db.from('bookings').select('*').limit(2000),db.from('orders').select('*').limit(2000),db.from('service_orders').select('*').limit(2000),db.from('rooms').select('*').order('name'),db.from('payments').select('*').limit(5000)]);if(u.error)return alert(u.error.message);if(p.error)return alert('Платежи: '+p.error.message);U=u.data||[];B=b.data||[];O=o.data||[];S=s.data||[];R=r.data||[];P=p.data||[];render()}$('search').addEventListener('input',render);function openUser(id){let u=U.find(x=>x.user_id===id),p=prof(u,id),rs=rows(id),ps=paymentsFor(id),charged=rs.reduce((a,x)=>a+x.amount,0),paid=ps.filter(x=>!['cancelled','canceled'].includes(x.status)).reduce((a,x)=>a+(+x.amount||0),0),debt=rs.reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0);$('box').innerHTML=`<button class="btn dark" onclick="closeM()">✕ Закрыть</button><h2>👤 ${esc(p.name)}</h2><div class="profile">${esc(p.phone)} · ${esc(p.email)}</div><div class="summary"><div class="sum">Начислено <b>${money(charged)}</b></div><div class="sum">Оплачено <b>${money(paid)}</b></div><div class="sum">Остаток <b>${money(debt)}</b></div></div><h3>Начисления</h3><table class="table"><tr><th>За что</th><th>Нач.</th><th>Опл.</th><th>Ост.</th><th></th></tr>${rs.map(x=>`<tr><td>${esc(x.title)}</td><td>${money(x.amount)}</td><td>${money(x.paid)}</td><td>${money(Math.max(0,x.amount-x.paid))}</td><td>${x.amount>x.paid&&x.kind!=='service'?`<button class="btn" onclick="pay('${id}','${x.kind}','${x.id}')">💳</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Нет начислений</td></tr>'}</table><h3>💳 Платежи <span class="muted">(${ps.length})</span></h3>${ps.length?ps.map(x=>`<div class="paybox"><span><b>${esc(paymentTitle(x))}</b><br><span class="muted">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||x.method||'—')}</span></span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">Платежей пока нет.</div>'}<button class="btn" onclick="closeM()">Готово</button>`;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}async function pay(uid,kind,id){let amount=+prompt('Сколько оплатить?');if(!amount)return;let method=prompt('Метод оплаты','безнал');if(!method)return;let args={p_amount:amount,p_payment_method:method};if(kind==='booking')args.p_booking_id=id;else args.p_order_id=id;let r=await db.rpc('record_payment',args);if(r.error)return alert(r.error.message);await load();openUser(uid)}load();</script></body></html>
