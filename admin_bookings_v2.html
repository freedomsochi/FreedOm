<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeDom — Бронирования</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f4;--glass:rgba(255,255,255,.76);--line:#e7e9e4;--text:#202522;--muted:#778078;--green:#68b79a;--green-bg:#e8f6ef;--red:#d85f62;--red-bg:#fdecec;--lilac:#9d8dcc;--shadow:0 12px 35px rgba(47,61,52,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#eee9fb 0,transparent 32%),radial-gradient(circle at 0 20%,#e4f4ed 0,transparent 30%),var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}.eyebrow{color:var(--muted);font-size:13px;margin-bottom:6px}h1{margin:0;font-size:32px;letter-spacing:-.03em}.auth{font-size:12px;color:var(--muted)}.panel{background:var(--glass);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.62)}.stat b{display:block;font-size:25px;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.filter{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--text)}.list{margin-top:16px}.row{display:grid;grid-template-columns:1.35fr 1fr .85fr auto;gap:14px;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.guest{font-weight:700}.muted{color:var(--muted);font-size:13px;margin-top:3px}.pill{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:650}.pending{background:#fff5d9;color:#9a7413}.confirmed{background:var(--green-bg);color:#287c5c}.cancelled{background:var(--red-bg);color:#a83e42}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.primary{background:var(--text);color:#fff;border-color:var(--text)}.modal{position:fixed;inset:0;background:rgba(25,31,27,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.box{width:min(760px,100%);max-height:90vh;overflow:auto;background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:24px;padding:22px;box-shadow:0 25px 70px rgba(20,30,24,.2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.item{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fafbf9}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:460px){.summary{grid-template-columns:1fr}.wrap{padding:20px 12px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">ОПЕРАЦИИ / БРОНИРОВАНИЯ</div><h1>Бронирования</h1></div><div id="auth" class="auth">Проверка доступа…</div></header>
<section class="panel"><div class="summary"><div class="stat"><b id="all">—</b><span>Всего</span></div><div class="stat"><b id="pending">—</b><span>Ожидают подтверждения</span></div><div class="stat"><b id="confirmed">—</b><span>Подтверждены</span></div><div class="stat"><b id="debt">—</b><span>К оплате по броням</span></div></div></section>
<section class="panel"><div class="toolbar"><button class="btn primary" onclick="setFilter('all')">Все</button><button class="btn" onclick="setFilter('pending')">Ожидают</button><button class="btn" onclick="setFilter('confirmed')">Подтверждены</button><button class="btn" onclick="setFilter('cancelled')">Отменены</button><input id="search" class="filter" placeholder="Поиск гостя…" oninput="render()"></div><div id="list" class="list">Загрузка…</div></section>
</main><div id="modal" class="modal"><div id="box" class="box"></div></div>
<script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽'; const date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—'; let bookings=[],filter='all';
function status(s){if(['подтверждено','confirmed','завершена','активна','долг'].includes(s))return '<span class="pill confirmed">Подтверждено</span>';if(['отменено','cancelled','отменена'].includes(s))return '<span class="pill cancelled">Отменено</span>';return '<span class="pill pending">Ожидает</span>'}
async function init(){const {data}=await sb.auth.getSession();if(!data.session){location.href='login.html';return}if(data.session.user.email!==ADMIN){auth.textContent='Доступ запрещён';return}auth.textContent='Администратор';await load()}
async function load(){const {data,error}=await sb.from('bookings').select('*,rooms(name),users(Display_name,Phone,Email)').order('created_at',{ascending:false}).limit(100);if(error){list.textContent='Ошибка: '+error.message;return}bookings=data||[];renderStats();render()}
function renderStats(){all.textContent=bookings.length;pending.textContent=bookings.filter(b=>!['подтверждено','confirmed','завершена','активна','долг','отменено','cancelled','отменена'].includes(b.status)).length;confirmed.textContent=bookings.filter(b=>['подтверждено','confirmed','завершена','активна','долг'].includes(b.status)).length;debt.textContent=money(bookings.reduce((s,b)=>s+Math.max(0,Number(b.total_amount||0)-Number(b.paid_amount||0)),0))}
function setFilter(v){filter=v;render()}
function render(){const q=(search.value||'').toLowerCase();const rows=bookings.filter(b=>(filter==='all'||(filter==='pending'&&!['подтверждено','confirmed','завершена','активна','долг','отменено','cancelled','отменена'].includes(b.status))||(filter==='confirmed'&&['подтверждено','confirmed','завершена','активна','долг'].includes(b.status))||(filter==='cancelled'&&['отменено','cancelled','отменена'].includes(b.status)))&&(b.guest_name||'').toLowerCase().includes(q));list.innerHTML=rows.map(b=>`<div class="row"><div><div class="guest">${esc(b.guest_name||'Гость')}</div><div class="muted">${esc(b.rooms?.name||'Номер')} · ${esc(b.guest_count||'—')} гостей</div></div><div><b>${date(b.check_in_date)} → ${date(b.check_out_date)}</b><div class="muted">${money(b.total_amount)}</div></div><div>${status(b.status)}<div class="muted">Оплачено ${money(b.paid_amount)}</div></div><button class="btn" onclick="openBooking('${b.id}')">Подробнее</button></div>`).join('')||'<div class="muted">Ничего не найдено</div>'}
window.openBooking=id=>{const b=bookings.find(x=>x.id===id);if(!b)return;const nights=Math.max(0,Math.round((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000));const pending=['новое','new','ожидает подтверждения'].includes(b.status);box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="eyebrow">БРОНИРОВАНИЕ</div><h2 style="margin:0">${esc(b.guest_name||'Гость')}</h2></div><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="grid"><div class="item"><b>Номер</b><br>${esc(b.rooms?.name||'—')}</div><div class="item"><b>Гостей</b><br>${esc(b.guest_count||'—')}</div><div class="item"><b>Период</b><br>${date(b.check_in_date)} → ${date(b.check_out_date)}<br>${nights} ночей</div><div class="item"><b>Стоимость</b><br>${money(b.total_amount)}</div><div class="item"><b>Оплачено</b><br>${money(b.paid_amount)}</div><div class="item"><b>Телефон</b><br>${esc(b.guest_phone||b.users?.Phone||'—')}</div><div class="item"><b>Email</b><br>${esc(b.guest_email||b.users?.Email||'—')}</div><div class="item"><b>Статус</b><br>${status(b.status)}</div></div><div class="item" style="margin-top:10px"><b>Пожелания / дополнительные услуги</b><br>${esc(b.services||'Нет')}</div><div class="actions">${pending?`<button class="btn primary" onclick="confirmBooking('${b.id}')">Подтвердить бронь</button><button class="btn" onclick="cancelBooking('${b.id}')">Отменить бронь</button>`:''}</div>`;modal.classList.add('show')};
window.closeModal=()=>modal.classList.remove('show');window.confirmBooking=async id=>{if(!confirm('Подтвердить бронирование? Стоимость проживания попадёт в долг пользователя.'))return;const {data,error}=await sb.rpc('confirm_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);if(!data?.ok)return alert('Не удалось подтвердить бронь');closeModal();await load()};window.cancelBooking=async id=>{if(!confirm('Отменить бронирование? Долг за проживание создан не будет.'))return;const {data,error}=await sb.rpc('cancel_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);if(!data?.ok)return alert('Не удалось отменить бронь');closeModal();await load()};init();
</script></body></html>
