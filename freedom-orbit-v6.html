<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — Orbit V6</title>
<style>
:root{--ink:#26352d;--soft:#6e7c73;--glass:rgba(255,255,255,.20);--line:rgba(255,255,255,.58);--accent:#72977d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink)}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#edf3ed;isolation:isolate}
.photo{position:absolute;inset:-4%;z-index:-5;background:center/cover no-repeat;filter:saturate(.88) contrast(.96);transform:scale(1.04);transition:background-image 1.2s ease,filter 1.2s ease,transform 1.8s cubic-bezier(.16,.8,.2,1)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,248,242,.58),rgba(242,247,242,.10) 36%,rgba(236,243,237,.62)),radial-gradient(circle at 50% 42%,transparent 0,rgba(228,238,229,.12) 46%,rgba(205,220,208,.34) 100%)}
.scene:before{content:"";position:absolute;inset:-30%;z-index:-2;background:linear-gradient(115deg,transparent 27%,rgba(255,255,255,.62) 39%,rgba(255,255,255,.10) 47%,transparent 58%);transform:translateX(-35%) rotate(-3deg);animation:sun 12s ease-in-out infinite alternate;filter:blur(12px);pointer-events:none}
@keyframes sun{to{transform:translateX(35%) rotate(-3deg)}}
.scene:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.34),transparent 36%),radial-gradient(circle at 14% 12%,rgba(255,255,255,.52),transparent 22%);pointer-events:none}
.top{position:absolute;z-index:30;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;font-weight:650;letter-spacing:.34em;text-transform:uppercase}.hint{font-size:9px;letter-spacing:.12em;color:#5d6c63;padding:9px 13px;border:1px solid rgba(255,255,255,.52);border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none}.orbit{position:relative;width:min(98vw,760px);height:min(98vw,760px)}
.glow{position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.66),rgba(255,255,255,.16) 42%,transparent 70%);filter:blur(16px);animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.045);opacity:.75}}
.tree{position:absolute;z-index:12;left:50%;bottom:-2%;width:67%;height:92%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 28px 35px rgba(33,52,40,.15))}.tree img{width:100%;height:100%;object-fit:contain;object-position:center bottom;animation:tree 8s ease-in-out infinite;mix-blend-mode:multiply}@keyframes tree{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(.2%,-.5%,0) rotate(.25deg)}}
.ring{position:absolute;inset:3%;z-index:20;border-radius:50%;--r:0deg;transform:rotate(var(--r));cursor:grab;transition:transform 900ms cubic-bezier(.12,.86,.16,1);touch-action:none}.ring.drag{cursor:grabbing;transition:none}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.48);box-shadow:inset 0 0 70px rgba(255,255,255,.34),0 0 90px rgba(255,255,255,.18)}.ring:after{content:"";position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(73,96,82,.12);box-shadow:0 0 0 1px rgba(255,255,255,.22),inset 0 0 35px rgba(255,255,255,.32)}
.node{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:15px;color:rgba(47,64,55,.66);font-size:10px;font-weight:520;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(145deg,rgba(255,255,255,.27),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.48);box-shadow:inset 0 1px rgba(255,255,255,.62),0 16px 50px rgba(35,55,43,.04);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);transform:rotate(calc(var(--a)*1deg)) translateY(min(37vw,278px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)));transition:background .55s,box-shadow .55s,color .55s,scale .55s cubic-bezier(.2,.8,.2,1)}
.node:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.22);opacity:0;transition:opacity .5s}.node.active{color:var(--ink);background:linear-gradient(145deg,rgba(255,255,255,.52),rgba(255,255,255,.17));box-shadow:0 22px 65px rgba(35,55,43,.13),0 0 0 7px rgba(255,255,255,.10),inset 0 1px rgba(255,255,255,.86);scale:1.10}.node.active:before{opacity:1}.node:after{content:"";position:absolute;top:12px;width:4px;height:4px;border-radius:50%;background:rgba(92,132,103,.72);box-shadow:0 0 16px rgba(92,132,103,.45)}
.center{position:absolute;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.core{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.98),rgba(218,235,220,.72) 28%,rgba(116,157,126,.45) 63%,rgba(68,97,76,.25));border:1px solid rgba(255,255,255,.72);box-shadow:0 0 0 16px rgba(255,255,255,.10),0 20px 60px rgba(38,63,47,.18),inset 0 1px rgba(255,255,255,.98);backdrop-filter:blur(10px);animation:core 5s ease-in-out infinite}@keyframes core{50%{box-shadow:0 0 0 25px rgba(255,255,255,.035),0 24px 70px rgba(38,63,47,.20),inset 0 1px rgba(255,255,255,.98)}}.center span{display:block;margin-top:13px;font-size:8px;letter-spacing:.36em;color:rgba(67,84,74,.72);text-transform:uppercase}
.panel{position:absolute;z-index:30;left:50%;bottom:22px;transform:translateX(-50%);width:min(570px,calc(100% - 30px));display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border:1px solid rgba(255,255,255,.58);border-radius:24px;background:rgba(255,255,255,.17);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);box-shadow:0 30px 90px rgba(33,52,41,.10)}.panel small{display:block;color:rgba(73,90,80,.64);font-size:8px;letter-spacing:.25em;text-transform:uppercase}.panel strong{display:block;margin-top:4px;font:500 23px Georgia,serif}.panel button{border:1px solid rgba(255,255,255,.66);border-radius:16px;padding:11px 16px;background:rgba(37,53,45,.74);color:white;font-size:9px;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 8px 25px rgba(37,53,45,.12)}
.modal{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:rgba(40,53,45,.10);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .6s}.modal.open{opacity:1;pointer-events:auto}.window{width:min(900px,calc(100% - 24px));max-height:88vh;overflow:hidden;border-radius:32px;background:rgba(248,250,246,.88);border:1px solid rgba(255,255,255,.82);box-shadow:0 45px 140px rgba(25,40,31,.22);transform:translateY(25px) scale(.96);transition:.7s cubic-bezier(.16,.86,.18,1)}.modal.open .window{transform:none}.media{height:360px;background:center/cover no-repeat}.copy{padding:26px}.copy small{font-size:9px;letter-spacing:.2em;color:#77847c;text-transform:uppercase}.copy h2{font:500 40px Georgia,serif;margin:8px 0 10px}.copy p{margin:0;color:#68756d;line-height:1.65}.close{position:absolute;right:18px;top:18px;width:40px;height:40px;border:1px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.62);font-size:20px;color:#405047;z-index:2}
@media(max-width:620px){.top{top:15px;left:15px;right:15px}.hint{font-size:8px}.orbit{width:122vw;height:122vw}.tree{width:78%;height:88%}.node{width:88px;height:88px;margin:-44px;font-size:8px;letter-spacing:.15em}.node{transform:rotate(calc(var(--a)*1deg)) translateY(43vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.panel{bottom:11px}.panel button{display:none}.media{height:235px}.copy h2{font-size:31px}}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="photo" id="photo"></div>
<header class="top"><div class="brand">FreeDom</div><div class="hint">исследуйте пространство</div></header>
<section class="stage"><div class="orbit"><div class="glow"></div><div class="tree"><img src="images/branches.png" alt="FreeDom tree branches"></div><div class="ring" id="ring"><div class="node active" style="--a:0" data-i="0">Пространство</div><div class="node" style="--a:72" data-i="1">События</div><div class="node" style="--a:144" data-i="2">Комнаты</div><div class="node" style="--a:216" data-i="3">Баня</div><div class="node" style="--a:288" data-i="4">Кухня</div></div><div class="center"><div class="core"></div><span>living free</span></div></div></section>
<div class="panel"><div><small>выбрано</small><strong id="title">Пространство</strong></div><button id="open">Открыть</button></div>
<div class="modal" id="modal"><div class="window"><button class="close" id="close">×</button><div class="media" id="media"></div><div class="copy"><small>FreeDom</small><h2 id="mh"></h2><p id="mp"></p></div></div></div>
</main>
<script>
const labels=['Пространство','События','Комнаты','Баня','Кухня'];
const texts=['Здесь начинается знакомство с домом.','Жизнь FreeDom каждый день: реальные события, встречи, музыка, практики и люди.','Карта дома показывает комнаты и их реальную доступность.','Тепло бани, холодная вода и место под звёздным небом.','Общее пространство дома. Концепцию кухни разработаем позже.'];
const imgs=['images/room-bungalow.jpg','images/gong-meditation.jpg','images/room-family.jpg','images/sauna.jpg','images/room-hostel.jpg'];
const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],title=document.getElementById('title'),photo=document.getElementById('photo');
let idx=0,rot=0,drag=false,lastAngle=0,lastTime=0,velocity=0;
const backgrounds=['images/room-bungalow.jpg','images/gong-meditation.jpg','images/room-family.jpg','images/sauna.jpg','images/room-hostel.jpg'];
photo.style.backgroundImage=`url('${backgrounds[0]}')`;
function pointAngle(e){const r=ring.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
function apply(r){rot=r;ring.style.setProperty('--r',rot+'deg')}
function select(n){idx=(n%5+5)%5;const target=-idx*72;let d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;apply(rot);nodes.forEach((x,i)=>x.classList.toggle('active',i===idx));title.textContent=labels[idx];photo.style.backgroundImage=`url('${backgrounds[idx]}')`;photo.style.transform='scale(1.075)';setTimeout(()=>photo.style.transform='scale(1.04)',80)}
function nearest(){select(Math.round(-rot/72))}
ring.addEventListener('pointerdown',e=>{drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);lastAngle=pointAngle(e);lastTime=performance.now();velocity=0});
ring.addEventListener('pointermove',e=>{if(!drag)return;const a=pointAngle(e);let d=a-lastAngle;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;apply(rot);const now=performance.now(),dt=Math.max(8,now-lastTime);velocity=.76*velocity+.24*(d/dt*16);lastAngle=a;lastTime=now});
ring.addEventListener('pointerup',()=>{if(!drag)return;drag=false;ring.classList.remove('drag');rot+=Math.max(-32,Math.min(32,velocity*8));apply(rot);setTimeout(nearest,280)});
ring.addEventListener('pointercancel',()=>{drag=false;ring.classList.remove('drag');nearest()});
nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();const i=+n.dataset.i;if(i===0)location.href='https://freed-om.vercel.app/space-preview.html';else select(i)}));
const modal=document.getElementById('modal'),mh=document.getElementById('mh'),mp=document.getElementById('mp'),media=document.getElementById('media');
document.getElementById('open').onclick=()=>{if(idx===0){location.href='https://freed-om.vercel.app/space-preview.html';return}mh.textContent=labels[idx];mp.textContent=texts[idx];media.style.backgroundImage=`url('${imgs[idx]}')`;modal.classList.add('open')};
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
</script>
</body>
</html>
