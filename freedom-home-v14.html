15%;width:24vw;height:145%;background:linear-gradient(90deg,transparent,rgba(255,247,202,.2),transparent);filter:blur(13px);transform:rotate(18deg);animation:ray 10s ease-in-out infinite alternate}@keyframes ray{to{transform:translateX(45vw) rotate(18deg)}}.leaf{position:absolute;width:9px;height:17px;border-radius:70% 10% 70% 10%;background:rgba(78,112,67,.35);animation:fall linear infinite}.leaf:nth-child(2){left:14%;animation-duration:8s}.leaf:nth-child(3){left:36%;animation-duration:11s;animation-delay:-4s}.leaf:nth-child(4){left:68%;animation-duration:9s;animation-delay:-6s}.leaf:nth-child(5){left:84%;animation-duration:12s;animation-delay:-2s}@keyframes fall{to{transform:translate(30px,120vh) rotate(300deg)}}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3bd;box-shadow:0 0 15px #ffe7a0;animation:star 2.8s infinite}.star:nth-child(1){left:16%;top:23%}.star:nth-child(2){left:31%;top:68%;animation-delay:.8s}.star:nth-child(3){left:72%;top:24%;animation-delay:1.3s}.star:nth-child(4){left:86%;top:61%;animation-delay:.3s}.star:nth-child(5){left:57%;top:12%;animation-delay:1.8s}@keyframes star{50%{opacity:.15;transform:scale(.5)}}.steam{position:absolute;bottom:4%;width:9vw;height:32vh;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);filter:blur(13px);animation:steam 5s ease-in-out infinite}.steam:nth-child(1){left:35%;animation-delay:-2s}.steam:nth-child(2){left:58%;animation-delay:-4s}@keyframes steam{0%{transform:translateY(12vh) scale(.7);opacity:0}35%{opacity:.6}100%{transform:translateY(-25vh) scale(1.25);opacity:0}}.ripple{position:absolute;left:50%;bottom:8%;width:58vw;height:13vw;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(255,255,255,.3);animation:ripple 4s ease-out infinite}@keyframes ripple{0%{opacity:0;transform:translateX(-50%) scale(.55)}35%{opacity:.55}100%{opacity:0;transform:translateX(-50%) scale(1.35)}}.dust{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,229,170,.4);animation:dust 7s ease-in-out infinite}.dust:nth-child(1){left:20%;top:58%}.dust:nth-child(2){left:76%;top:42%;animation-delay:-3s}.dust:nth-child(3){left:62%;top:74%;animation-delay:-5s}@keyframes dust{50%{transform:translate(18px,-25px);opacity:.8}100%{transform:translate(-12px,-45px);opacity:0}}.world{position:absolute;z-index:100;inset:0;background:rgba(40,31,23,.3);backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .65s}.world.open{opacity:1;pointer-events:auto}.sheet{position:absolute;inset:0;background:#f2eadf;transform:scale(.94);opacity:0;transition:transform 1s cubic-bezier(.12,.9,.18,1),opacity .8s;overflow:hidden}.world.open .sheet{transform:scale(1);opacity:1}.bar{position:absolute;z-index:5;left:0;right:0;top:0;height:90px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(248,242,232,.95),transparent)}.title{font:500 30px Georgia,serif}.kicker{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:#8a7a69}.close{width:44px;height:44px;border-radius:50%;border:1px solid #6b574022;background:#fffaf1aa;font-size:22px;color:#54483d}.scroll{position:absolute;inset:0;overflow:auto;padding:120px 6vw 70px}.hero{max-width:940px;margin:0 auto 55px;min-height:250px;display:flex;align-items:end}.hero h2{font:500 clamp(44px,7vw,84px) Georgia,serif;line-height:.95;margin:0 0 18px}.hero p{max-width:680px;color:#75685b;line-height:1.75;font-size:15px}.grid{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{overflow:hidden;border-radius:25px;background:#fffaf3c9;border:1px solid #fff;box-shadow:0 20px 55px #35271918}.card img{width:100%;height:220px;object-fit:cover;display:block}.body{padding:18px}.body h3{font:500 23px Georgia,serif;margin:0 0 8px}.body p{font-size:11px;color:#7a6b5e;line-height:1.55;min-height:34px}.action{display:inline-block;margin-top:8px;padding:10px 13px;bo </style></head><body><main class="home" id="home" data-theme="space"><div class="ambient" id="ambient"></div><div class="veil"></div><div class="atmos space"><i class="ray"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div><div class="atmos events"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div><div class="atmos sauna"><i class="steam"></i><i class="steam"></i><i class="ripple"></i></div><div class="atmos kitchen"><i class="dust"></i><i class="dust"></i><i class="dust"></i></div><div class="atmos rooms"></div><div class="brand-top">дом, в котором живет любовь</div><header class="top"><a class="account" href="profile.html">Личный кабинет</a></header><section class="stage"><div class="orbit" id="orbit"><div class="line"></div><div class="line2"></div><div class="core"><h1>FreeDom</h1></div><div class="ring" id="ring"><button class="portal active" style="--a:0deg" data-i="0"><b>Пространство</b></button><button class="portal" style="--a:72deg" data-i="1"><b>Кухня</b></button><button class="portal" style="--a:144deg" data-i="2"><b>Баня</b></button><button class="portal" style="--a:216deg" data-i="3"><b>События</b></button><button class="portal" style="--a:288deg" data-i="4"><b>Комнаты</b></button></div></div></section><div class="hint">Проведи вокруг центра · выбери путь</div><div class="world" id="world"><div class="sheet"><header class="bar"><div><div class="kicker">FreeDom · войти в мир</div><div class="title" id="title"></div></div><button class="close" id="close">×</button></header><div class="scroll" id="scroll"></div></div></div></main><script>const home=document.getElementById('home'),orbit=document.getElementById('orbit'),ring=document.getElementById('ring'),ps=[...document.querySelectorAll('.portal')],ambient=document.getElementById('ambient'),world=document.getElementById('world'),title=document.getElementById('title'),scroll=document.getElementById('scroll');const names=['Пространство','Кухня','Баня','События','Комнаты'],themes=['space','kitchen','sauna','events','rooms'],photos=['images/room-bungalow.jpg','images/tea-ceremony.jpg','images/sauna.jpg','images/gong-meditation.jpg','images/room-family.jpg'];let rot=0,idx=0,drag=false,last=0,vel=0,ignore=0,raf;function ang(e){let r=orbit.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)}function norm(x){return Math.atan2(Math.sin(x),Math.cos(x))}function apply(){idx=((Math.round(-rot/72)%5)+5)%5;home.dataset.theme=themes[idx];ps.forEach((p,i)=>p.classList.toggle('active',i===idx));ambient.style.backgroundImage=`url('${photos[idx]}')`}function set(v){rot=v;ring.style.setProperty('--r',rot+'deg')}ring.onpointerdown=e=>{drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);last=ang(e);vel=0;e.preventDefault()};ring.onpointermove=e=>{if(!drag)return;let a=ang(e),d=norm(a-last)*180/Math.PI;set(rot+d);vel=d;last=a;apply();e.preventDefault()};function release(){if(!drag)return;drag=false;ring.classList.remove('drag');ignore=Date.now()+320;let v=vel;function coast(){if(Math.abs(v)<.02){ring.style.transition='transform .9s cubic-bezier(.12,.86,.16,1)';set(Math.round(rot/72)*72);apply();setTimeout(()=>ring.style.transition='',950);return}set(rot+v);v*=.93;apply();raf=requestAnimationFrame(coast)}coast()}ring.onpointerup=release;ring.onpointercancel=release;ring.onlostpointercapture=release;ps.forEach(p=>p.onclick=()=>{if(Date.now()<ignore)return;open(+p.dataset.i)});function open(i){idx=i;set(-i*72);apply();home.classList.add('entering');world.classList.add('open');title.textContent=names[i];scroll.scrollTop=0;scroll.innerHTML=content(i)}function closeWorld(){world.classList.remove('open');setTimeout(()=>home.classList.remove('entering'),650)}document.getElementById('close').onclick=closeWorld;document.onkeydown=e=>{if(e.key==='Escape'&&world.classList.contains('open'))closeWorld();if(world.classList.contains('open'))return;if(e.key==='ArrowRight'){set(rot-72);apply()}if(e.key==='ArrowLeft'){set(rot+72);apply()}};function content(i){if(i===4)return rooms();let d=[['Здесь начинается жизнь','Дом, сад, бассейн, люди, книги, разговоры и пространство, в котором можно просто быть собой.','images/room-bungalow.jpg','Дом и территория'],['Здесь собираются вместе','Кухня FreeDom — не ресторан. Это повседневная жизнь: приготовить, поставить чайник, поделиться едой и задержаться за разговором.','images/tea-ceremony.jpg','Общий стол'],['Замедлиться и выдохнуть','Тёплое дерево, пар, вода и разговоры. Баня — отдельный ритм FreeDom.','images/sauna.jpg','Баня'],['То, что происходит между людьми','Музыка, лекции, медитации, спорт, кино, караоке, дни рождения, творчество и спонтанные вечера.','images/gong-meditation.jpg','Живая программа']][i];return `<section class="hero"><div><h2>${d[0]}</h2><p>${d[1]}</p></div></section><section class="grid"><article class="card"><img src="${d[2]}"><div class="body"><h3>${d[3]}</h3><p>Часть живого пространства FreeDom.</p></div></article></section>`}function rooms(){let r=[['Семейная комната','images/room-family.jpg'],['Двухместная с балконом','images/room-balcony.jpg'],['Мансарда','images/room-attic.jpg'],['Бунгало','images/room-bungalow.jpg'],['Место на балконе','images/room-balcony-bed.jpg'],['Стандартный хостел','images/room-hostel.jpg'],['Эконом-хостел','images/room-hostel-2.jpg']];return `<section class="hero"><div><h2>Место, где жить</h2><p>Комната — только часть опыта. Выбирай формат проживания, а жизнь FreeDom начинается уже за дверью.</p></div></section><section class="grid">${r.map(x=>`<article class="card"><img src="${x[1]}"><div class="body"><h3>${x[0]}</h3><p>Реальный вариант проживания FreeDom.</p><a class="action" href="availability_map_v3.html?room=${encodeURIComponent(x[0])}">Проверить доступность</a></div></article>`).join('')}</section>`}apply();</script></body></html>
