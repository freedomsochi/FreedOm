<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8dfd0">
<title>FreeDom — дом в котором есть жизнь</title>
<style>
:root{--ink:#302a24;--muted:#75695d;--paper:#eee6d8;--glass:rgba(255,250,240,.36);--line:rgba(255,255,255,.66);--shadow:0 28px 80px rgba(47,35,24,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#d7c8b5}button,a{font:inherit}
.home{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#d8c8b4,#efe5d5 55%,#cbb99f)}
.ambient,.ambient2{position:absolute;inset:-9%;background:center/cover no-repeat;filter:saturate(.48) sepia(.16) contrast(.9);transform:scale(1.05);transition:opacity 1.4s,transform 2.8s}.ambient{background-image:url('images/room-bungalow.jpg');opacity:.16}.ambient2{opacity:0}.wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,250,238,.55),transparent 36%),linear-gradient(180deg,rgba(255,249,237,.76),rgba(255,245,228,.18) 54%,rgba(52,39,27,.2));pointer-events:none}.sun{position:absolute;width:55vw;height:55vw;max-width:680px;max-height:680px;left:50%;top:43%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,246,210,.42),rgba(255,246,210,0) 68%);filter:blur(10px);animation:breathe 8s ease-in-out infinite alternate;pointer-events:none}@keyframes breathe{to{transform:translate(-50%,-50%) scale(1.08);opacity:.7}}
.top{position:absolute;z-index:50;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center}.brand{text-align:center}.brand strong{display:block;font:500 19px Georgia,serif;letter-spacing:.34em;text-transform:uppercase}.brand span{display:block;margin-top:5px;font-size:8px;letter-spacing:.28em;text-transform:uppercase;opacity:.5}.account{position:absolute;right:22px;top:20px;border:1px solid rgba(255,255,255,.7);background:rgba(255,250,240,.24);backdrop-filter:blur(20px);border-radius:999px;padding:10px 14px;color:var(--ink);text-decoration:none;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.stage{position:absolute;inset:0;display:grid;place-items:center}.orbit{position:relative;width:min(96vw,820px);height:min(96vw,820px);touch-action:none}.orbit-line,.orbit-line2{position:absolute;inset:3%;border-radius:50%;pointer-events:none}.orbit-line{border:1px solid rgba(255,255,255,.58);box-shadow:0 0 70px rgba(66,48,32,.08),inset 0 0 70px rgba(255,239,209,.16)}.orbit-line2{inset:8%;border:1px solid rgba(76,57,42,.13)}
.branches{position:absolute;z-index:7;left:50%;top:5%;width:76%;height:91%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 30px 38px rgba(46,31,20,.14))}.branches img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:contrast(.9) saturate(.72);animation:sway 10s ease-in-out infinite}@keyframes sway{50%{transform:rotate(.16deg) translateY(-.2%)}}
.core{position:absolute;z-index:12;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;pointer-events:none;background:radial-gradient(circle,rgba(255,250,239,.55),rgba(255,250,239,.13) 66%,transparent 70%);filter:drop-shadow(0 18px 40px rgba(54,38,24,.12))}.core-copy{transform:translateY(8px)}.core-copy small{display:block;font-size:8px;letter-spacing:.28em;text-transform:uppercase;opacity:.48;margin-bottom:8px}.core-copy h1{font:500 clamp(30px,5vw,48px) Georgia,serif;margin:0;letter-spacing:-.025em}.core-copy p{margin:9px 0 0;font:italic 14px Georgia,serif;color:#6d5d4e}
.ring{position:absolute;inset:0;z-index:20;border-radius:50%;transform:rotate(var(--r,0deg));cursor:grab}.ring.drag{cursor:grabbing;transition:none}.portal{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:15px;overflow:hidden;border:1px solid rgba(255,255,255,.78);box-shadow:0 18px 45px rgba(50,35,23,.13);background:rgba(255,250,240,.24);backdrop-filter:blur(16px);transform:rotate(var(--a)) translateY(min(39vw,315px)) rotate(calc(-1 * var(--a) - var(--r)));transition:transform .45s,filter .45s}.portal:before{content:"";position:absolute;inset:0;background:var(--photo) center/cover;filter:saturate(.72) sepia(.08);opacity:.62;z-index:-2;transition:transform .7s}.portal:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,251,240,.7),rgba(74,55,38,.08));z-index:-1}.portal b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}.portal.active{filter:brightness(1.08);box-shadow:0 24px 65px rgba(49,34,21,.2),0 0 0 9px rgba(255,240,213,.14)}.portal.active:before{transform:scale(1.1)}
.hint{position:absolute;z-index:40;left:50%;bottom:20px;transform:translateX(-50%);padding:11px 17px;border:1px solid rgba(255,255,255,.62);background:rgba(255,250,240,.22);backdrop-filter:blur(18px);border-radius:999px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:.5s}.entering .orbit{transform:scale(.91);opacity:0;filter:blur(9px);transition:1s cubic-bezier(.16,.86,.18,1)}.entering .brand,.entering .account,.entering .hint{opacity:0;transition:.5s}
.world{position:absolute;z-index:100;inset:0;background:rgba(40,31,23,.3);backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .65s}.world.open{opacity:1;pointer-events:auto}.world-sheet{position:absolute;inset:0;background:var(--paper);transform:scale(.94);opacity:0;transition:transform 1s cubic-bezier(.12,.9,.18,1),opacity .8s;overflow:hidden}.world.open .world-sheet{transform:scale(1);opacity:1}.world-photo{position:absolute;inset:0;background:var(--worldphoto) center/cover;filter:saturate(.7) sepia(.08);opacity:.16;transform:scale(1.08);transition:transform 9s ease,opacity .8s}.world.open .world-photo{transform:scale(1);opacity:.21}.world-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(248,242,232,.93),rgba(248,242,232,.64) 45%,rgba(248,242,232,.95));pointer-events:none}.world-head{position:absolute;z-index:5;left:0;right:0;top:0;height:92px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(248,242,232,.96),transparent)}.world-kicker{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:#8a7a69}.world-title{font:500 30px Georgia,serif;margin-top:4px}.close{width:44px;height:44px;border-radius:50%;border:1px solid rgba(67,50,35,.14);background:rgba(255,250,241,.7);color:#4e4034;font-size:22px;cursor:pointer}.world-scroll{position:absolute;inset:0;overflow:auto;padding:120px 6vw 70px}.world-scroll::-webkit-scrollbar{width:8px}.world-scroll::-webkit-scrollbar-thumb{background:#cbbba5;border-radius:99px}
.hero-world{max-width:940px;margin:0 auto 58px;min-height:270px;display:flex;align-items:end}.hero-world .copy{max-width:720px}.hero-world h2{font:500 clamp(42px,7vw,84px) Georgia,serif;line-height:.95;letter-spacing:-.035em;margin:0 0 18px}.hero-world p{max-width:670px;font-size:15px;line-height:1.75;color:#75685b}.world-link{display:inline-flex;margin-top:20px;padding:12px 17px;border-radius:999px;background:#44372b;color:#fffaf1;text-decoration:none;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.feature-grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.feature{min-height:310px;border-radius:28px;overflow:hidden;position:relative;background:#d7c8b5;box-shadow:var(--shadow)}.feature img{width:100%;height:100%;min-height:310px;object-fit:cover;display:block}.feature .overlay{position:absolute;inset:0;display:flex;align-items:end;padding:24px;background:linear-gradient(transparent 35%,rgba(39,28,20,.68));color:#fff}.feature h3{font:500 30px Georgia,serif;margin:0}.feature p{margin:7px 0 0;font-size:11px;line-height:1.5;opacity:.85}.stack{display:grid;gap:18px}.mini{border-radius:28px;padding:24px;background:rgba(255,250,240,.58);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(53,39,25,.08)}.mini h3{font:500 27px Georgia,serif;margin:0 0 9px}.mini p{font-size:12px;line-height:1.6;color:#76695d;margin:0}.quote{max-width:820px;margin:60px auto 0;text-align:center;font:italic 28px/1.4 Georgia,serif;color:#5c4e41}
.rooms-grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.room-card{overflow:hidden;border-radius:25px;background:rgba(255,251,243,.78);border:1px solid rgba(255,255,255,.82);box-shadow:0 20px 55px rgba(53,39,25,.09)}.room-card img{display:block;width:100%;height:220px;object-fit:cover}.room-body{padding:19px}.room-body h3{font:500 23px Georgia,serif;margin:0 0 8px}.room-body p{font-size:11px;line-height:1.55;color:#7a6b5e;min-height:34px;margin:0 0 16px}.room-action{display:inline-flex;padding:10px 13px;border-radius:999px;background:#4a3b2e;color:#fff9ef;text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.rooms-note{max-width:900px;margin:25px auto 0;text-align:center;font-size:10px;line-height:1.6;color:#8b7d6f}
@media(max-width:760px){.top{height:70px}.brand strong{font-size:16px}.brand span{font-size:6px}.account{right:12px;top:14px;width:40px;height:40px;padding:0;font-size:0}.orbit{width:124vw;height:124vw}.branches{width:91%;height:88%;top:7%}.core{width:150px;height:150px}.core-copy h1{font-size:31px}.core-copy p{font-size:12px}.portal{width:94px;height:94px;margin:-47px;padding:10px}.portal b{font-size:7px;letter-spacing:.1em}.hint{bottom:12px;font-size:7px}.world-head{height:76px;padding:16px}.world-title{font-size:23px}.world-scroll{padding:98px 16px 48px}.hero-world{min-height:260px;margin-bottom:35px}.hero-world h2{font-size:48px}.hero-world p{font-size:13px}.feature-grid{grid-template-columns:1fr}.feature,.feature img{min-height:260px}.rooms-grid{grid-template-columns:1fr;gap:14px}.room-card img{height:210px}.quote{font-size:22px;margin-top:40px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="home" id="home">
<div class="ambient" id="ambient"></div><div class="ambient2" id="ambient2"></div><div class="wash"></div><div class="sun"></div>
<header class="top"><div class="brand"><strong>FreeDom</strong><span>дом в котором есть жизнь</span></div><a class="account" href="profile.html">Личный кабинет</a></header>
<section class="stage" aria-label="Навигация FreeDom">
<div class="orbit" id="orbit">
<div class="orbit-line"></div><div class="orbit-line2"></div>
<div class="branches"><img src="images/branches.png" alt="Дерево FreeDom"></div>
<div class="core"><div class="core-copy"><small>выбери свой путь</small><h1>FreeDom</h1><p>куда хочешь пойти?</p></div></div>
<div class="ring" id="ring">
<button class="portal active" style="--a:0deg;--photo:url('images/room-bungalow.jpg')" data-index="0"><b>Пространство</b></button>
<button class="portal" style="--a:72deg;--photo:url('images/tea-ceremony.jpg')" data-index="1"><b>Кухня</b></button>
<button class="portal" style="--a:144deg;--photo:url('images/sauna.jpg')" data-index="2"><b>Баня</b></button>
<button class="portal" style="--a:216deg;--photo:url('images/gong-meditation.jpg')" data-index="3"><b>События</b></button>
<button class="portal" style="--a:288deg;--photo:url('images/room-family.jpg')" data-index="4"><b>Комнаты</b></button>
</div></div></section>
<div class="hint">Проведи вокруг дерева · выбери путь</div>
<div class="world" id="world"><div class="world-sheet" id="sheet"><div class="world-photo" id="worldPhoto"></div><div class="world-shade"></div><header class="world-head"><div><div class="world-kicker">FreeDom · войти в мир</div><div class="world-title" id="worldTitle"></div></div><button class="close" id="close" aria-label="Закрыть">×</button></header><div class="world-scroll" id="worldScroll"></div></div></div>
</main>
<script>
const home=document.getElementById('home'),orbit=document.getElementById('orbit'),ring=document.getElementById('ring'),portals=[...document.querySelectorAll('.portal')],ambient=document.getElementById('ambient'),ambient2=document.getElementById('ambient2'),world=document.getElementById('world'),sheet=document.getElementById('sheet'),worldPhoto=document.getElementById('worldPhoto'),worldTitle=document.getElementById('worldTitle'),worldScroll=document.getElementById('worldScroll'),close=document.getElementById('close');
const names=['Пространство','Кухня','Баня','События','Комнаты'];const photos=['images/room-bungalow.jpg','images/tea-ceremony.jpg','images/sauna.jpg','images/gong-meditation.jpg','images/room-family.jpg'];
let rot=0,idx=0,drag=false,lastAngle=0,lastTime=0,velocity=0,raf=0,ignore=0;
function angle(e){const r=orbit.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}
function atmosphere(i){ambient2.style.backgroundImage=`url('${photos[i]}')`;ambient2.style.opacity='.18';ambient.style.opacity='0';setTimeout(()=>{ambient.style.backgroundImage=`url('${photos[i]}')`;ambient.style.opacity='.16';ambient2.style.opacity='0'},700)}
function update(){const nearest=Math.round(-rot/72);idx=((nearest%5)+5)%5;portals.forEach((p,i)=>p.classList.toggle('active',i===idx));atmosphere(idx)}
function setRot(v){rot=v;ring.style.setProperty('--r',rot+'deg')}
ring.addEventListener('pointerdown',e=>{if(world.classList.contains('open'))return;drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);lastAngle=angle(e);lastTime=performance.now();velocity=0;cancelAnimationFrame(raf);e.preventDefault()});
ring.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),a=angle(e),d=norm(a-lastAngle),dt=Math.max(8,now-lastTime),delta=d*180/Math.PI;setRot(rot+delta);velocity=delta/(dt/16.67);lastAngle=a;lastTime=now;update();e.preventDefault()});
function release(){if(!drag)return;drag=false;ring.classList.remove('drag');ignore=Date.now()+320;let v=velocity;function coast(){if(Math.abs(v)<.018){ring.style.transition='transform .9s cubic-bezier(.12,.86,.16,1)';setRot(Math.round(rot/72)*72);update();setTimeout(()=>ring.style.transition='',950);return}setRot(rot+v);v*=.93;update();raf=requestAnimationFrame(coast)}coast()}
ring.addEventListener('pointerup',release);ring.addEventListener('pointercancel',release);ring.addEventListener('lostpointercapture',release);
portals.forEach(p=>p.addEventListener('click',()=>{if(Date.now()<ignore)return;openWorld(Number(p.dataset.index))}));
function openWorld(i){idx=i;setRot(-i*72);update();home.classList.add('entering');world.classList.add('open');worldTitle.textContent=names[i];worldPhoto.style.setProperty('--worldphoto',`url('${photos[i]}')`);worldScroll.scrollTop=0;worldScroll.innerHTML=content(i)}
function closeWorld(){world.classList.remove('open');setTimeout(()=>home.classList.remove('entering'),620)}
close.addEventListener('click',closeWorld);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&world.classList.contains('open'))closeWorld();if(world.classList.contains('open'))return;if(e.key==='ArrowRight'){setRot(rot-72);update()}if(e.key==='ArrowLeft'){setRot(rot+72);update()}});
function content(i){if(i===4)return rooms();const data=[
{hero:'Здесь начинается жизнь',text:'Дом, сад, бассейн, люди, книги, разговоры и пространство, в котором можно просто быть собой. Не экскурсия по объекту — место, куда можно войти и задержаться.',main:'images/room-bungalow.jpg',mainTitle:'Дом и территория',mainText:'FreeDom живёт не только внутри комнат. Здесь пересекаются работа, отдых, спорт, тишина, разговоры и случайные встречи.',a:'Люди',b:'Каждый приходит со своей историей — и становится частью общей.'},
{hero:'Здесь собираются вместе',text:'Кухня FreeDom — это не ресторан. Это повседневная жизнь: приготовить, поставить чайник, поделиться едой, поговорить и случайно задержаться ещё на час.',main:'images/tea-ceremony.jpg',mainTitle:'Общий стол',mainText:'Простые вещи становятся частью атмосферы дома: чай, еда, разговоры, совместная готовка и ощущение, что тебе здесь рады.',a:'Еда',b:'Без спешки. Без формальности. Вместе.'},
{hero:'Замедлиться и выдохнуть',text:'Тёплое дерево, пар, вода и разговоры. Баня — отдельный ритм FreeDom, где можно согреться, остыть, помолчать или говорить обо всём.',main:'images/sauna.jpg',mainTitle:'Баня',mainText:'Место для восстановления и простого человеческого общения — без сценария и обязательной программы.',a:'Тепло',b:'Иногда лучший план — никуда не торопиться.'},
{hero:'То, что происходит между людьми',text:'Музыка, лекции, медитации, спорт, кино, караоке, дни рождения, творчество и совершенно спонтанные вечера. События здесь рождаются из людей.',main:'images/gong-meditation.jpg',mainTitle:'Живая программа',mainText:'Не афиша ради афиши. Каждое событие — повод встретиться, попробовать что-то новое или просто провести вечер вместе.',a:'События',b:'Сегодня может случиться то, чего вчера не было в планах.'}
][i];return `<section class="hero-world"><div class="copy"><h2>${data.hero}</h2><p>${data.text}</p></div></section><section class="feature-grid"><article class="feature"><img src="${data.main}" alt=""><div class="overlay"><div><h3>${data.mainTitle}</h3><p>${data.mainText}</p></div></div></article><div class="stack"><article class="mini"><h3>${data.a}</h3><p>${data.b}</p></article><article class="mini"><h3>FreeDom</h3><p>Дом, в котором не нужно изображать кого-то другого.</p></article></div></section><p class="quote">«Вот FreeDom. Куда хочешь пойти?»</p>`}
function rooms(){const rooms=[['Семейная комната','images/room-family.jpg','Пространство для тех, кто хочет быть вместе.'],['Двухместная с балконом','images/room-balcony.jpg','Светлая комната с выходом на балкон.'],['Мансарда','images/room-attic.jpg','Тихое пространство под крышей.'],['Бунгало','images/room-bungalow.jpg','Отдельный формат жизни среди зелени.'],['Место на балконе','images/room-balcony-bed.jpg','Самый простой способ быть ближе к воздуху и небу.'],['Стандартный хостел','images/room-hostel.jpg','Общее пространство и жизнь рядом с другими.'],['Эконом-хостел','images/room-hostel-2.jpg','Простой вариант для тех, кому важнее сам FreeDom.']];return `<section class="hero-world"><div class="copy"><h2>Место, где жить</h2><p>Комната здесь — только часть опыта. Выбирай формат проживания, а остальное начинается уже за дверью: люди, пространство, кухня, баня, события и обычная жизнь дома.</p></div></section><section class="rooms-grid">${rooms.map(r=>`<article class="room-card"><img src="${r[1]}" alt="${r[0]}"><div class="room-body"><h3>${r[0]}</h3><p>${r[2]}</p><a class="room-action" href="availability_map_v3.html?room=${encodeURIComponent(r[0])}">Проверить доступность</a></div></article>`).join('')}</section><p class="rooms-note">Доступность и бронирование открываются через существующую систему FreeDom. Новая параллельная система бронирования не создаётся.</p>`}
atmosphere(0);
</script>
</body></html>
