<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — дом в котором есть жизнь</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#40372e;background:#d9c8b0}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#d9c8b0}.bg,.bg2{position:absolute;inset:-8%;background:center/cover no-repeat;filter:saturate(.58) sepia(.14) contrast(.9);transform:scale(1.06);transition:opacity 1.2s,transform 2s}.bg{background-image:url('images/room-bungalow.jpg');opacity:.28}.bg2{opacity:0}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,235,.76),rgba(255,244,222,.24) 45%,rgba(48,37,27,.25));pointer-events:none}.light{position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 38%,rgba(255,241,204,.45) 48%,transparent 58%);filter:blur(25px);animation:light 14s ease-in-out infinite alternate;pointer-events:none}@keyframes light{to{transform:translateX(34%)}}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:40;font:500 18px Georgia,serif;letter-spacing:.35em;text-transform:uppercase}.caption{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:40;font-size:7px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;opacity:.55}.account{position:absolute;right:22px;top:20px;z-index:50;padding:9px 13px;border:1px solid rgba(255,252,241,.5);border-radius:999px;background:rgba(255,249,236,.2);backdrop-filter:blur(18px);color:#4d4034;text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.orbit{position:absolute;width:min(102vw,760px);height:min(102vw,760px);left:50%;top:52%;transform:translate(-50%,-50%);touch-action:none;transition:transform 1s,opacity .8s,filter .8s}.entering .orbit{transform:translate(-50%,-50%) scale(.92);opacity:.08;filter:blur(7px)}.branches{position:absolute;z-index:12;left:50%;top:8%;width:78%;height:88%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 25px 35px rgba(50,35,23,.14));}.branches img{width:100%;height:100%;object-fit:contain;object-position:center center;mix-blend-mode:multiply;filter:contrast(.92) saturate(.7);animation:sway 9s ease-in-out infinite}@keyframes sway{50%{transform:rotate(.18deg) translateY(-.25%)}}
.ring{position:absolute;inset:3%;z-index:20;border-radius:50%;--r:0deg;transform:rotate(var(--r));transition:transform .95s cubic-bezier(.12,.86,.16,1);cursor:grab}.ring.drag{transition:none;cursor:grabbing}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,250,238,.62);box-shadow:inset 0 0 80px rgba(255,235,205,.18),0 0 70px rgba(60,42,27,.1)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(74,54,38,.13)}
.node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(255,249,236,.19);border:1px solid rgba(255,252,241,.62);backdrop-filter:blur(24px) saturate(125%);color:rgba(58,49,41,.65);font-size:9px;letter-spacing:.16em;text-transform:uppercase;transform:rotate(calc(var(--a)*1deg)) translateY(min(37vw,278px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)));transition:.45s}.node.active{background:rgba(255,248,228,.58);color:#302821;scale:1.08;box-shadow:0 20px 55px rgba(62,43,27,.13),0 0 0 8px rgba(255,235,205,.1),inset 0 1px rgba(255,255,255,.85)}
.core{position:absolute;left:50%;top:50%;z-index:18;width:116px;height:116px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(246,232,207,.2);border:1px solid rgba(255,250,238,.5);backdrop-filter:blur(10px);box-shadow:0 0 0 18px rgba(255,239,211,.08),0 18px 70px rgba(58,39,24,.12);pointer-events:none}.core:before{content:"";position:absolute;left:50%;bottom:12px;width:7px;height:58px;transform:translateX(-50%);border-radius:8px;background:linear-gradient(90deg,#6d4a31,#a57a50,#5b3d29);opacity:.75}.core:after{content:"";position:absolute;left:50%;top:28px;width:84px;height:60px;transform:translateX(-50%);border-radius:50% 50% 42% 42%;border-top:2px solid rgba(82,58,39,.62);border-left:1px solid rgba(82,58,39,.35);border-right:1px solid rgba(82,58,39,.35);opacity:.7}
.hint{position:absolute;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:11px 17px;border:1px solid #fff8e877;border-radius:99px;background:#fff8e928;backdrop-filter:blur(20px);white-space:nowrap;transition:.5s}.entering .hint,.entering .logo,.entering .caption,.entering .account{opacity:0}
.world{position:absolute;inset:0;z-index:60;background:rgba(48,37,27,.32);backdrop-filter:blur(28px);opacity:0;pointer-events:none;transition:opacity .7s}.world.open{opacity:1;pointer-events:auto}.sheet{position:absolute;inset:0;background:#f6efe3;transform:scale(.93);opacity:0;transition:transform 1s cubic-bezier(.16,.86,.18,1),opacity .8s;overflow:hidden}.world.open .sheet{transform:scale(1);opacity:1}.bar{position:absolute;z-index:20;top:0;left:0;right:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(rgba(255,250,241,.92),rgba(255,250,241,.42),transparent);backdrop-filter:blur(12px)}.title{font:500 28px Georgia,serif}.meta{font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:#837362;margin-top:3px}.close{width:42px;height:42px;border-radius:50%;border:1px solid #6b57401f;background:#fffaf280;font-size:21px;color:#54483d;cursor:pointer}.world-content{position:absolute;inset:0;overflow:auto;padding:112px 7vw 60px;scroll-behavior:smooth}.world-content::-webkit-scrollbar{width:8px}.world-content::-webkit-scrollbar-thumb{background:#d1c0a8;border-radius:8px}
.rooms-intro{max-width:760px;margin:0 auto 38px;text-align:center}.rooms-intro h1{font:500 clamp(38px,6vw,72px) Georgia,serif;margin:0 0 14px;color:#392f27}.rooms-intro p{margin:0 auto;max-width:620px;font-size:14px;line-height:1.7;color:#756758}.rooms-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.room-card{background:rgba(255,252,244,.65);border:1px solid rgba(91,70,50,.14);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(63,44,28,.09);transition:transform .35s,box-shadow .35s}.room-card:hover{transform:translateY(-5px);box-shadow:0 25px 65px rgba(63,44,28,.14)}.room-card img{display:block;width:100%;height:220px;object-fit:cover}.room-body{padding:18px}.room-body h2{font:500 23px Georgia,serif;margin:0 0 8px;color:#40342a}.room-body p{font-size:12px;line-height:1.55;color:#7b6b5c;margin:0 0 16px}.room-action{display:inline-flex;align-items:center;gap:7px;color:#5b4938;text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #bca98f;padding-bottom:4px}.rooms-note{max-width:1100px;margin:28px auto 0;text-align:center;color:#958473;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:760px){.logo{top:16px;font-size:15px}.caption{top:43px}.account{right:12px;top:12px;font-size:0;width:38px;height:38px;padding:0}.orbit{width:125vw;height:125vw;top:52%}.branches{width:90%;height:86%;top:10%}.node{width:90px;height:90px;margin:-45px;font-size:7px;transform:rotate(calc(var(--a)*1deg)) translateY(43vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.core{width:86px;height:86px}.core:before{height:42px;bottom:10px}.core:after{top:20px;width:62px;height:45px}.hint{bottom:12px}.bar{height:66px;padding:0 14px}.title{font-size:22px}.close{width:38px;height:38px}.world-content{padding:94px 16px 40px}.rooms-grid{grid-template-columns:1fr;gap:14px}.room-card img{height:190px}.rooms-intro{margin-bottom:26px}.rooms-intro p{font-size:13px}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="bg" id="bg"></div><div class="bg2" id="bg2"></div><div class="veil"></div><div class="light"></div>
<div class="logo">FreeDom</div><div class="caption">дом в котором есть жизнь · выбери свой путь</div>
<a class="account" href="#" onclick="event.preventDefault();alert('Личный кабинет подключим отдельно — он не входит в Orbit.')">Личный кабинет</a>
<div class="orbit" id="orbit">
<div class="branches"><img src="images/branches.png" alt=""></div>
<div class="ring" id="ring">
<div class="node active" style="--a:0deg" data-index="0">Пространство</div><div class="node" style="--a:72deg" data-index="1">Кухня</div><div class="node" style="--a:144deg" data-index="2">Баня</div><div class="node" style="--a:216deg" data-index="3">События</div><div class="node" style="--a:288deg" data-index="4">Комнаты</div>
</div><div class="core" aria-hidden="true"></div></div>
<div class="hint">Проведи вокруг дерева · выбери путь</div>
<div class="world" id="world"><div class="sheet">
<div class="bar"><div><div class="title" id="worldTitle">Комнаты</div><div class="meta">FreeDom · войти в мир</div></div><button class="close" id="close" aria-label="Закрыть">×</button></div>
<div class="world-content" id="worldContent"></div>
</div></div>
</div>
<script>
const scene=document.getElementById('scene'),ring=document.getElementById('ring'),orbit=document.getElementById('orbit'),nodes=[...document.querySelectorAll('.node')],bg=document.getElementById('bg'),bg2=document.getElementById('bg2'),world=document.getElementById('world'),worldContent=document.getElementById('worldContent'),worldTitle=document.getElementById('worldTitle'),close=document.getElementById('close');
const photos=['images/room-bungalow.jpg','images/room-family.jpg','images/sauna.jpg','images/gong-meditation.jpg','images/room-hostel.jpg'];const names=['Пространство','Кухня','Баня','События','Комнаты'];
let rot=0,idx=0,drag=false,lastAngle=0,lastTime=0,velocity=0,raf=0,ignoreClickUntil=0;
function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}function angleAt(e){const r=orbit.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}
function selectByRotation(){const nearest=Math.round(-rot/72);idx=((nearest%5)+5)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx)}
function atmosphere(i){const target=photos[i];bg2.style.backgroundImage=`url('${target}')`;bg2.style.opacity='.32';bg2.style.transform='scale(1.03)';bg.style.opacity='0';setTimeout(()=>{bg.style.backgroundImage=`url('${target}')`;bg.style.opacity='.28';bg2.style.opacity='0';bg.style.transform='scale(1.06)'},650)}
ring.addEventListener('pointerdown',e=>{if(world.classList.contains('open'))return;drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);lastAngle=angleAt(e);lastTime=performance.now();velocity=0;cancelAnimationFrame(raf);e.preventDefault()});
ring.addEventListener('pointermove',e=>{if(!drag)return;const a=angleAt(e),now=performance.now(),d=norm(a-lastAngle),dt=Math.max(8,now-lastTime),delta=d*180/Math.PI;rot+=delta;velocity=delta/(dt/16.67);lastAngle=a;lastTime=now;ring.style.setProperty('--r',rot+'deg');selectByRotation();e.preventDefault()});
function release(){if(!drag)return;drag=false;ring.classList.remove('drag');ignoreClickUntil=Date.now()+300;let v=velocity;function coast(){if(Math.abs(v)<.015){rot=Math.round(rot/72)*72;ring.style.transition='transform .95s cubic-bezier(.12,.86,.16,1)';ring.style.setProperty('--r',rot+'deg');selectByRotation();return}rot+=v;v*=.93;ring.style.setProperty('--r',rot+'deg');selectByRotation();raf=requestAnimationFrame(coast)}coast()}
ring.addEventListener('pointerup',release);ring.addEventListener('pointercancel',release);ring.addEventListener('lostpointercapture',release);
nodes.forEach(n=>n.addEventListener('click',()=>{if(Date.now()<ignoreClickUntil)return;openWorld(Number(n.dataset.index))}));
function roomsWorld(){worldTitle.textContent='Комнаты';worldContent.innerHTML=`<section class="rooms-intro"><h1>Комнаты</h1><p>Здесь не просто место для ночёвки. Выбери пространство, в котором тебе хочется пожить, познакомиться с людьми и почувствовать ритм FreeDom.</p></section><section class="rooms-grid">${[
['Семейная комната','images/room-family.jpg','Пространство для тех, кто хочет быть вместе.'],
['Двухместная с балконом','images/room-balcony.jpg','Светлая комната с выходом на балкон.'],
['Мансарда','images/room-attic.jpg','Уютное пространство под крышей дома.'],
['Бунгало','images/room-bungalow.jpg','Отдельное камерное пространство рядом с домом.'],
['Место на балконе','images/room-balcony-bed.jpg','Простой вариант для тех, кому важнее атмосфера, чем формат.'],
['Стандартный хостел','images/room-hostel.jpg','Общее пространство, знакомства и жизнь дома.'],
['Эконом-хостел','images/room-hostel-2.jpg','Самый простой способ оказаться внутри FreeDom.']
].map(r=>`<article class="room-card"><img src="${r[1]}" alt="${r[0]}"><div class="room-body"><h2>${r[0]}</h2><p>${r[2]}</p><a class="room-action" href="#" onclick="event.preventDefault();alert('Следующий шаг — подключить к этой карточке реальную доступность и бронирование из FreeDom.')">Выбрать комнату →</a></div></article>`).join('')}</section><div class="rooms-note">Данные бронирования подключим к существующей системе · ничего нового вместо неё не создаём</div>`}
function openWorld(i){if(Date.now()<ignoreClickUntil)return;idx=i;scene.classList.add('entering');world.classList.add('open');worldTitle.textContent=names[i];if(i===4){roomsWorld()}else{worldContent.innerHTML=`<div style="min-height:70vh;display:grid;place-items:center;text-align:center"><div><div style="font:500 48px Georgia,serif;margin-bottom:14px">${names[i]}</div><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8b7967">Следующий мир FreeDom</div></div></div>`}}
function closeWorld(){world.classList.remove('open');scene.classList.remove('entering');worldContent.innerHTML='';atmosphere(idx)}
close.addEventListener('click',closeWorld);world.addEventListener('click',e=>{if(e.target===world)closeWorld()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&world.classList.contains('open'))closeWorld();if(world.classList.contains('open'))return;if(e.key==='ArrowRight'){rot-=72;ring.style.setProperty('--r',rot+'deg');selectByRotation()}if(e.key==='ArrowLeft'){rot+=72;ring.style.setProperty('--r',rot+'deg');selectByRotation()}});
atmosphere(0);
</script>
</body>
</html>
