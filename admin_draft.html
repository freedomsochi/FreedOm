<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeDom — Админ-панель Draft</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c15;color:#eef1f7;font:15px Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.card{background:#111625;border:1px solid #252d42;border-radius:16px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#8992a8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab,.btn{border:1px solid #34405a;background:#171d2c;color:#e9edf5;border-radius:10px;padding:9px 13px;cursor:pointer}.tab.active,.primary{background:#d4af37;color:#111;border-color:#d4af37}.danger{background:#4b1e28;border-color:#7c3341}.success{background:#173b2b;border-color:#2b7753}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#171d2c;padding:14px;border-radius:12px}.stat b{display:block;font-size:1.35rem;margin-top:5px}.listrow{display:grid;grid-template-columns:2fr 1.4fr 1fr 1.1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #252d42}.status{font-weight:700}.pending{color:#f2c94c}.confirmed{color:#35d48a}.cancelled{color:#ff6978}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#20283a}.search{width:100%;background:#171d2c;color:#fff;border:1px solid #34405a;border-radius:10px;padding:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.box{width:min(850px,100%);max-height:92vh;overflow:auto;background:#111625;border:1px solid #34405a;border-radius:18px;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#171d2c;padding:12px;border-radius:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.debt{color:#ff6978;font-weight:700}.ok{color:#35d48a;font-weight:700}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #252d42}.alloc{margin-top:15px;padding:14px;background:#0d1220;border:1px solid #34405a;border-radius:12px}.allocrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #252d42}.formrow{display:grid;grid-template-columns:150px 150px 1fr auto;gap:8px;margin-top:10px}input,select{background:#171d2c;color:#fff;border:1px solid #34405a;border-radius:9px;padding:9px;width:100%}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.listrow{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1 style="margin:0 0 5px">⚙️ FreeDom — Админ-панель</h1><div id="auth" class="muted">Проверка доступа…</div></div><button class="btn" onclick="loadAll()">↻ Обновить</button></div>
<div id="app" style="display:none"><div class="tabs"><button class="tab active" data-p="dashboard">📊 Дашборд</button><button class="tab" data-p="users">👥 Пользователи</button><button class="tab" data-p="bookings">📅 Бронирования</button><button class="tab" data-p="orders">🥗 Veg Raw</button><button class="tab" data-p="finance">💰 Финансы</button></div>
<section id="dashboard" class="panel active"><div class="card"><div class="stats"><div class="stat"><small>Пользователи</small><b id="nUsers">0</b></div><div class="stat"><small>Бронирования</small><b id="nBookings">0</b></div><div class="stat"><small>Заказы</small><b id="nOrders">0</b></div><div class="stat"><small>Общий долг</small><b id="nDebt">0 ₽</b></div></div></div></section>
<section id="users" class="panel"><div class="card"><h2>👥 Пользователи</h2><input class="search" id="userSearch" placeholder="Поиск по имени, телефону, email"><div id="usersList">Загрузка…</div></div></section>
<section id="bookings" class="panel"><div class="card"><h2>📅 Бронирования</h2><div id="bookingsList">Загрузка…</div></div></section>
<section id="orders" class="panel"><div class="card"><h2>🥗 Veg Raw</h2><div id="ordersList">Загрузка…</div></div></section>
<section id="finance" class="panel"><div class="card"><div class="stats"><div class="stat"><small>Начислено</small><b id="charged">0 ₽</b></div><div class="stat"><small>Оплачено</small><b id="paid">0 ₽</b></div><div class="stat"><small>Долг</small><b id="debt">0 ₽</b></div><div class="stat"><small>Должников</small><b id="debtors">0</b></div></div></div><div class="card"><input class="search" id="financeSearch" placeholder="Поиск должника"><div id="financeList">Загрузка…</div></div></section></div></div>
<div id="modal" class="modal"><div class="box" id="modalbox"></div></div>
<script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';
let users=[],finance=[],bookings=[],currentProfile=null;
const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—';
function status(s){let v=String(s||'').toLowerCase();if(['подтверждено','confirmed','активна','завершена','долг'].includes(v))return '<span class="status confirmed">🟢 Подтверждено</span>';if(['отменено','отменена','cancelled'].includes(v))return '<span class="status cancelled">🔴 Отменено</span>';return '<span class="status pending">🟡 Ожидает подтверждения</span>'}
async function init(){const {data}=await sb.auth.getSession();if(!data.session){location.href='login.html';return}if(data.session.user.email!==ADMIN){document.getElementById('auth').textContent='⛔ Доступ запрещён';return}document.getElementById('auth').textContent='🔒 '+data.session.user.email;document.getElementById('app').style.display='block';await loadAll()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});
async function loadAll(){const [u,b,o,f]=await Promise.all([sb.from('users').select('user_id,Display_name,Phone,Email').order('Display_name'),sb.from('bookings').select('*,rooms(name)').order('created_at',{ascending:false}).limit(200),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200),sb.from('user_financial_summary').select('*').order('total_debt',{ascending:false})]);users=u.data||[];bookings=b.data||[];finance=f.data||[];document.getElementById('nUsers').textContent=users.length;document.getElementById('nBookings').textContent=bookings.length;document.getElementById('nOrders').textContent=(o.data||[]).length;renderUsers();renderBookings();renderOrders(o.data||[]);renderFinance()}
function renderUsers(){let q=(document.getElementById('userSearch').value||'').toLowerCase();document.getElementById('usersList').innerHTML=users.filter(u=>[u.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(q)).map(u=>{let f=finance.find(x=>x.user_id===u.user_id)||{};return `<div class="listrow"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div></div><div>Долг: <b class="${Number(f.total_debt)>0?'debt':'ok'}">${money(f.total_debt)}</b></div><div></div><div></div><button class="btn" onclick="openProfile('${u.user_id}')">Подробнее</button></div>`}).join('')||'<div class="muted">Нет пользователей</div>'}
function renderBookings(){document.getElementById('bookingsList').innerHTML=bookings.map(x=>`<div class="listrow"><div><b>${esc(x.guest_name||'Гость')}</b><div class="muted">${esc(x.rooms?.name||'Номер')} · ${date(x.check_in_date)} → ${date(x.check_out_date)}</div></div><div>${money(x.total_amount)}</div><div>${status(x.status)}</div><div class="muted">Оплачено: ${money(x.paid_amount)}</div><button class="btn" onclick="openBooking('${x.id}')">Подробнее</button></div>`).join('')||'<div class="muted">Нет бронирований</div>'}
function renderOrders(a){document.getElementById('ordersList').innerHTML=a.map(x=>`<div class="listrow"><div><b>${esc(x.guest_name||x.name||'Заказ')}</b><div class="muted">${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}</div></div><div>${money(x.total_amount)}</div><div>${esc(x.status||'')}</div><div></div><button class="btn" onclick="openOrder('${x.id}')">Подробнее</button></div>`).join('')||'<div class="muted">Нет заказов</div>'}
function renderFinance(){let c=finance.reduce((s,x)=>s+(+x.total_charged||0),0),p=finance.reduce((s,x)=>s+(+x.total_paid||0),0),d=finance.reduce((s,x)=>s+(+x.total_debt||0),0);document.getElementById('charged').textContent=money(c);document.getElementById('paid').textContent=money(p);document.getElementById('debt').textContent=money(d);document.getElementById('debtors').textContent=finance.filter(x=>+x.total_debt>0).length;document.getElementById('nDebt').textContent=money(d);let q=(document.getElementById('financeSearch').value||'').toLowerCase();document.getElementById('financeList').innerHTML=finance.filter(x=>{let u=users.find(y=>y.user_id===x.user_id)||{};return [x.Display_name,u.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(q)}).map(x=>{let u=users.find(y=>y.user_id===x.user_id)||{};return `<div class="card"><div class="listrow"><div><b>${esc(u.Display_name||x.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||u.Email||'')}</div></div><div></div><div></div><div class="debt">${money(x.total_debt)} долг</div><button class="btn" onclick="openProfile('${x.user_id}')">За что долг →</button></div></div>`}).join('')||'<div class="muted">Нет данных</div>'}
document.getElementById('userSearch').oninput=renderUsers;document.getElementById('financeSearch').oninput=renderFinance;
window.openBooking=async id=>{let b=bookings.find(x=>x.id===id);if(!b)return;let pending=!['подтверждено','confirmed','отменено','отменена','cancelled'].includes(String(b.status||'').toLowerCase());let nights=b.check_in_date&&b.check_out_date?Math.max(0,Math.round((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000)):0;document.getElementById('modalbox').innerHTML=`<div class="listrow"><h2>📅 Бронирование</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="grid2"><div class="item"><b>Гость</b><br>${esc(b.guest_name||'—')}</div><div class="item"><b>Телефон</b><br>${esc(b.guest_phone||b.phone||b.users?.Phone||'—')}</div><div class="item"><b>Email</b><br>${esc(b.guest_email||b.email||b.users?.Email||'—')}</div><div class="item"><b>Количество гостей</b><br>${esc(b.guest_count||b.guests_count||b.guests||'—')}</div><div class="item"><b>Номер</b><br>${esc(b.rooms?.name||b.room_name||'—')}</div><div class="item"><b>Период</b><br>${date(b.check_in_date)} → ${date(b.check_out_date)}<br>${nights} ночей</div><div class="item"><b>Стоимость</b><br>${money(b.total_amount)}</div><div class="item"><b>Оплачено</b><br>${money(b.paid_amount)}</div><div class="item"><b>Остаток</b><br>${money(Math.max(0,Number(b.total_amount||0)-Number(b.paid_amount||0)))}</div><div class="item"><b>Статус</b><br>${status(b.status)}</div><div class="item"><b>Создано</b><br>${b.created_at?new Date(b.created_at).toLocaleString('ru-RU'):'—'}</div></div><div class="item" style="margin-top:10px"><b>Комментарий / пожелания</b><br><span class="muted">${esc(b.comment||b.notes||b.message||b.services||'Нет')}</span></div><div class="actions">${pending?`<button class="btn success" onclick="confirmBooking('${b.id}')">✅ Подтвердить бронь</button><button class="btn danger" onclick="cancelBooking('${b.id}')">❌ Отменить бронь</button>`:''}</div>`;document.getElementById('modal').classList.add('show')};
window.confirmBooking=async id=>{if(!confirm('Подтвердить бронирование? Стоимость проживания будет учтена как долг пользователя.'))return;let {data,error}=await sb.rpc('confirm_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);if(data&&!data.ok)return alert(data.message||'Не удалось подтвердить бронь');closeModal();await loadAll();alert('Бронь подтверждена. Список обновлён.')};
window.cancelBooking=async id=>{if(!confirm('Отменить бронирование? Долг за проживание создан не будет.'))return;let {data,error}=await sb.rpc('cancel_booking',{p_booking_id:id});if(error)return alert('Ошибка: '+error.message);if(data&&!data.ok)return alert(data.message||'Не удалось отменить бронь');closeModal();await loadAll();alert('Бронь отменена. Список обновлён.')};
window.openProfile=async uid=>{let u=users.find(x=>x.user_id===uid)||{};let [r,p]=await Promise.all([sb.from('user_financial_breakdown').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);if(r.error)return alert('Ошибка детализации: '+r.error.message);let rows=r.data||[],f=finance.find(x=>x.user_id===uid)||{};currentProfile={uid,rows};document.getElementById('modalbox').innerHTML=`<div class="listrow"><h2>👤 ${esc(u.Display_name||'Без имени')}</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div><div class="stats" style="margin-top:12px"><div class="stat"><small>Начислено</small><b>${money(f.total_charged)}</b></div><div class="stat"><small>Оплачено</small><b class="ok">${money(f.total_paid)}</b></div><div class="stat"><small>Долг</small><b class="debt">${money(f.total_debt)}</b></div><div class="stat"><small>Бронирований</small><b>${bookings.filter(x=>x.user_id===uid).length}</b></div></div><div class="alloc"><h3>За что должен</h3>${rows.length?`<table class="table"><tr><th>Начисление</th><th>Начислено</th><th>Оплачено</th><th>Остаток</th></tr>${rows.map(x=>`<tr><td>${esc(x.label||x.description||x.service_name||x.type||'Начисление')}</td><td>${money(x.amount||x.charged||0)}</td><td>${money(x.paid||x.paid_amount||0)}</td><td class="${Number(x.debt)>0?'debt':'ok'}">${money(x.debt||0)}</td></tr>`).join('')}</table>`:'<div class="muted">Начислений пока нет.</div>'}</div>${renderPaymentForm(rows,uid)}<div class="alloc"><h3>История платежей</h3>${(p.data||[]).length?(p.data||[]).map(x=>`<div class="allocrow"><span>${date(x.created_at)} · ${esc(x.payment_method||x.method||'')}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">Платежей нет.</div>'}</div>`;document.getElementById('modal').classList.add('show')};
function renderPaymentForm(rows,uid){return `<div class="alloc"><h3>💳 Оплата долга</h3><div class="muted">После ввода суммы покажем, какие начисления она погасит.</div><div class="formrow"><input id="payAmount" type="number" min="1" placeholder="Сумма"><select id="payMethod"><option>Наличные</option><option>Перевод</option><option>Карта</option><option>Бонусы</option></select><input id="payNote" placeholder="Комментарий"><button class="btn primary" onclick="profilePay('${uid}')">Оплатить</button></div><div id="allocation"></div></div>`}
function showAllocation(){if(!currentProfile)return;let amount=Number(document.getElementById('payAmount')?.value)||0,left=amount,html='';for(let x of currentProfile.rows.filter(r=>Number(r.debt)>0)){let part=Math.min(left,Number(x.debt)||0);if(part){html+=`<div class="allocrow"><span>${esc(x.label||x.description||x.service_name||x.type||'Начисление')}</span><b>${money(part)}</b></div>`;left-=part}if(left<=0)break}document.getElementById('allocation').innerHTML=amount?`<div class="muted" style="margin-top:10px">Распределение:</div>${html||'<div class="muted">Нет открытого долга</div>'}`:''}
window.profilePay=async uid=>{let amount=Number(document.getElementById('payAmount').value),method=document.getElementById('payMethod').value,note=document.getElementById('payNote').value.trim();if(!amount||amount<=0)return alert('Введите сумму');let {error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:method,p_note:note||null});if(error)return alert('Ошибка оплаты: '+error.message);await loadAll();await openProfile(uid);alert('Оплата зарегистрирована')};
document.addEventListener('input',e=>{if(e.target&&e.target.id==='payAmount')showAllocation()});
window.openOrder=async id=>{let {data,error}=await sb.from('orders').select('*').eq('id',id).single();if(error)return alert('Ошибка: '+error.message);document.getElementById('modalbox').innerHTML=`<div class="listrow"><h2>🥗 Заказ Veg Raw</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="grid2">${Object.entries(data||{}).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><br>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</div>`;document.getElementById('modal').classList.add('show')};
window.closeModal=()=>document.getElementById('modal').classList.remove('show');init();
</script></body></html>
