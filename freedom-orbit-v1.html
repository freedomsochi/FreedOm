<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — Orbit</title>
<style>
:root{--bg:#f4f7f1;--ink:#24352d;--muted:#6f7d75;--metal:#9aa59d;--glass:rgba(255,255,255,.62);--mint:#77b998;--violet:#9c92c7;--ember:#c88b59;--shadow:0 24px 80px rgba(38,61,48,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 42%,#fff 0,#eef5ee 38%,#e7eee8 70%,#dde8df 100%)}
.scene{position:relative;width:100%;height:100%;isolation:isolate;overflow:hidden}.scene:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 30% 20%,rgba(119,185,152,.16),transparent 25%),radial-gradient(circle at 75% 75%,rgba(156,146,199,.14),transparent 27%);z-index:-3}.grain{position:absolute;inset:0;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");z-index:10;pointer-events:none}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:20}.brand{font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.hint{font-size:11px;color:var(--muted);padding:9px 12px;border:1px solid rgba(36,53,45,.09);background:rgba(255,255,255,.48);backdrop-filter:blur(15px);border-radius:999px}
.orbit-stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none;user-select:none}.orbit-wrap{position:relative;width:min(92vw,620px);height:min(92vw,620px)}
.halo{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,.25) 48%,transparent 70%);filter:blur(1px)}
.tree{position:absolute;left:50%;bottom:7%;width:48%;height:82%;transform:translateX(-50%);z-index:2;pointer-events:none;filter:drop-shadow(0 24px 26px rgba(39,64,50,.13))}.tree svg{width:100%;height:100%;overflow:visible}.leaf{transform-origin:center;animation:sway 5s ease-in-out infinite}.leaf:nth-child(2){animation-delay:-1.4s}.leaf:nth-child(3){animation-delay:-2.7s}.leaf:nth-child(4){animation-delay:-.7s}.leaf:nth-child(5){animation-delay:-3.3s}@keyframes sway{50%{transform:rotate(2deg) translateX(3px)}}
.ring{position:absolute;inset:9%;border-radius:50%;z-index:4;transform:rotate(0deg);transition:transform .6s cubic-bezier(.2,.85,.2,1);cursor:grab}.ring.dragging{transition:none;cursor:grabbing}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(93,111,101,.28);box-shadow:0 0 0 10px rgba(255,255,255,.18),inset 0 0 45px rgba(255,255,255,.8),0 20px 60px rgba(54,75,63,.08)}.ring:after{content:"";position:absolute;inset:4.5%;border-radius:50%;border:1px dashed rgba(93,111,101,.17)}
.node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:12px;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(224,231,226,.5));border:1px solid rgba(255,255,255,.98);box-shadow:0 15px 35px rgba(41,62,50,.12),inset 0 1px 0 #fff;color:#53635a;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;transition:all .45s cubic-bezier(.2,.85,.2,1);transform:rotate(calc(var(--angle) * 1deg)) translateY(calc(min(34vw,218px))) rotate(calc(var(--angle) * -1deg))}.node b{font-size:10px;font-weight:700}.node.active{background:rgba(255,255,255,.97);color:var(--ink);box-shadow:0 20px 48px rgba(45,69,56,.19),0 0 0 7px rgba(119,185,152,.12);transform:rotate(calc(var(--angle) * 1deg)) translateY(calc(min(34vw,218px))) rotate(calc(var(--angle) * -1deg)) scale(1.12)}
.marker{position:absolute;left:50%;top:0;width:2px;height:34px;background:linear-gradient(#62766a,transparent);transform:translateX(-50%);z-index:7;opacity:.8}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none}.center .dot{width:22px;height:22px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a4cdb5 55%,#5e9878);box-shadow:0 0 0 8px rgba(119,185,152,.11),0 5px 18px rgba(62,100,77,.25)}.center span{display:block;margin-top:10px;font-size:9px;letter-spacing:.24em;color:#7b8981;text-transform:uppercase}
.panel{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(500px,calc(100% - 32px));padding:17px 19px;border-radius:22px;background:rgba(255,255,255,.67);border:1px solid rgba(255,255,255,.92);backdrop-filter:blur(22px);box-shadow:var(--shadow);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:20px;opacity:.9}.panel small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.panel strong{display:block;font:600 22px/1.1 Georgia,serif;margin-top:4px}.panel button{border:0;border-radius:13px;padding:11px 14px;background:var(--ink);color:white;font-weight:700;font-size:11px;cursor:pointer}.panel button:active{transform:scale(.97)}
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(26,38,32,.18);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.45s}.modal.open{opacity:1;pointer-events:auto}.window{width:min(850px,calc(100% - 28px));max-height:82vh;overflow:hidden;border-radius:30px;background:rgba(250,252,249,.94);box-shadow:0 40px 120px rgba(21,36,28,.25);transform:translateY(18px) scale(.97);transition:.5s cubic-bezier(.2,.85,.2,1)}.modal.open .window{transform:none}.media{height:330px;background-size:cover;background-position:center}.copy{padding:22px 24px 25px}.copy small{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:10px}.copy h2{font:600 38px/1 Georgia,serif;margin:7px 0}.copy p{margin:0;color:var(--muted);font-size:14px;max-width:650px}.close{position:absolute;right:24px;top:24px;border:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.8);font-size:20px;cursor:pointer}
@media(max-width:620px){.top{top:13px;left:13px;right:13px}.hint{max-width:175px;text-align:right}.orbit-wrap{width:106vw;height:106vw}.node{width:86px;height:86px;margin:-43px;font-size:9px}.node.active{transform:rotate(calc(var(--angle) * 1deg)) translateY(38vw) rotate(calc(var(--angle) * -1deg)) scale(1.1)}.tree{width:57%;height:78%;bottom:8%}.panel{bottom:14px}.panel button{display:none}.media{height:230px}.copy h2{font-size:31px}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="grain"></div><div class="top"><div class="brand">FreeDom</div><div class="hint">Проведите пальцем по кругу</div></div>
<div class="orbit-stage" id="stage"><div class="orbit-wrap"><div class="halo"></div>
<div class="tree" aria-hidden="true"><svg viewBox="0 0 220 430" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c5948"/><stop offset=".5" stop-color="#9a8065"/><stop offset="1" stop-color="#574b40"/></linearGradient><radialGradient id="canopy"><stop stop-color="#9fc9a9"/><stop offset="1" stop-color="#557d62"/></radialGradient></defs><path d="M103 420C94 352 106 286 97 230C89 175 64 149 44 124M99 238C119 196 145 171 177 145M94 198C71 174 54 158 31 149M106 302C130 275 157 259 188 248" fill="none" stroke="url(#trunk)" stroke-width="18" stroke-linecap="round"/><g class="leaf"><ellipse cx="43" cy="111" rx="48" ry="39" fill="url(#canopy)" opacity=".93"/></g><g class="leaf"><ellipse cx="171" cy="126" rx="49" ry="42" fill="url(#canopy)" opacity=".95"/></g><g class="leaf"><ellipse cx="77" cy="177" rx="43" ry="34" fill="#6f9d7a" opacity=".94"/></g><g class="leaf"><ellipse cx="177" cy="239" rx="40" ry="31" fill="#86b18f" opacity=".9"/></g><g class="leaf"><ellipse cx="106" cy="71" rx="55" ry="43" fill="#5f896d" opacity=".92"/></g><g fill="#d9e8d7" opacity=".7"><circle cx="24" cy="93" r="3"/><circle cx="151" cy="101" r="2.5"/><circle cx="93" cy="55" r="3"/><circle cx="184" cy="225" r="2.5"/></g></svg></div>
<div class="ring" id="ring"></div><div class="marker"></div><div class="center"><div class="dot"></div><span>живая система</span></div></div></div>
<div class="panel"><div><small>Выбрано</small><strong id="selected">Пространство</strong></div><button id="open">Открыть</button></div>
<div class="modal" id="modal"><div class="window"><button class="close" id="close">×</button><div class="media" id="media"></div><div class="copy"><small id="mmeta"></small><h2 id="mtitle"></h2><p id="mdesc"></p></div></div></div>
</div>
<script>
const items=[
 {name:'Пространство',meta:'FreeDom Space',desc:'Места, в которых дом раскрывается: практики, разговоры, музыка, библиотека, сад и жизнь вокруг бассейна.',image:'images/gong-meditation.jpg'},
 {name:'События',meta:'Жизнь FreeDom',desc:'Реальные события дома: творческие вечера, медитации, чайные церемонии, встречи и музыкальные вечера.',image:'images/tea-ceremony.jpg'},
 {name:'Комнаты',meta:'Проживание',desc:'Карта дома и реальные данные о доступности. Выберите комнату и посмотрите её подробности.',image:'images/room-attic.jpg'},
 {name:'Баня',meta:'Тепло → вода → звёзды',desc:'Отдельный мир у бассейна. Здесь позже появится галерея из нескольких состояний: баня и место под звёздным небом.',image:'images/sauna.jpg'},
 {name:'Кухня',meta:'Позже',desc:'Этот раздел пока оставляем как часть общей системы. Концепцию кухни разработаем отдельно.',image:'images/chocolate1.jpg'}
];
const ring=document.getElementById('ring'), selected=document.getElementById('selected'), modal=document.getElementById('modal');let angle=0,startAngle=0,startPointer=0,drag=false;const step=72;
items.forEach((it,i)=>{const n=document.createElement('button');n.className='node';n.dataset.i=i;n.style.setProperty('--angle',i*step);n.innerHTML='<b>'+it.name+'</b>';n.addEventListener('click',()=>select(i));ring.appendChild(n)});
function normalize(a){return ((a%360)+360)%360}function activeIndex(){let a=normalize(-angle);return Math.round(a/step)%items.length}
function render(){ring.style.transform=`rotate(${angle}deg)`;const i=activeIndex();selected.textContent=items[i].name;document.querySelectorAll('.node').forEach((n,k)=>n.classList.toggle('active',k===i))}
function select(i){const target=-i*step;let delta=normalize(target-angle);if(delta>180)delta-=360;angle+=delta;ring.classList.remove('dragging');render()}
function point(e){return e.touches?e.touches[0]:e}function start(e){drag=true;ring.classList.add('dragging');startPointer=point(e).clientX;startAngle=angle;stage.setPointerCapture?.(e.pointerId);e.preventDefault()}function move(e){if(!drag)return;const p=point(e).clientX;angle=startAngle+(p-startPointer)*.55;render()}function end(){if(!drag)return;drag=false;ring.classList.remove('dragging');select(activeIndex())}
ring.addEventListener('pointerdown',start);window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);ring.addEventListener('touchstart',start,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end);
function open(){const i=activeIndex(),it=items[i];document.getElementById('mmeta').textContent=it.meta;document.getElementById('mtitle').textContent=it.name;document.getElementById('mdesc').textContent=it.desc;document.getElementById('media').style.backgroundImage=`url('${it.image}')`;modal.classList.add('open')}
document.getElementById('open').addEventListener('click',open);document.getElementById('close').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});render();
</script>
</body>
</html>
