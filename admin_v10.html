<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v10</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0b0d17;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#121526;border:1px solid #252941;border-radius:16px;padding:16px;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #34384f;background:#181c2d;color:#ddd;border-radius:10px;padding:9px 13px;cursor:pointer}.btn.primary{background:#d4af37;color:#111}.muted{color:#8f95ab}.hidden{display:none}.user{padding:12px;border-bottom:1px solid #252941;cursor:pointer}.user:hover{background:#181c2d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#181c2d;padding:13px;border-radius:12px}.stat b{display:block;font-size:1.3rem;margin-top:5px}.event{background:#0e1120;border:1px solid #252941;border-radius:12px;padding:12px;margin-top:10px}.green{color:#32d583}.red{color:#ff6b6b}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{background:#121526;border:1px solid #34384f;border-radius:18px;padding:18px;width:min(760px,100%);max-height:90vh;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>FreeDom — CRM v10</h1><div class="muted">Безопасная версия с отдельной интеграцией событий.</div><div class="tabs"><button class="btn primary" onclick="show('users')">👥 Пользователи</button><a class="btn" href="admin_v9_events.html">🎫 События</a><a class="btn" href="admin.html">💰 Старая админка</a></div></div><section id="users"><div class="card"><h2>👥 Пользователи</h2><input id="search" placeholder="Поиск по имени или телефону" style="width:100%;box-sizing:border-box;padding:11px;background:#181c2d;border:1px solid #34384f;border-radius:10px;color:#fff" oninput="loadUsers()"><div id="usersList" class="muted" style="margin-top:10px">Загрузка…</div></div></section></div><div id="profile" class="modal"><div class="modalbox"><button class="btn" onclick="closeProfile()">✕ Закрыть</button><div id="profileBody" style="margin-top:12px"></div></div></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');window.sb=sb;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';async function loadUsers(){const q=$('search').value.trim();let query=sb.from('users').select('id,name,phone,email').order('name');if(q)query=query.or(`name.ilike.%${q}%,phone.ilike.%${q}%`);const {data,error}=await query.limit(100);if(error){$('usersList').textContent=error.message;return}$('usersList').innerHTML=(data||[]).map(u=>`<div class="user" onclick="openProfile('${u.id}')"><b>${esc(u.name||'Без имени')}</b><div class="muted">📞 ${esc(u.phone||'—')}${u.email?' · ✉️ '+esc(u.email):''}</div></div>`).join('')||'<div class="muted">Ничего не найдено.</div>'}async function openProfile(id){$('profile').classList.add('show');$('profileBody').innerHTML='<div class="muted">Загрузка профиля…</div>';const [{data:u,error:ue},{data:rows,error:re}]=await Promise.all([sb.from('users').select('*').eq('id',id).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,comment,created_at,events(name,event_date,start_time,end_time,location)').eq('user_id',id).order('created_at',{ascending:false})]);if(ue){$('profileBody').textContent=ue.message;return}if(re){$('profileBody').textContent=re.message;return}const rs=rows||[], total=rs.reduce((s,x)=>s+(Number(x.amount)||0),0),paid=rs.reduce((s,x)=>s+(Number(x.paid_amount)||0),0),debt=Math.max(0,total-paid);$('profileBody').innerHTML=`<h2>👤 ${esc(u.name||'Без имени')}</h2><div class="muted">📞 ${esc(u.phone||'—')} ${u.email?'· ✉️ '+esc(u.email):''}</div><div class="grid" style="margin-top:14px"><div class="stat">События<b>${rs.length}</b></div><div class="stat">Начислено<b>${money(total)}</b></div><div class="stat">Оплачено<b>${money(paid)}</b></div><div class="stat">Долг<b class="${debt?'red':'green'}">${money(debt)}</b></div></div><h3 style="margin-top:20px">🎫 События</h3>${rs.length?rs.map(x=>{const e=x.events||{},a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p);return `<div class="event"><div><b>${esc(e.name||'Событие')}</b> · ${esc(x.status||'new')}</div><div class="muted">📅 ${e.event_date?new Date(e.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}${e.start_time?' · '+esc(e.start_time):''}${e.location?' · 📍 '+esc(e.location):''}</div><div style="margin-top:7px">👥 ${Number(x.participants)||1} · ${a?'💰 '+money(a):'💰 Бесплатно'}</div><div style="margin-top:5px">💳 ${a?(p>=a?'Оплачено':p?'Частично оплачено · оплачено '+money(p):'Не оплачено'):'Бесплатно'}${d?' · <span class="red">долг '+money(d)+'</span>':''}</div>${x.comment?'<div class="muted">💬 '+esc(x.comment)+'</div>':''}<div style="margin-top:9px"><a class="btn" href="admin_v9_user_events.html" target="_blank">Открыть события гостя</a></div></div>`}).join(''):'<div class="muted">🎫 Регистраций на события нет.</div>'}`;}function closeProfile(){$('profile').classList.remove('show')}loadUsers();</script></body></html>
