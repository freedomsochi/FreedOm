<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b0d17;--card:#121526;--card2:#181c2d;--line:#292e45;--muted:#8f95ab;--gold:#d4af37;--green:#32d583;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b2d 0,#0b0d17 45%);color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:800}.sub,.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{display:inline-block;text-decoration:none;border:1px solid #3a4059;background:var(--card2);color:#ddd;border-radius:11px;padding:10px 14px;cursor:pointer}.btn:hover{border-color:#59617d}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}.search{width:100%;padding:13px 14px;background:#0f1322;border:1px solid #353b55;border-radius:12px;color:#fff;font-size:15px;outline:none}.search:focus{border-color:var(--gold)}.card{background:rgba(18,21,38,.96);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 8px 30px #0003}.user{padding:14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:12px}.user:last-child{border-bottom:0}.user:hover{background:#191d2f}.userName{font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card2);padding:14px;border-radius:12px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.event{background:#0e1120;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px}.eventTop{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;padding:5px 8px;border-radius:8px;background:#252a3e}.badge.green{background:#17382c}.badge.red{background:#3b2026}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{background:#121526;border:1px solid #343a55;border-radius:19px;padding:19px;width:min(780px,100%);max-height:90vh;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.user{display:block}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><div class="brand">FreeDom CRM</div><div class="sub">Единая точка управления гостями и событиями</div></div></div><div class="tabs"><button class="btn primary" onclick="showUsers()">👥 Пользователи</button><a class="btn" href="admin_v9_events.html">🎫 События</a><a class="btn" href="admin.html">💰 Основная админка</a></div></div><section id="users"><div class="card"><h2 style="margin-top:0">👥 Пользователи</h2><input id="search" class="search" placeholder="Поиск по имени, телефону или email" oninput="loadUsers()"><div id="usersList" class="muted" style="margin-top:10px">Загрузка…</div></div></section></div><div id="profile" class="modal"><div class="modalbox"><button class="btn" onclick="closeProfile()">✕ Закрыть</button><div id="profileBody" style="margin-top:14px"></div></div></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const status=s=>({new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена'}[s]||s||'Новая');async function loadUsers(){const q=$('search').value.trim();let query=sb.from('users').select('user_id,"Email","Display_name","Phone",balance,total_debt').order('Display_name',{ascending:true});if(q)query=query.or('"Display_name".ilike.%'+q+'%,"Phone".ilike.%'+q+'%,"Email".ilike.%'+q+'%');const {data,error}=await query.limit(100);if(error){$('usersList').innerHTML='<div class="red">Ошибка: '+esc(error.message)+'</div>';return}const rows=data||[];$('usersList').innerHTML=rows.map(u=>`<div class="user" onclick="openProfile('${u.user_id}')"><div><div class="userName">${esc(u.Display_name||'Без имени')}</div><div class="muted">📞 ${esc(u.Phone||'—')} ${u.Email?'· ✉️ '+esc(u.Email):''}</div></div><div class="muted">${Number(u.total_debt)>0?'🔴 '+money(u.total_debt):'✓'}</div></div>`).join('')||'<div class="muted">Ничего не найдено.</div>'}async function openProfile(id){$('profile').classList.add('show');$('profileBody').innerHTML='<div class="muted">Загрузка профиля…</div>';const [{data:u,error:ue},{data:rows,error:re}]=await Promise.all([sb.from('users').select('user_id,"Email","Display_name","Phone","City",balance,total_debt').eq('user_id',id).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,comment,created_at,events(name,event_date,start_time,end_time,location)').eq('user_id',id).order('created_at',{ascending:false})]);if(ue){$('profileBody').innerHTML='<div class="red">Ошибка профиля: '+esc(ue.message)+'</div>';return}if(re){$('profileBody').innerHTML='<div class="red">Ошибка событий: '+esc(re.message)+'</div>';return}const rs=rows||[],eventTotal=rs.reduce((s,x)=>s+(Number(x.amount)||0),0),eventPaid=rs.reduce((s,x)=>s+(Number(x.paid_amount)||0),0),eventDebt=Math.max(0,eventTotal-eventPaid),realDebt=Number(u.total_debt)||0;$('profileBody').innerHTML=`<div class="top"><div><h2 style="margin:8px 0">👤 ${esc(u.Display_name||'Без имени')}</h2><div class="muted">📞 ${esc(u.Phone||'—')} ${u.Email?'· ✉️ '+esc(u.Email):''}${u.City?' · 📍 '+esc(u.City):''}</div></div><a class="btn" href="admin_v9_user_events.html" target="_blank">🎫 Все события</a></div><div class="grid" style="margin-top:16px"><div class="stat"><span>Общий долг</span><b class="${realDebt?'red':'green'}">${money(realDebt)}</b></div><div class="stat"><span>Баланс</span><b>${money(u.balance)}</b></div><div class="stat"><span>Событий</span><b>${rs.length}</b></div><div class="stat"><span>Долг по событиям</span><b class="${eventDebt?'red':'green'}">${money(eventDebt)}</b></div></div><h3 style="margin:22px 0 8px">🎫 События</h3>${rs.length?rs.map(x=>{const e=x.events||{},a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p),st=status(x.status);return `<div class="event"><div class="eventTop"><b>${esc(e.name||'Событие')}</b><span class="badge ${x.status==='confirmed'?'green':x.status==='cancelled'?'red':''}">${esc(st)}</span></div><div class="muted" style="margin-top:6px">📅 ${e.event_date?new Date(e.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}${e.start_time?' · '+esc(e.start_time):''}${e.location?' · 📍 '+esc(e.location):''}</div><div style="margin-top:9px">👥 ${Number(x.participants)||1} · ${a?'💰 '+money(a):'💰 Бесплатно'}</div><div style="margin-top:5px">${a?(p>=a?'💳 Оплачено':p?'💳 Частично · оплачено '+money(p):'💳 Не оплачено'):'💳 Бесплатно'}${d?' · <span class="red">долг '+money(d)+'</span>':''}</div>${x.comment?'<div class="muted" style="margin-top:6px">💬 '+esc(x.comment)+'</div>':''}<div style="margin-top:10px"><a class="btn" href="admin_v9_events.html" target="_blank">Открыть панель события</a></div></div>`}).join(''):'<div class="muted">🎫 Регистраций на события нет.</div>'}`;}function closeProfile(){$('profile').classList.remove('show')}function showUsers(){$('users').scrollIntoView({behavior:'smooth'})}loadUsers();</script></body></html>
