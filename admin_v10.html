<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a class="active" href="#users">👥 <span class="label">Гости</span></a><a href="admin_v9_events.html">🎫 <span class="label">События</span></a><a href="admin.html">💰 <span class="label">Финансы</span></a><a href="admin_v9_user_events.html">📋 <span class="label">Регистрации</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Гости</h1><div class="fd-sub">FreeDom CRM · единая точка управления</div></div><a class="fd-btn primary" href="admin_v9_events.html">＋ Новое событие</a></header><section class="fd-grid"><div class="fd-card"><div class="fd-stat-label">Гостей</div><div id="sUsers" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Активных событий</div><div id="sEvents" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Регистраций</div><div id="sRegs" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div id="sDebt" class="fd-stat-value red">—</div></div></section><section class="fd-section fd-card"><h2 style="margin:0 0 12px">👥 Поиск гостя</h2><input id="search" class="fd-search" placeholder="Имя, телефон или email" oninput="loadUsers()"><div id="usersList" class="fd-list"><div class="fd-muted">Загрузка…</div></div></section></div></main></div><div id="profile" class="fd-modal"><div class="fd-modal-box"><div class="fd-actions"><button class="fd-btn" onclick="closeProfile()">✕ Закрыть</button><a class="fd-btn" href="admin_v9_events.html">🎫 Панель событий</a></div><div id="profileBody" style="margin-top:16px"></div></div></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',status=s=>({new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена'}[s]||s||'Новая');async function stats(){const [u,e,r,d]=await Promise.all([sb.from('users').select('*',{count:'exact',head:true}),sb.from('events').select('*',{count:'exact',head:true}).eq('is_active',true),sb.from('event_registrations').select('*',{count:'exact',head:true}),sb.from('users').select('total_debt')]);$('sUsers').textContent=u.count??'—';$('sEvents').textContent=e.count??'—';$('sRegs').textContent=r.count??'—';$('sDebt').textContent=money((d.data||[]).reduce((s,x)=>s+(Number(x.total_debt)||0),0))}async function loadUsers(){const q=$('search').value.trim();let query=sb.from('users').select('user_id,"Email","Display_name","Phone",balance,total_debt').order('Display_name',{ascending:true});if(q)query=query.or('"Display_name".ilike.%'+q+'%,"Phone".ilike.%'+q+'%,"Email".ilike.%'+q+'%');const {data,error}=await query.limit(100);if(error){$('usersList').innerHTML='<div class="fd-badge red">Ошибка: '+esc(error.message)+'</div>';return}$('usersList').innerHTML=(data||[]).map(u=>`<div class="fd-row" onclick="openProfile('${u.user_id}')"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="fd-muted">📞 ${esc(u.Phone||'—')}${u.Email?' · ✉️ '+esc(u.Email):''}</div></div><div>${Number(u.total_debt)>0?'<span class="fd-badge red">🔴 '+money(u.total_debt)+'</span>':'<span class="fd-badge green">✓ Всё оплачено</span>'}</div></div>`).join('')||'<div class="fd-muted">Ничего не найдено.</div>'}async function openProfile(id){$('profile').classList.add('show');$('profileBody').innerHTML='<div class="fd-muted">Загрузка…</div>';const [{data:u,error:ue},{data:rows,error:re}]=await Promise.all([sb.from('users').select('user_id,"Email","Display_name","Phone","City",balance,total_debt').eq('user_id',id).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,comment,created_at,events(name,event_date,start_time,end_time,location)').eq('user_id',id).order('created_at',{ascending:false})]);if(ue)return $('profileBody').innerHTML='<span class="fd-badge red">'+esc(ue.message)+'</span>';if(re)return $('profileBody').innerHTML='<span class="fd-badge red">'+esc(re.message)+'</span>';const rs=rows||[],et=rs.reduce((s,x)=>s+(Number(x.amount)||0),0),ep=rs.reduce((s,x)=>s+(Number(x.paid_amount)||0),0),ed=Math.max(0,et-ep),debt=Number(u.total_debt)||0;$('profileBody').innerHTML=`<div class="fd-topbar"><div><h2 style="margin:0">👤 ${esc(u.Display_name||'Без имени')}</h2><div class="fd-muted">📞 ${esc(u.Phone||'—')}${u.Email?' · ✉️ '+esc(u.Email):''}${u.City?' · 📍 '+esc(u.City):''}</div></div></div><div class="fd-grid"><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div class="fd-stat-value ${debt?'red':'green'}">${money(debt)}</div></div><div class="fd-card"><div class="fd-stat-label">Баланс</div><div class="fd-stat-value">${money(u.balance)}</div></div><div class="fd-card"><div class="fd-stat-label">Событий</div><div class="fd-stat-value">${rs.length}</div></div><div class="fd-card"><div class="fd-stat-label">Долг по событиям</div><div class="fd-stat-value ${ed?'red':'green'}">${money(ed)}</div></div></div><div class="fd-section"><div class="fd-topbar"><h3 style="margin:0">🎫 События</h3><a class="fd-btn" href="admin_v9_events.html">Все события</a></div>${rs.length?rs.map(x=>{const e=x.events||{},a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p);return `<div class="fd-event"><div class="fd-topbar" style="margin-bottom:8px"><b>${esc(e.name||'Событие')}</b><span class="fd-badge ${x.status==='confirmed'?'green':x.status==='cancelled'?'red':''}">${esc(status(x.status))}</span></div><div class="fd-muted">📅 ${e.event_date?new Date(e.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}${e.start_time?' · '+esc(e.start_time):''}${e.location?' · 📍 '+esc(e.location):''}</div><div style="margin-top:8px">👥 ${Number(x.participants)||1} · ${a?'💰 '+money(a):'💰 Бесплатно'} · ${a?(p>=a?'💳 Оплачено':p?'💳 Частично · '+money(p):'💳 Не оплачено'):'💳 Бесплатно'}${d?' · <span class="red">долг '+money(d)+'</span>':''}</div>${x.comment?'<div class="fd-muted" style="margin-top:6px">💬 '+esc(x.comment)+'</div>':''}</div>`}).join(''):'<div class="fd-card fd-muted">🎫 Регистраций на события нет.</div>'}</div>`}function closeProfile(){$('profile').classList.remove('show')}stats();loadUsers();</script></body></html>
