<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Гости</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.guest-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.guest-toolbar .fd-search{flex:1;min-width:220px}.guest-count{font-size:12px;color:var(--fd-muted);white-space:nowrap}.guest-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--fd-line);text-decoration:none}.guest-main{min-width:0}.guest-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guest-meta{color:var(--fd-muted);font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guest-debt{text-align:right;min-width:92px}.guest-arrow{color:var(--fd-muted);font-size:18px}.guest-filter{display:inline-flex;align-items:center;gap:7px}.guest-filter.active{border-color:var(--fd-gold);color:#fff;background:var(--fd-gold-soft)}.guest-skeleton{height:55px;border-bottom:1px solid var(--fd-line)}.guest-mobile-kicker{display:none}.guest-quick{display:none}@media(max-width:600px){.guest-row{gap:9px;padding:13px 2px}.guest-debt{min-width:78px}.guest-toolbar{display:grid;grid-template-columns:1fr auto;gap:7px}.guest-toolbar .fd-search{min-width:0;grid-column:1/-1}.guest-toolbar .fd-btn{white-space:nowrap}.guest-count{grid-column:1/-1}.fd-grid{grid-template-columns:1fr 1fr!important}.guest-mobile-kicker{display:block;color:var(--fd-muted);font-size:11px;margin-top:8px}.guest-quick{display:flex;gap:7px;overflow:auto;margin:10px 0}.guest-quick button{white-space:nowrap;border:1px solid var(--fd-line);background:#fff;border-radius:999px;padding:8px 10px;font:inherit;font-size:12px}.guest-quick button.active{background:var(--fd-text);color:#fff}.fd-sidebar{display:none}.fd-main{margin:0!important}.fd-container{padding:12px!important}.fd-topbar{padding:4px 0 8px}.fd-title{font-size:24px!important}.fd-sub{font-size:12px}.fd-grid{gap:7px;margin-top:8px}.fd-grid .fd-card{padding:11px;border-radius:14px}.fd-grid .fd-stat-label{font-size:11px}.fd-grid .fd-stat-value{font-size:18px}.guest-name{font-size:14px}.guest-meta{font-size:11px;margin-top:3px}.guest-debt{font-size:13px}.guest-arrow{font-size:17px}.fd-section{margin-top:9px!important;padding:12px!important;border-radius:16px!important}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Гости</h1><div class="fd-sub">Быстрый поиск и доступ к профилю</div><div class="guest-mobile-kicker">Административные данные загружаются через защищённые RPC.</div></div><a class="fd-btn primary" href="admin_v10_events.html">🎫 События</a></header><div class="guest-quick"><button class="active" data-q="">Все</button><button data-q="debt">🔴 С долгом</button></div><section class="fd-grid"><div class="fd-card"><div class="fd-stat-label">Гостей</div><div id="sUsers" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Активных событий</div><div id="sEvents" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Регистраций</div><div id="sRegs" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div id="sDebt" class="fd-stat-value red">—</div></div></section><section class="fd-section fd-card"><div class="guest-toolbar"><input id="search" class="fd-search" placeholder="Имя, телефон или email" autocomplete="off"><button id="debtFilter" class="fd-btn guest-filter">🔴 Только с долгом</button><span id="guestCount" class="guest-count"></span></div><div id="usersList" class="fd-list"><div class="guest-skeleton"></div><div class="guest-skeleton"></div><div class="guest-skeleton"></div></div></section></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let allUsers=[],summaryById=new Map(),onlyDebt=false,timer;async function stats(){const{data,error}=await sb.rpc('admin_get_guest_dashboard_stats');if(error){$('sUsers').textContent='—';$('sEvents').textContent='—';$('sRegs').textContent='—';$('sDebt').textContent='—';return}const x=data||{};$('sUsers').textContent=x.guests??'—';$('sEvents').textContent=x.active_events??'—';$('sRegs').textContent=x.registrations??'—';$('sDebt').textContent=money(x.debt)}async function loadDebts(){const{data,error}=await sb.rpc('admin_get_user_debts');if(!error)(data||[]).forEach(x=>summaryById.set(x.user_id,x))}async function loadUsers(){clearTimeout(timer);timer=setTimeout(loadUsersNow,120)}async function loadUsersNow(){const{data,error}=await sb.rpc('admin_get_users');if(error){$('usersList').innerHTML='<div class="fd-badge red">Ошибка: '+esc(error.message)+'</div>';return}allUsers=data||[];renderUsers()}function renderUsers(){const q=$('search').value.trim().toLowerCase();const data=allUsers.filter(u=>{const debt=Number(summaryById.get(u.user_id)?.total_debt)||0;const text=[u.Display_name,u.Phone,u.Email,u.City].join(' ').toLowerCase();return(!q||text.includes(q))&&(!onlyDebt||debt>0)});$('guestCount').textContent=data.length+' гостей';$('usersList').innerHTML=data.map(u=>{const debt=Number(summaryById.get(u.user_id)?.total_debt)||0;return `<a class="guest-row" href="admin_v11_guest_profile.html?id=${encodeURIComponent(u.user_id)}"><div class="guest-main"><div class="guest-name">${esc(u.Display_name||'Без имени')}</div><div class="guest-meta">📞 ${esc(u.Phone||'—')}${u.Email?' · ✉️ '+esc(u.Email):''}</div></div><div class="guest-debt">${debt>0?'<b class="debt">'+money(debt)+'</b>':'<span class="fd-muted">0 ₽</span>'}<div class="guest-arrow">›</div></div></a>`}).join('')||'<div class="fd-empty">Ничего не найдено.</div>'}async function init(){await Promise.all([stats(),loadDebts(),loadUsersNow()])}$('search').addEventListener('input',loadUsers);$('debtFilter').addEventListener('click',()=>{onlyDebt=!onlyDebt;$('debtFilter').classList.toggle('active',onlyDebt);document.querySelectorAll('.guest-quick button').forEach(x=>x.classList.toggle('active',(x.dataset.q==='debt'&&onlyDebt)||(x.dataset.q===''&&!onlyDebt)));renderUsers()});document.querySelectorAll('.guest-quick button').forEach(x=>x.onclick=()=>{onlyDebt=x.dataset.q==='debt';$('debtFilter').classList.toggle('active',onlyDebt);document.querySelectorAll('.guest-quick button').forEach(y=>y.classList.toggle('active',y===x));renderUsers()});init();</script></body></html>
