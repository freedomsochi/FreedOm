<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Гости</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.guest-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.guest-toolbar .fd-search{flex:1;min-width:220px}.guest-count{font-size:12px;color:var(--fd-muted);white-space:nowrap}.guest-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--fd-line);text-decoration:none}.guest-row:hover{background:#151a28;border-radius:11px;padding-left:10px;padding-right:10px}.guest-main{min-width:0}.guest-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guest-meta{color:var(--fd-muted);font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guest-debt{text-align:right;min-width:92px}.guest-arrow{color:var(--fd-muted);font-size:18px}.guest-filter{display:inline-flex;align-items:center;gap:7px}.guest-filter.active{border-color:var(--fd-gold);color:#fff;background:var(--fd-gold-soft)}.guest-skeleton{height:55px;border-bottom:1px solid var(--fd-line)}@media(max-width:600px){.guest-row{grid-template-columns:minmax(0,1fr) auto;gap:9px}.guest-row .guest-status{display:none}.guest-arrow{display:block}.guest-debt{min-width:80px}.guest-toolbar{align-items:stretch}.guest-toolbar .fd-search{min-width:0}.guest-toolbar .fd-btn{white-space:nowrap}.fd-grid{grid-template-columns:1fr 1fr!important}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Гости</h1><div class="fd-sub">Быстрый поиск и доступ к профилю</div></div><a class="fd-btn primary" href="admin_v10_events.html">＋ Новое событие</a></header><section class="fd-grid"><div class="fd-card"><div class="fd-stat-label">Гостей</div><div id="sUsers" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Активных событий</div><div id="sEvents" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Регистраций</div><div id="sRegs" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Общий долг</div><div id="sDebt" class="fd-stat-value red">—</div></div></section><section class="fd-section fd-card"><div class="guest-toolbar"><input id="search" class="fd-search" placeholder="Имя, телефон или email" autocomplete="off"><button id="debtFilter" class="fd-btn guest-filter">🔴 Только с долгом</button><span id="guestCount" class="guest-count"></span></div><div id="usersList" class="fd-list"><div class="guest-skeleton"></div><div class="guest-skeleton"></div><div class="guest-skeleton"></div></div></section></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let allUsers=[],summaryById=new Map(),onlyDebt=false,timer;async function stats(){const [u,e,r,s]=await Promise.all([sb.from('users').select('*',{count:'exact',head:true}),sb.from('events').select('*',{count:'exact',head:true}).eq('is_active',true),sb.from('event_registrations').select('*',{count:'exact',head:true}),sb.from('user_financial_summary').select('user_id,total_debt')]);$('sUsers').textContent=u.count??'—';$('sEvents').textContent=e.count??'—';$('sRegs').textContent=r.count??'—';$('sDebt').textContent=money((s.data||[]).reduce((n,x)=>n+(Number(x.total_debt)||0),0));(s.data||[]).forEach(x=>summaryById.set(x.user_id,x))}async function loadUsers(){clearTimeout(timer);timer=setTimeout(loadUsersNow,120)}async function loadUsersNow(){const q=$('search').value.trim();let query=sb.from('users').select('user_id,"Email","Display_name","Phone","City"').order('Display_name',{ascending:true}).limit(100);if(q)query=query.or('"Display_name".ilike.%'+q+'%,"Phone".ilike.%'+q+'%,"Email".ilike.%'+q+'%');const {data,error}=await query;if(error){$('usersList').innerHTML='<div class="fd-badge red">Ошибка: '+esc(error.message)+'</div>';return}allUsers=data||[];renderUsers()}function renderUsers(){const data=allUsers.filter(u=>!onlyDebt||Number(summaryById.get(u.user_id)?.total_debt)>0);$('guestCount').textContent=data.length+' гостей';$('usersList').innerHTML=data.map(u=>{const debt=Number(summaryById.get(u.user_id)?.total_debt)||0;return `<a class="guest-row" href="admin_v11_guest_profile.html?id=${encodeURIComponent(u.user_id)}"><div class="guest-main"><div class="guest-name">${esc(u.Display_name||'Без имени')}</div><div class="guest-meta">📞 ${esc(u.Phone||'—')}${u.Email?' · ✉️ '+esc(u.Email):''}</div></div><div class="guest-status">${debt>0?'<span class="fd-badge red">Есть долг</span>':'<span class="fd-badge green">Оплачено</span>'}</div><div class="guest-debt">${debt>0?'<b class="debt">'+money(debt)+'</b>':'<span class="fd-muted">0 ₽</span>'}<div class="guest-arrow">›</div></div></a>`}).join('')||'<div class="fd-empty">Ничего не найдено.</div>'}$('search').addEventListener('input',loadUsers);$('debtFilter').addEventListener('click',()=>{onlyDebt=!onlyDebt;$('debtFilter').classList.toggle('active',onlyDebt);renderUsers()});stats();loadUsersNow();</script></body></html>
