<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — технический прототип бронирования</title><style>body{margin:0;background:#f4f7f2;color:#1d2822;font:16px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid rgba(37,63,50,.1);border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 15px 40px rgba(39,64,50,.08)}h1{font-size:clamp(36px,7vw,64px);line-height:1;margin:0 0 12px}label{display:block;color:#708078;font-size:13px;margin-bottom:6px}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #d8e0da}input{width:100%;box-sizing:border-box}button{background:#1d2822;color:#fff;border-color:#1d2822;cursor:pointer}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.room{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #edf0ed}.room:last-child{border-bottom:0}.muted{color:#708078}.status{margin-top:12px}.ok{color:#3e9071}.bad{color:#b04c4c}@media(max-width:600px){.dates{grid-template-columns:1fr}.room{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="card"><div class="muted">FreeDom · технический этап</div><h1>Проверка доступности</h1><p class="muted">Это временный технический экран. Дизайн интерфейса бронирования будем делать вместе.</p><div class="dates"><div><label for="in">Заезд</label><input id="in" type="date"></div><div><label for="out">Выезд</label><input id="out" type="date"></div></div><p><button id="find">Найти свободные места</button></p><div id="status" class="status"></div></div><div class="card"><div id="rooms"><div class="muted">Выберите даты.</div></div></div></main><script src="booking-flow.js"></script><script>const $=id=>document.getElementById(id);$('find').addEventListener('click',async()=>{const status=$('status'),rooms=$('rooms');status.textContent='Проверяем…';status.className='status';rooms.innerHTML='';try{const data=await FREEDOM_BOOKING.availability($('in').value,$('out').value);const list=Array.isArray(data.rooms)?data.rooms:[];if(!list.length){rooms.innerHTML='<div class="muted">Комнаты не найдены.</div>';return}rooms.innerHTML=list.map(r=>`<div class="room"><div><strong>${r.name}</strong><div class="muted">Вместимость: ${r.capacity} · ${r.booking_mode==='places'?'Свободно мест: '+r.free_places:(r.available?'Свободна':'Занята')}</div></div><span class="${r.available?'ok':'bad'}">${r.available?'Доступна':'Занята'}</span></div>`).join('');status.textContent='Данные получены из Supabase.';status.className='status ok'}catch(e){status.textContent=e.message||'Ошибка';status.className='status bad'}});</script></body></html>
