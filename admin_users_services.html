<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пользователи и услуги — FreeDom</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d17;color:#eee;font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.head,.card{background:#151827;border:1px solid #292d42;border-radius:18px;padding:18px;margin-bottom:14px}.head{background:linear-gradient(145deg,#241b42,#121522)}h1,h2{margin:0 0 12px;color:#d4af37;font-weight:500}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tab,.btn{border:1px solid #353a52;background:#202437;color:#ddd;border-radius:12px;padding:10px 14px;cursor:pointer}.tab.active,.btn.primary{background:#d4af37;color:#111;border-color:#d4af37}.btn.danger{border-color:#7b3030;color:#ff9a9a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.item{background:#101321;border:1px solid #282c40;border-radius:14px;padding:14px}.muted{color:#8f95ab;font-size:13px}.price{color:#d4af37;font-size:18px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.search,input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #34394f;background:#0e111c;color:#eee;margin:5px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbox{max-width:820px;width:100%;max-height:92vh;overflow:auto;background:#151827;border:1px solid #34394f;border-radius:18px;padding:20px}.service{border:1px solid #30354b;border-radius:12px;padding:10px;margin:7px 0;cursor:pointer}.service.selected{border-color:#d4af37;background:#28220f}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202437;padding:12px 18px;border-radius:12px;display:none;z-index:20}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#101321;border:1px solid #282c40;border-radius:14px;padding:13px}.stat b{display:block;font-size:20px;margin-top:5px}.red{color:#ff6b6b}.yellow{color:#f1c75b}.green{color:#32d583}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px}.status.redbg{background:#3a2024;color:#ff8585}.status.yellowbg{background:#3b321b;color:#f1c75b}.status.greenbg{background:#193629;color:#58e09a}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.line{padding:12px 0;border-bottom:1px solid #292d42}.line:last-child{border-bottom:0}.small{font-size:12px;color:#8f95ab}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.modalbox{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><a href="admin.html" style="color:#b8a9d4">← Назад в админку</a><h1>Пользователи и услуги</h1><div class="muted">Профиль гостя теперь показывает всю финансовую картину: начислено, оплачено, долг и историю.</div></div>
 <div class="tabs"><button class="tab active" data-tab="users">Пользователи</button><button class="tab" data-tab="services">Услуги</button></div>
 <section id="users"><div class="card"><div class="row"><h2>Гости</h2><button class="btn primary" id="addGuest">＋ Добавить пользователя</button></div><input class="search" id="userSearch" placeholder="Поиск по имени, телефону, email"><div id="userList" class="grid"></div></div></section>
 <section id="services" class="hidden"><div class="card"><div class="row"><h2>Каталог услуг</h2><button class="btn primary" id="addService">＋ Добавить услугу</button></div><div id="serviceList" class="grid"></div></div></section>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');
const ADMIN='serzh.xz@mail.ru';let users=[],services=[],summaries=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function statusClass(s){return s==='оплачено'?'greenbg':s==='частично'?'yellowbg':'redbg'}
async function init(){const {data}=await sb.auth.getSession();if(!data.session||data.session.user.email!==ADMIN){location.href='login.html';return}await Promise.all([loadUsers(),loadServices()])}
async function loadUsers(){const [u,s]=await Promise.all([sb.from('users').select('user_id,Display_name,Email,Phone,City,is_manual_guest,balance').order('Display_name'),sb.from('user_financial_summary').select('user_id,total_charged,total_paid,total_debt,payment_status')]);if(u.error)return toast(u.error.message);if(s.error)return toast(s.error.message);users=u.data||[];summaries=s.data||[];renderUsers()}
function summary(id){return summaries.find(x=>x.user_id===id)||{total_charged:0,total_paid:0,total_debt:0,payment_status:'оплачено'}}
function renderUsers(){const q=($('userSearch').value||'').toLowerCase();$('userList').innerHTML=users.filter(u=>[u.Display_name,u.Email,u.Phone].join(' ').toLowerCase().includes(q)).map(u=>{const f=summary(u.user_id);return `<div class="item"><div class="row"><div><b>${esc(u.Display_name||'Без имени')}</b>${u.is_manual_guest?'<div class="small">ручной гость</div>':''}</div><span class="status ${statusClass(f.payment_status)}">${esc(f.payment_status)}</span></div><div class="muted">${esc(u.Phone||'Телефон не указан')}</div><div class="muted">${esc(u.Email||'')}</div><div style="margin-top:10px">Долг: <b class="${f.total_debt>0?(f.total_paid>0?'yellow':'red'):'green'}">${money(f.total_debt)}</b></div><div class="small">Начислено ${money(f.total_charged)} · оплачено ${money(f.total_paid)}</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="profile('${u.user_id}')">Открыть профиль</button></div></div>`}).join('')||'<div class="muted">Пользователей нет</div>'}
async function loadServices(){const {data,error}=await sb.from('services').select('*').order('category').order('name');if(error)return toast(error.message);services=data||[];renderServices()}
function renderServices(){$('serviceList').innerHTML=services.map(s=>`<div class="item"><div class="row"><b>${esc(s.name)}</b><span class="price">${money(s.price)}</span></div><div class="muted">${esc(s.category)} · ${esc(s.unit)} · ${s.is_active?'активна':'архив'}</div><div class="muted">${esc(s.description||'')}</div><button class="btn" style="margin-top:9px" onclick="toggleService('${s.id}',${!s.is_active})">${s.is_active?'Отключить':'Включить'}</button></div>`).join('')||'<div class="muted">Услуг пока нет</div>'}
$('userSearch').oninput=renderUsers;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('users').classList.toggle('hidden',b.dataset.tab!=='users');$('services').classList.toggle('hidden',b.dataset.tab!=='services')});
$('addGuest').onclick=()=>{$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><h2>＋ Новый пользователь</h2><input id="gn" placeholder="Имя и фамилия *"><input id="gp" placeholder="Телефон"><input id="ge" placeholder="Email (необязательно)"><input id="gc" placeholder="Город"><input id="gb" type="date"><textarea id="gcomment" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="saveGuest">Создать</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('saveGuest').onclick=async()=>{const name=$('gn').value.trim();if(!name)return toast('Укажите имя');const {error}=await sb.rpc('create_manual_guest',{p_name:name,p_phone:$('gp').value,p_email:$('ge').value,p_city:$('gc').value,p_birth_date:$('gb').value||null,p_comment:$('gcomment').value});if(error)return toast(error.message);closeModal();await loadUsers();toast('Пользователь создан')}};
$('addService').onclick=()=>{$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><h2>＋ Новая услуга</h2><input id="sn" placeholder="Название *"><input id="sp" type="number" min="0" placeholder="Цена, ₽ *"><input id="sc" placeholder="Категория, например Быт"><input id="su" placeholder="Единица, например шт."><textarea id="sd" placeholder="Описание"></textarea><div class="actions"><button class="btn primary" id="saveService">Создать</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('saveService').onclick=async()=>{const name=$('sn').value.trim(),price=Number($('sp').value);if(!name||price<0)return toast('Укажите название и цену');const {error}=await sb.from('services').insert({name,price,category:$('sc').value.trim()||'Быт',unit:$('su').value.trim()||'шт.',description:$('sd').value.trim()||null});if(error)return toast(error.message);closeModal();await loadServices();toast('Услуга создана')}};
window.toggleService=async(id,on)=>{const {error}=await sb.from('services').update({is_active:on,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);loadServices()};
function itemPay(total,paid,discount){const due=Math.max((Number(total)||0)-(Number(discount)||0)-(Number(paid)||0),0);return{total:Number(total)||0,paid:Number(paid)||0,discount:Number(discount)||0,due,status:due?(paid?'частично':'не оплачено'):'оплачено'}}
async function openUserPayment(uid){const f=summary(uid);if(f.total_debt<=0)return toast('У пользователя нет долга');$('modal').innerHTML=`<div class="modalbox"><h2>Внести общую оплату</h2><div class="muted">Эта оплата уменьшит общий долг пользователя. Для конкретного бронирования используйте кнопку у самого бронирования.</div><div class="stats"><div class="stat">Начислено<b>${money(f.total_charged)}</b></div><div class="stat">Оплачено<b>${money(f.total_paid)}</b></div><div class="stat">Долг<b class="red">${money(f.total_debt)}</b></div><div class="stat">Статус<b>${esc(f.payment_status)}</b></div></div><input id="upa" type="number" min="1" max="${f.total_debt}" value="${f.total_debt}" placeholder="Сумма"><select id="upm"><option>Перевод</option><option>Наличные</option><option>Карта</option><option>Другое</option></select><textarea id="upn" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="ups">Сохранить оплату</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('modal').classList.remove('hidden');$('ups').onclick=async()=>{const amount=Number($('upa').value);if(amount<=0||amount>f.total_debt)return toast('Проверьте сумму');const {error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:$('upm').value,p_note:$('upn').value||null});if(error)return toast(error.message);await loadUsers();toast('Оплата внесена');profile(uid)}}
async function payTarget(uid,type,id){let row;if(type==='booking'){row=(await sb.from('bookings').select('total_amount,paid_amount,discount_amount').eq('id',id).single()).data}else{row=(await sb.from('orders').select('total_amount,paid_amount,discount_amount').eq('id',id).single()).data}if(!row)return toast('Запись не найдена');const f=itemPay(row.total_amount,row.paid_amount,row.discount_amount);if(f.due<=0)return toast('Долг по этой записи отсутствует');$('modal').innerHTML=`<div class="modalbox"><h2>Внести оплату</h2><div class="muted">Остаток по записи: <b>${money(f.due)}</b></div><input id="tpa" type="number" min="1" max="${f.due}" value="${f.due}"><select id="tpm"><option>Перевод</option><option>Наличные</option><option>Карта</option><option>Другое</option></select><textarea id="tpn" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="tps">Сохранить оплату</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('modal').classList.remove('hidden');$('tps').onclick=async()=>{const amount=Number($('tpa').value);if(amount<=0||amount>f.due)return toast('Проверьте сумму');const args={p_amount:amount,p_payment_method:$('tpm').value,p_note:$('tpn').value||null};args[type==='booking'?'p_booking_id':'p_order_id']=id;const {error}=await sb.rpc('record_payment',args);if(error)return toast(error.message);await loadUsers();toast('Оплата внесена');profile(uid)}}
window.profile=async uid=>{const u=users.find(x=>x.user_id===uid);if(!u)return;const [b,o,so,ph]=await Promise.all([sb.from('bookings').select('id,guest_name,check_in_date,check_out_date,total_amount,paid_amount,discount_amount,payment_status,status,rooms(name)').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('orders').select('id,guest_name,items,total_amount,paid_amount,discount_amount,payment_status,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('service_orders').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.rpc('get_user_payment_history',{p_user_id:uid})]);if(b.error)return toast(b.error.message);if(o.error)return toast(o.error.message);if(so.error)return toast(so.error.message);if(ph.error)return toast(ph.error.message);const f=summary(uid);const bookings=b.data||[],orders=o.data||[],serviceOrders=so.data||[],payments=ph.data||[];$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="row"><div><h2 style="margin-bottom:4px">${esc(u.Display_name||'Без имени')}</h2><div class="muted">${esc(u.Phone||'Телефон не указан')} · ${esc(u.Email||'')}</div>${u.is_manual_guest?'<div class="small">ручной гость</div>':''}</div><button class="btn" onclick="closeModal()">×</button></div><div class="stats"><div class="stat">Начислено<b>${money(f.total_charged)}</b></div><div class="stat">Оплачено<b class="green">${money(f.total_paid)}</b></div><div class="stat">Долг<b class="${f.total_debt?(f.total_paid?'yellow':'red'):'green'}">${money(f.total_debt)}</b></div><div class="stat">Статус<b><span class="status ${statusClass(f.payment_status)}">${esc(f.payment_status)}</span></b></div></div><div class="actions"><button class="btn primary" ${f.total_debt?'':'disabled'} onclick="openUserPayment('${uid}')">💰 Внести оплату</button><button class="btn" onclick="addToUser('${uid}')">＋ Добавить услугу</button></div><div class="section-title"><h2>Бронирования</h2></div>${bookings.map(x=>{const p=itemPay(x.total_amount,x.paid_amount,x.discount_amount);return `<div class="line"><div class="row"><div><b>${esc(x.rooms?.name||'Номер')}</b><div class="small">${x.check_in_date} → ${x.check_out_date} · ${money(p.total-p.discount)}</div><div class="small ${p.due?(p.paid?'yellow':'red'):'green'}">${p.due?'Оплачено '+money(p.paid)+' · долг '+money(p.due):'Оплачено'}</div></div><div class="actions"><span class="status ${statusClass(p.status)}">${esc(p.status)}</span>${p.due?`<button class="btn primary" onclick="payTarget('${uid}','booking','${x.id}')">Оплата</button>`:''}</div></div></div>`}).join('')||'<div class="muted">Бронирований нет</div>'}<div class="section-title"><h2>Veg-raw</h2></div>${orders.map(x=>{const p=itemPay(x.total_amount,x.paid_amount,x.discount_amount);let items='';try{items=(x.items||[]).map(i=>`${esc(i.name||'Блюдо')} × ${i.quantity||1}`).join(', ')}catch{}return `<div class="line"><div class="row"><div><b>${money(p.total-p.discount)}</b><div class="small">${items||'Состав заказа не указан'}</div><div class="small ${p.due?(p.paid?'yellow':'red'):'green'}">${p.due?'Оплачено '+money(p.paid)+' · долг '+money(p.due):'Оплачено'}</div></div><div class="actions"><span class="status ${statusClass(p.status)}">${esc(p.status)}</span>${p.due?`<button class="btn primary" onclick="payTarget('${uid}','order','${x.id}')">Оплата</button>`:''}</div></div></div>`}).join('')||'<div class="muted">Заказов Veg-raw нет</div>'}<div class="section-title"><h2>Услуги</h2><button class="btn" onclick="addToUser('${uid}')">＋ Добавить</button></div>${serviceOrders.map(x=>`<div class="line"><div class="row"><div><b>${esc(x.service_name)}</b> × ${x.quantity}<div class="small">${esc(x.category||'Быт')} · ${new Date(x.created_at).toLocaleString('ru-RU')}</div><div class="small">${esc(x.comment||'')}</div></div><span class="price">${money(x.total_amount)}</span></div></div>`).join('')||'<div class="muted">Услуг пока нет</div>'}<div class="section-title"><h2>История оплат</h2></div>${payments.map(p=>`<div class="line"><div class="row"><div><b>${money(p.amount)}</b><div class="small">${new Date(p.created_at).toLocaleString('ru-RU')} · ${esc(p.payment_method||'')}</div><div class="small">${esc(p.note||'Общая оплата')}</div></div><span class="status greenbg">оплата</span></div></div>`).join('')||'<div class="muted">Оплат ещё нет</div>'}</div>`}
function addToUser(uid){$('modal').innerHTML=`<div class="modalbox"><h2>Добавить услугу</h2><input id="serviceSearch" placeholder="Поиск услуги"><div id="pickServices"></div><input id="qty" type="number" min="1" value="1" placeholder="Количество"><textarea id="scmt" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="confirmService">Добавить пользователю</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;let chosen=null;function render(){const q=($('serviceSearch').value||'').toLowerCase();$('pickServices').innerHTML=services.filter(s=>s.is_active&&[s.name,s.category].join(' ').toLowerCase().includes(q)).map(s=>`<div class="service ${chosen===s.id?'selected':''}" data-id="${s.id}"><b>${esc(s.name)}</b> — ${money(s.price)} <span class="muted">${esc(s.category)}</span></div>`).join('')||'<div class="muted">Подходящих услуг нет</div>';document.querySelectorAll('.service').forEach(x=>x.onclick=()=>{chosen=x.dataset.id;render()})}$('serviceSearch').oninput=render;render();$('modal').classList.remove('hidden');$('confirmService').onclick=async()=>{if(!chosen)return toast('Выберите услугу');const qty=Number($('qty').value)||1;if(qty<=0)return toast('Количество должно быть больше нуля');const {error}=await sb.rpc('add_service_order',{p_user_id:uid,p_service_id:chosen,p_quantity:qty,p_comment:$('scmt').value||null});if(error)return toast(error.message);await loadUsers();toast('Услуга добавлена');profile(uid)}}
init();
</script>
</body></html>
