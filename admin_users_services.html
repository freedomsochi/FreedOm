<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользователи и услуги — FreeDom</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d17;color:#eee;font:15px Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.head,.card{background:#151827;border:1px solid #292d42;border-radius:18px;padding:18px;margin-bottom:14px}.head{background:linear-gradient(145deg,#241b42,#121522)}h1,h2{margin:0 0 12px;color:#d4af37;font-weight:500}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tab,.btn{border:1px solid #353a52;background:#202437;color:#ddd;border-radius:12px;padding:10px 14px;cursor:pointer}.tab.active,.btn.primary{background:#d4af37;color:#111;border-color:#d4af37}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.item{background:#101321;border:1px solid #282c40;border-radius:14px;padding:14px}.muted{color:#8f95ab;font-size:13px}.price{color:#d4af37;font-size:18px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.search,input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #34394f;background:#0e111c;color:#eee;margin:5px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:#151827;border:1px solid #34394f;border-radius:18px;padding:20px}.service{border:1px solid #30354b;border-radius:12px;padding:10px;margin:7px 0;cursor:pointer}.service.selected{border-color:#d4af37;background:#28220f}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202437;padding:12px 18px;border-radius:12px;display:none}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body><div class="wrap"><div class="head"><a href="admin.html" style="color:#b8a9d4">← Назад в админку</a><h1>👥 Пользователи и 🧾 услуги</h1><div class="muted">Ручные гости, каталог услуг и добавление услуг в профиль</div></div><div class="tabs"><button class="tab active" data-tab="users">👥 Пользователи</button><button class="tab" data-tab="services">🧾 Услуги</button></div><section id="users"><div class="card"><div class="row"><h2>👥 Гости</h2><button class="btn primary" id="addGuest">＋ Добавить пользователя</button></div><input class="search" id="userSearch" placeholder="Поиск по имени, телефону, email"><div id="userList" class="grid"></div></div></section><section id="services" class="hidden"><div class="card"><div class="row"><h2>🧾 Каталог услуг</h2><button class="btn primary" id="addService">＋ Добавить услугу</button></div><div id="serviceList" class="grid"></div></div></section></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script>
const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const ADMIN='serzh.xz@mail.ru';let users=[],services=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
async function init(){const {data}=await sb.auth.getSession();if(!data.session||data.session.user.email!==ADMIN){location.href='login.html';return}await Promise.all([loadUsers(),loadServices()])}
async function loadUsers(){const {data,error}=await sb.from('users').select('user_id,Display_name,Email,Phone,City,is_manual_guest,balance,total_debt').order('Display_name');if(error)return toast(error.message);users=data||[];renderUsers()}
function renderUsers(){const q=($('userSearch').value||'').toLowerCase();$('userList').innerHTML=users.filter(u=>[u.Display_name,u.Email,u.Phone].join(' ').toLowerCase().includes(q)).map(u=>`<div class="item"><div class="row"><b>${esc(u.Display_name||'Без имени')}</b>${u.is_manual_guest?'<span class="muted">ручной гость</span>':''}</div><div class="muted">${esc(u.Phone||'Телефон не указан')}</div><div class="muted">${esc(u.Email||'')}</div><div class="muted">Долг: <b style="color:${Number(u.total_debt)>0?'#ff6b6b':'#25d366'}">${money(u.total_debt)}</b></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="profile('${u.user_id}')">Открыть профиль</button></div></div>`).join('')||'<div class="muted">Пользователей нет</div>'}
async function loadServices(){const {data,error}=await sb.from('services').select('*').order('category').order('name');if(error)return toast(error.message);services=data||[];renderServices()}
function renderServices(){$('serviceList').innerHTML=services.map(s=>`<div class="item"><div class="row"><b>${esc(s.name)}</b><span class="price">${money(s.price)}</span></div><div class="muted">${esc(s.category)} · ${esc(s.unit)} · ${s.is_active?'активна':'архив'}</div><div class="muted">${esc(s.description||'')}</div><button class="btn" style="margin-top:9px" onclick="toggleService('${s.id}',${!s.is_active})">${s.is_active?'Отключить':'Включить'}</button></div>`).join('')||'<div class="muted">Услуг пока нет</div>'}
$('userSearch').oninput=renderUsers;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('users').classList.toggle('hidden',b.dataset.tab!=='users');$('services').classList.toggle('hidden',b.dataset.tab!=='services')});
$('addGuest').onclick=()=>{$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><h2>＋ Новый пользователь</h2><input id="gn" placeholder="Имя и фамилия *"><input id="gp" placeholder="Телефон"><input id="ge" placeholder="Email (необязательно)"><input id="gc" placeholder="Город"><input id="gb" type="date"><textarea id="gcomment" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="saveGuest">Создать</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('saveGuest').onclick=async()=>{const name=$('gn').value.trim();if(!name)return toast('Укажите имя');const {data,error}=await sb.rpc('create_manual_guest',{p_name:name,p_phone:$('gp').value,p_email:$('ge').value,p_city:$('gc').value,p_birth_date:$('gb').value||null,p_comment:$('gcomment').value});if(error)return toast(error.message);closeModal();await loadUsers();toast('Пользователь создан')}}
$('addService').onclick=()=>{$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><h2>＋ Новая услуга</h2><input id="sn" placeholder="Название *"><input id="sp" type="number" min="0" placeholder="Цена, ₽ *"><input id="sc" placeholder="Категория, например Быт"><input id="su" placeholder="Единица, например шт."><textarea id="sd" placeholder="Описание"></textarea><div class="actions"><button class="btn primary" id="saveService">Создать</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;$('saveService').onclick=async()=>{const name=$('sn').value.trim(),price=Number($('sp').value);if(!name||price<0)return toast('Укажите название и цену');const {error}=await sb.from('services').insert({name,price,category:$('sc').value.trim()||'Быт',unit:$('su').value.trim()||'шт.',description:$('sd').value.trim()||null});if(error)return toast(error.message);closeModal();await loadServices();toast('Услуга создана')}};
window.toggleService=async(id,on)=>{const {error}=await sb.from('services').update({is_active:on,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);loadServices()};
window.profile=async id=>{const u=users.find(x=>x.user_id===id);if(!u)return;const {data:so}=await sb.from('service_orders').select('*').eq('user_id',id).order('created_at',{ascending:false});$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="row"><h2>👤 ${esc(u.Display_name)}</h2><button class="btn" onclick="closeModal()">×</button></div><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div><hr style="border-color:#292d42"><h2 style="font-size:18px">🧾 Услуги</h2><div id="profileServices">${(so||[]).map(x=>`<div class="item"><div class="row"><b>${esc(x.service_name)} × ${x.quantity}</b><span class="price">${money(x.total_amount)}</span></div><div class="muted">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.status)}</div></div>`).join('')||'<div class="muted">Услуг пока нет</div>'}</div><button class="btn primary" style="width:100%;margin-top:12px" id="addToUser">＋ Добавить услугу пользователю</button></div>`;$('addToUser').onclick=()=>addToUser(id)};
function addToUser(uid){$('modal').innerHTML=`<div class="modalbox"><h2>🧾 Добавить услугу</h2><input id="serviceSearch" placeholder="Поиск услуги"><div id="pickServices"></div><input id="qty" type="number" min="1" value="1" placeholder="Количество"><textarea id="scmt" placeholder="Комментарий"></textarea><div class="actions"><button class="btn primary" id="confirmService">Добавить пользователю</button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`;let chosen=null;function render(){const q=($('serviceSearch').value||'').toLowerCase();$('pickServices').innerHTML=services.filter(s=>s.is_active&&[s.name,s.category].join(' ').toLowerCase().includes(q)).map(s=>`<div class="service ${chosen===s.id?'selected':''}" data-id="${s.id}"><b>${esc(s.name)}</b> — ${money(s.price)} <span class="muted">${esc(s.category)}</span></div>`).join('');document.querySelectorAll('.service').forEach(x=>x.onclick=()=>{chosen=x.dataset.id;render()})}$('serviceSearch').oninput=render;render();$('confirmService').onclick=async()=>{if(!chosen)return toast('Выберите услугу');const {error}=await sb.rpc('add_service_order',{p_user_id:uid,p_service_id:chosen,p_quantity:Number($('qty').value)||1,p_comment:$('scmt').value||null});if(error)return toast(error.message);await loadUsers();toast('Услуга добавлена');profile(uid)}}
init();</script></body></html>
