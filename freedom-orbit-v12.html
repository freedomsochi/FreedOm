<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — дом в котором есть жизнь</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#40372e;background:#d7c2a4}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#d7c2a4}.scene.entering .orbit{transform:translate(-50%,-50%) scale(.94);opacity:.18;filter:blur(5px);transition:transform 1s ease,opacity .7s,filter .8s}.scene.entering .logo,.scene.entering .caption,.scene.entering .account{opacity:0;transition:opacity .5s}
.bg,.bg2{position:absolute;inset:-8%;background:center/cover no-repeat;filter:saturate(.72) sepia(.12) contrast(.92);transform:scale(1.05);transition:background-image 1.25s ease,transform 2.2s ease,opacity 1.25s ease}.bg{background-image:url('images/room-bungalow.jpg')}.bg2{opacity:0;transform:scale(1.10)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,247,231,.54),rgba(255,241,216,.07) 47%,rgba(45,33,24,.28));pointer-events:none}.light{position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 38%,rgba(255,240,202,.48) 48%,transparent 58%);filter:blur(20px);animation:light 13s ease-in-out infinite alternate;pointer-events:none}@keyframes light{to{transform:translateX(34%)}}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:30;font:500 18px Georgia,serif;letter-spacing:.35em;text-transform:uppercase}.caption{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:30;font-size:7px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;opacity:.58}.account{position:absolute;right:22px;top:20px;z-index:50;display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(255,252,241,.48);border-radius:999px;background:rgba(255,249,236,.17);backdrop-filter:blur(18px);color:#4d4034;text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 35px rgba(55,39,25,.08);transition:.35s}.account:hover{background:rgba(255,248,228,.42);transform:translateY(-1px)}.account svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.orbit{position:absolute;width:min(103vw,760px);height:min(103vw,760px);left:50%;top:51%;transform:translate(-50%,-50%);touch-action:none;transition:transform .4s ease}.branches{position:absolute;z-index:10;left:50%;bottom:-4%;width:72%;height:94%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 25px 35px rgba(50,35,23,.16));overflow:hidden;border-radius:50%}.branches img{width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;filter:contrast(.94) saturate(.78);mask-image:radial-gradient(ellipse 68% 82% at 50% 58%,#000 56%,transparent 92%);animation:sway 9s ease-in-out infinite}@keyframes sway{50%{transform:rotate(.2deg) translateY(-.3%)}}
.ring{position:absolute;inset:2%;z-index:20;border-radius:50%;--r:0deg;transform:rotate(var(--r));transition:transform .95s cubic-bezier(.12,.86,.16,1);cursor:grab}.ring.drag{transition:none;cursor:grabbing}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,250,238,.62);box-shadow:inset 0 0 70px rgba(255,235,205,.18),0 0 70px rgba(60,42,27,.12)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(74,54,38,.14)}
.node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:0;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(255,249,236,.17);border:1px solid rgba(255,252,241,.56);backdrop-filter:blur(25px) saturate(125%);color:rgba(58,49,41,.62);font-size:9px;letter-spacing:.16em;text-transform:uppercase;transform:translate(-50%,-50%) rotate(calc(-1*var(--r)));transition:background .45s,color .45s,scale .65s,box-shadow .65s}.node.active{background:rgba(255,248,228,.52);color:#302821;scale:1.08;box-shadow:0 20px 55px rgba(62,43,27,.14),0 0 0 8px rgba(255,235,205,.1),inset 0 1px rgba(255,255,255,.8)}
.core{position:absolute;left:50%;top:50%;z-index:18;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff8e9 0 9%,#d9b98e 28%,#8d6241 58%,transparent 72%);border:1px solid #fff8e999;box-shadow:0 0 0 18px #ffe8c51a,0 18px 70px #3a291f2b;cursor:pointer;animation:pulse 5s infinite}@keyframes pulse{50%{scale:1.05}}
.hint{position:absolute;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:11px 17px;border:1px solid #fff8e877;border-radius:99px;background:#fff8e928;backdrop-filter:blur(20px);white-space:nowrap;transition:opacity .5s}.scene.entering .hint{opacity:0}
.world{position:absolute;inset:0;z-index:60;background:rgba(48,37,27,.28);backdrop-filter:blur(28px);opacity:0;pointer-events:none;transition:opacity .8s ease}.world.open{opacity:1;pointer-events:auto}.sheet{position:absolute;inset:0;overflow:hidden;border:0;border-radius:0;background:#f6efe3;box-shadow:0 45px 140px rgba(47,33,23,.2);transform:scale(.93);opacity:0;transition:transform 1.05s cubic-bezier(.16,.86,.18,1),opacity .8s ease}.world.open .sheet{transform:scale(1);opacity:1}.bar{position:absolute;z-index:4;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(rgba(255,250,241,.78),rgba(255,250,241,.28),transparent);backdrop-filter:blur(10px)}.title{font:500 27px Georgia,serif}.meta{font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:#837362;margin-top:3px}.close{width:42px;height:42px;border-radius:50%;border:1px solid #6b57401f;background:#fffaf280;font-size:21px;color:#54483d;cursor:pointer}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#eee2d1;opacity:0;transition:opacity .7s ease}.frame.ready{opacity:1}.entry{position:absolute;inset:0;z-index:5;overflow:hidden;display:grid;place-items:center;background:#33281f;opacity:1;transition:opacity .9s ease;pointer-events:none}.entry-photo{position:absolute;inset:-7%;background:center/cover no-repeat;transform:scale(1.16);filter:saturate(.8) sepia(.08) contrast(.92);transition:transform 1.8s cubic-bezier(.12,.82,.18,1),filter 1.4s,opacity .9s}.entry-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,27,20,.18),rgba(35,27,20,.38))}.entry-copy{position:relative;z-index:2;color:#fff8ed;text-shadow:0 3px 30px rgba(0,0,0,.28);transition:opacity .55s,transform .8s}.entry strong{display:block;text-align:center;font:500 56px Georgia,serif}.entry span{display:block;text-align:center;margin-top:12px;font-size:8px;letter-spacing:.28em;text-transform:uppercase}.entry.active .entry-photo{transform:scale(1.02);filter:saturate(.88) sepia(.04) contrast(.96)}.entry.hide{opacity:0}.entry.hide .entry-copy{opacity:0;transform:scale(1.04)}
@media(max-width:620px){.logo{top:16px;font-size:15px}.caption{top:43px}.account{right:12px;top:12px;padding:8px 10px;font-size:0}.account svg{width:17px;height:17px}.orbit{width:124vw;height:124vw;top:51%}.branches{width:82%;height:90%}.node{width:90px;height:90px;margin:0;font-size:7px}.core{width:62px;height:62px}.hint{bottom:12px}.bar{height:64px;padding:0 14px}.title{font-size:22px}.close{width:38px;height:38px}.entry strong{font-size:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="bg" id="bg"></div><div class="bg2" id="bg2"></div><div class="veil"></div><div class="light"></div>
<div class="logo">FreeDom</div><div class="caption">дом в котором есть жизнь · выбери свой путь</div>
<a class="account" href="#account" onclick="event.preventDefault();alert('Личный кабинет подключим отдельно — он не входит в Orbit.')">Личный кабинет</a>
<div class="orbit" id="orbit">
<div class="branches"><img src="images/branches.png" alt=""></div>
<div class="ring" id="ring">
<div class="node active" style="--a:0deg" data-index="0">Пространство</div>
<div class="node" style="--a:72deg" data-index="1">Кухня</div>
<div class="node" style="--a:144deg" data-index="2">Баня</div>
<div class="node" style="--a:216deg" data-index="3">События</div>
<div class="node" style="--a:288deg" data-index="4">Комнаты</div>
</div><div class="core" id="core" aria-label="FreeDom"></div></div>
<div class="hint">Проведи вокруг дерева · выбери путь</div>
<div class="world" id="world"><div class="sheet"><div class="bar"><div><div class="title" id="worldTitle">Пространство</div><div class="meta">FreeDom · войти в мир</div></div><button class="close" id="close" aria-label="Закрыть">×</button></div><iframe class="frame" id="frame" title="FreeDom world"></iframe><div class="entry" id="entry"><div class="entry-photo" id="entryPhoto"></div><div class="entry-shade"></div><div class="entry-copy"><strong id="entryTitle">Пространство</strong><span>войти</span></div></div></div></div>
</div>
<script>
const scene=document.getElementById('scene'),ring=document.getElementById('ring'),orbit=document.getElementById('orbit'),nodes=[...document.querySelectorAll('.node')],bg=document.getElementById('bg'),bg2=document.getElementById('bg2'),world=document.getElementById('world'),frame=document.getElementById('frame'),entry=document.getElementById('entry'),entryPhoto=document.getElementById('entryPhoto'),entryTitle=document.getElementById('entryTitle'),worldTitle=document.getElementById('worldTitle'),close=document.getElementById('close'),core=document.getElementById('core');
const photos=['images/room-bungalow.jpg','images/room-family.jpg','images/sauna.jpg','images/gong-meditation.jpg','images/room-hostel.jpg'];
const names=['Пространство','Кухня','Баня','События','Комнаты'];let rot=0,idx=0,drag=false,lastAngle=0,lastTime=0,velocity=0,raf=0,ignoreClickUntil=0;
function layoutNodes(){const w=ring.clientWidth,h=ring.clientHeight;if(!w||!h)return;const radius=Math.min(w,h)*(window.matchMedia('(max-width: 620px)').matches?.43:.37);nodes.forEach(n=>{const a=(parseFloat(n.style.getPropertyValue('--a'))||0)*Math.PI/180;const x=50+(Math.sin(a)*radius/w*100);const y=50-(Math.cos(a)*radius/h*100);n.style.left=x+'%';n.style.top=y+'%'});}
window.addEventListener('resize',layoutNodes);requestAnimationFrame(layoutNodes);
function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}
function angleAt(e){const r=orbit.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}
function setRot(v){rot=v;ring.style.setProperty('--r',rot+'deg');const nearest=Math.round(-rot/72);idx=((nearest%5)+5)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx)}
function atmosphere(i){const target=photos[i];bg2.style.backgroundImage=`url('${target}')`;bg2.style.opacity='1';bg2.style.transform='scale(1.04)';bg.style.opacity='0';setTimeout(()=>{bg.style.backgroundImage=`url('${target}')`;bg.style.opacity='1';bg2.style.opacity='0';bg.style.transform='scale(1.05)'},700)}
ring.addEventListener('pointerdown',e=>{if(world.classList.contains('open'))return;drag=true;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);lastAngle=angleAt(e);lastTime=performance.now();velocity=0;cancelAnimationFrame(raf);e.preventDefault()});
ring.addEventListener('pointermove',e=>{if(!drag)return;const a=angleAt(e),now=performance.now(),d=norm(a-lastAngle),dt=Math.max(8,now-lastTime);rot+=d*180/Math.PI;velocity=(d*180/Math.PI)/(dt/16.67);lastAngle=a;lastTime=now;ring.style.setProperty('--r',rot+'deg');const nearest=Math.round(-rot/72);idx=((nearest%5)+5)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx);e.preventDefault()});
function release(){if(!drag)return;drag=false;ring.classList.remove('drag');ignoreClickUntil=Date.now()+280;let v=velocity;function coast(){if(Math.abs(v)<.015){const target=Math.round(rot/72)*72;ring.style.transition='transform .95s cubic-bezier(.12,.86,.16,1)';rot=target;ring.style.setProperty('--r',rot+'deg');idx=(((-Math.round(rot/72))%5)+5)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx);return}rot+=v;v*=.93;ring.style.setProperty('--r',rot+'deg');const nearest=Math.round(-rot/72);idx=((nearest%5)+5)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx);raf=requestAnimationFrame(coast)}coast()}
ring.addEventListener('pointerup',release);ring.addEventListener('pointercancel',release);ring.addEventListener('lostpointercapture',release);
function openWorld(i){if(Date.now()<ignoreClickUntil)return;idx=i;const target=photos[i];worldTitle.textContent=names[i];entryTitle.textContent=names[i];entryPhoto.style.backgroundImage=`url('${target}')`;entry.classList.remove('hide');scene.classList.add('entering');world.classList.add('open');frame.classList.remove('ready');if(i===0){frame.src='space-preview.html';}else{frame.src='about:blank';setTimeout(()=>{if(world.classList.contains('open')&&idx===i){entry.classList.add('hide')}},1100)}}
nodes.forEach(n=>n.addEventListener('click',e=>{if(Date.now()<ignoreClickUntil)return;openWorld(Number(n.dataset.index))}));core.addEventListener('click',()=>openWorld(idx));
frame.addEventListener('load',()=>{if(idx!==0)return;try{const back=frame.contentDocument?.querySelector('.back');if(back){back.addEventListener('click',e=>{e.preventDefault();closeWorld()})}}catch(e){}setTimeout(()=>{if(world.classList.contains('open')){frame.classList.add('ready');entry.classList.add('hide')}},500)});
function closeWorld(){entry.classList.remove('hide');frame.classList.remove('ready');setTimeout(()=>{world.classList.remove('open');scene.classList.remove('entering');setTimeout(()=>{frame.src='about:blank';atmosphere(idx)},700)},550)}
close.addEventListener('click',closeWorld);
window.addEventListener('message',e=>{if(e.data&&e.data.type==='freedom-space-close'&&world.classList.contains('open')&&idx===0)closeWorld()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&world.classList.contains('open'))closeWorld();if(e.key==='ArrowRight'&&!world.classList.contains('open')){rot-=72;ring.style.setProperty('--r',rot+'deg');idx=(idx+1)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx)}if(e.key==='ArrowLeft'&&!world.classList.contains('open')){rot+=72;ring.style.setProperty('--r',rot+'deg');idx=(idx+4)%5;nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));atmosphere(idx)}});
</script>
</body></html>
