<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeDom — дом в котором есть жизнь</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#40372e;background:#d7c2a4}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#d7c2a4}
.bg,.bg2{position:absolute;inset:-8%;background:center/cover no-repeat;filter:saturate(.72) sepia(.12) contrast(.92);transform:scale(1.05);transition:background-image 1.25s ease,transform 2.2s ease,opacity 1.25s ease}.bg{background-image:url('images/room-bungalow.jpg')}.bg2{opacity:0;transform:scale(1.10)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,247,231,.54),rgba(255,241,216,.07) 47%,rgba(45,33,24,.28));pointer-events:none}.light{position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 38%,rgba(255,240,202,.48) 48%,transparent 58%);filter:blur(20px);animation:light 13s ease-in-out infinite alternate;pointer-events:none}@keyframes light{to{transform:translateX(34%)}}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:30;font:500 18px Georgia,serif;letter-spacing:.35em;text-transform:uppercase}.caption{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:30;font-size:7px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;opacity:.58}
.account{position:absolute;right:22px;top:20px;z-index:50;display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(255,252,241,.48);border-radius:999px;background:rgba(255,249,236,.17);backdrop-filter:blur(18px);color:#4d4034;text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 35px rgba(55,39,25,.08);transition:.35s}.account:hover{background:rgba(255,248,228,.42);transform:translateY(-1px)}.account svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.orbit{position:absolute;width:min(103vw,760px);height:min(103vw,760px);left:50%;top:51%;transform:translate(-50%,-50%);touch-action:none}.branches{position:absolute;z-index:10;left:50%;bottom:-4%;width:72%;height:94%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 25px 35px rgba(50,35,23,.16));overflow:hidden;border-radius:50%}.branches img{width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;filter:contrast(.94) saturate(.78);mask-image:radial-gradient(ellipse 68% 82% at 50% 58%,#000 56%,transparent 92%);animation:sway 9s ease-in-out infinite}@keyframes sway{50%{transform:rotate(.2deg) translateY(-.3%)}}
.ring{position:absolute;inset:2%;z-index:20;border-radius:50%;--r:0deg;transform:rotate(var(--r));transition:transform .95s cubic-bezier(.12,.86,.16,1);cursor:grab}.ring.drag{transition:none;cursor:grabbing}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,250,238,.62);box-shadow:inset 0 0 70px rgba(255,235,205,.18),0 0 70px rgba(60,42,27,.12)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(74,54,38,.14)}
.node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(255,249,236,.17);border:1px solid rgba(255,252,241,.56);backdrop-filter:blur(25px) saturate(125%);color:rgba(58,49,41,.62);font-size:9px;letter-spacing:.16em;text-transform:uppercase;transform:rotate(calc(var(--a)*1deg)) translateY(min(37vw,278px)) rotate(calc(-1*(var(--a)*1deg) - var(--r)));transition:background .45s,color .45s,scale .65s,box-shadow .65s}.node.active{background:rgba(255,248,228,.52);color:#302821;scale:1.08;box-shadow:0 20px 55px rgba(62,43,27,.14),0 0 0 8px rgba(255,235,205,.1),inset 0 1px rgba(255,255,255,.8)}.node i{position:absolute;top:12px;width:4px;height:4px;border-radius:50%;background:#ad8257;box-shadow:0 0 14px #ad825755}
.core{position:absolute;left:50%;top:50%;z-index:18;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff8e9 0 9%,#d9b98e 28%,#8d6241 58%,transparent 72%);border:1px solid #fff8e999;box-shadow:0 0 0 18px #ffe8c51a,0 18px 70px #3a291f2b;cursor:pointer;animation:pulse 5s infinite}@keyframes pulse{50%{scale:1.05}}
.hint{position:absolute;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:11px 17px;border:1px solid #fff8e877;border-radius:99px;background:#fff8e928;backdrop-filter:blur(20px);white-space:nowrap;transition:opacity .5s}.scene.entering .hint,.scene.world-open .hint{opacity:0}
.world{position:absolute;inset:0;z-index:60;background:rgba(48,37,27,.28);backdrop-filter:blur(28px);opacity:0;pointer-events:none;transition:opacity .8s ease}.world.open{opacity:1;pointer-events:auto}.sheet{position:absolute;inset:0;overflow:hidden;border:0;border-radius:0;background:#f6efe3;box-shadow:0 45px 140px rgba(47,33,23,.2);transform:scale(.93);opacity:0;transition:transform 1.05s cubic-bezier(.16,.86,.18,1),opacity .8s ease}.world.open .sheet{transform:scale(1);opacity:1}.bar{position:absolute;z-index:4;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(rgba(255,250,241,.78),rgba(255,250,241,.28),transparent);backdrop-filter:blur(10px)}.title{font:500 27px Georgia,serif}.meta{font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:#837362;margin-top:3px}.close{width:42px;height:42px;border-radius:50%;border:1px solid #6b57401f;background:#fffaf280;font-size:21px;color:#54483d;cursor:pointer}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#eee2d1}.entry{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:linear-gradient(rgba(247,239,225,.95),rgba(247,239,225,.15));transition:opacity .85s ease}.entry.hide{opacity:0}.entry strong{display:block;text-align:center;font:500 56px Georgia,serif}.entry span{display:block;text-align:center;margin-top:12px;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#806f5d}
@media(max-width:620px){.logo{top:16px;font-size:15px}.caption{top:43px}.account{right:12px;top:12px;padding:8px 10px;font-size:0}.account svg{width:17px;height:17px}.orbit{width:124vw;height:124vw;top:51%}.branches{width:82%;height:90%}.node{width:90px;height:90px;margin:-45px;font-size:7px;transform:rotate(calc(var(--a)*1deg)) translateY(43vw) rotate(calc(-1*(var(--a)*1deg) - var(--r)))}.core{width:62px;height:62px}.hint{bottom:12px}.bar{height:64px;padding:0 14px}.title{font-size:22px}.close{width:38px;height:38px}.entry strong{font-size:40px}.entry span{font-size:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="bg" id="bg"></div><div class="bg2" id="bg2"></div><div class="veil"></div><div class="light"></div>
<div class="logo">FreeDom</div><div class="caption">дом в котором есть жизнь</div>
<a class="account" href="#" id="account" aria-label="Личный кабинет"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg><span>Личный кабинет</span></a>
<div class="orbit">
<div class="branches"><img src="images/branches.png" alt="FreeDom"></div>
<div class="ring" id="ring">
<div class="node active" style="--a:0" data-i="0">Пространство</div>
<div class="node" style="--a:72" data-i="1">Кухня</div>
<div class="node" style="--a:144" data-i="2">Баня</div>
<div class="node" style="--a:216" data-i="3">События</div>
<div class="node" style="--a:288" data-i="4">Комнаты</div>
</div><div class="core" id="core" aria-label="Войти в выбранный раздел"></div></div>
<div class="hint">вращайте пространство · выберите путь</div>
<section class="world" id="world"><div class="sheet"><div class="bar"><div><div class="title" id="title">Пространство</div><div class="meta">FreeDom · вход внутрь</div></div><button class="close" id="close" aria-label="Вернуться">×</button></div><div class="entry" id="entry"><div><strong id="entryTitle">Пространство</strong><span>входим внутрь FreeDom</span></div></div><iframe class="frame" id="frame" title="FreeDom world"></iframe></div></section>
</main>
<script>
const pics=['images/room-bungalow.jpg','images/room-family.jpg','images/sauna.jpg','images/gong-meditation.jpg','images/room-hostel.jpg'];
const names=['Пространство','Кухня','Баня','События','Комнаты'];
const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],bg=document.getElementById('bg'),bg2=document.getElementById('bg2'),world=document.getElementById('world'),frame=document.getElementById('frame'),entry=document.getElementById('entry'),title=document.getElementById('title'),entryTitle=document.getElementById('entryTitle'),scene=document.getElementById('scene');
let idx=0,rot=0,drag=0,last=0,vel=0,lastT=0,timer;
function angle(e){const r=ring.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI}
function set(){ring.style.setProperty('--r',rot+'deg')}
function atmosphere(i){clearTimeout(timer);bg2.style.backgroundImage=`url('${pics[i]}')`;bg2.style.opacity=1;bg2.style.transform='scale(1.09)';timer=setTimeout(()=>{bg.style.backgroundImage=`url('${pics[i]}')`;bg.style.transform='scale(1.05)';bg2.style.opacity=0;bg2.style.transform='scale(1.05)'},1250)}
function select(i){idx=(i+5)%5;const target=-idx*72;let d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;set();nodes.forEach((n,k)=>n.classList.toggle('active',k===idx));atmosphere(idx)}
function snap(){select(Math.round(-rot/72))}
ring.onpointerdown=e=>{drag=1;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);last=angle(e);lastT=performance.now();vel=0}
ring.onpointermove=e=>{if(!drag)return;let x=angle(e),d=x-last;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;set();let now=performance.now(),dt=Math.max(8,now-lastT);vel=.76*vel+.24*d/dt*16;last=x;lastT=now}
ring.onpointerup=()=>{if(!drag)return;drag=0;ring.classList.remove('drag');rot+=Math.max(-28,Math.min(28,vel*8));set();setTimeout(snap,260)}
ring.onpointercancel=()=>{drag=0;ring.classList.remove('drag');snap()}
nodes.forEach(n=>n.onclick=e=>{e.stopPropagation();const i=+n.dataset.i;if(i===idx)openWorld(i);else select(i)})
document.getElementById('core').onclick=()=>openWorld(idx)
function openWorld(i){idx=i;title.textContent=names[i];entryTitle.textContent=names[i];scene.classList.add('entering');world.classList.add('open');entry.classList.remove('hide');if(i===0){frame.src='space-preview.html';setTimeout(()=>entry.classList.add('hide'),900)}else{frame.src='about:blank';setTimeout(()=>entry.classList.add('hide'),650)}}
document.getElementById('close').onclick=()=>{world.classList.remove('open');scene.classList.remove('entering');setTimeout(()=>{frame.src='';atmosphere(idx)},800)}
document.getElementById('account').onclick=e=>{e.preventDefault();alert('Личный кабинет подключим отдельно — он не входит в Orbit.')}
bg.style.backgroundImage=`url('${pics[0]}')`;
</script>
</body></html>
