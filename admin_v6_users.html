<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v6 — Пользователи</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:18px}.wrap{max-width:900px;margin:auto}.card,.modalbox{background:#151c30;border-radius:16px;padding:18px;margin-bottom:14px}.row{padding:14px 0;border-bottom:1px solid #303a52}.btn{padding:11px 14px;border:0;border-radius:9px;background:#d4af37;color:#111;cursor:pointer;margin:3px}.muted{color:#9aa3b8}.debt{color:#ff6b6b;font-size:20px;font-weight:bold}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto}input,select{padding:10px;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662;margin:4px;width:calc(100% - 20px)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #303a52;text-align:left}.close{float:right;background:#2a3348;color:white}</style></head><body><div class="wrap"><div class="card"><h1>👤 Пользователи</h1><p class="muted">Финансовая карточка пользователя — тестовая v6</p><div id="users">Загрузка…</div></div></div><div id="modal" class="modal"><div id="box" class="modalbox"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let users=[],bookings=[],orders=[],services=[];const M=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const modal=document.getElementById('modal'),box=document.getElementById('box');async function load(){const [u,b,o,s]=await Promise.all([db.from('users').select('*').limit(200),db.from('bookings').select('*').limit(500),db.from('orders').select('*').limit(500),db.from('service_orders').select('*').limit(500)]);users=u.data||[];bookings=b.data||[];orders=o.data||[];services=s.data||[];document.getElementById('users').innerHTML=users.map(x=>{let items=[...bookings.filter(v=>v.user_id===x.user_id).map(v=>({type:'🛏 Бронирование',amount:v.total_amount||v.total_price||0,paid:v.paid_amount||0,name:v.room_name||'Проживание'})),...orders.filter(v=>v.user_id===x.user_id).map(v=>({type:'🥗 Veg Raw',amount:v.total_amount||0,paid:v.paid_amount||0,name:'Заказ кухни'})),...services.filter(v=>v.user_id===x.user_id).map(v=>({type:'🧺 Услуга',amount:v.total_amount||0,paid:0,name:v.service_name}))];let debt=items.reduce((a,v)=>a+Math.max(0,Number(v.amount)-Number(v.paid)),0);return `<div class="row"><b>${E(x.name||x.full_name||'Пользователь')}</b><div>${E(x.phone||'')} · ${E(x.email||'')}</div><div class="debt">Долг: ${M(debt)}</div><button class="btn user-btn" data-id="${E(x.user_id)}">Подробнее</button></div>`}).join('')||'Пользователей нет'}function close(){modal.classList.remove('show');box.innerHTML=''}function openUser(id){const u=users.find(x=>x.user_id===id);if(!u)return;const bs=bookings.filter(x=>x.user_id===id),os=orders.filter(x=>x.user_id===id),ss=services.filter(x=>x.user_id===id);let rows=[...bs.map(x=>({type:'🛏 Бронирование',name:x.room_name||'Проживание',amount:Number(x.total_amount||x.total_price||0),paid:Number(x.paid_amount||0),id:x.id,kind:'booking'})),...os.map(x=>({type:'🥗 Veg Raw',name:'Заказ кухни',amount:Number(x.total_amount||0),paid:Number(x.paid_amount||0),id:x.id,kind:'order'})),...ss.map(x=>({type:'🧺 Услуга',name:x.service_name,amount:Number(x.total_amount||0),paid:0,id:x.id,kind:'service'}))];let debt=rows.reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0);box.innerHTML=`<button class="btn close" id="x">✕ Закрыть</button><h2>👤 ${E(u.name||u.full_name||'Пользователь')}</h2><p>📞 ${E(u.phone||'—')}<br>✉️ ${E(u.email||'—')}</p><div class="card"><h3>Финансы</h3><div class="debt">Общий долг: ${M(debt)}</div><table><tr><th>За что</th><th>Начислено</th><th>Оплачено</th><th>Остаток</th><th></th></tr>${rows.map(r=>`<tr><td>${r.type}<br>${E(r.name)}</td><td>${M(r.amount)}</td><td>${M(r.paid)}</td><td>${M(Math.max(0,r.amount-r.paid))}</td><td>${r.amount>r.paid&&r.kind!=='service'?`<button class="btn pay" data-kind="${r.kind}" data-id="${r.id}">💳 Оплатить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Начислений пока нет</td></tr>'}</table><button class="btn" id="add">➕ Добавить начисление</button></div>`;modal.classList.add('show');document.getElementById('x').onclick=close;document.getElementById('add').onclick=()=>addForm(id);box.querySelectorAll('.pay').forEach(b=>b.onclick=()=>pay(id,b.dataset.kind,b.dataset.id))}function addForm(uid){box.innerHTML=`<button class="btn close" id="x">✕</button><h2>➕ Добавить начисление</h2><label>Тип<select id="type"><option value="service">🧺 Услуга</option><option value="kitchen">🥗 Кухня Veg Raw</option><option value="booking">🛏 Бронирование</option></select></label><input id="name" placeholder="Название / описание"><input id="amount" type="number" min="0" placeholder="Сумма, ₽"><input id="comment" placeholder="Комментарий"><button class="btn" id="save">Сохранить начисление</button>`;document.getElementById('x').onclick=()=>openUser(uid);document.getElementById('save').onclick=async()=>{const type=document.getElementById('type').value,name=document.getElementById('name').value.trim(),amount=Number(document.getElementById('amount').value),comment=document.getElementById('comment').value.trim();if(!name||!amount)return alert('Укажите название и сумму');if(type==='service'){const sv=await db.from('services').select('id').eq('name',name).maybeSingle();if(sv.error||!sv.data)return alert('Для услуги пока нужно выбрать существующую услугу из справочника: '+sv.error?.message);const r=await db.from('service_orders').insert({user_id:uid,service_id:sv.data.id,service_name:name,unit:'шт',quantity:1,unit_price:amount,total_amount:amount,status:'новый',comment});if(r.error)return alert(r.error.message)}else return alert('Начисление типа '+(type==='kitchen'?'Кухня':'Бронирование')+' лучше создавать через соответствующий заказ, чтобы сохранить все поля и связи.');alert('Начисление добавлено');openUser(uid)}}async function pay(uid,kind,id){const amount=Number(prompt('Сколько оплатить?'));if(!amount||amount<1)return;const method=prompt('Метод: нал / безнал / бонусы','безнал');if(!method)return;const args={p_amount:amount,p_payment_method:method};if(kind==='booking')args.p_booking_id=id;else args.p_order_id=id;const r=await db.rpc('record_payment',args);if(r.error)return alert('Ошибка платежа: '+r.error.message);alert('Оплата внесена: '+M(amount));openUser(uid)}document.getElementById('users').addEventListener('click',e=>{const b=e.target.closest('.user-btn');if(b)openUser(b.dataset.id)});modal.addEventListener('click',e=>{if(e.target===modal)close()});load()</script></body></html>
