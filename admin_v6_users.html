<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v6 — Пользователи</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:18px}.wrap{max-width:950px;margin:auto}.card,.modalbox{background:#151c30;border-radius:16px;padding:18px;margin-bottom:14px}.row{padding:14px 0;border-bottom:1px solid #303a52}.btn{padding:11px 14px;border:0;border-radius:9px;background:#d4af37;color:#111;cursor:pointer;margin:3px}.muted{color:#9aa3b8}.debt{color:#ff6b6b;font-size:20px;font-weight:bold}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{width:min(780px,100%);max-height:90vh;overflow:auto}input,select{padding:10px;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662;margin:4px;width:calc(100% - 20px)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #303a52;text-align:left}.close{float:right;background:#2a3348;color:white}.profile{display:grid;gap:5px;background:#101627;padding:14px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid>*{width:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}}.formbox{background:#101627;padding:14px;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><h1>👤 Пользователи</h1><p class="muted">Финансовая карточка пользователя — v6</p><div id="users">Загрузка…</div></div></div><div id="modal" class="modal"><div id="box" class="modalbox"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let users=[],bookings=[],orders=[],services=[],rooms=[],serviceCatalog=[];const M=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const modal=document.getElementById('modal'),box=document.getElementById('box');function profile(u,id){const b=bookings.find(x=>x.user_id===id)||{},o=orders.find(x=>x.user_id===id)||{};return{name:u.name||u.full_name||u.guest_name||b.guest_name||o.guest_name||'Гость',phone:u.phone||u.guest_phone||b.guest_phone||o.guest_phone||'—',email:u.email||u.guest_email||b.guest_email||o.guest_email||'—'}}function rowsFor(id){return[...bookings.filter(x=>x.user_id===id).map(x=>({type:'🛏 Бронирование',name:x.room_name||x.room||'Проживание',amount:Number(x.total_amount||x.total_price||0),paid:Number(x.paid_amount||0),id:x.id,kind:'booking'})),...orders.filter(x=>x.user_id===id).map(x=>({type:'🥗 Veg Raw',name:'Заказ кухни',amount:Number(x.total_amount||0),paid:Number(x.paid_amount||0),id:x.id,kind:'order'})),...services.filter(x=>x.user_id===id).map(x=>({type:'🧺 Услуга',name:x.service_name||x.name||'Услуга',amount:Number(x.total_amount||0),paid:0,id:x.id,kind:'service'}))]}async function load(){const [u,b,o,s,r,sc]=await Promise.all([db.from('users').select('*').limit(200),db.from('bookings').select('*').limit(500),db.from('orders').select('*').limit(500),db.from('service_orders').select('*').limit(500),db.from('rooms').select('*').order('name'),db.from('services').select('*').eq('is_active',true).order('name')]);users=u.data||[];bookings=b.data||[];orders=o.data||[];services=s.data||[];rooms=r.data||[];serviceCatalog=sc.data||[];document.getElementById('users').innerHTML=users.map(x=>{const p=profile(x,x.user_id),debt=rowsFor(x.user_id).reduce((a,v)=>a+Math.max(0,v.amount-v.paid),0);return `<div class="row"><b>${E(p.name)}</b><div>${E(p.phone)} · ${E(p.email)}</div><div class="debt">Долг: ${M(debt)}</div><button class="btn user-btn" data-id="${E(x.user_id)}">Подробнее</button></div>`}).join('')||'Пользователей нет'}function close(){modal.classList.remove('show');box.innerHTML=''}function openUser(id){const u=users.find(x=>x.user_id===id);if(!u)return;const p=profile(u,id),rows=rowsFor(id),debt=rows.reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0);box.innerHTML=`<button class="btn close" id="x">✕ Закрыть</button><h2>👤 ${E(p.name)}</h2><div class="profile"><div>📞 <b>Телефон:</b> ${E(p.phone)}</div><div>✉️ <b>Email:</b> ${E(p.email)}</div></div><div class="card"><h3>💰 Финансы</h3><div class="debt">Общий долг: ${M(debt)}</div><table><tr><th>За что</th><th>Начислено</th><th>Оплачено</th><th>Остаток</th><th></th></tr>${rows.map(r=>`<tr><td>${r.type}<br>${E(r.name)}</td><td>${M(r.amount)}</td><td>${M(r.paid)}</td><td>${M(Math.max(0,r.amount-r.paid))}</td><td>${r.amount>r.paid&&r.kind!=='service'?`<button class="btn pay" data-kind="${r.kind}" data-id="${r.id}">💳 Оплатить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Начислений пока нет</td></tr>'}</table><button class="btn" id="add">➕ Добавить начисление</button></div>`;modal.classList.add('show');document.getElementById('x').onclick=close;document.getElementById('add').onclick=()=>addForm(id);box.querySelectorAll('.pay').forEach(b=>b.onclick=()=>pay(id,b.dataset.kind,b.dataset.id))}function addForm(uid){box.innerHTML=`<button class="btn close" id="x">✕</button><h2>➕ Добавить начисление</h2><div class="formbox"><label>Тип<br><select id="type"><option value="service">🧺 Услуга</option><option value="kitchen">🥗 Кухня Veg Raw</option><option value="booking">🛏 Бронирование</option></select></label><div id="fields"></div><button class="btn" id="save">Добавить начисление</button></div>`;document.getElementById('x').onclick=()=>openUser(uid);const type=document.getElementById('type'),fields=document.getElementById('fields');function render(){if(type.value==='service')fields.innerHTML=`<select id="service"><option value="">Выберите услугу</option>${serviceCatalog.map(s=>`<option value="${s.id}">${E(s.name)} — ${M(s.price)}</option>`).join('')}</select><input id="qty" type="number" min="1" value="1" placeholder="Количество"><input id="comment" placeholder="Комментарий">`;else if(type.value==='kitchen')fields.innerHTML=`<input id="item" placeholder="Блюдо / состав заказа"><div class="grid"><input id="qty" type="number" min="1" value="1" placeholder="Количество"><input id="price" type="number" min="0" placeholder="Цена за единицу"></div><input id="comment" placeholder="Комментарий">`;else fields.innerHTML=`<select id="room"><option value="">Выберите номер</option>${rooms.map(r=>`<option value="${r.id}">${E(r.name)} — ${M(r.price_per_night)}/ночь</option>`).join('')}</select><div class="grid"><input id="checkin" type="date"><input id="checkout" type="date"></div><input id="guests" type="number" min="1" value="1" placeholder="Количество гостей"><input id="comment" placeholder="Комментарий>`}type.onchange=render;render();document.getElementById('save').onclick=async()=>{if(type.value==='service'){const sid=document.getElementById('service').value,svc=serviceCatalog.find(s=>s.id===sid),qty=Number(document.getElementById('qty').value)||1;if(!svc)return alert('Выберите услугу');const r=await db.from('service_orders').insert({user_id:uid,service_id:sid,service_name:svc.name,unit:svc.unit||'шт',quantity:qty,unit_price:svc.price,total_amount:svc.price*qty,status:'новый',comment:document.getElementById('comment').value||null});if(r.error)return alert(r.error.message)}else if(type.value==='kitchen'){const item=document.getElementById('item').value.trim(),qty=Number(document.getElementById('qty').value)||1,price=Number(document.getElementById('price').value)||0;if(!item||!price)return alert('Укажите блюдо и цену');const u=users.find(x=>x.user_id===uid),p=profile(u,uid),r=await db.from('orders').insert({user_id:uid,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,items:[{name:item,price,quantity:qty,comment:document.getElementById('comment').value||''}],total_amount:price*qty,status:'новый',payment_status:'не оплачено',paid_amount:0,discount_amount:0}).select('id').single();if(r.error)return alert(r.error.message)}else{const rid=document.getElementById('room').value,ci=document.getElementById('checkin').value,co=document.getElementById('checkout').value,g=Number(document.getElementById('guests').value)||1,room=rooms.find(r=>r.id===rid);if(!room||!ci||!co)return alert('Выберите номер и даты');const nights=Math.ceil((new Date(co)-new Date(ci))/86400000);if(nights<=0)return alert('Дата выезда должна быть позже заезда');const u=users.find(x=>x.user_id===uid),p=profile(u,uid),r=await db.from('bookings').insert({room_id:rid,user_id:uid,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,check_in_date:ci,check_out_date:co,guest_count:g,total_amount:room.price_per_night*nights,discount_amount:0,paid_amount:0,status:'новое',payment_status:'не оплачено',services:[]}).select('id').single();if(r.error)return alert(r.error.message)}alert('Начисление добавлено');await load();openUser(uid)}}async function pay(uid,kind,id){const amount=Number(prompt('Сколько оплатить?'));if(!amount||amount<1)return;const method=prompt('Метод: нал / безнал / бонусы','безнал');if(!method)return;const args={p_amount:amount,p_payment_method:method};if(kind==='booking')args.p_booking_id=id;else args.p_order_id=id;const r=await db.rpc('record_payment',args);if(r.error)return alert('Ошибка платежа: '+r.error.message);alert('Оплата внесена: '+M(amount));await load();openUser(uid)}document.getElementById('users').addEventListener('click',e=>{const b=e.target.closest('.user-btn');if(b)openUser(b.dataset.id)});modal.addEventListener('click',e=>{if(e.target===modal)close()});load()</script></body></html>
