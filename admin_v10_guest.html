<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Профиль гостя</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.profile{max-width:1100px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 10px;border-radius:999px;background:#181c2d;border:1px solid var(--fd-line);color:var(--fd-muted);font-size:13px}.money{font-weight:700}.debt{color:#ff6b6b}.ok{color:#32d583}.section{margin-top:16px}.section h2{margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--fd-line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-weight:650}.muted{color:var(--fd-muted);font-size:13px;margin-top:4px}.back{margin-bottom:14px}@media(max-width:700px){.hero{flex-direction:column}.row{align-items:flex-start}.row-right{text-align:right}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin.html">💰 <span class="label">Финансы</span></a><a href="admin_v9_events.html">📋 <span class="label">Регистрации</span></a></nav></aside><main class="fd-main"><div class="fd-container profile"><a class="fd-btn back" href="admin_v10.html">← К гостям</a><div id="app"><div class="fd-card">Загрузка профиля…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=d=>d?new Date(d).toLocaleDateString('ru-RU'):'—';const status=s=>({confirmed:'Подтверждена',new:'Новая',cancelled:'Отменена'}[s]||s||'—');async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('app').innerHTML='<div class="fd-card">Не указан ID гостя.</div>';return}const [{data:u,error:ue},{data:events,error:ee},{data:bookings,error:be},{data:orders,error:oe},{data:payments,error:pe}]=await Promise.all([sb.from('users').select('*').eq('user_id',id).single(),sb.from('event_registrations').select('id,event_id,participants,amount,paid_amount,status,payment_status,comment,created_at,events(name,event_date,start_time,location)').eq('user_id',id).order('created_at',{ascending:false}),sb.from('bookings').select('id,check_in_date,check_out_date,status,total_amount,paid_amount,payment_status,payment_method,guest_count,room_id,created_at').eq('user_id',id).order('created_at',{ascending:false}),sb.from('orders').select('id,total_amount,paid_amount,status,payment_status,items,created_at').eq('user_id',id).order('created_at',{ascending:false}),sb.from('payments').select('id,amount,method,payment_method,status,note,created_at').eq('user_id',id).order('created_at',{ascending:false})]);if(ue){$('app').innerHTML='<div class="fd-card">Ошибка: '+esc(ue.message)+'</div>';return}const ev=events||[],bk=bookings||[],ord=orders||[],pay=payments||[];const debt=Number(u.total_debt)||0;const balance=Number(u.balance)||0;const eventDebt=ev.reduce((s,x)=>s+Math.max(0,(Number(x.amount)||0)-(Number(x.paid_amount)||0)),0);const bookingDebt=bk.reduce((s,x)=>s+Math.max(0,(Number(x.total_amount)||0)-(Number(x.paid_amount)||0)),0);const orderDebt=ord.reduce((s,x)=>s+Math.max(0,(Number(x.total_amount)||0)-(Number(x.paid_amount)||0)),0);$('app').innerHTML=`<div class="fd-card"><div class="hero"><div><h1>${esc(u.Display_name||'Гость')}</h1><div class="muted">📞 ${esc(u.Phone||'—')} ${u.Email?' · ✉️ '+esc(u.Email):''}</div><div class="chips"><span class="chip">🎫 ${ev.length} событий</span><span class="chip">🏠 ${bk.length} бронирований</span><span class="chip">🍲 ${ord.length} заказов</span></div></div><div style="text-align:right"><div class="muted">Текущий долг</div><div class="money ${debt?'debt':'ok'}" style="font-size:28px">${money(debt)}</div></div></div></div><div class="fd-grid section"><div class="fd-card"><div class="fd-stat-label">Долг в профиле</div><div class="fd-stat-value ${debt?'red':''}">${money(debt)}</div></div><div class="fd-card"><div class="fd-stat-label">Баланс</div><div class="fd-stat-value">${money(balance)}</div></div><div class="fd-card"><div class="fd-stat-label">Долг по событиям</div><div class="fd-stat-value">${money(eventDebt)}</div></div><div class="fd-card"><div class="fd-stat-label">Долг по заказам</div><div class="fd-stat-value">${money(orderDebt+bookingDebt)}</div></div></div><div class="fd-card section"><div class="section"><h2>🎫 События</h2>${ev.length?ev.map(x=>{const e=x.events||{},a=Number(x.amount)||0,p=Number(x.paid_amount)||0,d=Math.max(0,a-p);return `<div class="row"><div class="row-main"><div class="row-title">${esc(e.name||'Событие')}</div><div class="muted">${date(e.event_date)}${e.start_time?' · '+esc(e.start_time):''}${e.location?' · 📍 '+esc(e.location):''} · ${Number(x.participants)||1} участник(ов)</div></div><div class="row-right">${a?'<div>'+money(a)+'</div><div class="muted">'+(p?'оплачено '+money(p):'не оплачено')+'</div>':'<div class="ok">Бесплатно</div>'}${d?'<div class="debt">долг '+money(d)+'</div>':''}<div class="muted">${esc(status(x.status))}</div></div></div>`}).join(''):'<div class="muted">Нет регистраций.</div>'}</div><div class="section"><h2>🏠 Бронирования</h2>${bk.length?bk.map(x=>{const d=Math.max(0,(Number(x.total_amount)||0)-(Number(x.paid_amount)||0));return `<div class="row"><div class="row-main"><div class="row-title">Проживание · ${date(x.check_in_date)} — ${date(x.check_out_date)}</div><div class="muted">${Number(x.guest_count)||1} гост. · статус: ${esc(x.status||'—')}</div></div><div class="row-right"><div>${money(x.total_amount)}</div><div class="muted">оплачено ${money(x.paid_amount)}</div>${d?'<div class="debt">долг '+money(d)+'</div>':''}</div></div>`}).join(''):'<div class="muted">Нет бронирований.</div>'}</div><div class="section"><h2>🍲 Заказы</h2>${ord.length?ord.map(x=>{const d=Math.max(0,(Number(x.total_amount)||0)-(Number(x.paid_amount)||0));return `<div class="row"><div class="row-main"><div class="row-title">Заказ · ${date(x.created_at)}</div><div class="muted">Статус: ${esc(x.status||'—')} · оплата: ${esc(x.payment_status||'—')}</div></div><div class="row-right"><div>${money(x.total_amount)}</div><div class="muted">оплачено ${money(x.paid_amount)}</div>${d?'<div class="debt">долг '+money(d)+'</div>':''}</div></div>`}).join(''):'<div class="muted">Нет заказов.</div>'}</div><div class="section"><h2>💳 Платежи</h2>${pay.length?pay.map(x=>`<div class="row"><div><div class="row-title">${money(x.amount)}</div><div class="muted">${date(x.created_at)} · ${esc(x.payment_method||x.method||'—')} ${x.note?'· '+esc(x.note):''}</div></div><div class="row-right"><span class="chip">${esc(x.status||'—')}</span></div></div>`).join(''):'<div class="muted">Платежей пока нет.</div>'}</div></div>`}load();</script></body></html>
