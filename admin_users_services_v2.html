<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — Финансы</title><style>html,body{margin:0;height:100%;background:#0b0d17}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="admin_users_services.html"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;const old=w.profile;w.profile=async uid=>{const u=w.users?.find(x=>x.user_id===uid);if(!u)return;const [r,p]=await Promise.all([w.sb.from('user_financial_breakdown').select('*').eq('user_id',uid).order('created_at',{ascending:false}),w.sb.from('payments').select('id,amount,payment_method,note,status,created_at').eq('user_id',uid).order('created_at',{ascending:false})]);if(r.error)return w.toast(r.error.message);if(p.error)return w.toast(p.error.message);const f=w.summary(uid),rows=r.data||[],payments=p.data||[],debt=rows.filter(x=>x.debt>0);d.getElementById('modal').classList.remove('hidden');d.getElementById('modal').innerHTML=`<div class="modalbox"><div class="row"><div><h2>${w.esc(u.Display_name||'Без имени')}</h2><div class="muted">${w.esc(u.Phone||'Телефон не указан')} · ${w.esc(u.Email||'')}</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="stats"><div class="stat">Начислено<b>${w.money(f.total_charged)}</b></div><div class="stat">Оплачено<b class="green">${w.money(f.total_paid)}</b></div><div class="stat">Долг<b class="${f.total_debt?'red':'green'}">${w.money(f.total_debt)}</b></div><div class="stat">Статус<b>${w.esc(f.payment_status)}</b></div></div><div class="actions"><button class="btn primary" ${f.total_debt?'':'disabled'} onclick="openUserPayment('${uid}')">💰 Оплатить долг</button></div><h2 style="margin-top:20px">За что должен</h2><div class="paygrid"><b>Начисление</b><b>Начислено</b><b>Оплачено</b><b>Долг</b>${debt.map(x=>`<div><b>${w.esc(x.label)}</b><div class="small">${x.charge_type==='booking'?`${x.check_in_date||''} → ${x.check_out_date||''}`:x.charge_type==='service'?`${x.service_quantity||1} ${w.esc(x.service_unit||'шт.')}`:'Veg Raw'}</div></div><div>${w.money(x.charged)}</div><div class="green">${w.money(x.paid)}</div><div class="red"><b>${w.money(x.debt)}</b></div>`).join('')}<div><b>Итого</b></div><div><b>${w.money(f.total_charged)}</b></div><div class="green"><b>${w.money(f.total_paid)}</b></div><div class="red"><b>${w.money(f.total_debt)}</b></div></div><h2 style="margin-top:20px">История оплат</h2>${payments.map(x=>`<div class="line"><div class="row"><div><b>${w.money(x.amount)}</b><div class="small">${new Date(x.created_at).toLocaleString('ru-RU')} · ${w.esc(x.payment_method||'')}</div><div class="small">${w.esc(x.note||'')}</div></div><span class="status greenbg">${w.esc(x.status||'')}</span></div></div>`).join('')||'<div class="muted">Оплат ещё нет</div>'}</div>`};const s=d.createElement('style');s.textContent='.paygrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px}.paygrid>*{padding:9px;background:#101321;border-radius:8px}.green{color:#32d583}.red{color:#ff6b6b}.muted,.small{color:#8f95ab}';d.head.appendChild(s)});
</script></body></html>
