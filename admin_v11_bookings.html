<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Бронирования</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.booking{padding:16px;background:linear-gradient(180deg,#141927,#10131e);border:1px solid var(--fd-line);border-radius:16px;margin-top:10px}.booking-top{display:flex;justify-content:space-between;gap:12px}.booking-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.booking-meta span{padding:7px 9px;background:var(--fd-panel2);border-radius:9px;color:#cbd1df;font-size:13px}.money{font-size:20px;font-weight:850}.debt{color:var(--fd-red)}.paid{color:var(--fd-green)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input{flex:1;min-width:220px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0c1019;border:1px solid var(--fd-line);border-radius:12px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.booking-top{display:block}.booking-top>div:last-child{margin-top:10px}.filters input{min-width:100%}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a class="active" href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Бронирования</h1><div class="fd-sub">Проживание, даты, оплата и связь с гостем</div></div><div class="fd-actions"><button class="fd-btn" onclick="load()">↻ Обновить</button><a class="fd-btn primary" href="admin_v10.html">👥 Гости</a></div></header><section class="fd-card"><div class="stats"><div class="stat"><span class="fd-muted">Активные</span><b id="active">—</b></div><div class="stat"><span class="fd-muted">Гости</span><b id="guests">—</b></div><div class="stat"><span class="fd-muted">Начислено</span><b id="charged">—</b></div><div class="stat"><span class="fd-muted">Долг</span><b id="debt" class="debt">—</b></div></div></section><section class="fd-card" style="margin-top:16px"><div class="filters"><input id="q" class="fd-search" placeholder="Поиск: имя, телефон, номер"><button id="activeOnly" class="fd-btn primary">Активные</button><button id="all" class="fd-btn">Все</button><button id="debtOnly" class="fd-btn">🔴 С долгом</button></div><div id="list">Загрузка…</div></section></div></main></div><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let rows=[],mode='active';async function load(){const {data,error}=await db.from('bookings').select('*,rooms(name)').order('check_in_date',{ascending:false});if(error){$('list').innerHTML='<div class="fd-empty" style="color:var(--fd-red)">'+esc(error.message)+'</div>';return}rows=data||[];updateStats();render()}function active(b){return !['отменено','отменена','cancelled','canceled','завершена','завершено'].includes(String(b.status||'').toLowerCase())}function updateStats(){const a=rows.filter(active),valid=rows.filter(b=>!['отменено','отменена','cancelled','canceled'].includes(String(b.status||'').toLowerCase())),charged=valid.reduce((s,b)=>s+Math.max((Number(b.total_amount)||0)-(Number(b.discount_amount)||0),0),0),debt=valid.reduce((s,b)=>s+Math.max((Number(b.total_amount)||0)-(Number(b.discount_amount)||0)-(Number(b.paid_amount)||0),0),0);$('active').textContent=a.length;$('guests').textContent=new Set(a.map(b=>b.user_id||b.guest_phone||b.guest_name)).size;$('charged').textContent=money(charged);$('debt').textContent=money(debt)}function render(){const q=$('q').value.trim().toLowerCase();const list=rows.filter(b=>{const txt=[b.guest_name,b.guest_phone,b.guest_email,b.rooms?.name].join(' ').toLowerCase();const d=Math.max((Number(b.total_amount)||0)-(Number(b.discount_amount)||0)-(Number(b.paid_amount)||0),0);return (!q||txt.includes(q))&&(mode==='all'||(mode==='active'&&active(b))||(mode==='debt'&&d>0))});$('list').innerHTML=list.map(b=>{const total=Math.max((Number(b.total_amount)||0)-(Number(b.discount_amount)||0),0),paid=Number(b.paid_amount)||0,due=Math.max(total-paid,0),cancel=['отменено','отменена','cancelled','canceled'].includes(String(b.status||'').toLowerCase());return `<article class="booking"><div class="booking-top"><div><div class="fd-kicker">${esc(b.status||'Бронирование')}</div><h2 style="margin:4px 0">${esc(b.rooms?.name||'Номер не указан')}</h2><div><b>${esc(b.guest_name||'Гость')}</b></div><div class="fd-muted">${esc(b.guest_phone||b.guest_email||'')}</div></div><div style="text-align:right"><div class="money ${due?'debt':'paid'}">${money(due)}</div><div class="fd-muted">${due?'долг':'оплачено'}</div></div></div><div class="booking-meta"><span>📅 ${new Date(b.check_in_date+'T00:00:00').toLocaleDateString('ru-RU')} → ${new Date(b.check_out_date+'T00:00:00').toLocaleDateString('ru-RU')}</span><span>👥 ${Number(b.guest_count)||1}</span><span>💰 ${money(total)}</span><span>💳 ${money(paid)}</span></div><div class="actions">${b.user_id?`<a class="fd-btn" href="admin_v11_guest_profile.html?id=${encodeURIComponent(b.user_id)}">👤 Профиль гостя</a>`:''}${b.user_id&&due&&!cancel?`<a class="fd-btn primary" href="admin_v11_finance_detail.html?type=booking&id=${encodeURIComponent(b.id)}&user_id=${encodeURIComponent(b.user_id)}">💳 Оплатить долг ${money(due)}</a>`:''}</div></article>`}).join('')||'<div class="fd-empty">Нет подходящих бронирований.</div>'}$('q').oninput=render;$('activeOnly').onclick=()=>{mode='active';setButtons();render()};$('all').onclick=()=>{mode='all';setButtons();render()};$('debtOnly').onclick=()=>{mode='debt';setButtons();render()};function setButtons(){$('activeOnly').classList.toggle('primary',mode==='active');$('all').classList.toggle('primary',mode==='all');$('debtOnly').classList.toggle('primary',mode==='debt')}load();</script></body></html>
