<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom — живая доступность</title><style>body{margin:0;font:15px system-ui;background:#f2f7f2;color:#21342b}main{max-width:1100px;margin:auto;padding:28px}.glass{background:#ffffffbb;backdrop-filter:blur(18px);border:1px solid #fff;border-radius:28px;padding:20px;box-shadow:0 20px 60px #294a3814}h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.06em;margin:8px 0}.sub{color:#708078}.dates{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,button{padding:13px 15px;border-radius:14px;border:1px solid #dbe5de;background:white;font:inherit}button{background:#21342b;color:white;cursor:pointer}.status{margin:12px 0;color:#5d7168}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:18px;border-radius:22px;background:#ffffffaa;border:1px solid #fff}.free{border-color:#9ddbbf}.busy{border-color:#e7b6c3;background:#fff7f8}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#68c39b;margin-right:7px}.busy .dot{background:#d77d92}.price{font-weight:700;margin-top:10px}.muted{color:#718078;font-size:13px}.error{color:#a33} @media(max-width:600px){main{padding:18px}.dates>*{width:100%}}</style></head><body><main><section class="glass"><div class="muted">FreeDom · живая доступность</div><h1>Выберите даты.</h1><div class="sub">Карта теперь получает состояние объектов из серверного слоя доступности. Цены пока не показываем как актуальные.</div><div class="dates"><label>Заезд<br><input id="in" type="date"></label><label>Выезд<br><input id="out" type="date"></label><button id="go">Проверить</button></div><div id="status" class="status">Выберите период.</div><div id="grid" class="grid"></div></section></main><script>const FN='https://vutmbhsclmcfqqlzxqkc.supabase.co/functions/v1/public-availability';const API_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1dG1iaHNjbG1jZnFxbHp4qkcifQ';const $=id=>document.getElementById(id);function date(d){return d.toISOString().slice(0,10)}const now=new Date();const tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);$('in').value=date(now);$('out').value=date(tomorrow);$('go').onclick=async()=>{const check_in=$('in').value,check_out=$('out').value;if(!check_in||!check_out||check_out<=check_in){$('status').innerHTML='<span class="error">Проверьте даты.</span>';return}$('status').textContent='Проверяем доступность…';$('grid').innerHTML='';try{const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY,'apikey':API_KEY},body:JSON.stringify({check_in,check_out})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'Ошибка');$('status').textContent='Доступность на '+check_in+' → '+check_out;for(const x of data.rooms){const card=document.createElement('article');card.className='card '+(x.available?'free':'busy');const label=x.available?'Свободно':'Занято';const places=x.booking_mode==='places'?`<div class="muted">Свободных мест: <b>${x.free_places}</b> из ${x.capacity}</div>`:`<div class="muted">${x.available?'Можно забронировать целиком':'Забронировано целиком'}</div>`;card.innerHTML=`<div><span class="dot"></span>${label}</div><h3>${x.name}</h3>${places}`; $('grid').appendChild(card)}}catch(e){console.error(e);$('status').innerHTML='<span class="error">Не удалось получить доступность. Серверный слой отвечает с ошибкой.</span>'}};</script></body></html>
