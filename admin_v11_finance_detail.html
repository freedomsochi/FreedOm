<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Начисление</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.big{font-size:30px;font-weight:800}.meta{color:var(--fd-muted);margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--fd-line)}.row:first-child{border-top:0}.danger{color:#ff6b6b}.ok{color:#42d392}.form{display:grid;gap:10px;max-width:420px}.form input,.form select{padding:11px;border-radius:10px;border:1px solid var(--fd-line);background:#181c2d;color:#fff}.msg{padding:10px;border-radius:10px;background:#181c2d}.hide{display:none}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a class="active" href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a href="admin_v10_finance.html" class="fd-muted">← Финансы</a><h1 class="fd-title">Детализация начисления</h1></div></header><div id="app"><div class="fd-card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id'),uid=p.get('user_id');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const labels={booking:'🛏️ Проживание',order:'🍲 Veg Raw',service:'🧾 Услуга',event:'🎫 Событие'};async function load(){if(!type||!id||!uid){$('app').innerHTML='<div class="fd-card">Не указано начисление.</div>';return}let row=null;if(type==='booking')row=(await sb.from('bookings').select('*').eq('id',id).eq('user_id',uid).single()).data;if(type==='order')row=(await sb.from('orders').select('*').eq('id',id).eq('user_id',uid).single()).data;if(type==='service')row=(await sb.from('service_orders').select('*').eq('id',id).eq('user_id',uid).single()).data;if(type==='event')row=(await sb.from('event_registrations').select('*,events(name,event_date,start_time,location)').eq('id',id).eq('user_id',uid).single()).data;if(!row){$('app').innerHTML='<div class="fd-card">Начисление не найдено.</div>';return}const total=type==='event'?Number(row.amount)||0:Math.max((Number(row.total_amount)||0)-(Number(row.discount_amount)||0),0);const paid=type==='event'?Number(row.paid_amount)||0:Number(row.paid_amount)||0;const due=Math.max(total-paid,0);$('app').innerHTML=`<section class="fd-card"><div class="hero"><div><div class="meta">${labels[type]}</div><h2 style="margin:6px 0">${esc(type==='event'?(row.events?.name||'Событие'):row.name||row.title||row.room_name||row.service_name||'Начисление')}</h2><div class="meta">Пользователь: <a href="admin_v11_guest_profile.html?id=${encodeURIComponent(uid)}">${esc(uid)}</a></div></div><div><div class="meta">Остаток</div><div class="big ${due?'danger':'ok'}">${money(due)}</div></div></div><div style="margin-top:18px"><div class="row"><span>Начислено</span><b>${money(total)}</b></div><div class="row"><span>Оплачено</span><b class="ok">${money(paid)}</b></div><div class="row"><span>Остаток</span><b class="${due?'danger':'ok'}">${money(due)}</b></div></div></section><section class="fd-card" style="margin-top:14px"><h2>💳 Записать оплату</h2>${due?`<div class="form"><input id="amount" type="number" min="1" max="${due}" value="${due}" placeholder="Сумма"><select id="method"><option>Перевод</option><option>Наличные</option><option>Карта</option><option>Другое</option></select><input id="note" placeholder="Комментарий"><button class="fd-btn primary" onclick="pay()">Записать оплату</button><div id="msg" class="msg hide"></div></div>`:'<div class="msg ok">Начисление полностью оплачено.</div>'}</section></div>}async function pay(){const amount=Number($('amount').value);if(!amount)return;const {data,error}=await sb.rpc('record_user_payment_for_charge',{p_user_id:uid,p_charge_type:type,p_charge_id:id,p_amount:amount,p_payment_method:$('method').value,p_note:$('note').value||null});$('msg').classList.remove('hide');if(error){$('msg').className='msg danger';$('msg').textContent=error.message;return}$('msg').className='msg ok';$('msg').textContent='Оплата записана. Обновляем…';setTimeout(load,500)}load();</script></body></html>
