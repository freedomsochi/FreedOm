<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Начисление</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.hero{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.big{font-size:30px;font-weight:800}.meta{color:var(--fd-muted);margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--fd-line)}.row:first-child{border-top:0}.danger{color:#ff6b6b}.ok{color:#42d392}.form{display:grid;gap:10px;max-width:420px}.form input,.form select{padding:11px;border-radius:10px;border:1px solid var(--fd-line);background:#181c2d;color:#fff}.msg{padding:10px;border-radius:10px;background:#181c2d}.hide{display:none}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a class="active" href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><a href="admin_v10_finance.html" class="fd-muted">← Финансы</a><h1 class="fd-title">Детализация начисления</h1></div></header><div id="app"><div class="fd-card">Загрузка…</div></div></div></main></div><script>
const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');
const p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id');
let uid=null;
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const labels={booking:'🛏️ Проживание',order:'🍲 Veg Raw',service:'🧾 Услуга',event:'🎫 Событие'};
let currentCharge=null;
async function load(){
 if(!type||!id||!['booking','order','service','event'].includes(type)){$('app').innerHTML='<div class="fd-card">Не указано начисление.</div>';return}
 const {data,error}=await sb.rpc('admin_get_finance_charge_detail',{p_charge_type:type,p_charge_id:id});
 if(error){$('app').innerHTML='<div class="fd-card">Ошибка загрузки начисления: '+esc(error.message)+'</div>';return}
 if(!data||!data.charge){$('app').innerHTML='<div class="fd-card">Начисление не найдено.</div>';return}
 const row=data.charge,alloc=data.allocations||[];currentCharge=row;uid=row.user_id||null;
 const total=type==='event'?Number(row.amount)||0:Math.max((Number(row.total_amount)||0)-(Number(row.discount_amount)||0),0);
 const paid=alloc.reduce((s,a)=>s+(Number(a.amount)||0),0),due=Math.max(total-paid,0);
 const title=type==='event'?(row.event_name||'Событие'):type==='booking'?(row.room_name||'Номер'):row.service_name||row.name||row.title||'Начисление';
 const details=type==='booking'?'<div class="row"><span>Заезд / выезд</span><b>'+esc(row.check_in_date||'—')+' — '+esc(row.check_out_date||'—')+'</b></div>':type==='event'?'<div class="row"><span>Дата события</span><b>'+esc(row.event_date||'—')+' '+esc(row.start_time||'')+'</b></div>':'';
 const history=alloc.length?alloc.map(a=>'<div class="row"><span>'+esc(a.created_at?new Date(a.created_at).toLocaleString('ru-RU'):'Оплата')+' · '+esc(a.payment_method||a.method||'')+(a.note?' · '+esc(a.note):'')+'</span><b class="ok">'+money(a.amount)+'</b></div>').join(''):'<div class="msg">Успешных оплат пока нет.</div>';
 $('app').innerHTML=`<section class="fd-card"><div class="hero"><div><div class="meta">${labels[type]}</div><h2 style="margin:6px 0">${esc(title)}</h2><div class="meta">${uid?'<a href="admin_v11_guest_profile.html?id='+encodeURIComponent(uid)+'">← Профиль гостя</a>':'Пользователь не привязан'}</div></div><div><div class="meta">Остаток</div><div class="big ${due?'danger':'ok'}">${money(due)}</div></div></div><div style="margin-top:18px"><div class="row"><span>Начислено</span><b>${money(total)}</b></div><div class="row"><span>Оплачено</span><b class="ok">${money(paid)}</b></div><div class="row"><span>Остаток</span><b class="${due?'danger':'ok'}">${money(due)}</b></div>${details}</div></section><section class="fd-card" style="margin-top:14px"><h2>История успешных оплат</h2>${history}</section><section class="fd-card" style="margin-top:14px"><h2>💳 Записать оплату</h2>${due&&uid?`<div class="form"><input id="amount" type="number" min="1" max="${due}" value="${due}" placeholder="Сумма"><select id="method"><option>Перевод</option><option>Наличные</option><option>Карта</option><option>Другое</option></select><input id="note" placeholder="Комментарий"><button class="fd-btn primary" onclick="pay()">Записать оплату</button><div id="msg" class="msg hide"></div></div>`:'<div class="msg">'+(uid?'Начисление полностью оплачено.':'Нельзя записать оплату: начисление не связано с пользователем.')+'</div>'}</section>`;
}
async function pay(){
 const amount=Number($('amount').value);
 if(!Number.isFinite(amount)||amount<=0){$('msg').classList.remove('hide');$('msg').className='msg danger';$('msg').textContent='Введите корректную сумму.';return}
 const {error}=await sb.rpc('record_user_payment_for_charge',{p_user_id:uid,p_charge_type:type,p_charge_id:id,p_amount:amount,p_payment_method:$('method').value,p_note:$('note').value||null});
 $('msg').classList.remove('hide');
 if(error){$('msg').className='msg danger';$('msg').textContent=error.message;return}
 $('msg').className='msg ok';$('msg').textContent='Оплата записана. Обновляем…';setTimeout(load,500);
}
load();
</script></body></html>
