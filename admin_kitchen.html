<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Кухня</title><link rel="stylesheet" href="admin_design.css"><link rel="stylesheet" href="admin_mobile_pass.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--mint:#1fb7a6;--ink:#17222b;--muted:#71808b;--line:rgba(37,70,82,.12)}body{background:radial-gradient(circle at 8% 4%,rgba(104,221,196,.18),transparent 28%),radial-gradient(circle at 92% 6%,rgba(143,146,245,.15),transparent 30%),linear-gradient(135deg,#f5fbf8,#f7f7ff 48%,#eef8f7);color:var(--ink)}.fd-sidebar{background:rgba(255,255,255,.62)!important;backdrop-filter:blur(20px);border-right:1px solid var(--line)!important}.fd-brand{color:var(--ink)!important}.fd-brand span{color:var(--mint)!important}.fd-nav a{color:#52626d!important;border-radius:12px}.fd-nav a:hover,.fd-nav a.active{background:rgba(31,183,166,.1)!important;color:var(--ink)!important}.fd-container{max-width:1320px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}.sub{color:var(--muted);margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:15px;box-shadow:0 12px 35px rgba(41,77,86,.06)}.stat small{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:4px}.workspace{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{flex:1;min-width:220px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:999px;padding:9px 12px;font:inherit;color:var(--ink);white-space:nowrap;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.column{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:12px;min-width:0}.column-head{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 10px}.column-title{font-weight:800}.count{font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 8px;border-radius:999px}.orders{display:grid;gap:9px}.order{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:17px;padding:14px;box-shadow:0 10px 30px rgba(41,77,86,.055)}.order-top{display:flex;justify-content:space-between;gap:10px}.guest{font-weight:800}.time{font-size:11px;color:var(--muted);margin-top:3px}.amount{text-align:right;font-weight:800;white-space:nowrap}.items{margin-top:10px;padding:10px 11px;background:#f5f8f7;border-radius:12px;font-size:12px;color:#4f6069;line-height:1.45}.debt{color:#d45764}.paid{color:#16866f}.actions{display:flex;gap:6px;margin-top:11px}.actions .fd-btn{flex:1;justify-content:center;min-height:34px;font-size:12px}.empty{padding:22px 6px;text-align:center;color:var(--muted);font-size:13px}.hint{font-size:12px;color:var(--muted)}@media(max-width:1050px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.board{display:block}.column{margin-bottom:10px}.toolbar{display:block}.toolbar input{width:100%;box-sizing:border-box;margin-bottom:8px}.head .fd-btn{width:100%;justify-content:center}}
</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a class="active" href="admin_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div class="head"><div><div class="fd-kicker">FreeDom · service</div><h1 class="fd-title">Кухня</h1><div class="sub">Рабочий экран кухни: новые заказы → приготовление → готово → архив.</div></div><button id="refresh" class="fd-btn">↻ Обновить</button></div></header><section class="stats"><div class="stat"><small>Новые</small><b id="sNew">—</b></div><div class="stat"><small>Готовятся</small><b id="sPrep">—</b></div><div class="stat"><small>Готовы</small><b id="sReady">—</b></div><div class="stat"><small>Долг кухни</small><b id="sDebt" class="debt">—</b></div></section><section class="workspace"><div class="toolbar"><input id="q" class="fd-search" placeholder="Поиск: имя, телефон, email"><div id="tabs" class="tabs"><button class="tab active" data-filter="active">Активные</button><button class="tab" data-filter="new">Новые</button><button class="tab" data-filter="preparing">Готовятся</button><button class="tab" data-filter="ready">Готовы</button><button class="tab" data-filter="completed">Архив</button><button class="tab" data-filter="debt">🔴 С долгом</button></div></div><div id="board" class="board"></div></section></div></main></div><script>
const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const cancelled=s=>['cancelled','canceled','отменён','отменено','отменена'].includes(String(s||'').toLowerCase());const norm=s=>{const v=String(s||'').toLowerCase();if(['new','новый','новая','новое','заказ'].includes(v))return'new';if(['preparing','готовится','готовим','в работе'].includes(v))return'preparing';if(['ready','готов','готово'].includes(v))return'ready';if(['completed','завершён','завершено','выполнен'].includes(v))return'completed';return v||'new'};const labels={new:'Новые',preparing:'Готовятся',ready:'Готовы',completed:'Архив'};const transitions={new:[['preparing','▶ В работу']],preparing:[['ready','✓ Готово']],ready:[['completed','Архив →']]};let rows=[],filter='active';function total(o){return Math.max((Number(o.total_amount)||0)-(Number(o.discount_amount)||0),0)}function due(o){return Math.max(total(o)-(Number(o.paid_amount)||0),0)}function itemText(items){if(!items)return'Состав заказа не указан';if(Array.isArray(items))return items.map(i=>typeof i==='string'?i:`${i.name||i.title||'Позиция'}${i.quantity?' × '+i.quantity:''}`).join(' · ');if(typeof items==='object')return Object.entries(items).map(([k,v])=>`${k}${typeof v==='number'?' × '+v:''}`).join(' · ');return String(items)}async function load(){const{data,error}=await sb.rpc('admin_get_kitchen_orders');if(error){$('board').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data?.orders||[];stats();render()}function stats(){const active=rows.filter(o=>!cancelled(o.status));$('sNew').textContent=active.filter(o=>norm(o.status)==='new').length;$('sPrep').textContent=active.filter(o=>norm(o.status)==='preparing').length;$('sReady').textContent=active.filter(o=>norm(o.status)==='ready').length;$('sDebt').textContent=money(active.reduce((s,o)=>s+due(o),0))}function matches(o){const q=$('q').value.trim().toLowerCase(),text=[o.guest_name,o.guest_phone,o.guest_email].join(' ').toLowerCase(),st=norm(o.status);if(q&&!text.includes(q))return false;if(filter==='active')return!cancelled(o.status)&&st!=='completed';if(filter==='debt')return!cancelled(o.status)&&due(o)>0;return st===filter}function card(o){const st=norm(o.status),d=due(o),t=total(o),p=Number(o.paid_amount)||0,actions=(transitions[st]||[]).map(([next,label])=>`<button class="fd-btn primary" onclick="changeStatus('${o.id}','${next}',this)">${label}</button>`).join('');return `<article class="order"><div class="order-top"><div><div class="guest">${esc(o.guest_name||'Гость')}</div><div class="time">${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):'—'} · ${esc(labels[st]||o.status||'Новый')}</div></div><div class="amount ${d?'debt':'paid'}">${money(d)}<div class="hint">${d?'долг':'оплачено'}</div></div></div><div class="items">🍽️ ${esc(itemText(o.items))}</div><div class="hint" style="margin-top:8px">Заказ ${money(t)} · оплачено ${money(p)}</div><div class="actions">${o.user_id?`<a class="fd-btn" href="admin_guest_profile.html?id=${encodeURIComponent(o.user_id)}&from=guests">👤 Гость</a>`:''}${actions}</div></article>`}function render(){const groups=['new','preparing','ready','completed'];const shown=rows.filter(matches);const cols=filter==='active'||filter==='debt'?groups.slice(0,3):[filter];$('board').innerHTML=cols.map(st=>{const list=shown.filter(o=>norm(o.status)===st);return `<section class="column"><div class="column-head"><div class="column-title">${labels[st]}</div><div class="count">${list.length}</div></div><div class="orders">${list.map(card).join('')||'<div class="empty">Пусто</div>'}</div></section>`}).join('')}async function changeStatus(id,next,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Сохраняем…';const{error}=await sb.rpc('admin_update_kitchen_order_status',{p_order_id:id,p_status:next});if(error){btn.disabled=false;btn.textContent=old;alert(error.message);return}await load()}$('refresh').onclick=load;$('q').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
