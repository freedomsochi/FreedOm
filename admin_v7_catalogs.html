<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v7 — Справочники</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:18px}.wrap{max-width:1000px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{padding:11px 14px;border:0;border-radius:10px;background:#263149;color:#fff;cursor:pointer}.tab.active{background:#d4af37;color:#111}.panel{display:none;background:#151c30;padding:18px;border-radius:16px}.panel.active{display:block}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #303a52}.muted{color:#9aa3b8}.price{font-weight:bold}.badge{padding:4px 8px;border-radius:8px;background:#263149}.btn{padding:9px 12px;border:0;border-radius:9px;background:#d4af37;color:#111;cursor:pointer;margin:2px}.secondary{background:#263149;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#151c30;border-radius:16px;padding:20px;width:min(600px,100%)}input,textarea{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662}.actions{margin-top:10px}</style></head><body><div class="wrap"><h1>⚙️ Справочники</h1><p class="muted">Меню, услуги и номера. Изменения сохраняются прямо в Supabase.</p><div class="tabs"><button class="tab active" data-p="menu">🥗 Меню Veg Raw</button><button class="tab" data-p="services">🧺 Услуги</button><button class="tab" data-p="rooms">🛏 Номера</button></div><section id="menu" class="panel active"><h2>Меню Veg Raw</h2><button class="btn add" data-type="menu">➕ Добавить блюдо</button><div id="menuList">Загрузка…</div></section><section id="services" class="panel"><h2>Услуги</h2><button class="btn add" data-type="service">➕ Добавить услугу</button><div id="serviceList">Загрузка…</div></section><section id="rooms" class="panel"><h2>Номера</h2><p class="muted">Номера берутся из существующего справочника rooms. Здесь мы пока только редактируем цену и статус, не создавая дубликаты.</p><div id="roomList">Загрузка…</div></section></div><div id="modal" class="modal"><div class="box"><button class="btn secondary" id="close">✕ Закрыть</button><h2 id="mt">Добавить</h2><input id="name" placeholder="Название"><input id="price" type="number" min="0" placeholder="Цена, ₽"><textarea id="desc" placeholder="Описание"></textarea><div class="actions"><button class="btn" id="save">Сохранить</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const M=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let type='menu',editId=null,editTable=null;const modal=document.getElementById('modal');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});async function load(){const [m,s,r]=await Promise.all([db.from('menu_items').select('*').order('name'),db.from('services').select('*').order('name'),db.from('rooms').select('*').order('name')]);render('menuList',m.data||[],x=>`${E(x.name)} <span class="price">${M(x.price)}</span> <span class="badge">${x.active===false?'скрыто':'активно'}</span>`,x=>actions('menu_items',x));render('serviceList',s.data||[],x=>`${E(x.name)} <span class="price">${M(x.price)}</span> <span class="badge">${x.active===false?'скрыто':'активно'}</span>`,x=>actions('services',x));render('roomList',r.data||[],x=>`${E(x.name)} <span class="price">${M(x.price_per_night)} / ночь</span> <span class="badge">${x.active===false?'скрыто':'активно'}</span>`,x=>actions('rooms',x))}function actions(t,x){return `<button class="btn secondary edit" data-t="${t}" data-id="${E(x.id)}">✏️ Изменить</button><button class="btn toggle" data-t="${t}" data-id="${E(x.id)}" data-active="${x.active!==false}">${x.active===false?'👁 Включить':'🚫 Скрыть'}</button>`}function render(id,a,fn,af){document.getElementById(id).innerHTML=a.length?a.map(x=>`<div class="row"><div>${fn(x)}</div><div>${af(x)}</div></div>`).join(''):'<p class="muted">Пока нет записей.</p>'}document.querySelectorAll('.add').forEach(b=>b.onclick=()=>openForm(b.dataset.type));function openForm(t,x=null){type=t;editId=x?.id||null;editTable=t==='menu'?'menu_items':t==='service'?'services':'rooms';document.getElementById('mt').textContent=editId?'✏️ Изменить':'➕ Добавить '+(t==='menu'?'блюдо':t==='service'?'услугу':'номер');document.getElementById('name').value=x?.name||'';document.getElementById('price').value=t==='rooms'?(x?.price_per_night??''):(x?.price??'');document.getElementById('desc').value=x?.description||'';document.getElementById('name').disabled=t==='rooms';modal.classList.add('show')}document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('save').onclick=async()=>{const name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value),description=document.getElementById('desc').value.trim();if(price<0||(!name&&!editId))return alert('Проверьте название и цену');let payload=editTable==='rooms'?{price_per_night:price}:{name,price,description};let r=editId?await db.from(editTable).update(payload).eq('id',editId):await db.from(editTable).insert({...payload,active:true});if(r.error)return alert('Ошибка: '+r.error.message);modal.classList.remove('show');load()};document.body.addEventListener('click',async e=>{const ed=e.target.closest('.edit'),tg=e.target.closest('.toggle');if(ed){const t=ed.dataset.t,id=ed.dataset.id;const q=await db.from(t).select('*').eq('id',id).single();if(q.error)return alert(q.error.message);openForm(t==='menu_items'?'menu':t==='services'?'service':'rooms',q.data)}if(tg){const t=tg.dataset.t,id=tg.dataset.id,active=tg.dataset.active==='true';const r=await db.from(t).update({active:!active}).eq('id',id);if(r.error)return alert(r.error.message);load()}});load()</script></body></html>
