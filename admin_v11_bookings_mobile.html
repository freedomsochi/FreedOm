<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Бронирования · Mobile</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{background:linear-gradient(145deg,#f8faf7,#eef5f1 55%,#f6f8f4)}.mobile-wrap{max-width:720px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sub{color:var(--fd-muted);font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}.stat{padding:13px 14px;background:rgba(255,255,255,.76);border:1px solid var(--fd-line);border-radius:16px}.stat small{color:var(--fd-muted)}.stat b{display:block;font-size:22px;margin-top:3px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.filter{white-space:nowrap;border:1px solid var(--fd-line);background:#fff;border-radius:999px;padding:9px 12px;font:inherit;cursor:pointer}.filter.active{background:var(--fd-text);color:#fff;border-color:var(--fd-text)}.booking{display:block;padding:15px;margin:9px 0;background:rgba(255,255,255,.82);border:1px solid rgba(44,71,62,.11);border-radius:18px;box-shadow:0 8px 24px rgba(48,77,66,.055);text-decoration:none}.top{display:flex;justify-content:space-between;gap:10px}.room{font-weight:850;font-size:16px}.guest{margin-top:4px;font-size:13px}.dates{margin-top:10px;color:var(--fd-muted);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 8px;border-radius:9px;background:#f1f5f3;font-size:11px;color:#53625b}.chip.debt{background:var(--fd-red-soft);color:#bd4e57}.arrow{font-size:20px;color:var(--fd-muted)}.empty{text-align:center;padding:32px;color:var(--fd-muted)}@media(min-width:721px){body{padding:30px}.mobile-wrap{max-width:100%}}
</style></head><body><main class="mobile-wrap"><header class="fd-topbar"><div class="head"><div><div class="fd-kicker">FreeDom · mobile</div><h1 class="fd-title">Бронирования</h1><div class="sub">Быстрый рабочий список без карты.</div></div><a class="fd-btn" href="admin_v11_bookings.html">Карта</a></div></header><section class="stats"><div class="stat"><small>Активные</small><b id="active">—</b></div><div class="stat"><small>Заезды сегодня</small><b id="arrivals">—</b></div><div class="stat"><small>Проживают</small><b id="staying">—</b></div><div class="stat"><small>Долг</small><b id="debt" style="color:var(--fd-red)">—</b></div></section><div id="filters" class="filters"><button class="filter active" data-f="active">Активные</button><button class="filter" data-f="arrivals">Заезд</button><button class="filter" data-f="staying">Проживают</button><button class="filter" data-f="debt">🔴 С долгом</button></div><input id="q" class="fd-search" placeholder="Имя, телефон или номер комнаты"><section id="list" style="margin-top:8px">Загрузка…</section></main><script>
const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';let rows=[],filter='active';function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е')}function active(b){return !['отменено','отменена','cancelled','canceled','завершено','завершена'].includes(norm(b.status))}function staying(b){const t=new Date(),a=new Date((b.check_in_date||'')+'T00:00:00'),o=new Date((b.check_out_date||'')+'T23:59:59');return active(b)&&a<=t&&o>=t}function arrival(b){const d=new Date();d.setHours(0,0,0,0);return active(b)&&new Date((b.check_in_date||'')+'T00:00:00').getTime()===d.getTime()}function debt(b){return Math.max((Number(b.total_amount)||0)-(Number(b.paid_amount)||0),0)}function match(b){const q=norm($('q').value.trim());return !q||[b.guest_name,b.guest_phone,b.guest_email,b.rooms?.name].join(' ').toLowerCase().includes(q)}function render(){const list=rows.filter(b=>match(b)&&(filter==='active'?active(b):filter==='arrivals'?arrival(b):filter==='staying'?staying(b):debt(b)>0)).sort((a,b)=>String(a.check_in_date||'').localeCompare(String(b.check_in_date||'')));$('list').innerHTML=list.map(b=>`<a class="booking" href="admin_guest_profile.html?id=${encodeURIComponent(b.user_id||'')}&from=bookings"><div class="top"><div><div class="room">${esc(b.rooms?.name||b.room_name||'Номер')}</div><div class="guest">${esc(b.guest_name||'Гость')}</div></div><div class="arrow">›</div></div><div class="dates">${esc(b.check_in_date||'—')} → ${esc(b.check_out_date||'—')}</div><div class="chips"><span class="chip">👤 ${Number(b.guests_count||b.guest_count||1)} гостей</span>${debt(b)>0?`<span class="chip debt">Долг ${money(debt(b))}</span>`:'<span class="chip">Оплачено</span>'}</div></a>`).join('')||'<div class="empty">Ничего не найдено</div>'}async function load(){const{data,error}=await sb.rpc('admin_get_bookings');if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data?.bookings||data||[];$('active').textContent=rows.filter(active).length;$('arrivals').textContent=rows.filter(arrival).length;$('staying').textContent=rows.filter(staying).length;$('debt').textContent=money(rows.filter(active).reduce((s,b)=>s+debt(b),0));render()}document.querySelectorAll('.filter').forEach(x=>x.onclick=()=>{filter=x.dataset.f;document.querySelectorAll('.filter').forEach(y=>y.classList.toggle('active',y===x));render()});$('q').oninput=render;load();
</script></body></html>
