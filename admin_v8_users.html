<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v8 — Пользователи</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:18px}.wrap{max-width:950px;margin:auto}.card,.box{background:#151c30;border-radius:16px;padding:18px;margin-bottom:14px}.row{padding:14px 0;border-bottom:1px solid #303a52}.btn{padding:10px 13px;border:0;border-radius:9px;background:#d4af37;color:#111;cursor:pointer;margin:3px}.dark{background:#263149;color:#fff}.debt{color:#ff6b6b;font-size:20px;font-weight:bold}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(800px,100%);max-height:90vh;overflow:auto}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #303a52;text-align:left}.profile{background:#101627;padding:14px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paybox{background:#101627;padding:12px;border-radius:10px;margin:10px 0}.ok{color:#70d6a3}.muted{color:#9aa3b8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>👤 Пользователи</h1><div id="users">Загрузка…</div></div></div><div id="modal" class="modal"><div class="box" id="box"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let U=[],B=[],O=[],S=[],R=[],MNU=[],P=[],serviceCatalog=[];const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function prof(u,id){let b=B.find(x=>x.user_id===id),o=O.find(x=>x.user_id===id);return{name:u?.Display_name||b?.guest_name||o?.guest_name||'Гость',phone:u?.Phone||b?.guest_phone||o?.guest_phone||'—',email:u?.Email||b?.guest_email||o?.guest_email||'—'}}function rows(id){return [...B.filter(x=>x.user_id===id).map(x=>({kind:'booking',id:x.id,title:'🛏 '+(R.find(r=>r.id===x.room_id)?.name||'Бронирование'),amount:+x.total_amount||0,paid:+x.paid_amount||0})),...O.filter(x=>x.user_id===id).map(x=>({kind:'order',id:x.id,title:'🥗 '+((x.items||[])[0]?.name||'Veg Raw'),amount:+x.total_amount||0,paid:+x.paid_amount||0})),...S.filter(x=>x.user_id===id).map(x=>({kind:'service',id:x.id,title:'🧺 '+x.service_name,amount:+x.total_amount||0,paid:0}))]}function paymentsFor(id){return P.filter(x=>x.user_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}function paymentTitle(p){if(p.booking_id){let b=B.find(x=>x.id===p.booking_id);return '🛏 '+(R.find(r=>r.id===b?.room_id)?.name||'Бронирование')}if(p.order_id){let o=O.find(x=>x.id===p.order_id);return '🥗 '+((o?.items||[])[0]?.name||'Veg Raw')}return '💳 Платёж'}async function load(){let [u,b,o,s,r,m,p]=await Promise.all([db.from('users').select('*').order('Created_at',{ascending:false}).limit(300),db.from('bookings').select('*').limit(1000),db.from('orders').select('*').limit(1000),db.from('service_orders').select('*').limit(1000),db.from('rooms').select('*').order('name'),db.from('veg_raw_menu').select('*').eq('is_active',true).order('name'),db.from('payments').select('*').order('created_at',{ascending:false}).limit(3000)]);if(u.error)return alert('Пользователи: '+u.error.message);if(p.error)return alert('Платежи: '+p.error.message);U=u.data||[];B=b.data||[];O=o.data||[];S=s.data||[];R=r.data||[];MNU=m.data||[];P=p.data||[];$('users').innerHTML=U.map(u=>{let p=prof(u,u.user_id),d=rows(u.user_id).reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0);return `<div class="row"><b>${esc(p.name)}</b><div>${esc(p.phone)} · ${esc(p.email)}</div><div class="debt">Долг: ${money(d)}</div><button class="btn" onclick="openUser('${u.user_id}')">Подробнее</button></div>`}).join('')||'Пользователей нет'}function openUser(id){let u=U.find(x=>x.user_id===id),p=prof(u,id),rs=rows(id),d=rs.reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0),ps=paymentsFor(id),totalPaid=ps.filter(x=>!['cancelled','canceled'].includes(x.status)).reduce((a,x)=>a+(+x.amount||0),0),totalCharged=rs.reduce((a,x)=>a+x.amount,0);$('box').innerHTML=`<button class="btn dark" onclick="closeM()">✕ Закрыть</button><h2>👤 ${esc(p.name)}</h2><div class="profile">📞 <b>Телефон:</b> ${esc(p.phone)}<br>✉️ <b>Email:</b> ${esc(p.email)}</div><h3>💰 Финансы</h3><div>Начислено: <b>${money(totalCharged)}</b></div><div>Оплачено: <b>${money(totalPaid)}</b></div><div class="debt">Остаток: ${money(d)}</div><table><tr><th>За что</th><th>Начислено</th><th>Оплачено</th><th>Остаток</th><th></th></tr>${rs.map(x=>`<tr><td>${esc(x.title)}</td><td>${money(x.amount)}</td><td>${money(x.paid)}</td><td>${money(Math.max(0,x.amount-x.paid))}</td><td>${x.amount>x.paid&&x.kind!=='service'?`<button class="btn pay" onclick="pay('${id}','${x.kind}','${x.id}')">💳 Оплатить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Нет начислений</td></tr>'}</table><h3>💳 История платежей</h3>${ps.length?ps.map(x=>`<div class="paybox"><b>${esc(paymentTitle(x))}</b><br><span class="ok">${money(x.amount)}</span> · ${esc(x.payment_method||x.method||'—')}<br><span class="muted">${new Date(x.created_at).toLocaleString('ru-RU')}</span>${x.note?`<br>Комментарий: ${esc(x.note)}`:''}<br>Статус: ${esc(x.status||'—')}</div>`).join(''):'<div class="muted">Платежей пока нет.</div>'}<button class="btn" onclick="formAdd('${id}')">➕ Добавить начисление</button>`;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}function formAdd(uid){$('box').innerHTML=`<button class="btn dark" onclick="openUser('${uid}')">← Назад</button><h2>➕ Добавить начисление</h2><select id="kind" onchange="drawForm('${uid}')"><option value="menu">🥗 Кухня Veg Raw</option><option value="service">🧺 Услуга</option><option value="booking">🛏 Бронирование</option></select><div id="fields"></div>`;drawForm(uid)}function drawForm(uid){let k=$('kind').value;if(k==='menu')$('fields').innerHTML=`<select id="item"><option value="">Выберите блюдо</option>${MNU.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="qty" type="number" min="1" value="1"><input id="comment" placeholder="Комментарий"><button class="btn" onclick="saveMenu('${uid}')">Добавить</button>`;else if(k==='service')$('fields').innerHTML=`<select id="svc"><option value="">Выберите услугу</option>${serviceCatalog.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="qty" type="number" min="1" value="1"><input id="comment" placeholder="Комментарий"><button class="btn" onclick="saveService('${uid}')">Добавить</button>`;else $('fields').innerHTML=`<select id="room"><option value="">Выберите номер</option>${R.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price_per_night)}/ночь</option>`).join('')}</select><div class="grid"><input id="ci" type="date"><input id="co" type="date"></div><input id="guests" type="number" min="1" value="1"><button class="btn" onclick="saveBooking('${uid}')">Добавить</button>`}async function saveMenu(uid){let id=$('item').value,q=+$('qty').value||1,item=MNU.find(x=>x.id===id),u=U.find(x=>x.user_id===uid),p=prof(u,uid);if(!item)return alert('Выберите блюдо');let r=await db.from('orders').insert({user_id:uid,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,items:[{menu_id:item.id,name:item.name,price:item.price,quantity:q,comment:$('comment').value||''}],total_amount:item.price*q,status:'новый',payment_status:'не оплачено',paid_amount:0,discount_amount:0});if(r.error)return alert(r.error.message);await load();openUser(uid)}async function saveService(uid){let id=$('svc').value,q=+$('qty').value||1,x=serviceCatalog.find(s=>s.id===id);if(!x)return alert('Выберите услугу');let r=await db.from('service_orders').insert({user_id:uid,service_id:id,service_name:x.name,unit:x.unit||'шт',quantity:q,unit_price:x.price,total_amount:x.price*q,status:'новый',comment:$('comment').value||null});if(r.error)return alert(r.error.message);await load();openUser(uid)}async function saveBooking(uid){let rid=$('room').value,ci=$('ci').value,co=$('co').value,g=+$('guests').value||1,r=R.find(x=>x.id===rid),n=(new Date(co)-new Date(ci))/86400000;if(!r||!ci||!co||n<=0)return alert('Выберите номер и корректные даты');let u=U.find(x=>x.user_id===uid),p=prof(u,uid),x=await db.from('bookings').insert({room_id:rid,user_id:uid,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,check_in_date:ci,check_out_date:co,guest_count:g,total_amount:r.price_per_night*n,discount_amount:0,paid_amount:0,status:'новое',payment_status:'не оплачено',services:[]});if(x.error)return alert(x.error.message);await load();openUser(uid)}async function pay(uid,kind,id){let amount=+prompt('Сколько оплатить?');if(!amount)return;let method=prompt('Метод оплаты','безнал');if(!method)return;let args={p_amount:amount,p_payment_method:method};if(kind==='booking')args.p_booking_id=id;else args.p_order_id=id;let r=await db.rpc('record_payment',args);if(r.error)return alert(r.error.message);await load();openUser(uid)}async function init(){let q=await db.from('services').select('*').eq('is_active',true).order('name');serviceCatalog=q.data||[];await load()}init();</script></body></html>
