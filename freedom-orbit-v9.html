{bg.style.backgroundImage=`url('${pics[i]}')`;bg.style.transform='scale(1.05)';bg2.style.opacity=0;bg2.style.transform='scale(1.05)'},1200)}function select(i){idx=(i+5)%5;let target=-idx*72,d=target-rot;d=((d+180)%360+360)%360-180;rot+=d;set();nodes.forEach((n,k)=>n.classList.toggle('active',k===idx));atmosphere(idx)}function snap(){select(Math.round(-rot/72))}ring.onpointerdown=e=>{drag=1;ring.classList.add('drag');ring.setPointerCapture(e.pointerId);last=a(e);lastT=performance.now();vel=0};ring.onpointermove=e=>{if(!drag)return;let x=a(e),d=x-last;if(d>180)d-=360;if(d<-180)d+=360;rot+=d;set();let now=performance.now(),dt=Math.max(8,now-lastT);vel=.76*vel+.24*d/dt*16;last=x;lastT=now};ring.onpointerup=()=>{if(!drag)return;drag=0;ring.classList.remove('drag');rot+=Math.max(-28,Math.min(28,vel*8));set();setTimeout(snap,260)};ring.onpointercancel=()=>{drag=0;ring.classList.remove('drag');snap()};nodes.forEach(n=>n.onclick=e=>{e.stopPropagation();let i=+n.dataset.i;if(i===idx&&i===0)openSpace();else select(i)});function openSpace(){if(idx!==0)return;world.classList.add('open');entry.classList.remove('hide');frame.src='space-preview.html';setTimeout(()=>entry.classList.add('hide'),900)}document.getElementById('core').onclick=openSpace;document.getElementById('close').onclick=()=>{world.classList.remove('open');setTimeout(()=>frame.src='',700)};frame.onload=()=>setTimeout(()=>entry.classList.add('hide'),300);bg.style.backgroundImage=`url('${pics[0]}')`;</script></body></html>
