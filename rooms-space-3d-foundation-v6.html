const nav=document.querySelector('#levels'),defs=[['space','Пространство','весь дом и территория'],['attic','Мансарда','верхний уровень'],['three','3 этаж','жилой уровень'],['two','2 этаж','жилой уровень'],['one','1 этаж','вход · общие зоны'],['minus','−1 этаж','нижний уровень']];let current='space';defs.forEach(([id,t,s])=>{const b=document.createElement('button');b.className='level'+(id==='space'?' space':'');b.dataset.id=id;b.innerHTML=`<b>${t}</b><span>${s}</span>`;b.onclick=()=>setView(id);nav.appendChild(b)});function fade(g,v){g.traverse(o=>{if(o.isMesh){o.material.transparent=v<1||o.material.transparent;o.material.opacity=v}})}let moving=0;function move(p,t,d=900){const id=++moving,sp=camera.position.clone(),st=controls.target.clone(),start=performance.now();function f(now){if(id!==moving)return;const q=Math.min(1,(now-start)/d),e=1-Math.pow(1-q,4);camera.position.lerpVectors(sp,p,e);controls.target.lerpVectors(st,t,e);if(q<1)requestAnimationFrame(f)}requestAnimationFrame(f)}function setView(id){current=id;nav.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b.dataset.id===id));Object.entries(floors).forEach(([k,g])=>fade(g,id==='space'||k===id?1:.13));if(id==='space')move(new THREE.Vector3(61,70,66),new THREE.Vector3(0,0,0));else{const y={minus:-2,one:2,two:7,three:13,attic:18}[id];move(new THREE.Vector3(30,42,33),new THREE.Vector3(0,y,0),850)}}
