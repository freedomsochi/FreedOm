<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FreeDom — Orbit V4</title><style>:root{--ink:#26352d;--soft:#758179;--line:rgba(58,75,65,.2);--glass:rgba(250,252,247,.42);--green:#719879;--warm:#b98258}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#e9eee8}.scene{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 0,#f1f5ef 40%,#dfe8df 100%)}.scene:before{content:"";position:absolute;inset:-15%;background:radial-gradient(circle at 18% 25%,rgba(112,153,122,.22),transparent 27%),radial-gradient(circle at 85% 70%,rgba(185,130,88,.11),transparent 25%);filter:blur(12px)}.top{position:absolute;z-index:20;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}.hint{font-size:10px;letter-spacing:.1em;color:#68766e;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.7);padding:9px 13px;border-radius:30px;backdrop-filter:blur(15px)}.stage{position:absolute;inset:0;display:grid;place-items:center;touch-action:none}.orbit{position:relative;width:min(90vw,650px);height:min(90vw,650px)}.aura{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.82),rgba(255,255,255,.18) 55%,transparent 72%);filter:blur(3px)}.tree{position:absolute;z-index:3;left:50%;bottom:4%;width:51%;height:88%;transform:translateX(-50%);filter:drop-shadow(0 28px 24px rgba(38,58,46,.12));pointer-events:none}.tree svg{width:100%;height:100%;overflow:visible}.leaf{transform-origin:center;animation:sway 6s ease-in-out infinite}.l2{animation-delay:-1.8s}.l3{animation-delay:-3s}.l4{animation-delay:-.9s}.l5{animation-delay:-4s}@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg) translateX(2px)}}.ring{position:absolute;inset:7%;border-radius:50%;z-index:5;cursor:grab;transition:transform .7s cubic-bezier(.18,.82,.2,1)}.ring.drag{cursor:grabbing;transition:none}.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(75,94,83,.25);box-shadow:inset 0 0 55px rgba(255,255,255,.9),0 0 0 1px rgba(255,255,255,.45),0 24px 70px rgba(49,69,56,.08)}.ring:after{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(104,122,112,.11)}.node{position:absolute;left:50%;top:50%;width:105px;height:105px;margin:-52.5px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;color:#6b776f;font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(12px);box-shadow:inset 0 1px rgba(255,255,255,.9);transform:rotate(calc(var(--a)*1deg)) translateY(calc(min(33vw,215px))) rotate(calc(var(--a)*-1deg));transition:all .55s cubic-bezier(.18,.82,.2,1)}.node.active{color:var(--ink);background:rgba(255,255,255,.76);box-shadow:0 16px 42px rgba(42,62,49,.14),0 0 0 6px rgba(113,152,121,.1),inset 0 1px #fff;transform:rotate(calc(var(--a)*1deg)) translateY(calc(min(33vw,215px))) rotate(calc(var(--a)*-1deg)) scale(1.12)}.node:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#8ba795;top:9px;opacity:.7}.center{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.center .mark{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#adcbb2 50%,#668d70);box-shadow:0 0 0 10px rgba(113,152,121,.09),0 8px 25px rgba(51,80,59,.2)}.center span{display:block;margin-top:12px;font-size:8px;letter-spacing:.3em;color:#829087;text-transform:uppercase}.panel{position:absolute;z-index:18;left:50%;bottom:25px;transform:translateX(-50%);width:min(520px,calc(100% - 30px));padding:15px 18px;border:1px solid rgba(255,255,255,.72);border-radius:20px;background:rgba(255,255,255,.48);backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:space-between;box-shadow:0 20px 70px rgba(38,58,46,.1)}.panel small{display:block;color:#7a867f;font-size:9px;letter-spacing:.2em;text-transform:uppercase}.panel strong{display:block;margin-top:4px;font:600 21px Georgia,serif}.panel button{border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:11px 15px;background:rgba(38,53,45,.9);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(31,43,36,.12);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.5s}.modal.open{opacity:1;pointer-events:auto}.window{position:relative;width:min(820px,calc(100% - 28px));max-height:84vh;overflow:hidden;border-radius:28px;background:rgba(249,251,247,.95);box-shadow:0 40px 110px rgba(25,40,31,.22);transform:translateY(20px) scale(.97);transition:.55s cubic-bezier(.18,.82,.2,1)}.modal.open .window{transform:none}.media{height:330px;background-position:center;background-size:cover}.copy{padding:24px}.copy small{font-size:9px;letter-spacing:.2em;color:#7a867f;text-transform:uppercase}.copy h2{font:600 38px Georgia,serif;margin:8px 0}.copy p{margin:0;color:#68756d;line-height:1.55}.close{position:absolute;right:18px;top:18px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.8);font-size:20px}@media(max-width:620px){.top{top:15px;left:15px;right:15px}.hint{font-size:9px}.orbit{width:108vw;height:108vw}.tree{width:59%;height:81%;bottom:8%}.node{width:82px;height:82px;margin:-41px;font-size:8px}.node.active{transform:rotate(calc(var(--a)*1deg)) translateY(38vw) rotate(calc(var(--a)*-1deg)) scale(1.1)}.panel{bottom:12px}.panel button{display:none}.media{height:230px}.copy h2{font-size:30px}}</style></head><body><main class="scene"><header class="top"><div class="brand">FreeDom</div><div class="hint">прикоснитесь к кругу</div></header><section class="stage"><div class="orbit"><div class="aura"></div><div class="tree"><svg viewBox="0 0 240 430" fill="none"><path d="M118 425C121 355 116 300 125 250C134 198 126 147 141 93" stroke="#765b45" stroke-width="11" stroke-linecap="round"/><path d="M126 274C101 235 76 215 46 197M129 230C153 190 181 174 207 150M130 181C105 150 84 124 72 91M138 116C157 90 174 67 180 42" stroke="#765b45" stroke-width="6" stroke-linecap="round"/><g fill="#6f9877"><ellipse class="leaf" cx="43" cy="191" rx="31" ry="18" transform="rotate(-20 43 191)"/><ellipse class="leaf l2" cx="204" cy="145" rx="34" ry="19" transform="rotate(-18 204 145)"/><ellipse class="leaf l3" cx="69" cy="86" rx="35" ry="20" transform="rotate(18 69 86)"/><ellipse class="leaf l4" cx="181" cy="40" rx="30" ry="18" transform="rotate(-18 181 40)"/><ellipse class="leaf l5" cx="129" cy="61" rx="38" ry="21" transform="rotate(-4 129 61)"/></g><g fill="#89a98c" opacity=".65"><circle cx="35" cy="205" r="4"/><circle cx="193" cy="164" r="3"/><circle cx="83" cy="72" r="3"/><circle cx="174" cy="28" r="4"/></g></svg></div><div class="ring" id="ring"><div class="node active" style="--a:0" data-i="0">Пространство</div><div class="node" style="--a:72" data-i="1">События</div><div class="node" style="--a:144" data-i="2">Комнаты</div><div class="node" style="--a:216" data-i="3">Баня</div><div class="node" style="--a:288" data-i="4">Кухня</div></div><div class="center"><div class="mark"></div><span>living free</span></div></div></section><div class="panel"><div><small>выбрано</small><strong id="title">Пространство</strong></div><button id="open">Открыть</button></div><div class="modal" id="modal"><div class="window"><button class="close" id="close">×</button><div class="media" id="media"></div><div class="copy"><small>FreeDom</small><h2 id="mh"></h2><p id="mp"></p></div></div></div></main><script>const labels=['Пространство','События','Комнаты','Баня','Кухня'];const texts=['Место, где можно остановиться, почувствовать пространство и быть собой.','То, чем живёт FreeDom каждый день: встречи, музыка, практики и люди.','Выберите своё место в доме и посмотрите его реальную доступность.','Тепло, вода, тишина и место под звёздами.','Общее пространство дома. Эту часть мы разработаем отдельно.'];const imgs=['https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1400&q=80','https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1400&q=80','https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=1400&q=80','https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1400&q=80','https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1400&q=80'];const ring=document.getElementById('ring'),nodes=[...document.querySelectorAll('.node')],title=document.getElementById('title');let idx=0,rot=0,startX=0,startRot=0,drag=false;function select(n){idx=(n+5)%5;rot=-idx*72;ring.style.transform=`rotate(${rot}deg)`;nodes.forEach((x,i)=>x.classList.toggle('active',i===idx));title.textContent=labels[idx]}function nearest(){let n=Math.round((-rot/72));select(n)}ring.addEventListener('pointerdown',e=>{drag=true;ring.classList.add('drag');startX=e.clientX;startRot=rot;ring.setPointerCapture(e.pointerId)});ring.addEventListener('pointermove',e=>{if(!drag)return;rot=startRot+(e.clientX-startX)*.55;ring.style.transform=`rotate(${rot}deg)`});ring.addEventListener('pointerup',()=>{if(!drag)return;drag=false;ring.classList.remove('drag');nearest()});nodes.forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();select(+n.dataset.i)}));const modal=document.getElementById('modal'),mh=document.getElementById('mh'),mp=document.getElementById('mp'),media=document.getElementById('media');document.getElementById('open').onclick=()=>{mh.textContent=labels[idx];mp.textContent=texts[idx];media.style.backgroundImage=`url('${imgs[idx]}')`;modal.classList.add('open')};document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});</script></body></html>
