const card=document.querySelector('#card'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),cap=document.querySelector('#cap'),kind=document.querySelector('#kind'),reticle=document.querySelector('#reticle');let selected=null,anim=0;
function opacityGroup(g,a){g.traverse(o=>{if(!o.isMesh)return;if(!o.userData.originalOpacity)o.userData.originalOpacity=o.material.opacity??1;o.material.transparent=a<.99||o.material.transparent;o.material.opacity=o.userData.originalOpacity*a})}
function setView(id){current=id;nav.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b.dataset.id===id));closeCard();if(id==='space'){Object.values(floors).forEach(g=>{g.visible=true;opacityGroup(g,1)});terrain.visible=true;move(new THREE.Vector3(63,76,67),new THREE.Vector3(0,1,0),850);return}terrain.visible=true;Object.entries(floors).forEach(([k,g])=>{g.visible=true;opacityGroup(g,k===id?1:.12)});const y={minus:-2,one:1,two:6.3,three:11.7,attic:17}[id];move(new THREE.Vector3(39,47,46),new THREE.Vector3(0,y,0),900)}
function move(p,t,d=900){const sp=camera.position.clone(),st=controls.target.clone(),start=performance.now();cancelAnimationFrame(anim);const ease=x=>1-Math.pow(1-x,4);function f(now){const q=Math.min(1,(now-start)/d),e=ease(q);camera.position.lerpVectors(sp,p,e);controls.target.lerpVectors(st,t,e);if(q<1)anim=requestAnimationFrame(f)}anim=requestAnimationFrame(f)}
function select(o){const d=data[o.userData.id];if(!d)return;selected=o;const p=o.getWorldPosition(new THREE.Vector3());const target=new THREE.Vector3(p.x,p.y,p.z);const cp=new THREE.Vector3(p.x+8,p.y+13,p.z+10);move(cp,target,1050);title.textContent=d[0];desc.textContent=d[1];cap.textContent=d[2];kind.textContent=d[3];card.classList.add('open');reticle.classList.remove('show')}
function closeCard(){card.classList.remove('open');selected=null}
document.querySelector('#close').onclick=()=>{closeCard();setView(current)};document.querySelector('#book').onclick=()=>{if(selected)location.href='booking.html?object='+encodeURIComponent(selected.userData.id)};
let day=true;document.querySelector('#light').onclick=()=>{day=!day;sun.intensity=day?4.2:.7;hemi.intensity=day?2.6:.8;renderer.toneMappingExposure=day?1.05:.7;document.querySelector('#light').textContent=day?'☾ Ночной свет':'☀ Дневной свет'};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(selectable,true);if(hits.length)select(hits[0].object)});
setView('space');function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
