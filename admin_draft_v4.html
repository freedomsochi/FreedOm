<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin v4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090c15;color:#eef1f7;font:15px Arial}.wrap{max-width:1200px;margin:auto;padding:16px}.card,.head,.modalbox{background:#111625;border:1px solid #283249;border-radius:16px;padding:16px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab,input,select,textarea{background:#171d2c;color:#eee;border:1px solid #39455f;border-radius:10px;padding:10px}.btn,.tab{cursor:pointer}.active{background:#d4af37;color:#111}.ok{color:#35d48a}.bad{color:#ff6978}.pending{color:#f2c94c}.panel{display:none;margin-top:14px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#171d2c;padding:14px;border-radius:12px}.stat b{display:block;font-size:1.25rem;margin-top:6px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #283249}.muted{color:#8992a8}.search{width:100%;margin-bottom:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}.modalbox{width:min(960px,100%);max-height:92vh;overflow:auto}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#171d2c;padding:12px;border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #283249;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.danger{background:#4b1e28}.success{background:#173b2b}.full{grid-column:1/-1}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.items{white-space:pre-wrap;background:#0d1220;padding:12px;border-radius:10px}@media(max-width:750px){.grid,.details,.form,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ FreeDom — Админ v4</h1><span id="auth" class="muted">Проверка…</span></div><button class="btn" onclick="loadAll()">↻ Обновить</button></div><div id="app" style="display:none"><div class="tabs"><button class="tab active" data-p="dash">📊 Дашборд</button><button class="tab" data-p="users">👥 Пользователи</button><button class="tab" data-p="bookings">📅 Бронирования</button><button class="tab" data-p="orders">🥗 Veg Raw</button><button class="tab" data-p="services">🛎 Услуги</button><button class="tab" data-p="finance">💰 Финансы</button></div><section id="dash" class="panel active"><div class="card"><div class="grid"><div class="stat">Пользователи<b id="nUsers">0</b></div><div class="stat">Брони<b id="nBookings">0</b></div><div class="stat">Veg Raw<b id="nOrders">0</b></div><div class="stat">Долг<b id="nDebt">0 ₽</b></div></div></div></section><section id="users" class="panel"><div class="card"><h2>👥 Пользователи</h2><input id="userSearch" class="search" placeholder="Имя, телефон или email"><div id="usersList">Загрузка…</div></div></section><section id="bookings" class="panel"><div class="card"><h2>📅 Бронирования</h2><div id="bookingsList">Загрузка…</div></div></section><section id="orders" class="panel"><div class="card"><h2>🥗 Veg Raw</h2><div id="ordersList">Загрузка…</div></div></section><section id="services" class="panel"><div class="card"><h2>🛎 Услуги</h2><div id="servicesList">Загрузка…</div></div></section><section id="finance" class="panel"><div class="card"><div class="grid"><div class="stat">Начислено<b id="charged">0 ₽</b></div><div class="stat">Оплачено<b id="paid">0 ₽</b></div><div class="stat">Долг<b id="debt">0 ₽</b></div><div class="stat">Должников<b id="debtors">0</b></div></div></div><div class="card"><input id="financeSearch" class="search" placeholder="Поиск должника"><div id="financeList">Загрузка…</div></div></section></div></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>const sb=window.supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'),ADMIN='serzh.xz@mail.ru';let users=[],bookings=[],orders=[],services=[],finance=[];const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?new Date(s).toLocaleDateString('ru-RU'):'—';function status(s){let v=String(s||'').toLowerCase();if(['подтверждено','confirmed','активна','завершена','долг'].includes(v))return'<span class="ok">🟢 Подтверждено</span>';if(['отменено','отменена','cancelled'].includes(v))return'<span class="bad">🔴 Отменено</span>';return'<span class="pending">🟡 Ожидает подтверждения</span>'}function closeModal(){$('modal').classList.remove('show')}async function init(){const{data}=await sb.auth.getSession();if(!data.session)return location.href='login.html';if(data.session.user.email!==ADMIN){$('auth').textContent='⛔ Доступ запрещён';return}$('auth').textContent='🔒 '+data.session.user.email;$('app').style.display='block';await loadAll()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.p).classList.add('active')});async function loadAll(){const[u,b,o,s,f]=await Promise.all([sb.from('users').select('user_id,Display_name,Phone,Email,City,Birth_date,Ref_code,Created_at,total_debt,discount_rate').order('Display_name'),sb.from('bookings').select('*,rooms(name)').order('created_at',{ascending:false}).limit(300),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300),sb.from('service_orders').select('*').order('created_at',{ascending:false}).limit(300),sb.from('user_financial_summary').select('*').order('total_debt',{ascending:false})]);const bad=[u,b,o,s,f].find(x=>x.error);if(bad)return alert('Ошибка загрузки: '+bad.error.message);users=u.data||[];bookings=b.data||[];orders=o.data||[];services=s.data||[];finance=f.data||[];render()}function total(k){return finance.reduce((a,x)=>a+(Number(x[k])||0),0)}function render(){nUsers.textContent=users.length;nBookings.textContent=bookings.length;nOrders.textContent=orders.length;nDebt.textContent=money(total('total_debt'));charged.textContent=money(total('total_charged'));paid.textContent=money(total('total_paid'));debt.textContent=money(total('total_debt'));debtors.textContent=finance.filter(x=>Number(x.total_debt)>0).length;let uq=($('userSearch').value||'').toLowerCase();$('usersList').innerHTML=users.filter(u=>[u.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(uq)).map(u=>{let f=finance.find(x=>x.user_id===u.user_id)||{};return`<div class="row"><div><b>${esc(u.Display_name||'Без имени')}</b><div class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')}</div></div><div class="${Number(f.total_debt)>0?'bad':'ok'}">${money(f.total_debt)}</div><div>${esc(u.City||'')}</div><div>${esc(u.discount_rate||0)}% скидка</div><button class="btn" onclick="openUser('${u.user_id}')">Подробнее</button></div>`}).join('')||'<p class="muted">Нет пользователей</p>';$('bookingsList').innerHTML=bookings.map(b=>`<div class="row"><div><b>${esc(b.guest_name||'Гость')}</b><div class="muted">${esc(b.rooms?.name||'Номер')} · ${date(b.check_in_date)} → ${date(b.check_out_date)}</div></div><div>${money(b.total_amount)}</div><div>${status(b.status)}</div><div>${money(b.paid_amount)} оплачено</div><button class="btn" onclick="openBooking('${b.id}')">Подробнее</button></div>`).join('')||'<p class="muted">Нет бронирований</p>';$('ordersList').innerHTML=orders.map(o=>`<div class="row"><div><b>${esc(o.guest_name||'Заказ')}</b><div class="muted">${esc(o.guest_phone||'')} · ${date(o.created_at)}</div></div><div>${money(o.total_amount)}</div><div>${esc(o.status||'—')}</div><div>${esc(o.payment_status||'—')}</div><button class="btn" onclick="openOrder('${o.id}')">Подробнее</button></div>`).join('')||'<p class="muted">Нет заказов</p>';$('servicesList').innerHTML=services.map(s=>`<div class="row"><div><b>${esc(s.service_name||'Услуга')}</b><div class="muted">${esc(s.unit||'')} · ${esc(s.comment||'')}</div></div><div>${money(s.total_amount)}</div><div>${esc(s.status||'—')}</div><div>${esc(s.quantity||1)} × ${money(s.unit_price)}</div><button class="btn" onclick="openService('${s.id}')">Подробнее</button></div>`).join('')||'<p class="muted">Нет услуг</p>';let fq=($('financeSearch').value||'').toLowerCase();$('financeList').innerHTML=finance.filter(f=>{let u=users.find(x=>x.user_id===f.user_id)||{};return[u.Display_name,u.Phone,u.Email].join(' ').toLowerCase().includes(fq)}).map(f=>`<div class="row"><div><b>${esc(f.Display_name||users.find(u=>u.user_id===f.user_id)?.Display_name||'Без имени')}</b></div><div class="bad">${money(f.total_debt)}</div><div>${money(f.total_charged)} начислено</div><div>${money(f.total_paid)} оплачено</div><button class="btn" onclick="openUser('${f.user_id}')">За что долг →</button></div>`).join('')||'<p class="muted">Нет должников</p>'}userSearch.oninput=render;financeSearch.oninput=render;async function openBooking(id){const b=bookings.find(x=>x.id===id);if(!b)return;const nights=b.check_in_date&&b.check_out_date?Math.max(0,Math.round((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000)):0;const pending=!['подтверждено','confirmed','отменено','отменена','cancelled'].includes(String(b.status||'').toLowerCase());let svc=b.services;try{svc=typeof svc==='string'?JSON.parse(svc):svc}catch{};$('modalbox').innerHTML=`<div class="row"><h2>📅 Бронирование</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="details"><div class="detail"><b>Гость</b><br>${esc(b.guest_name||'—')}</div><div class="detail"><b>Телефон</b><br>${esc(b.guest_phone||'—')}</div><div class="detail"><b>Email</b><br>${esc(b.guest_email||'—')}</div><div class="detail"><b>Количество гостей</b><br>${esc(b.guest_count||'—')}</div><div class="detail"><b>Номер</b><br>${esc(b.rooms?.name||'—')}</div><div class="detail"><b>Период</b><br>${date(b.check_in_date)} → ${date(b.check_out_date)}<br>${nights} ночей</div><div class="detail"><b>Стоимость</b><br>${money(b.total_amount)}</div><div class="detail"><b>Оплачено</b><br>${money(b.paid_amount)}</div><div class="detail"><b>Остаток</b><br>${money(Math.max(0,Number(b.total_amount)-Number(b.paid_amount||0)))}</div><div class="detail"><b>Статус</b><br>${status(b.status)}</div><div class="detail"><b>Создано</b><br>${b.created_at?new Date(b.created_at).toLocaleString('ru-RU'):'—'}</div><div class="detail"><b>Способ оплаты</b><br>${esc(b.payment_method||'—')}</div></div><div class="card"><b>Дополнительные услуги / пожелания</b><div class="items">${esc(JSON.stringify(svc,null,2))}</div></div><div class="actions">${pending?`<button class="btn success" onclick="confirmBooking('${b.id}')">✅ Подтвердить бронь</button><button class="btn danger" onclick="cancelBooking('${b.id}')">❌ Отменить бронь</button>`:''}</div>`;$('modal').classList.add('show')}async function confirmBooking(id){if(!confirm('Подтвердить бронь? Стоимость проживания станет долгом пользователя.'))return;const{data,error}=await sb.rpc('confirm_booking',{p_booking_id:id});if(error)return alert(error.message);if(data&&!data.ok)return alert(data.message||'Не удалось подтвердить');closeModal();await loadAll();alert('Бронь подтверждена.')}async function cancelBooking(id){if(!confirm('Отменить бронь? Долг за проживание создан не будет.'))return;const{data,error}=await sb.rpc('cancel_booking',{p_booking_id:id});if(error)return alert(error.message);if(data&&!data.ok)return alert(data.message||'Не удалось отменить');closeModal();await loadAll();alert('Бронь отменена.')}async function openUser(uid){const u=users.find(x=>x.user_id===uid)||{};const[f,r,p,o,s]=await Promise.all([Promise.resolve(finance.find(x=>x.user_id===uid)||{}),sb.from('user_financial_breakdown').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('payments').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('orders').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('service_orders').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);const err=[r,p,o,s].find(x=>x.error);if(err)return alert(err.error.message);const rows=r.data||[],payments=p.data||[],ord=o.data||[],sv=s.data||[];$('modalbox').innerHTML=`<div class="row"><h2>👤 ${esc(u.Display_name||f.Display_name||'Без имени')}</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><p class="muted">${esc(u.Phone||'')} · ${esc(u.Email||'')} · ${esc(u.City||'')}</p><div class="grid"><div class="stat">Начислено<b>${money(f.total_charged)}</b></div><div class="stat">Оплачено<b class="ok">${money(f.total_paid)}</b></div><div class="stat">Долг<b class="bad">${money(f.total_debt)}</b></div><div class="stat">Скидка<b>${esc(u.discount_rate||0)}%</b></div></div><div class="card"><h3>🔴 За что должен</h3>${rows.length?`<table class="table"><tr><th>За что</th><th>Начислено</th><th>Оплачено</th><th>Остаток</th><th>Период</th></tr>${rows.map(x=>`<tr><td>${esc(x.label||x.charge_type||'—')}</td><td>${money(x.charged)}</td><td>${money(x.paid)}</td><td class="${Number(x.debt)>0?'bad':'ok'}">${money(x.debt)}</td><td>${date(x.check_in_date)} → ${date(x.check_out_date)}</td></tr>`).join('')}</table>`:'<p class="muted">Долгов нет</p>'}</div><div class="card"><h3>💳 Платежи</h3>${payments.length?`<table class="table"><tr><th>Дата</th><th>Сумма</th><th>Метод</th><th>Статус</th><th>Комментарий</th></tr>${payments.map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):'—'}</td><td>${money(x.amount)}</td><td>${esc(x.method||x.payment_method||'—')}</td><td>${esc(x.status||'—')}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table>`:'<p class="muted">Платежей нет</p>'}<div class="form"><input id="payAmount" type="number" min="1" placeholder="Сумма, ₽"><select id="payMethod"><option value="нал">Наличные</option><option value="безнал">Безналичные</option><option value="бонусы">Бонусы</option></select><input id="payNote" class="full" placeholder="Комментарий"><button class="btn success full" onclick="recordPayment('${uid}')">💳 Записать оплату</button></div></div><div class="card"><h3>🥗 Veg Raw</h3>${ord.length?ord.map(x=>`<div class="detail"><b>${money(x.total_amount)}</b> · ${esc(x.status||'—')} · ${date(x.created_at)}<div class="items">${esc(JSON.stringify(x.items,null,2))}</div></div>`).join(''):'<p class="muted">Заказов нет</p>'}</div><div class="card"><h3>🛎 Услуги</h3>${sv.length?sv.map(x=>`<div class="detail"><b>${esc(x.service_name)}</b> — ${money(x.total_amount)}<br>${esc(x.quantity)} × ${money(x.unit_price)} · ${esc(x.status||'—')}<br>${esc(x.comment||'')}</div>`).join(''):'<p class="muted">Услуг нет</p>'}</div>`;$('modal').classList.add('show')}async function recordPayment(uid){const amount=Math.round(Number($('payAmount').value)),method=$('payMethod').value,note=$('payNote').value.trim();if(!amount||amount<1)return alert('Введите сумму');if(!confirm(`Записать оплату ${money(amount)}?`))return;const{data,error}=await sb.rpc('record_user_payment',{p_user_id:uid,p_amount:amount,p_payment_method:method,p_note:note||null});if(error)return alert(error.message);if(data&&!data.ok)return alert(data.message||'Не удалось записать оплату');await loadAll();await openUser(uid);alert('Оплата записана и распределена.')}async function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;let items=o.items;try{items=typeof items==='string'?JSON.parse(items):items}catch{};$('modalbox').innerHTML=`<div class="row"><h2>🥗 Veg Raw — заказ</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="details"><div class="detail"><b>Гость</b><br>${esc(o.guest_name||'—')}</div><div class="detail"><b>Телефон</b><br>${esc(o.guest_phone||'—')}</div><div class="detail"><b>Email</b><br>${esc(o.guest_email||'—')}</div><div class="detail"><b>Сумма</b><br>${money(o.total_amount)}</div><div class="detail"><b>Оплачено</b><br>${money(o.paid_amount)}</div><div class="detail"><b>Статус</b><br>${esc(o.status||'—')}</div><div class="detail"><b>Оплата</b><br>${esc(o.payment_status||'—')}</div></div><div class="card"><h3>Состав заказа</h3><div class="items">${esc(JSON.stringify(items,null,2))}</div></div>`;$('modal').classList.add('show')}async function openService(id){const s=services.find(x=>x.id===id);if(!s)return;$('modalbox').innerHTML=`<div class="row"><h2>🛎 Услуга</h2><button class="btn" onclick="closeModal()">Закрыть</button></div><div class="details"><div class="detail"><b>Услуга</b><br>${esc(s.service_name)}</div><div class="detail"><b>Количество</b><br>${esc(s.quantity)} ${esc(s.unit||'')}</div><div class="detail"><b>Цена</b><br>${money(s.unit_price)}</div><div class="detail"><b>Итого</b><br>${money(s.total_amount)}</div><div class="detail"><b>Статус</b><br>${esc(s.status||'—')}</div><div class="detail"><b>Создано</b><br>${date(s.created_at)}</div></div><div class="card">${esc(s.comment||'Без комментария')}</div>`;$('modal').classList.add('show')}init();</script></body></html>
