name: Patch Space share navigation
on:
  push:
    branches: [feat/homepage-v13]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve Vercel share access when entering Space
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freedom-home-v14.html')
          s = p.read_text()
          old = "function openSpace(){home.classList.add('space-launch');home.classList.add('entering');setTimeout(()=>{window.location.href='space-preview.html'},1050)}"
          new = "function openSpace(){home.classList.add('space-launch');home.classList.add('entering');setTimeout(()=>{const share=new URLSearchParams(location.search).get('_vercel_share');window.location.href='space-preview.html'+(share?'?_vercel_share='+encodeURIComponent(share):'')},1050)}"
          if old not in s: raise SystemExit('openSpace marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom-home-v14.html
          git commit -m 'fix: preserve preview access when entering Space'
          git push