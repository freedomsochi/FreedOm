name: Fix Orbit portals

on:
  push:
    branches: [feat/homepage-v13]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'fix: distribute Orbit portals during opening'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13

      - name: Patch portal geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freedom-home-v14.html')
          s = p.read_text()
          needle = '.portal{opacity:0;pointer-events:none;transform:rotate(var(--a)) translateY(0) scale(.08) rotate(calc(-1 * var(--a)));filter:blur(10px)}'
          replacement = needle + '.portal:nth-child(3){--a:0deg}.portal:nth-child(4){--a:72deg}.portal:nth-child(5){--a:144deg}.portal:nth-child(6){--a:216deg}.portal:nth-child(7){--a:288deg}'
          if needle not in s:
              raise SystemExit('target CSS not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom-home-v14.html
          git commit -m 'fix: distribute Orbit portals during opening'
          git push origin feat/homepage-v13
