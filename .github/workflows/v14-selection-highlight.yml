name: V14 selection highlight

on:
  push:
    branches:
      - feat/homepage-v13

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13
          fetch-depth: 0
      - name: Patch V14 portal handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freedom-home-v14.html')
          s = p.read_text()
          old = "p.onclick = e => { e.preventDefault(); e.stopPropagation(); if (typeof open === 'function') open(i); };"
          new = "p.onclick = e => { e.preventDefault(); e.stopPropagation(); if (typeof open !== 'function') return; if (i === idx) { open(i); return; } idx = i; set(-i*72); apply(); ps.forEach((q,j)=>q.classList.toggle('selected',j===i)); };"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom-home-v14.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply deliberate tap to V14 portal handler'
          git push origin feat/homepage-v13
