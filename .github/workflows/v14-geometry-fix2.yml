name: V14 geometry fix 2

on:
  push:
    branches:
      - feat/homepage-v13

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13
          fetch-depth: 0
      - name: Apply exact geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('freedom-home-v14.html')
          s=p.read_text()
          marker='/* V14 geometry final: equal gaps */'
          if marker in s:
              raise SystemExit(0)
          css='''<style>\n/* V14 geometry final: equal gaps */\n.portal{margin:0!important}\n@media (min-width:761px){.portal[data-i="0"]{--x:0px;--y:calc(-1 * min(calc(23.5vw + 56px),261px))}.portal[data-i="1"]{--x:calc(.9510565163 * min(calc(23.5vw + 56px),261px));--y:calc(-.3090169944 * min(calc(23.5vw + 56px),261px))}.portal[data-i="2"]{--x:calc(.5877852523 * min(calc(23.5vw + 56px),261px));--y:calc(.8090169944 * min(calc(23.5vw + 56px),261px))}.portal[data-i="3"]{--x:calc(-.5877852523 * min(calc(23.5vw + 56px),261px));--y:calc(.8090169944 * min(calc(23.5vw + 56px),261px))}.portal[data-i="4"]{--x:calc(-.9510565163 * min(calc(23.5vw + 56px),261px));--y:calc(-.3090169944 * min(calc(23.5vw + 56px),261px))}}\n@media (max-width:760px){.portal[data-i="0"]{--x:0px;--y:calc(-1 * (31vw + 38.5px))}.portal[data-i="1"]{--x:calc(.9510565163 * (31vw + 38.5px));--y:calc(-.3090169944 * (31vw + 38.5px))}.portal[data-i="2"]{--x:calc(.5877852523 * (31vw + 38.5px));--y:calc(.8090169944 * (31vw + 38.5px))}.portal[data-i="3"]{--x:calc(-.5877852523 * (31vw + 38.5px));--y:calc(.8090169944 * (31vw + 38.5px))}.portal[data-i="4"]{--x:calc(-.9510565163 * (31vw + 38.5px));--y:calc(-.3090169944 * (31vw + 38.5px))}}</style>'''
          s=s.replace('</body>',css+'</body>') if '</body>' in s else s.replace('</html>',css+'</html>')
          p.write_text(s)
          PY
      - name: Commit exact geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom-home-v14.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make V14 orbit geometry truly symmetric'
          git push origin feat/homepage-v13
