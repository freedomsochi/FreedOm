name: Apply Veg-raw order fix
on:
  push:
    branches: [vegraw-order-fix-auto]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start="    document.getElementById('orderForm').addEventListener('submit',async function(e){"
          end="    window.addEventListener('load',function(){"
          i=s.find(start); j=s.find(end,i)
          if i<0 or j<0: raise SystemExit('orderForm handler not found')
          new="""    document.getElementById('orderForm').addEventListener('submit',async function(e){e.preventDefault();const form=this,submitBtn=form.querySelector('button[type=\\\"submit\\\"]'),errorDiv=document.getElementById('orderError'),successDiv=document.getElementById('orderSuccess');errorDiv.style.display='none';successDiv.style.display='none';submitBtn.disabled=true;submitBtn.textContent='Отправка...';const name=document.getElementById('orderName').value.trim(),price=parseInt(document.getElementById('orderPrice').value)||0,guestName=document.getElementById('orderGuestName').value.trim(),guestPhone=document.getElementById('orderGuestPhone').value.trim(),guestEmail=document.getElementById('orderGuestEmail').value.trim(),quantity=parseInt(document.getElementById('orderQuantity').value)||1,comment=document.getElementById('orderComment').value.trim();if(!guestName||!guestPhone){errorDiv.textContent='Заполните имя и телефон.';errorDiv.style.display='block';submitBtn.disabled=false;submitBtn.textContent='✅ Заказать';return}const totalAmount=price*quantity,items=[{name,quantity,price,comment}];try{const session=await supabase.auth.getSession(),userId=session.data.session?.user?.id||null;const{error}=await supabase.from('orders').insert({user_id:userId,guest_name:guestName,guest_phone:guestPhone,guest_email:guestEmail||null,items,total_amount:totalAmount,status:'новый',payment_status:'не выбрано'});if(error)throw error;const formspreeForm=document.createElement('form');formspreeForm.method='POST';formspreeForm.action='https://formspree.io/f/xpqgqkzgo';formspreeForm.style.display='none';const fields={type:'Новый заказ Veg-raw кухни',item:name,quantity:String(quantity),total:String(totalAmount)+' ₽',guest_name:guestName,guest_phone:guestPhone,guest_email:guestEmail||'не указан',comment:comment||'нет'};Object.entries(fields).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;formspreeForm.appendChild(input)});document.body.appendChild(formspreeForm);formspreeForm.submit() }catch(error){console.error('Ошибка заказа:',error);errorDiv.textContent='Ошибка: '+error.message;errorDiv.style.display='block';submitBtn.disabled=false;submitBtn.textContent='✅ Заказать'}});\n"""
          p.write_text(s[:i]+new+s[j:],encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html && git diff --cached --quiet && exit 0 || true
          git commit -m 'Fix Veg-raw Formspree order redirect'
          git push
