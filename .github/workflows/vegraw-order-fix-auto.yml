name: Fix Veg-raw order Formspree

on:
  push:
    branches:
      - vegraw-order-fix-auto

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch order handler
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'FreeDom: Veg-raw Formspree redirect fix' in text:
              print('Patch already present')
              raise SystemExit(0)

          start = text.find("document.getElementById('orderForm').addEventListener('submit'")
          if start < 0:
              raise SystemExit('orderForm submit handler not found')

          end_marker = "    window.addEventListener('load'"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('end of order handler not found')

          new_handler = r'''    /* FreeDom: Veg-raw Formspree redirect fix */
          document.getElementById('orderForm').addEventListener('submit',async function(e){
              e.preventDefault();
              const form=this;
              const submitBtn=form.querySelector('button[type="submit"]');
              const errorDiv=document.getElementById('orderError');
              const successDiv=document.getElementById('orderSuccess');
              errorDiv.style.display='none';
              successDiv.style.display='none';
              submitBtn.disabled=true;
              submitBtn.textContent='Отправка...';
              const name=document.getElementById('orderName').value.trim();
              const price=parseInt(document.getElementById('orderPrice').value)||0;
              const guestName=document.getElementById('orderGuestName').value.trim();
              const guestPhone=document.getElementById('orderGuestPhone').value.trim();
              const guestEmail=document.getElementById('orderGuestEmail').value.trim();
              const quantity=parseInt(document.getElementById('orderQuantity').value)||1;
              const comment=document.getElementById('orderComment').value.trim();
              if(!guestName||!guestPhone){
                  errorDiv.textContent='Заполните имя и телефон.';
                  errorDiv.style.display='block';
                  submitBtn.disabled=false;
                  submitBtn.textContent='✅ Заказать';
                  return;
              }
              const totalAmount=price*quantity;
              try{
                  const session=await supabase.auth.getSession();
                  const userId=session.data.session?.user?.id||null;
                  const {error}=await supabase.from('orders').insert({
                      user_id:userId,
                      guest_name:guestName,
                      guest_phone:guestPhone,
                      guest_email:guestEmail||null,
                      items:[{name,quantity,price,comment}],
                      total_amount:totalAmount,
                      status:'новый',
                      payment_status:'не выбрано'
                  });
                  if(error) throw error;

                  const formspreeForm=document.createElement('form');
                  formspreeForm.method='POST';
                  formspreeForm.action='https://formspree.io/f/xpqgqkzgo';
                  formspreeForm.style.display='none';
                  const fields={
                      type:'Новый заказ Veg-raw кухни',
                      item:name,
                      quantity:String(quantity),
                      total:String(totalAmount)+' ₽',
                      guest_name:guestName,
                      guest_phone:guestPhone,
                      guest_email:guestEmail||'не указан',
                      comment:comment||'нет'
                  };
                  Object.entries(fields).forEach(([key,value])=>{
                      const input=document.createElement('input');
                      input.type='hidden';
                      input.name=key;
                      input.value=value;
                      formspreeForm.appendChild(input);
                  });
                  document.body.appendChild(formspreeForm);
                  formspreeForm.submit();
              }catch(error){
                  console.error('Ошибка заказа:',error);
                  errorDiv.textContent='Ошибка: '+error.message;
                  errorDiv.style.display='block';
                  submitBtn.disabled=false;
                  submitBtn.textContent='✅ Заказать';
              }
          });
'''

          text = text[:start] + new_handler + text[end:]
          path.write_text(text, encoding='utf-8')

          # Basic structural checks before committing.
          patched = path.read_text(encoding='utf-8')
          assert 'formspreeForm.action=\'https://formspree.io/f/xpqgqkzgo\'' in patched
          assert 'formspreeForm.submit();' in patched
          assert "supabase.from('orders').insert" in patched
          print('Patch prepared successfully')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Veg-raw Formspree order redirect"
          git push