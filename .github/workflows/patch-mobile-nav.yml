name: Patch mobile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-nav-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
          /* FreeDom: compact guest navigation for phones */
          .top-nav{display:flex!important;justify-content:center!important;align-items:center!important;padding:7px 0!important;gap:4px!important;flex-wrap:nowrap!important;overflow:hidden!important}
          .top-nav .nav-links{display:flex!important;align-items:center!important;justify-content:center!important;gap:3px!important;flex-wrap:nowrap!important;min-width:0!important}
          .top-nav .nav-links a,.top-nav .login-icon{font-size:.62rem!important;padding:5px 6px!important;white-space:nowrap!important;border-radius:10px!important;line-height:1.2!important}
          .top-nav .login-icon{flex:0 0 auto!important}
          .top-nav .login-icon svg{width:13px!important;height:13px!important}
          @media (max-width:380px){.top-nav{gap:2px!important}.top-nav .nav-links{gap:2px!important}.top-nav .nav-links a,.top-nav .login-icon{font-size:.56rem!important;padding:4px 5px!important}.top-nav .login-icon svg{width:12px!important;height:12px!important}}
          '''
          if 'FreeDom: compact guest navigation for phones' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          links = '''<div class="nav-links">
              <a href="partners.html">🤝 Партнёрка</a>
              <a href="purchases.html">🛍 Покупки</a>
              <a href="profile.html">👤 Личный кабинет</a>
          </div>'''
          s, n = re.subn(r'<div class="nav-links">.*?</div>', links, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('nav-links block was not found')

          # Remove an admin link from the public top navigation if present.
          s = re.sub(r'<a[^>]+href=["\']admin\.html["\'][^>]*>.*?</a>', '', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched page and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-mobile-nav.yml
          git add index.html .github/workflows/patch-mobile-nav.yml
          git commit -m "Fix mobile guest navigation [mobile-nav-patched]"
          git push
