name: Fix Veg-raw Formspree

on:
  push:
    paths:
      - '.github/workflows/fix-vegraw.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Veg-raw order handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """const formspreeForm=document.createElement('form');formspreeForm.method='POST';formspreeForm.action='https://formspree.io/f/xpqgqkzgo';formspreeForm.style.display='none';const fields={type:'Новый заказ Veg-raw кухни',item:name,quantity:String(quantity),total:String(totalAmount)+' ₽',guest_name:guestName,guest_phone:guestPhone,guest_email:guestEmail||'не указан',comment:comment||'нет'};Object.entries(fields).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;formspreeForm.appendChild(input)});document.body.appendChild(formspreeForm);formspreeForm.submit()"""
          new = """const formData=new FormData();formData.append('type','Новый заказ Veg-raw кухни');formData.append('item',name);formData.append('quantity',String(quantity));formData.append('total',String(totalAmount)+' ₽');formData.append('guest_name',guestName);formData.append('guest_phone',guestPhone);formData.append('guest_email',guestEmail||'не указан');formData.append('comment',comment||'нет');try{const formspreeResponse=await fetch('https://formspree.io/f/xpqgqkzgo',{method:'POST',body:formData,headers:{Accept:'application/json'}});if(!formspreeResponse.ok){console.warn('Formspree notification failed:',formspreeResponse.status)}}catch(notificationError){console.warn('Formspree notification error:',notificationError)}form.style.display='none';successDiv.style.display='block';submitBtn.disabled=false;submitBtn.textContent='✅ Заказать';setTimeout(()=>{document.getElementById('orderModal').classList.remove('active');document.body.style.overflow='';form.style.display='block';successDiv.style.display='none'},3000)"""
          if old not in s:
              raise SystemExit('Old Veg-raw Formspree handler not found; aborting without changes.')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Veg-raw order Formspree redirect' || exit 0
          git push
