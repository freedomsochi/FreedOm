name: Fix Veg-raw order handler

on:
  push:
    branches:
      - vegraw-fix-20260811

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch order handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = "document.getElementById('orderForm').addEventListener('submit'"
          end_marker = "window.addEventListener('load'"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Veg-raw order handler markers not found')
          new_handler = r'''document.getElementById('orderForm').addEventListener('submit',async function(e){
      e.preventDefault();
      const form=this;
      const submitBtn=form.querySelector('button[type="submit"]');
      const errorDiv=document.getElementById('orderError');
      const successDiv=document.getElementById('orderSuccess');
      errorDiv.style.display='none';
      successDiv.style.display='none';
      submitBtn.disabled=true;
      submitBtn.textContent='Отправка...';
      const name=document.getElementById('orderName').value.trim();
      const price=parseInt(document.getElementById('orderPrice').value)||0;
      const guestName=document.getElementById('orderGuestName').value.trim();
      const guestPhone=document.getElementById('orderGuestPhone').value.trim();
      const guestEmail=document.getElementById('orderGuestEmail').value.trim();
      const quantity=parseInt(document.getElementById('orderQuantity').value)||1;
      const comment=document.getElementById('orderComment').value.trim();
      if(!guestName||!guestPhone){
          errorDiv.textContent='Заполните имя и телефон.';
          errorDiv.style.display='block';
          submitBtn.disabled=false;
          submitBtn.textContent='✅ Заказать';
          return;
      }
      const totalAmount=price*quantity;
      const items=[{name,quantity,price,comment}];
      try{
          const session=await supabase.auth.getSession();
          const userId=session.data.session?.user?.id||null;
          const {error}=await supabase.from('orders').insert({
              user_id:userId,
              guest_name:guestName,
              guest_phone:guestPhone,
              guest_email:guestEmail||null,
              items,
              total_amount:totalAmount,
              status:'новый',
              payment_status:'не выбрано'
          });
          if(error) throw error;
          try{
              const fd=new FormData();
              fd.append('type','Новый заказ Veg-raw кухни');
              fd.append('item',name);
              fd.append('quantity',String(quantity));
              fd.append('total',String(totalAmount)+' ₽');
              fd.append('guest_name',guestName);
              fd.append('guest_phone',guestPhone);
              fd.append('guest_email',guestEmail||'не указан');
              fd.append('comment',comment||'нет');
              const response=await fetch('https://formspree.io/f/xpqgqkzgo',{
                  method:'POST',
                  body:fd,
                  headers:{Accept:'application/json'}
              });
              if(!response.ok) console.warn('Formspree notification failed:',response.status);
          }catch(notificationError){
              console.warn('Уведомление Formspree не отправлено:',notificationError);
          }
          form.style.display='none';
          successDiv.innerHTML='✅ Заказ принят!<br><span style="font-size:.9rem;color:#c8c2d4">Мы получили ваш заказ и скоро свяжемся с вами.</span>';
          successDiv.style.display='block';
          submitBtn.disabled=false;
          submitBtn.textContent='✅ Заказать';
          setTimeout(()=>{
              document.getElementById('orderModal').classList.remove('active');
              document.body.style.overflow='';
              form.style.display='block';
              successDiv.style.display='none';
          },3000);
      }catch(error){
          console.error('Ошибка заказа:',error);
          errorDiv.textContent='Ошибка: '+error.message;
          errorDiv.style.display='block';
          submitBtn.disabled=false;
          submitBtn.textContent='✅ Заказать';
      }
  });
'''
          p.write_text(s[:start] + new_handler + s[end:], encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: restore Veg-raw AJAX submission"
          git push