name: Fix V14 Orbit and Space

on:
  push:
    branches: [feat/homepage-v13]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13
          fetch-depth: 0
      - name: Patch V14
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('freedom-home-v14.html')
          s = p.read_text()
          marker = '</style></head>'
          css = '''<style>
          /* V14 fix: five portals on one true circle centered on FreeDom */
          .portal{left:50%!important;top:50%!important;margin:-66px!important;transform:rotate(var(--a)) translateY(min(39vw,315px)) rotate(calc(-1 * var(--a) - var(--r,0deg)))!important;}
          .menu-open .portal{transform:rotate(var(--a)) translateY(min(39vw,315px)) rotate(calc(-1 * var(--a) - var(--r,0deg)))!important;}
          .space-launch .portal.active{transform:rotate(var(--a)) translateY(min(39vw,315px)) scale(8) rotate(calc(-1 * var(--a) - var(--r,0deg)))!important;transition:transform 1.35s cubic-bezier(.12,.86,.16,1),box-shadow 1.1s,background .9s!important;}
          </style>'''
          if marker not in s:
              raise SystemExit('style marker missing')
          s = s.replace(marker, css + marker, 1)
          js_marker = '</body>'
          js = '''<script>
          // V14 pointer fix: a tap on a portal must open it; only a real drag is ignored.
          (() => {
            const portals = [...document.querySelectorAll('.portal')];
            portals.forEach(p => {
              const i = Number(p.dataset.i);
              p.onclick = e => { e.preventDefault(); e.stopPropagation(); if (typeof open === 'function') open(i); };
            });
          })();
          </script>'''
          if js_marker not in s:
              raise SystemExit('body marker missing')
          s = s.replace(js_marker, js + js_marker, 1)
          s = s.replace("setTimeout(()=>{window.location.href='space-preview.html'},1050)", "setTimeout(()=>{window.location.href='space-preview.html'},1450)")
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom-home-v14.html
          git commit -m "fix: center V14 Orbit and restore Space transition"
          git rm .github/workflows/fix-v14-orbit-space.yml
          git commit -m "chore: remove one-time V14 fix workflow"
          git push origin HEAD:feat/homepage-v13
