name: Fix V14 Final
on:
  push:
    branches: [feat/homepage-v13]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13
          fetch-depth: 0
      - name: Repair V14 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('freedom-home-v14.html')
          s=p.read_text()
          s=s.replace('</style></style></head>','</style></head>',1)
          s=s.replace("setTimeout(()=>{const share=new URLSearchParams(location.search).get('_vercel_share');window.location.href='space-preview.html'+(share?'?_vercel_share='+encodeURIComponent(share):'')},1050)", "setTimeout(()=>{const share=new URLSearchParams(location.search).get('_vercel_share');window.location.href='space-preview.html'+(share?'?_vercel_share='+encodeURIComponent(share):'')},1450)")
          p.write_text(s)
          PY
          rm -f .v14-fix-trigger
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom-home-v14.html .v14-fix-trigger
          git commit -m "fix: polish V14 Space transition"
          git rm .github/workflows/fix-v14-final.yml
          git commit -m "chore: remove one-time V14 final workflow"
          git push origin HEAD:feat/homepage-v13
