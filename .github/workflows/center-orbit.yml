name: Center FreeDom Orbit
on:
  push:
    paths:
      - '.github/workflows/center-orbit.yml'
    branches:
      - feat/live-availability-bridge
permissions:
  contents: write
jobs:
  center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center Orbit geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freedom-orbit-v12.html')
          s = p.read_text(encoding='utf-8')
          old_css = ".orbit{position:absolute;width:min(103vw,760px);height:min(103vw,760px);left:50%;top:51%;transform:translate(-50%,-50%);touch-action:none;transition:transform .4s ease}"
          new_css = ".orbit{position:absolute;width:min(103vw,760px);height:min(103vw,760px);left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;transition:transform .4s ease}"
          if old_css not in s:
              raise SystemExit('orbit desktop CSS pattern not found')
          s = s.replace(old_css, new_css, 1)
          old_node = ".node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:0;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(255,249,236,.17);border:1px solid rgba(255,252,241,.56);backdrop-filter:blur(25px) saturate(125%);color:rgba(58,49,41,.62);font-size:9px;letter-spacing:.16em;text-transform:uppercase;transform:translate(-50%,-50%) rotate(calc(-1*var(--r)));transition:background .45s,color .45s,scale .65s,box-shadow .65s}"
          new_node = ".node{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:0;border-radius:50%;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(255,249,236,.17);border:1px solid rgba(255,252,241,.56);backdrop-filter:blur(25px) saturate(125%);color:rgba(58,49,41,.62);font-size:9px;letter-spacing:.16em;text-transform:uppercase;transform:translate(-50%,-50%) translate(var(--orbit-x,0px),var(--orbit-y,0px)) rotate(calc(-1*var(--r)));transition:background .45s,color .45s,scale .65s,box-shadow .65s}"
          if old_node not in s:
              raise SystemExit('node CSS pattern not found')
          s = s.replace(old_node, new_node, 1)
          old_layout = "function layoutNodes(){const w=ring.clientWidth,h=ring.clientHeight;if(!w||!h)return;const radius=Math.min(w,h)*(window.matchMedia('(max-width: 620px)').matches?.43:.37);nodes.forEach(n=>{const a=(parseFloat(n.style.getPropertyValue('--a'))||0)*Math.PI/180;const x=50+(Math.sin(a)*radius/w*100);const y=50-(Math.cos(a)*radius/h*100);n.style.left=x+'%';n.style.top=y+'%'});}"
          new_layout = "function layoutNodes(){const w=ring.clientWidth,h=ring.clientHeight;if(!w||!h)return;const radius=Math.min(w,h)*(window.matchMedia('(max-width: 620px)').matches?.43:.37);nodes.forEach(n=>{const a=(parseFloat(n.style.getPropertyValue('--a'))||0)*Math.PI/180;const x=Math.sin(a)*radius;const y=-Math.cos(a)*radius;n.style.left='50%';n.style.top='50%';n.style.setProperty('--orbit-x',x.toFixed(3)+'px');n.style.setProperty('--orbit-y',y.toFixed(3)+'px');});}"
          if old_layout not in s:
              raise SystemExit('layoutNodes pattern not found')
          s = s.replace(old_layout, new_layout, 1)
          old_mobile = ".orbit{width:124vw;height:124vw;top:51%}"
          new_mobile = ".orbit{width:124vw;height:124vw;top:50%}"
          if old_mobile not in s:
              raise SystemExit('mobile orbit CSS pattern not found')
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove maintenance workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom-orbit-v12.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: center Orbit circles on one geometric center'
          git rm .github/workflows/center-orbit.yml
          git commit -m 'chore: remove one-time Orbit centering workflow'
          git push
