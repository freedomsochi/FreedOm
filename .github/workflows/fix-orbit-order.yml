name: fix-orbit-order
on:
  push:
    branches: [feat/homepage-v13]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-v13
      - name: Fix deterministic Orbit order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('freedom-home-v14.html')
          s=p.read_text()
          marker='.portal{position:absolute;left:calc(50% + var(--x,0px));top:calc(50% + var(--y,0px));'
          inject='''.portal:nth-of-type(1){--x:0px;--y:calc(-1 * min(39vw,315px))}.portal:nth-of-type(2){--x:min(39vw,315px);--y:0px}.portal:nth-of-type(3){--x:0px;--y:min(39vw,315px)}.portal:nth-of-type(4){--x:calc(-1 * min(39vw,315px));--y:0px}.portal:nth-of-type(5){--x:0px;--y:calc(-1 * min(39vw,315px))}'''
          # Use explicit data-i selectors because the portals are direct children with stable data indices.
          if '.portal[data-i="0"]{--x:' not in s:
              s=s.replace(marker,inject+marker,1)
          old='.menu-open .portal[data-i="0"]{transition-delay:0s}.menu-open .portal[data-i="1"]{transition-delay:.08s}.menu-open .portal[data-i="2"]{transition-delay:.16s}.menu-open .portal[data-i="3"]{transition-delay:.24s}.menu-open .portal[data-i="4"]{transition-delay:.32s}'
          new='.portal[data-i="0"]{--x:0px;--y:calc(-1 * min(39vw,315px))}.portal[data-i="1"]{--x:min(39vw,315px);--y:0px}.portal[data-i="2"]{--x:0px;--y:min(39vw,315px)}.portal[data-i="3"]{--x:calc(-1 * min(39vw,315px));--y:0px}.portal[data-i="4"]{--x:calc(-1 * min(39vw,315px));--y:calc(-1 * min(39vw,315px))}.menu-open .portal[data-i="0"],.menu-open .portal[data-i="1"],.menu-open .portal[data-i="2"],.menu-open .portal[data-i="3"],.menu-open .portal[data-i="4"]{transition-delay:0s}'
          if old not in s: raise SystemExit('delay rule not found')
          s=s.replace(old,new,1)
          # Remove JS positioning so CSS is the single source of truth; keep resize-free deterministic geometry.
          start='const R=()=>Math.min(window.innerWidth*.39,315);function layoutPortals(){const r=R();ps.forEach((p,i)=>{const a=i*72*Math.PI/180;p.style.setProperty(\'--x\',(Math.sin(a)*r).toFixed(2)+\'px\');p.style.setProperty(\'--y\',(-Math.cos(a)*r).toFixed(2)+\'px\')})}layoutPortals();window.addEventListener(\'resize\',layoutPortals);ps.forEach(p=>p.addEventListener(\'pointerdown\',e=>e.stopPropagation()));'
          s=s.replace(start,'ps.forEach(p=>p.addEventListener(\'pointerdown\',e=>e.stopPropagation()));',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freedom-home-v14.html
          git commit -m "fix: make Orbit positions deterministic" || exit 0
          git push origin feat/homepage-v13
