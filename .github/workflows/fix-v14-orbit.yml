name: Fix V14 Orbit
on:
  push:
    branches: [feat/homepage-v13]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center Orbit nodes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('freedom-home-v14.html')
          s = p.read_text()
          old = '''.portal[data-i="0"]{--x:0px;--y:calc(-1 * min(39vw,315px))}.portal[data-i="1"]{--x:min(39vw,315px);--y:0px}.portal[data-i="2"]{--x:0px;--y:min(39vw,315px)}.portal[data-i="3"]{--x:calc(-1 * min(39vw,315px));--y:0px}.portal[data-i="4"]{--x:calc(-1 * min(39vw,315px));--y:calc(-1 * min(39vw,315px))}'''
          new = '''.portal[data-i="0"]{--x:0px;--y:calc(-1 * min(39vw,315px))}.portal[data-i="1"]{--x:calc(.95 * min(39vw,315px));--y:calc(-.31 * min(39vw,315px))}.portal[data-i="2"]{--x:calc(.59 * min(39vw,315px));--y:calc(.81 * min(39vw,315px))}.portal[data-i="3"]{--x:calc(-.59 * min(39vw,315px));--y:calc(.81 * min(39vw,315px))}.portal[data-i="4"]{--x:calc(-.95 * min(39vw,315px));--y:calc(-.31 * min(39vw,315px))}'''
          if old not in s:
              raise SystemExit('expected V14 Orbit rules not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-v14-orbit.yml
          git add freedom-home-v14.html .github/workflows/fix-v14-orbit.yml
          git commit -m 'fix: center V14 Orbit nodes evenly'
          git push