<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom Admin — События</title><style>body{font-family:Arial;background:#0b1020;color:#eee;padding:16px}.wrap{max-width:1100px;margin:auto}.head,.panel,.box{background:#151c30;border-radius:14px;padding:16px;margin-bottom:12px}.muted,.small{color:#9aa3b8}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 12px;border:0;border-radius:8px;background:#d4af37;color:#111;cursor:pointer}.dark{background:#263149;color:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{font-size:12px;color:#9aa3b8;text-align:left;padding:9px;border-bottom:1px solid #39445e}.table td{padding:10px;border-bottom:1px solid #2a344b;vertical-align:top}.badge{padding:4px 7px;border-radius:7px;background:#263149;font-size:11px}.on{background:#214d3a}.off{background:#4b2930}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.box{width:min(780px,100%);max-height:92vh;overflow:auto}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:8px;background:#101627;color:#fff;border:1px solid #3a4662}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mentor,.reg{background:#101627;padding:12px;border-radius:9px;margin-top:10px}.mentor h3{margin:0 0 4px}.reghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.stat{background:#101627;border-radius:9px;padding:10px 12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>📅 События</h1><p class="muted">Управление событиями и регистрациями.</p><div class="toolbar"><button class="btn" onclick="openForm()">＋ Добавить событие</button><button class="btn dark" onclick="load()">↻ Обновить</button></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Событие</th><th>Дата</th><th>Время</th><th>Место</th><th>Цена</th><th>Наставник</th><th>Главная</th><th></th></tr></thead><tbody id="list"><tr><td colspan="8">Загрузка…</td></tr></tbody></table></div></div></div><div id="modal" class="modal"><div class="box"><button class="btn dark" onclick="closeM()">✕ Закрыть</button><h2 id="title">Добавить событие</h2><input id="name" placeholder="Название события"><textarea id="desc" placeholder="Описание события"></textarea><div class="grid"><input id="date" type="date"><input id="start" type="time"><input id="end" type="time"><input id="location" placeholder="Место проведения"></div><input id="price" type="number" min="0" placeholder="Цена, ₽"><input id="image" placeholder="URL изображения события"><div class="mentor"><h3>🧑‍🏫 Наставник</h3><input id="mentorName" placeholder="Имя наставника"><textarea id="mentorDesc" placeholder="Описание наставника"></textarea><input id="mentorPhoto" placeholder="URL фотографии наставника"></div><label><input id="active" type="checkbox" checked style="width:auto"> Событие активно</label><label><input id="home" type="checkbox" style="width:auto"> Показывать на главной</label><br><button class="btn" onclick="save()">Сохранить</button></div></div><div id="regs" class="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let editing=null,cache=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';async function load(){let r=await db.from('events').select('*').order('event_date',{ascending:true}).order('start_time',{ascending:true});if(r.error)return alert(r.error.message);cache=r.data||[];$('list').innerHTML=cache.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.description||'')}</span></td><td>${new Date(x.event_date+'T00:00:00').toLocaleDateString('ru-RU')}</td><td>${esc(x.start_time||'—')}${x.end_time?'–'+esc(x.end_time):''}</td><td>${esc(x.location||'—')}</td><td>${money(x.price)}</td><td>${esc(x.mentor_name||'—')}</td><td><span class="badge ${x.show_on_home?'on':'off'}">${x.show_on_home?'Да':'Нет'}</span></td><td><button class="btn" onclick="edit('${x.id}')">Изменить</button> <button class="btn dark" onclick="toggle('${x.id}',${!x.is_active})">${x.is_active?'Скрыть':'Включить'}</button> <button class="btn dark" onclick="showRegs('${x.id}')">👥 Регистрации</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Событий пока нет.</td></tr>'}function openForm(x=null){editing=x?.id||null;$('title').textContent=editing?'✏️ Изменить событие':'＋ Добавить событие';$('name').value=x?.name||'';$('desc').value=x?.description||'';$('date').value=x?.event_date||'';$('start').value=x?.start_time||'';$('end').value=x?.end_time||'';$('location').value=x?.location||'';$('price').value=x?.price??0;$('image').value=x?.image_url||'';$('mentorName').value=x?.mentor_name||'';$('mentorDesc').value=x?.mentor_description||'';$('mentorPhoto').value=x?.mentor_photo_url||'';$('active').checked=x?.is_active!==false;$('home').checked=x?.show_on_home===true;$('modal').classList.add('show')}function edit(id){openForm(cache.find(x=>x.id===id))}function closeM(){$('modal').classList.remove('show')}async function save(){let payload={name:$('name').value.trim(),description:$('desc').value.trim()||null,event_date:$('date').value,start_time:$('start').value||null,end_time:$('end').value||null,location:$('location').value.trim()||null,price:Number($('price').value)||0,image_url:$('image').value.trim()||null,mentor_name:$('mentorName').value.trim()||null,mentor_description:$('mentorDesc').value.trim()||null,mentor_photo_url:$('mentorPhoto').value.trim()||null,is_active:$('active').checked,show_on_home:$('home').checked,updated_at:new Date().toISOString()};if(!payload.name||!payload.event_date)return alert('Укажите название и дату');let r=editing?await db.from('events').update(payload).eq('id',editing):await db.from('events').insert(payload);if(r.error)return alert(r.error.message);closeM();load()}async function toggle(id,active){let r=await db.from('events').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);load()}async function showRegs(eventId){let ev=cache.find(x=>x.id===eventId);let r=await db.from('event_registrations').select('*').eq('event_id',eventId).order('created_at',{ascending:false});if(r.error)return alert(r.error.message);let rows=r.data||[],participants=rows.reduce((s,x)=>s+(Number(x.participants)||1),0),total=rows.reduce((s,x)=>s+(Number(x.amount)||0),0),paid=rows.reduce((s,x)=>s+(Number(x.paid_amount)||0),0);let html=`<div class="box"><button class="btn dark" onclick="closeRegs()">✕ Закрыть</button><h2>👥 Регистрации: ${esc(ev?.name||'')}</h2><div class="stats"><div class="stat">Записей: <b>${rows.length}</b></div><div class="stat">Участников: <b>${participants}</b></div><div class="stat">Начислено: <b>${money(total)}</b></div><div class="stat">Оплачено: <b>${money(paid)}</b></div></div>${rows.length?rows.map(x=>`<div class="reg"><div class="reghead"><b>${esc(x.guest_name||'Без имени')}</b><span class="badge">${statusLabel(x.status)}</span></div><div>📞 ${esc(x.guest_phone||x.phone||'—')} ${x.guest_email?` · ✉️ ${esc(x.guest_email)}`:''}</div><div>👥 ${Number(x.participants)||1} · 💰 ${money(x.amount)}</div><div class="grid"><label>Статус<select id="st_${x.id}"><option value="new" ${x.status==='new'?'selected':''}>Новая</option><option value="confirmed" ${x.status==='confirmed'?'selected':''}>Подтверждена</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Отменена</option></select></label><label>Оплата<select id="ps_${x.id}"><option value="unpaid" ${x.payment_status==='unpaid'?'selected':''}>Не оплачено</option><option value="partial" ${x.payment_status==='partial'?'selected':''}>Частично</option><option value="paid" ${x.payment_status==='paid'?'selected':''}>Оплачено</option></select></label></div><label>Оплачено, ₽<input id="pa_${x.id}" type="number" min="0" max="${Number(x.amount)||0}" value="${Number(x.paid_amount)||0}"></label><div class="actions"><button class="btn" onclick="updateReg('${x.id}')">💾 Сохранить</button><button class="btn dark" onclick="quickConfirm('${x.id}')">✓ Подтвердить</button><button class="btn dark" onclick="quickCancel('${x.id}')">Отменить</button></div><div class="small">Запись: ${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}${x.comment?` · ${esc(x.comment)}`:''}</div></div>`).join(''):'<p class="muted">Регистраций пока нет.</p>'}</div>`;$('regs').innerHTML=html;$('regs').classList.add('show')}function statusLabel(s){return s==='confirmed'?'Подтверждена':s==='cancelled'?'Отменена':'Новая'}async function updateReg(id){let paid=Math.max(0,Number($('pa_'+id).value)||0),r=await db.from('event_registrations').update({status:$('st_'+id).value,payment_status:$('ps_'+id).value,paid_amount:paid,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);alert('Сохранено');let eventId=(await db.from('event_registrations').select('event_id').eq('id',id).single()).data?.event_id;if(eventId)showRegs(eventId)}async function quickConfirm(id){let r=await db.from('event_registrations').update({status:'confirmed',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);let q=await db.from('event_registrations').select('event_id').eq('id',id).single();if(q.data?.event_id)showRegs(q.data.event_id)}async function quickCancel(id){if(!confirm('Отменить регистрацию?'))return;let r=await db.from('event_registrations').update({status:'cancelled',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);let q=await db.from('event_registrations').select('event_id').eq('id',id).single();if(q.data?.event_id)showRegs(q.data.event_id)}function closeRegs(){$('regs').classList.remove('show')}load();</script></body></html>
