<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeDom — Rooms / Site Layout V2</title>
<style>
:root{--glass:rgba(18,23,22,.72);--line:rgba(255,255,255,.14);--text:#f3eee4;--muted:#b8b5ab;--accent:#e8c98c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111612;color:var(--text);font-family:Inter,Arial,sans-serif}#scene{position:fixed;inset:0}canvas{display:block}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none}.panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 18px 60px #0007;border-radius:18px}.brand{position:absolute;left:22px;top:22px;padding:12px 16px}.brand b{letter-spacing:.16em;font-size:12px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.levels{position:absolute;left:22px;top:50%;transform:translateY(-50%);padding:10px;display:flex;flex-direction:column;gap:5px}.levels button,.actions button{border:0;background:transparent;color:var(--muted);padding:11px 14px;border-radius:12px;text-align:left;font-size:14px;cursor:pointer}.levels button:hover,.levels button.active{background:#ffffff12;color:#fff}.levels button.active{box-shadow:inset 2px 0 0 var(--accent)}.actions{position:absolute;right:22px;top:22px;padding:8px;display:flex;gap:4px}.actions button{text-align:center}.hint{position:absolute;right:22px;bottom:22px;padding:13px 16px;color:var(--muted);font-size:12px}.hint strong{color:#fff}.legend{position:absolute;left:22px;bottom:22px;padding:10px 13px;color:var(--muted);font-size:11px}.card{position:absolute;right:22px;bottom:72px;width:min(350px,calc(100vw - 44px));padding:18px;display:none}.card.show{display:block}.card h2{margin:0 0 6px;font-size:21px}.card p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}.card .meta{margin-top:12px;color:#ddd6c7;font-size:12px}.card button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:12px;background:#eee2c7;color:#201c16;font-weight:700;cursor:pointer}
@media(max-width:700px){.levels{left:10px}.brand{left:10px;top:10px}.actions{right:10px;top:10px}.hint,.legend{display:none}.card{right:10px;bottom:10px}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="ui">
<div class="panel brand"><b>FREEDOM</b><span>ROOMS · 3D SPACE</span></div>
<div class="panel levels" id="levels">
<button data-level="space" class="active">Пространство</button>
<button data-level="-1">−1 этаж</button><button data-level="1">1 этаж</button><button data-level="2">2 этаж</button><button data-level="3">3 этаж</button><button data-level="attic">Мансарда</button>
</div>
<div class="panel actions"><button id="home">← На главную</button><button id="light">☼</button></div>
<div class="panel legend">Вращайте карту · колесо — масштаб · нажмите на точку</div>
<div class="panel hint"><strong>FreeDom</strong> · план территории по ручному эскизу</div>
<div class="panel card" id="card"><h2 id="cardTitle"></h2><p id="cardText"></p><div class="meta" id="cardMeta"></div><button>Забронировать</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x96a699);scene.fog=new THREE.Fog(0x96a699,85,190);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,600);camera.position.set(58,68,62);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=28;controls.maxDistance=125;controls.maxPolarAngle=Math.PI*.47;
scene.add(new THREE.HemisphereLight(0xf4efe2,0x34433a,2.1));const sun=new THREE.DirectionalLight(0xffe7bf,3.2);sun.position.set(-40,75,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const root=new THREE.Group();scene.add(root);
const levels={};const hotspots=[];
const mat={ground:new THREE.MeshStandardMaterial({color:0x71806f,roughness:.97}),path:new THREE.MeshStandardMaterial({color:0xb4a78f,roughness:.92}),wall:new THREE.MeshStandardMaterial({color:0xd6c8ad,roughness:.74}),wall2:new THREE.MeshStandardMaterial({color:0xb6aa95,roughness:.8}),floor:new THREE.MeshStandardMaterial({color:0x90745a,roughness:.9}),water:new THREE.MeshPhysicalMaterial({color:0x438d97,roughness:.09,transmission:.3,transparent:true,opacity:.84}),roof:new THREE.MeshStandardMaterial({color:0x514a43,roughness:.84}),wood:new THREE.MeshStandardMaterial({color:0x765b43,roughness:.86}),leaf:new THREE.MeshStandardMaterial({color:0x47644b,roughness:1}),dark:new THREE.MeshStandardMaterial({color:0x252a27,roughness:.96}),accent:new THREE.MeshStandardMaterial({color:0xc9a66c,roughness:.7}),glass:new THREE.MeshPhysicalMaterial({color:0x72a8ae,roughness:.17,transmission:.15,transparent:true,opacity:.78})};
function box(g,x,y,z,sx,sy,sz,m,cast=true){const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;g.add(q);return q}
function cyl(g,x,y,z,r,h,m){const q=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.88,h,14),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);cyl(g,0,2.3,0,.34*s,4.6*s,mat.wood);cyl(g,0,5.1,0,1.65*s,2.7*s,mat.leaf);cyl(g,.75,6,.15,1.15*s,2.1*s,mat.leaf);root.add(g)}
function hotspot(name,x,z,text,level='space'){const g=new THREE.Group();g.position.set(x,.9,z);const ring=new THREE.Mesh(new THREE.RingGeometry(.42,.56,32),new THREE.MeshBasicMaterial({color:0xf0d39a,transparent:true,opacity:.95,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;g.add(ring);g.add(new THREE.Mesh(new THREE.SphereGeometry(.18,16,16),new THREE.MeshBasicMaterial({color:0xffffff})));g.userData={hotspot:true,name,text,level};root.add(g);hotspots.push(g);return g}
function room(g,x,z,w,d,h,label){box(g,x,h/2,z,w,h,d,mat.floor,false);const t=.22;box(g,x,h,z-d/2,w,t,h,mat.wall);box(g,x,h,z+d/2,w,t,h,mat.wall);box(g,x-w/2,h,z,t,h,d,mat.wall);box(g,x+w/2,h,z,t,h,d,mat.wall);}

// ========================= TERRITORY =========================
// North is the top of the drawing. South is the gates/front approach.
box(root,0,-.7,0,92,1.4,76,mat.ground,false);
// Main approach from gates in the south toward the house.
box(root,0,.04,31,9,.12,29,mat.path,false);
box(root,-9,.05,20,3,.12,24,mat.path,false);
// Gates at the south boundary.
box(root,0,2.15,34,10,4,.35,mat.dark);box(root,-4.2,1.7,34,7,.35,.28,mat.accent);box(root,4.2,1.7,34,7,.35,.28,mat.accent);

// Central house footprint. Pool is IN FRONT / SOUTH of the house, not on its side.
const houseFoot=box(root,0,.3,-1,30,.6,25,mat.wall2,false);
// Front porch faces south toward the pool and entrance route.
box(root,8,1.5,12,8,1,4,mat.wood);for(let i=0;i<4;i++)box(root,8,.25+i*.28,14+i*.55,8-i*.45,.3,1,mat.path,false);

// Pool directly in front / south of the house.
box(root,7,.2,19,24,.42,11,mat.path,false);box(root,7,.28,19,22,.46,9.5,mat.water,false);
hotspot('Бассейн',7,19,'Бассейн перед домом, центральная территория','space');

// Fountain to the LEFT / west of the pool.
cyl(root,-11,.45,18,1.55,.65,mat.accent);cyl(root,-11,1.15,18,.28,1.2,mat.water);hotspot('Фонтан',-11,18,'Фонтан слева от бассейна','space');

// Sports ground BELOW / SOUTH-WEST of the house, not beside the pool.
box(root,-20,.12,25,17,.24,12,mat.path,false);
// pull-up bar
box(root,-25,3.2,22,.28,6,.28,mat.dark);box(root,-19,3.2,22,.28,6,.28,mat.dark);box(root,-22,6,22,6,.28,.28,mat.dark);
// push-up equipment and kettlebell
box(root,-24,1.0,28,.4,.3,3,mat.dark);cyl(root,-17,.85,27,.65,1.25,mat.dark);
hotspot('Спортивная площадка',-20,25,'Гиря, турник и оборудование для отжиманий','space');

// Hammock directly NORTH of the pool.
box(root,3,2,-1,.2,4,.2,mat.wood);box(root,11,2,-1,.2,4,.2,mat.wood);const hammock=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,8,10),mat.accent);hammock.rotation.z=Math.PI/2;hammock.position.set(7,1.5,-1);root.add(hammock);hotspot('Гамак',7,-1,'Гамак прямо за бассейном, в северной части','space');

// Bungalow farther NORTH than the hammock.
box(root,7,2,-13,10,4.2,7,mat.wood);box(root,7,4.45,-13,11,.55,8,mat.roof);hotspot('Бунгало',7,-13,'Бунгало дальше к северу от гамака','space');

// Pond on the north-west side, near the trees.
box(root,-25,.18,-18,13,.35,9,mat.water,false);hotspot('Пруд',-25,-18,'Пруд в северо-западной садовой части','space');

// Summer kitchen SOUTH of the pool, near the rear/southern part of the site.
box(root,23,2.0,24,10,4,7,mat.wood);box(root,23,4.3,24,11,.5,8,mat.roof);hotspot('Летняя кухня',23,24,'Летняя кухня за бассейном, в южной части','space');

// Sauna currently shown only as the existing sauna zone near the summer kitchen.
box(root,23,1.8,32,8,3.6,6,mat.wood);box(root,23,3.8,32,9,.45,7,mat.roof);hotspot('Баня',23,32,'Баня в южной части рядом с летней кухней','space');

// No second/development sauna is added to this version.

// Garden trees following the hand sketch: mainly north and perimeter.
[[-36,-28,1.05],[-31,-10,.9],[-28,-27,.85],[-20,-31,.95],[-13,-25,.85],[-2,-25,.8],[18,-23,.9],[30,-18,.95],[35,-28,.9],[35,4,.8],[-34,7,.75],[-31,18,.8]].forEach(a=>tree(...a));

// ========================= HOUSE / FLOORS =========================
// These floor plans preserve the confirmed room structure; site objects above follow the user's hand-drawn site plan.
const floorDefs={
'-1':{y:1,rooms:[[-6,0,10,10,'Нижняя зона / бассейн'],[6,0,8,10,'Кухня'],[0,7,17,5,'Терраса']]},
'1':{y:5,rooms:[[0,0,14,11,'Гостиная'],[7,-5,6,4,'Кухня'],[-7,-4,5,5,'Коридор'],[7,3,4,4,'Санузел'],[0,8,18,5,'Закрытая веранда']]},
'2':{y:9,rooms:[[-5,-1,8,9,'Хостел стандарт — левый'],[5,-1,8,9,'Хостел стандарт — правый'],[-5,6,7,4,'Администрация'],[5,6,7,4,'Семейная'],[0,6,3,3,'Санузел']]},
'3':{y:13,rooms:[[-5,-1,7,9,'Практика / йога — левая часть'],[5,-1,7,9,'Практика / йога — правая часть'],[0,5,10,5,'Йога / общее пространство'],[-8,6,3,3,'Боковая зона'],[8,6,3,3,'Боковая зона']]},
'attic':{y:17,rooms:[[0,0,15,12,'Мансарда — план уточняется']]}
};
for(const [id,def] of Object.entries(floorDefs)){const g=new THREE.Group();g.position.y=def.y;levels[id]=g;root.add(g);for(const r of def.rooms){const[x,z,w,d,label]=r;room(g,x,z,w,d,3.2,label)}box(g,0,-.15,0,25,.3,20,mat.wall2,false)}
// windows / facade cues
for(const id of Object.keys(floorDefs)){const y=floorDefs[id].y+1.9;for(let x=-9;x<=9;x+=4.5)box(root,x,y,-10.12,2.2,1.5,.12,mat.glass);}
// roof hint, kept transparent in spirit by material choice
box(root,0,19.2,-1,31,1,26,mat.roof);

// Room hotspots
hotspot('Гостиная',0,1,'Главное общее пространство первого этажа','1').position.y=6.2;
hotspot('Закрытая веранда',0,8,'Отдельная закрытая веранда первого этажа','1').position.y=6.2;
hotspot('Хостел стандарт — левый',-5,-1,'Стандартный хостел','2').position.y=10.2;
hotspot('Хостел стандарт — правый',5,-1,'Стандартный хостел','2').position.y=10.2;
hotspot('Семейная комната',5,6,'Семейная комната второго этажа','2').position.y=10.2;
hotspot('Йога / практика',0,5,'Общее пространство практик третьего этажа','3').position.y=14.2;

let current='space',dark=false;
function setLevel(id){current=id;document.querySelectorAll('#levels button').forEach(b=>b.classList.toggle('active',b.dataset.level===id));for(const[k,g]of Object.entries(levels)){const active=id==='space'||k===id;g.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=active?1:.12}})}hotspots.forEach(h=>h.visible=id==='space'||h.userData.level===id);document.querySelector('#card').classList.remove('show')}
function focusHotspot(h){controls.target.set(h.position.x,Math.max(1,h.position.y),h.position.z);camera.position.set(h.position.x+11,h.position.y+13,h.position.z+13);document.querySelector('#cardTitle').textContent=h.userData.name;document.querySelector('#cardText').textContent=h.userData.text;document.querySelector('#cardMeta').textContent=h.userData.level==='space'?'Пространство территории':'Этаж '+h.userData.level;document.querySelector('#card').classList.add('show')}
document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>setLevel(b.dataset.level));
document.querySelector('#light').onclick=()=>{dark=!dark;scene.background.set(dark?0x101715:0x96a699);sun.intensity=dark?1.15:3.2};
document.querySelector('#home').onclick=()=>location.href='index.html';
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(hotspots,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.hotspot)o=o.parent;if(o?.userData.hotspot)focusHotspot(o)}});
setLevel('space');function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
