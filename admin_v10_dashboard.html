<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Дашборд</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.fd-table{width:100%;border-collapse:collapse}.fd-table th,.fd-table td{text-align:left;padding:10px;border-bottom:1px solid var(--fd-line)}.fd-table th{color:var(--fd-muted);font-size:12px}.fd-empty{padding:18px 0;color:var(--fd-muted)}@media(max-width:700px){.fd-table{font-size:13px}.fd-table th:nth-child(3),.fd-table td:nth-child(3){display:none}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a class="active" href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin.html">💰 <span class="label">Финансы</span></a><a href="admin_v9_events.html">📋 <span class="label">Регистрации</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><div><h1 class="fd-title">Дашборд</h1><div class="fd-sub">Сегодня · единая картина FreeDom</div></div><div class="fd-actions"><a class="fd-btn" href="admin_v10_events.html">🎫 События</a><a class="fd-btn primary" href="admin_v10.html">👥 Гости</a></div></header><section class="fd-grid"><div class="fd-card"><div class="fd-stat-label">Гостей</div><div id="guests" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Активных событий</div><div id="events" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Регистраций</div><div id="regs" class="fd-stat-value">—</div></div><div class="fd-card"><div class="fd-stat-label">Долг гостей</div><div id="debt" class="fd-stat-value red">—</div></div></section><section class="fd-section fd-card"><h2 style="margin-top:0">🎫 Ближайшие события</h2><div id="eventList" class="fd-empty">Загрузка…</div></section><section class="fd-section fd-card"><h2 style="margin-top:0">📝 Последние регистрации</h2><div id="regList" class="fd-empty">Загрузка…</div></section></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';async function run(){const today=new Date().toISOString().slice(0,10);const [{count:g},{count:e},{count:r},{data:users},{data:events},{data:regs}]=await Promise.all([sb.from('users').select('user_id',{count:'exact',head:true}),sb.from('events').select('id',{count:'exact',head:true}).eq('is_active',true),sb.from('event_registrations').select('id',{count:'exact',head:true}),sb.from('users').select('total_debt').limit(5000),sb.from('events').select('id,name,event_date,start_time,end_time,location,price,is_active').eq('is_active',true).gte('event_date',today).order('event_date').order('start_time').limit(8),sb.from('event_registrations').select('id,guest_name,participants,amount,paid_amount,status,created_at,event_id,events(name,event_date)').order('created_at',{ascending:false}).limit(8)]);$('guests').textContent=g??0;$('events').textContent=e??0;$('regs').textContent=r??0;$('debt').textContent=money((users||[]).reduce((s,u)=>s+Math.max(0,Number(u.total_debt)||0),0));$('eventList').innerHTML=(events||[]).length?(events||[]).map(x=>`<div class="fd-row"><div><b>${esc(x.name)}</b><div class="fd-muted">📅 ${new Date(x.event_date+'T00:00:00').toLocaleDateString('ru-RU')}${x.start_time?' · '+esc(x.start_time):''}${x.location?' · 📍 '+esc(x.location):''}</div></div><span class="fd-badge">${Number(x.price)?money(x.price):'Бесплатно'}</span></div>`).join(''):'<div class="fd-empty">Ближайших событий нет.</div>';$('regList').innerHTML=(regs||[]).length?`<table class="fd-table"><thead><tr><th>Гость</th><th>Событие</th><th>Дата</th><th>Статус</th><th>Оплата</th></tr></thead><tbody>${regs.map(x=>`<tr><td>${esc(x.guest_name||'—')}</td><td>${esc(x.events?.name||'—')}</td><td>${x.events?.event_date?new Date(x.events.event_date+'T00:00:00').toLocaleDateString('ru-RU'):'—'}</td><td><span class="fd-badge ${x.status==='confirmed'?'green':x.status==='cancelled'?'red':''}">${esc(x.status||'new')}</span></td><td>${Number(x.amount)?money(x.paid_amount||0)+' / '+money(x.amount):'Бесплатно'}</td></tr>`).join('')}</tbody></table>`:'<div class="fd-empty">Регистраций пока нет.</div>'}run();</script></body></html>
