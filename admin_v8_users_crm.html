<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Клиенты</title><style>body{font-family:Arial,sans-serif;background:#0b1020;color:#eee;padding:14px;margin:0}.wrap{max-width:1100px;margin:auto}.panel,.box{background:#151c30;border-radius:14px;padding:15px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search,select,input,textarea{box-sizing:border-box;padding:11px;border-radius:9px;background:#101627;color:#fff;border:1px solid #3a4662}.search{flex:1;min-width:220px}.btn{padding:9px 12px;border:0;border-radius:8px;background:#d4af37;color:#111;cursor:pointer}.dark{background:#263149;color:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;font-size:12px;color:#9aa3b8;padding:9px;border-bottom:1px solid #39445e}.table td{padding:11px 9px;border-bottom:1px solid #2a344b}.tr{cursor:pointer}.tr:hover{background:#1b243b}.name{font-weight:700}.good{color:#8fe0a8}.bad{color:#ff8585}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pages{display:flex;gap:4px;flex-wrap:wrap}.page{border:0;border-radius:7px;padding:7px 9px;background:#263149;color:#fff}.active{background:#d4af37;color:#111}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}.show{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto}.profile,.sum,.item,.empty{background:#101627;border-radius:9px;padding:10px}.summary{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.sum{font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.section{margin-top:15px}.item{margin:6px 0;font-size:13px}.itemtop,.pay{display:flex;justify-content:space-between;gap:8px}.sub,.muted{font-size:12px;color:#9aa3b8}.badge{background:#263149;border-radius:7px;padding:3px 7px;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid>*{width:100%}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.table{min-width:650px}}</style></head><body><div class="wrap"><div class="panel"><h2>👥 Клиенты</h2><div class="toolbar"><input id="search" class="search" placeholder="Поиск по ФИО…"><select id="filter"><option value="all">Все клиенты</option><option value="debt">Есть долг</option><option value="zero">Без долга</option></select></div><div id="count" class="muted" style="margin-top:8px"></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>ФИО</th><th>Телефон</th><th>Email</th><th>Долг</th><th></th></tr></thead><tbody id="users"><tr><td colspan="5">Загрузка…</td></tr></tbody></table></div><div class="pager"><span id="range" class="muted"></span><div id="pages" class="pages"></div></div></div></div><div id="clientModal" class="modal"><div class="box"><button class="btn dark" style="float:right" onclick="closeClient()">✕ Закрыть</button><div id="client"></div></div></div><div id="actionModal" class="modal"><div class="box"><button class="btn dark" style="float:right" onclick="closeAction()">✕ Закрыть</button><div id="action"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');let U=[],B=[],O=[],S=[],R=[],P=[],M=[],current=null,page=1,size=25;const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pick(x,...k){for(const a of k)if(x?.[a]!=null&&String(x[a]).trim()!=='')return x[a];return ''}function prof(id){let u=U.find(x=>x.user_id===id)||{},b=B.find(x=>x.user_id===id),o=O.find(x=>x.user_id===id);return{name:pick(u,'Display_name','display_name','name')||pick(b,'guest_name')||pick(o,'guest_name')||'Гость',phone:pick(u,'Phone','phone')||pick(b,'guest_phone')||pick(o,'guest_phone')||'—',email:pick(u,'Email','email')||pick(b,'guest_email')||pick(o,'guest_email')||'—'}}function charges(id){return[...B.filter(x=>x.user_id===id).map(x=>({type:'booking',id:x.id,title:'🛏 '+(R.find(r=>r.id===x.room_id)?.name||'Бронь'),amount:+(x.total_amount||0),paid:+(x.paid_amount||0),date:x.check_in_date,status:x.status||'—'})),...O.filter(x=>x.user_id===id).map(x=>({type:'order',id:x.id,title:'🥗 Veg Raw',amount:+(x.total_amount||0),paid:+(x.paid_amount||0),date:x.created_at,status:x.status||'—'})),...S.filter(x=>x.user_id===id).map(x=>({type:'service',id:x.id,title:'🧺 '+(x.service_name||'Услуга'),amount:+(x.total_amount||0),paid:0,date:x.created_at,status:x.status||'—'}))]}function debt(id){return charges(id).reduce((s,x)=>s+Math.max(0,x.amount-x.paid),0)}function render(){let q=$('search').value.trim().toLocaleLowerCase('ru-RU'),f=$('filter').value,a=U.filter(u=>{let p=prof(u.user_id),d=debt(u.user_id);return(!q||p.name.toLocaleLowerCase('ru-RU').includes(q))&&(f==='all'||(f==='debt'&&d>0)||(f==='zero'&&d<=0))}).sort((a,b)=>prof(a.user_id).name.localeCompare(prof(b.user_id),'ru')),max=Math.max(1,Math.ceil(a.length/size));if(page>max)page=max;let part=a.slice((page-1)*size,page*size);$('count').textContent='Клиентов: '+a.length;$('range').textContent=a.length?`${(page-1)*size+1}–${Math.min(page*size,a.length)} из ${a.length}`:'Нет результатов';$('users').innerHTML=part.map(u=>{let p=prof(u.user_id),d=debt(u.user_id);return `<tr class="tr" onclick="openClient('${u.user_id}')"><td class="name">${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td><td class="${d?'bad':'good'}">${money(d)}</td><td><button class="btn" onclick="event.stopPropagation();openClient('${u.user_id}')">Открыть</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Ничего не найдено</td></tr>';$('pages').innerHTML=Array.from({length:max},(_,i)=>`<button class="page ${i+1===page?'active':''}" onclick="page=${i+1};render()">${i+1}</button>`).join('')}function openClient(id){current=id;let p=prof(id),c=charges(id),ps=P.filter(x=>x.user_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),charged=c.reduce((s,x)=>s+x.amount,0),paid=ps.reduce((s,x)=>s+(+x.amount||0),0),d=Math.max(0,charged-paid);$('client').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="profile">📞 ${esc(p.phone)}<br>✉️ ${esc(p.email)}</div><div class="actions"><button class="btn" onclick="action('booking')">＋ Бронь</button><button class="btn" onclick="action('food')">＋ Кухня</button><button class="btn" onclick="action('service')">＋ Услуга</button><button class="btn" onclick="action('payment')">💳 Оплата</button></div><div class="summary"><div class="sum">Начислено <b>${money(charged)}</b></div><div class="sum">Оплачено <b>${money(paid)}</b></div><div class="sum">Остаток <b class="${d?'bad':'good'}">${money(d)}</b></div></div>${section('🛏 Бронирования',c.filter(x=>x.type==='booking'))}${section('🥗 Veg Raw',c.filter(x=>x.type==='order'))}${section('🧺 Услуги',c.filter(x=>x.type==='service'))}<div class="section"><h3>💳 Платежи (${ps.length})</h3>${ps.map(x=>`<div class="item pay"><span><b>${esc(payTitle(x))}</b><br><span class="sub">${new Date(x.created_at).toLocaleString('ru-RU')} · ${esc(x.payment_method||x.method||'—')}</span></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Платежей пока нет</div>'}</div>`;$('clientModal').classList.add('show')}function section(title,a){return `<div class="section"><h3>${title} (${a.length})</h3>${a.map(x=>`<div class="item"><div class="itemtop"><b>${esc(x.title)}</b><b>${money(x.amount)}</b></div><div class="sub">${x.date?esc(new Date(x.date).toLocaleDateString('ru-RU')):''} · <span class="badge">${esc(x.status)}</span> · оплачено ${money(x.paid)}</div></div>`).join('')||'<div class="empty">Нет</div>'}</div>`}function payTitle(x){if(x.booking_id){let b=B.find(y=>y.id===x.booking_id);return '🛏 '+(R.find(r=>r.id===b?.room_id)?.name||'Бронь')}if(x.order_id)return '🥗 Veg Raw';if(x.service_order_id){let s=S.find(y=>y.id===x.service_order_id);return '🧺 '+(s?.service_name||'Услуга')}return '💳 Оплата'}function closeClient(){$('clientModal').classList.remove('show')}function closeAction(){$('actionModal').classList.remove('show')}async function action(type){if(!current)return;if(type==='food'){let q=await db.from('veg_raw_menu').select('*').eq('is_active',true).order('name');M=q.data||[];$('action').innerHTML=`<h2>🥗 Добавить кухню</h2><div class="formgrid"><select id="food" class="select">${M.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="foodQty" type="number" min="1" value="1"></div><textarea id="foodNote" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="saveFood()">Добавить</button>`}else if(type==='service'){let q=await db.from('services').select('*').eq('is_active',true).order('name');M=q.data||[];$('action').innerHTML=`<h2>🧺 Добавить услугу</h2><div class="formgrid"><select id="service" class="select">${M.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><input id="serviceQty" type="number" min="1" value="1"></div><textarea id="serviceNote" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="saveService()">Добавить</button>`}else if(type==='payment'){let d=debt(current);$('action').innerHTML=`<h2>💳 Добавить оплату</h2><p class="muted">Остаток: <b>${money(d)}</b></p><div class="formgrid"><input id="pay" type="number" min="1" max="${Math.max(1,d)}" placeholder="Сумма"><select id="method" class="select"><option>наличные</option><option>перевод</option><option>карта</option><option>бонусы</option></select></div><textarea id="note" placeholder="Комментарий" style="width:100%;margin-top:8px"></textarea><button class="btn" style="margin-top:8px" onclick="savePayment()">Зачислить</button>`}else{let q=await db.from('rooms').select('*').order('name');R=q.data||[];$('action').innerHTML=`<h2>🛏 Добавить бронь</h2><div class="formgrid"><select id="room" class="select">${R.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price_per_night)}/ночь</option>`).join('')}</select><input id="guests" type="number" min="1" value="1"><input id="in" type="date"><input id="out" type="date"></div><button class="btn" style="margin-top:8px" onclick="saveBooking()">Создать бронь</button>`}$('actionModal').classList.add('show')}async function saveFood(){let x=M.find(y=>y.id===$('food').value),qty=Math.max(1,+$('foodQty').value||1),p=prof(current);if(!x)return;let r=await db.from('orders').insert({user_id:current,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,items:[{name:x.name,price:x.price,quantity:qty,comment:$('foodNote').value.trim()}],total_amount:x.price*qty,status:'новый',payment_status:'не оплачено'});if(r.error)return alert(r.error.message);await refresh();closeAction();openClient(current)}async function saveService(){let x=M.find(y=>y.id===$('service').value),qty=Math.max(1,+$('serviceQty').value||1),p=prof(current);if(!x)return;let r=await db.from('service_orders').insert({user_id:current,service_id:x.id,service_name:x.name,unit:x.unit||'шт.',quantity:qty,unit_price:x.price,status:'новая',comment:$('serviceNote').value.trim()});if(r.error)return alert(r.error.message);await refresh();closeAction();openClient(current)}async function saveBooking(){let room=$('room').value,ci=$('in').value,co=$('out').value,g=+$('guests').value||1;if(!ci||!co||co<=ci)return alert('Проверьте даты');let rm=R.find(x=>x.id===room),days=Math.ceil((new Date(co)-new Date(ci))/86400000),total=(+rm?.price_per_night||0)*days,p=prof(current);if(!total)return alert('У номера нет цены за ночь');let r=await db.from('bookings').insert({room_id:room,user_id:current,guest_name:p.name,guest_phone:p.phone,guest_email:p.email,check_in_date:ci,check_out_date:co,status:'новое',total_amount:total,guest_count:g,paid_amount:0,payment_status:'не оплачено'});if(r.error)return alert(r.error.message);await refresh();closeAction();openClient(current)}async function savePayment(){let amount=+$('pay').value||0,d=debt(current);if(amount<=0)return alert('Введите сумму');if(amount>d)return alert('Сумма больше остатка');let r=await db.rpc('record_user_payment',{p_user_id:current,p_amount:amount,p_payment_method:$('method').value,p_note:$('note').value.trim()});if(r.error)return alert(r.error.message);await refresh();closeAction();openClient(current)}async function refresh(){let [u,b,o,s,r,p]=await Promise.all([db.from('users').select('*').limit(5000),db.from('bookings').select('*').limit(5000),db.from('orders').select('*').limit(5000),db.from('service_orders').select('*').limit(5000),db.from('rooms').select('*').order('name'),db.from('payments').select('*').limit(10000)]);if(u.error)return alert(u.error.message);U=u.data||[];B=b.data||[];O=o.data||[];S=s.data||[];R=r.data||[];P=p.data||[];render()}$('search').oninput=()=>{page=1;render()};$('filter').onchange=()=>{page=1;render()};refresh();</script></body></html>
