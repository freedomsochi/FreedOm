<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Покупки — FreeDom</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#0b0d17;color:#eae6f0;line-height:1.6;min-height:100vh;padding:20px 0 60px}.container{max-width:640px;margin:0 auto;padding:0 16px}.header{background:linear-gradient(145deg,rgba(26,16,61,.95),rgba(11,13,23,.95));border:1px solid rgba(212,175,55,.2);border-radius:0 0 40px 40px;padding:1.8rem 1rem;text-align:center;margin:0 -16px 1.5rem;position:relative;overflow:hidden}.header:before{content:'';position:absolute;inset:0;background:url('images/branches.png') center/cover;opacity:.4}.back-link,.header h1,.header p{position:relative;z-index:1}.back-link{position:absolute;top:16px;left:20px;color:#b8a9d4;text-decoration:none;font-size:.9rem}.header h1{font-weight:300;font-size:1.8rem;color:#d4af37}.header p{opacity:.7;font-size:.9rem}.card{background:rgba(255,255,255,.03);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:1.5rem;margin-bottom:1.2rem;box-shadow:0 8px 32px rgba(0,0,0,.4)}.card h3{color:#d4af37;margin-bottom:.8rem;font-size:1.2rem}.purchase-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}.purchase-item:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.amount{font-weight:700;color:#d4af37}.date{font-size:.8rem;opacity:.45}.badge{border-radius:30px;padding:3px 10px;font-size:.7rem;white-space:nowrap}.new{background:rgba(212,175,55,.1);color:#d4af37;border:1px solid rgba(212,175,55,.2)}.paid{background:rgba(37,211,102,.1);color:#25D366;border:1px solid rgba(37,211,102,.2)}.cancelled{background:rgba(255,107,107,.1);color:#ff6b6b;border:1px solid rgba(255,107,107,.2)}.items{font-size:.9rem;margin-top:6px;color:#c8c2d4}.btn{display:inline-block;padding:10px 24px;border-radius:40px;font-size:1rem;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#b8a9d4;width:100%;text-align:center}.footer{text-align:center;margin-top:2rem;font-size:.8rem;opacity:.3}.empty{text-align:center;opacity:.5;padding:1.5rem 0}
</style>
<link rel="stylesheet" href="freedom-transitions.css">
<script defer src="freedom-transitions.js"></script>
<link rel="stylesheet" href="freedom-account.css">
<link rel="stylesheet" href="freedom-design-system.css">
</head>
<body><div class="container"><div class="header"><a href="index.html" class="back-link">← На главную</a><h1>📋 Мои покупки</h1><p>История заказов кухни и покупок</p></div>
<div class="card"><h3>🥗 Заказы Veg-raw</h3><div id="ordersList"><div class="empty">Загрузка...</div></div></div>
<div class="card"><h3>🧾 Остальные покупки</h3><div id="purchasesList"><div class="empty">Загрузка...</div></div></div>
<a href="profile.html" class="btn">← Личный кабинет</a></div><div class="footer">FreeDom — место для жизни, отдыха и развития ❤️</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const supabase = window.supabase.createClient(
        'https://vutmbhsclmcfqqlzxqkc.supabase.co',
        'sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q'
    );
    const ordersList = document.getElementById('ordersList');
    const purchasesList = document.getElementById('purchasesList');

    function showMessage(container, message) {
        const element = document.createElement('div');
        element.className = 'empty';
        element.textContent = message;
        container.replaceChildren(element);
    }

    function createElement(tag, className, value) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (value !== undefined) element.textContent = String(value);
        return element;
    }

    function formatAmount(value) {
        const amount = Number(value);
        return Number.isFinite(amount)
            ? amount.toLocaleString('ru-RU') + ' ₽'
            : '—';
    }

    function formatDate(value, withTime) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '—';
        return withTime
            ? date.toLocaleString('ru-RU')
            : date.toLocaleDateString('ru-RU');
    }

    function renderOrder(order) {
        const item = createElement('div', 'purchase-item');
        const row = createElement('div', 'row');
        const details = createElement('div');
        details.append(
            createElement('div', 'amount', formatAmount(order.total_amount)),
            createElement('div', 'date', formatDate(order.created_at, true))
        );

        const status = String(order.status || 'новый');
        const statusClass = status === 'оплачен' || status === 'завершён'
            ? 'paid'
            : status === 'отменён' ? 'cancelled' : 'new';
        row.append(details, createElement('span', 'badge ' + statusClass, status));
        item.append(row);

        const orderItems = Array.isArray(order.items) ? order.items : [];
        const description = orderItems.map(entry => {
            if (!entry || typeof entry !== 'object') return '';
            const name = String(entry.name || 'Блюдо');
            const quantity = Number(entry.quantity);
            return name + ' × ' + (Number.isFinite(quantity) && quantity > 0 ? quantity : 1);
        }).filter(Boolean).join(', ');
        item.append(createElement('div', 'items', description || 'Состав заказа не указан'));
        return item;
    }

    function renderPurchase(purchase) {
        const item = createElement('div', 'purchase-item');
        const row = createElement('div', 'row');
        const details = createElement('div');
        details.append(
            createElement('div', 'amount', formatAmount(purchase.Amount)),
            createElement('div', 'date', formatDate(purchase.Created_at, false))
        );
        row.append(details, createElement('span', 'badge paid', '✅ Подтверждено'));
        item.append(row);
        return item;
    }

    try {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
            window.location.href = 'login.html';
            return;
        }

        const userId = sessionData.session.user.id;
        const ordersResult = await supabase
            .from('orders')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: false });

        if (ordersResult.error) {
            console.error('Ошибка загрузки заказов:', ordersResult.error);
            showMessage(ordersList, '❌ Не удалось загрузить заказы');
        } else if (!ordersResult.data?.length) {
            showMessage(ordersList, 'Пока нет заказов кухни');
        } else {
            ordersList.replaceChildren(...ordersResult.data.map(renderOrder));
        }

        const purchasesResult = await supabase
            .from('purchases')
            .select('*')
            .eq('Buyer_id', userId)
            .order('Created_at', { ascending: false });

        if (purchasesResult.error) {
            console.error('Ошибка загрузки покупок:', purchasesResult.error);
            showMessage(purchasesList, '❌ Ошибка загрузки покупок');
        } else if (!purchasesResult.data?.length) {
            showMessage(purchasesList, 'Других покупок пока нет');
        } else {
            purchasesList.replaceChildren(...purchasesResult.data.map(renderPurchase));
        }
    } catch (error) {
        console.error('Не удалось загрузить личную историю:', error);
        showMessage(ordersList, '❌ Не удалось проверить авторизацию или загрузить заказы. Обновите страницу.');
        showMessage(purchasesList, '❌ Не удалось загрузить покупки. Обновите страницу.');
    }
});
</script></body></html>
