<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Статусы профиля</title><link rel="stylesheet" href="admin_design.css"><script src="guest_profile_finance.js"></script><script src="guest_profile_status.js"></script><style>.status-list{display:grid;gap:12px}.status-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--fd-line);border-radius:16px;background:#fff}.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#e7f8f1;color:#148564}.partial{background:#fff3d9;color:#a46a00}.danger{background:#ffe8eb;color:#c83d50}</style></head><body><div class="fd-shell"><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><h1 class="fd-title">Статусы начислений</h1><div class="fd-sub">Единая логика оплаты для профиля гостя.</div></header><section class="card"><div id="statusList" class="status-list"></div></section></div></main></div><script>const samples=[['🛏️ Проживание',2000,4000],['🍲 Кухня',1600,1600],['🎫 Событие',0,1200]];document.getElementById('statusList').innerHTML=samples.map(([label,paid,total])=>{const s=FreeDomGuestStatus.payment(paid,total,Math.max(0,total-paid));return `<div class="status-row"><b>${label}</b><span class="chip ${s.className}">${s.icon} ${s.label}</span></div>`}).join('');</script></body></html>
