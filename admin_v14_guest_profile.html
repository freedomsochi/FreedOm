<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeDom CRM — Профиль гостя</title><link rel="stylesheet" href="admin_design.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.card{background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(41,77,86,.07);margin-top:14px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.name{font-size:26px;margin:0}.muted{color:var(--fd-muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{padding:14px;border:1px solid #ffffffaa;background:#ffffff70;border-radius:16px}.stat b{display:block;font-size:20px;margin-top:4px}.danger{color:#d94f5f}.ok{color:#149b78}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;border-top:1px solid var(--fd-line);align-items:center}.row:first-child{border-top:0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.paid{background:#e3f7ef;color:#138668}.partial{background:#fff2d8;color:#a66a00}.unpaid{background:#fde7ea;color:#c74758}.amount{font-weight:800;white-space:nowrap}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{padding:12px;border-radius:14px;background:#f7faf9;border:1px solid var(--fd-line)}.mini b{display:block;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:var(--fd-muted);padding:10px 0}@media(max-width:800px){.stats,.breakdown{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.breakdown{grid-template-columns:1fr}.row{align-items:flex-start}.amount{white-space:normal}.actions{width:100%}.actions .fd-btn{flex:1}}</style></head><body><div class="fd-shell"><aside class="fd-sidebar"><div class="fd-brand">Free<span>Dom</span></div><nav class="fd-nav"><a href="admin_v10_dashboard.html">📊 <span class="label">Дашборд</span></a><a class="active" href="admin_v10.html">👥 <span class="label">Гости</span></a><a href="admin_v10_events.html">🎫 <span class="label">События</span></a><a href="admin_v11_bookings.html">🛏️ <span class="label">Бронирования</span></a><a href="admin_v11_kitchen.html">🍲 <span class="label">Кухня</span></a><a href="admin_v11_services.html">🧾 <span class="label">Услуги</span></a><a href="admin_v10_finance.html">💰 <span class="label">Финансы</span></a></nav></aside><main class="fd-main"><div class="fd-container"><header class="fd-topbar"><a id="back" class="fd-muted" href="admin_v10.html">← Гости</a><h1 class="fd-title">Профиль гостя</h1><div class="fd-sub">Финансовый статус и история гостя</div></header><div id="app"><div class="card">Загрузка…</div></div></div></main></div><script>const sb=supabase.createClient('https://vutmbhsclmcfqqlzxqkc.supabase.co','sb_publishable_G7jiYh_r-oC9gkd1a09Ncw_5BKgfV_q');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'—';const qs=new URLSearchParams(location.search),uid=qs.get('id'),from=qs.get('from')||'guests';const backMap={bookings:['admin_v13_bookings.html','← Бронирования'],occupancy:['admin_v14_occupancy.html','← Кто живёт'],finance:['admin_v10_finance.html','← Финансы'],guests:['admin_v10.html','← Гости']};const [backUrl,backText]=backMap[from]||backMap.guests;$('#back').href=backUrl;$('#back').textContent=backText;function status(debt,charged){debt=Number(debt)||0;charged=Number(charged)||0;if(debt<=0)return ['Оплачено','paid','✓'];if(charged>debt)return ['Частично оплачено','partial','◐'];return ['Не оплачено','unpaid','!']}function typeName(t){return({booking:'Проживание',order:'Кухня',event:'Событие',service:'Услуга'})[t]||t}async function load(){if(!uid){$('app').innerHTML='<div class="card">Не указан пользователь.</div>';return}const{data:{session}}=await sb.auth.getSession();if(!session){$('app').innerHTML='<div class="card">Требуется вход администратора.</div>';return}const{data,error}=await sb.rpc('admin_get_guest_profile',{p_user_id:uid});if(error){$('app').innerHTML='<div class="card">Ошибка загрузки профиля: '+esc(error.message)+'</div>';return}const u=data.user||{},bd=data.financial_breakdown||[],sm=data.financial_summary||{},bk=data.bookings||[],payments=data.payments||[];const rows=bd.map(x=>{const debt=Number(x.debt)||0,charged=Number(x.charged||x.total_amount||0);const[s,c,i]=status(debt,charged);return `<div class="row"><div><b>${esc(x.label||typeName(x.charge_type))}</b><div class="muted">${esc(typeName(x.charge_type))}${x.created_at?' · '+date(String(x.created_at).slice(0,10)):''}</div><span class="badge ${c}">${i} ${s}</span></div><div class="amount"><div>${money(debt)} <span class="muted">долг</span></div>${charged?`<div class="muted">начислено ${money(charged)}</div>`:''}</div></div>`}).join('');const totals=bd.reduce((a,x)=>({charged:a.charged+(Number(x.charged||x.total_amount)||0),debt:a.debt+(Number(x.debt)||0)}),{charged:0,debt:0});$('app').innerHTML=`<section class="card"><div class="hero"><div><h2 class="name">${esc(u.Display_name||'Без имени')}</h2><div class="muted">📞 ${esc(u.Phone||'—')} · ✉️ ${esc(u.Email||'—')}${u.City?' · 📍 '+esc(u.City):''}</div></div><div class="actions"><a class="fd-btn" href="admin_v13_guest_profile.html?id=${encodeURIComponent(uid)}&from=${encodeURIComponent(from)}">Открыть полный профиль</a><a class="fd-btn primary" href="admin_v13_bookings.html?guest_id=${encodeURIComponent(uid)}">🛏️ Бронировать</a></div></div><div class="stats"><div class="stat"><small>Общий долг</small><b class="${totals.debt?'danger':'ok'}">${money(totals.debt||sm.total_debt)}</b></div><div class="stat"><small>Оплачено</small><b class="ok">${money(sm.total_paid)}</b></div><div class="stat"><small>Начислено</small><b>${money(totals.charged||sm.total_charged)}</b></div></div></section><section class="card" id="finance"><h2>💳 Финансовый статус</h2><div class="muted">Теперь по каждому начислению видно состояние оплаты.</div><div class="breakdown" style="margin-top:12px">${['booking','order','event','service'].map(t=>{const list=bd.filter(x=>x.charge_type===t);const debt=list.reduce((n,x)=>n+(Number(x.debt)||0),0);const charged=list.reduce((n,x)=>n+(Number(x.charged||x.total_amount)||0),0);const[s,c,i]=status(debt,charged);return `<div class="mini"><span>${typeName(t)}</span><b>${money(debt)}</b><span class="badge ${c}">${i} ${s}</span></div>`}).join('')}</div><div style="margin-top:14px">${rows||'<div class="empty">Начислений нет.</div>'}</div></section><section class="card"><h2>🛏️ Бронирования</h2>${bk.map(x=>`<div class="row"><div><b>${esc(x.room_name||'Номер')}</b><div class="muted">${date(x.check_in_date)} → ${date(x.check_out_date)} · ${esc(x.status||'—')}</div></div><div class="amount">${money(x.total_amount)}<br><span class="badge ${Number(x.paid_amount)>=Number(x.total_amount)?'paid':'unpaid'}">${Number(x.paid_amount)>=Number(x.total_amount)?'✓ Оплачено':'! Не оплачено'}</span></div></div>`).join('')||'<div class="empty">Бронирований нет.</div>'}</section><section class="card"><h2>💰 Последние платежи</h2>${payments.map(x=>`<div class="row"><div><b>${money(x.amount)}</b><div class="muted">${esc(x.note||x.payment_method||x.method||'—')}</div></div><div class="muted">${x.created_at?new Date(x.created_at).toLocaleDateString('ru-RU'):'—'}</div></div>`).join('')||'<div class="empty">Платежей нет.</div>'}</section>`;if(location.hash==='#finance')$('#finance')?.scrollIntoView()}load();</script></body></html>
